<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VEX</title>
<link rel="stylesheet" href="/vaco-design.css" />
<style>
  .gate { display: flex; align-items: center; gap: var(--vaco-space-3); padding: var(--vaco-space-3) 0;
          border-top: 1px solid var(--vaco-border-subtle); }
  .gate:first-child { border-top: 0; }
  .gate-name { font-weight: var(--vaco-weight-medium); }
</style>
</head>
<body class="vaco">
<script src="/vaco-ui.js"></script>
<script>
// VEX — the Cvltvre Card brokerage.
//
// Extracted out of VOKEN into its own app: VOKEN is the collectibles
// marketplace, VEX is the brokerage that trades positions in them.
//
// **Compliance gates are the first tab, deliberately.** A brokerage
// that trades before its gates pass is the failure mode that ends a
// business, and these are real server-side gates that refuse orders
// rather than warn about them.

var el = VACO.el;

function renderGates(body) {
  var out = el('div', 'vaco-stack');
  out.appendChild(VACO.notice(
    'These gates are enforced by the server: an order placed while a required gate is closed is refused, '
    + 'not flagged. <strong>Nothing here connects to a real regulator or broker-dealer</strong> — the gate '
    + 'model is real, the regulatory relationship is not.', 'warn'));

  // A dedicated result slot, not the old trim-by-count on `out` --
  // this tab now has several persistent cards below it (System
  // status, the operator gate-setter), so deleting "everything past
  // index 2" would delete those instead of just the previous check's
  // result.
  var gateResult = el('div', null);
  out.appendChild(VACO.card('Check a gate', [
    VACO.form([{ name: 'gateName', label: 'Gate', placeholder: 'gate name', width: '200px' }],
      function (values) {
        return VACO.api('/api/compliance-gate/' + encodeURIComponent(values.gateName)).then(function (gate) {
          var row = el('div', 'gate');
          row.appendChild(el('span', 'gate-name', values.gateName));
          row.appendChild(el('span', 'vaco-spacer'));
          // `isComplianceCleared` returns `{gateName, cleared}` --
          // this read `gate.open || gate.passed`, neither of which the
          // route has ever sent, so the badge showed "closed" even
          // when the gate was genuinely cleared. A status read that
          // always says closed is worse than no status at all in a
          // brokerage app.
          row.appendChild(gate.cleared
            ? VACO.badge('open', 'money')
            : VACO.badge('closed', 'danger'));
          VACO.mount(gateResult, VACO.card('Gate status', [row]));
        });
      }, 'Check'),
    gateResult,
  ]));

  var statusResult = el('div', null);
  out.appendChild(VACO.card('System status', [
    el('p', 'vaco-small vaco-dim',
      'The real net-capital model, order types, and gate names this server knows about — from GET /api/health.'),
    VACO.button('Load status', function () {
      return VACO.api('/api/health').then(function (h) {
        var rows = [
          { field: 'service', value: h.service },
          { field: 'net capital models', value: (h.netCapitalModels || []).join(', ') },
          { field: 'order types', value: (h.orderTypes || []).join(', ') },
          { field: 'gates', value: (h.gates || []).join(', ') },
        ];
        VACO.mount(statusResult, VACO.table([{ key: 'field', label: 'Field' }, { key: 'value', label: 'Value' }], rows));
      });
    }),
    statusResult,
  ]));

  out.appendChild(renderOperatorGate());

  return VACO.mount(body, out);
}

// -- Operator: set a compliance gate -----------------------------------
//
// `POST /api/compliance-gate/:gateName` is requireOperator('vex:compliance')
// -- the real admin action that is "not a routine toggle" per
// lib/complianceGate.js's own header: it fires only after actual
// broker-dealer registration/legal work clears. There is no operator
// login in this frontend (same as every other app's operator tooling
// in this ecosystem) -- a real X-Operator-Credential from vaco-operator
// is pasted in by hand, the same shape cvnvo/yap's moderation tab
// already uses for its own operator-only routes.
function renderOperatorGate() {
  var state = { credential: '' };
  var resultBox = el('div', null);

  var card = VACO.card('Set a gate (operator only)', [
    VACO.notice(
      'This is the real brokerage interlock, not a demo toggle. Clearing it here clears it for every order '
      + 'this server will accept. A real human operator credential is required — there is no fallback, and a '
      + 'service token is explicitly refused by this route.', 'danger'),
    VACO.form([{ name: 'credential', label: 'X-Operator-Credential', placeholder: 'from vaco-operator', width: '220px' }],
      function (values) {
        state.credential = values.credential;
        VACO.toast('Credential set for this session (not stored).');
      }, 'Use this credential'),
    VACO.form([
      { name: 'gateName', label: 'Gate', value: 'vex-brokerage', width: '160px' },
      { name: 'cleared', label: 'Status', options: [{ label: 'Clear (open)', value: 'true' }, { label: 'Hold (closed)', value: 'false' }] },
      { name: 'reason', label: 'Reason', placeholder: 'why', width: '220px' },
    ], function (values) {
      if (!state.credential) { VACO.toast('Set an operator credential first.', 'warn'); return Promise.resolve(); }
      return VACO.api('/api/compliance-gate/' + encodeURIComponent(values.gateName), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Operator-Credential': state.credential },
        body: JSON.stringify({ cleared: values.cleared === 'true', reason: values.reason || null }),
      }).then(function (result) {
        VACO.toast('Gate ' + result.gateName + ' is now ' + (result.cleared ? 'open' : 'closed') + '.', result.cleared ? 'money' : 'warn');
        VACO.mount(resultBox, el('pre', 'vaco-mono vaco-small', JSON.stringify(result, null, 2)));
      });
    }, 'Set gate'),
    resultBox,
  ]);
  return card;
}

function renderAccount(body) {
  var out = el('div', 'vaco-stack');

  out.appendChild(VACO.card('Open an account', [
    VACO.form([{ name: 'userId', label: 'User', value: VACO.userId() || '', width: '160px' }],
      function (values) {
        return VACO.post('/api/account', values)
          .then(function (a) { VACO.toast('Account ' + a.id + ' opened.'); });
      }, 'Open'),
  ]));

  out.appendChild(VACO.card('Look up an account', [
    VACO.form([{ name: 'id', label: 'Account id', width: '140px' }],
      function (values) {
        return VACO.api('/api/account/' + encodeURIComponent(values.id)).then(function (a) {
          while (out.childNodes.length > 2) out.removeChild(out.lastChild);
          var rows = Object.keys(a)
            .filter(function (k) { return typeof a[k] !== 'object'; })
            .map(function (k) { return { field: k.replace(/([A-Z])/g, ' $1'), value: String(a[k]) }; });
          out.appendChild(VACO.card('Account ' + values.id, [
            VACO.table([{ key: 'field', label: 'Field' }, { key: 'value', label: 'Value' }], rows),
          ]));
          VACO.mount(body, out);
        });
      }, 'Load'),
  ]));

  return VACO.mount(body, out);
}

function renderTrade(body) {
  var out = el('div', 'vaco-stack');
  out.appendChild(VACO.notice(
    'An order moves real VCoin through V3 on fill. Compliance gates are checked first — if one is closed, '
    + 'the order is refused before any money moves.'));

  out.appendChild(VACO.card('Place an order', [
    // Field names here must match `lib/brokerage.js`'s real
    // `placeTradeOrder({ accountId, cardId, orderType, quantity,
    // pricePerUnit })` exactly. This previously sent `side` and
    // `limitPrice`, which the handler has never read — every order
    // landed on the server as `orderType: undefined`, which fails the
    // `ORDER_TYPES.includes(orderType)` check and refuses the trade.
    // The Trade tab could not place a single order until this was
    // corrected.
    VACO.form([
      { name: 'accountId', label: 'Account', width: '130px' },
      { name: 'orderType', label: 'Side', options: ['buy', 'sell'] },
      { name: 'cardId', label: 'Card', width: '110px' },
      { name: 'quantity', label: 'Qty', type: 'number', min: 1, value: 1, width: '80px' },
      { name: 'pricePerUnit', label: 'Price/unit', type: 'number', min: 1, value: 100, width: '110px' },
    ], function (values) {
      return VACO.post('/api/order', values).then(function (order) {
        VACO.toast('Order ' + order.id + ' — ' + order.status, 'money');
        VACO.refreshBalances().then(VACO.renderIdentity);
        out.appendChild(VACO.card('Order ' + order.id, [
          el('pre', 'vaco-mono vaco-small', JSON.stringify(order, null, 2)),
        ]));
        VACO.mount(body, out);
      });
    }, 'Place order'),
  ]));

  // Its own result slot, not a trim-by-count on `out` -- "Place an
  // order" above appends a result card of its own on every submit and
  // never removes one, so `out`'s child count is not stable, and
  // reusing that trick here would delete this very card instead of
  // just the previous lookup's result.
  var orderResult = el('div', null);
  out.appendChild(VACO.card('Look up an order', [
    VACO.form([{ name: 'id', label: 'Order id', width: '140px' }],
      function (values) {
        return VACO.api('/api/order/' + encodeURIComponent(values.id)).then(function (o) {
          var rows = Object.keys(o)
            .filter(function (k) { return typeof o[k] !== 'object'; })
            .map(function (k) { return { field: k.replace(/([A-Z])/g, ' $1'), value: String(o[k]) }; });
          VACO.mount(orderResult, VACO.card('Order ' + values.id, [
            VACO.table([{ key: 'field', label: 'Field' }, { key: 'value', label: 'Value' }], rows),
          ]));
        });
      }, 'Load'),
    orderResult,
  ]));

  return VACO.mount(body, out);
}

// -- VXC: a second, separate tradeable coin -----------------------------
//
// Not a card trade. VXC trades against lib/coinMarket.js's own
// platform-held liquidity pool — a constant-product market maker, the
// same mechanism real decentralized exchanges use — so its price moves
// purely from real buy/sell flow in this pool, never from a fame score
// like VOKEN's cards and never from a fixed rate like VCoin/VASH. See
// coinMarket.js's own header for why VXC is a new asset rather than
// letting VCoin itself float.
function renderCoin(body) {
  var out = el('div', 'vaco-stack');
  out.appendChild(VACO.notice(
    'VXC trades against a platform-held liquidity pool, not against another trader’s order. A buy/sell is '
    + 'quoted and filled in the same call — the quote already includes this order’s own price impact ("slippage"), '
    + 'it is not a snapshot of some earlier price. Gated the same way card trading is, by a separate compliance '
    + 'gate (<code>vex-coin-trading</code>) on the Compliance tab — clearing <code>vex-brokerage</code> does not '
    + 'clear this one.'));

  var priceBox = el('div', null);
  function loadPrice() {
    return VACO.api('/api/coin/price').then(function (p) {
      var rows = [
        { field: 'price (VCoin per VXC)', value: String(p.price) },
        { field: 'pool VXC reserve', value: String(p.coinReserve) },
        { field: 'pool VCoin reserve', value: String(p.vcoinReserve) },
      ];
      VACO.mount(priceBox, VACO.table([{ key: 'field', label: 'Field' }, { key: 'value', label: 'Value' }], rows));
    });
  }
  out.appendChild(VACO.card('VXC price', [
    VACO.button('Refresh', loadPrice),
    priceBox,
  ]));
  loadPrice();

  out.appendChild(VACO.card('Buy / sell VXC', [
    // Field names must match lib/coinMarket.js's real
    // placeCoinOrder({ accountId, orderType, coinAmount }) exactly —
    // the account's owner, not a typed userId, decides who the trade
    // settles for (requireAccountOwner('accountId') on the server).
    VACO.form([
      { name: 'accountId', label: 'Account', width: '130px' },
      { name: 'orderType', label: 'Side', options: ['buy', 'sell'] },
      { name: 'coinAmount', label: 'VXC amount', type: 'number', min: 0.000001, value: 100, width: '130px' },
    ], function (values) {
      return VACO.post('/api/coin/orders', values).then(function (order) {
        VACO.toast('Order ' + order.id + ' filled — ' + order.vcoinAmount + ' VCoin, new price ' + order.priceAfter, 'money');
        VACO.refreshBalances().then(VACO.renderIdentity);
        loadPrice();
        out.appendChild(VACO.card('Order ' + order.id, [
          el('pre', 'vaco-mono vaco-small', JSON.stringify(order, null, 2)),
        ]));
        VACO.mount(body, out);
      });
    }, 'Place order'),
  ]));

  var holdingsResult = el('div', null);
  out.appendChild(VACO.card('My VXC holdings', [
    VACO.form([{ name: 'accountId', label: 'Account id', width: '140px' }],
      function (values) {
        return VACO.api('/api/coin/holdings/' + encodeURIComponent(values.accountId)).then(function (h) {
          VACO.mount(holdingsResult, VACO.card('Account ' + values.accountId, [
            el('p', 'vaco-mono', h.balance + ' ' + h.symbol),
          ]));
        });
      }, 'Load'),
    holdingsResult,
  ]));

  var coinOrderResult = el('div', null);
  out.appendChild(VACO.card('Look up a VXC order', [
    VACO.form([{ name: 'id', label: 'Order id', width: '140px' }],
      function (values) {
        return VACO.api('/api/coin/orders/' + encodeURIComponent(values.id)).then(function (o) {
          var rows = Object.keys(o)
            .filter(function (k) { return typeof o[k] !== 'object'; })
            .map(function (k) { return { field: k.replace(/([A-Z])/g, ' $1'), value: String(o[k]) }; });
          VACO.mount(coinOrderResult, VACO.card('Order ' + values.id, [
            VACO.table([{ key: 'field', label: 'Field' }, { key: 'value', label: 'Value' }], rows),
          ]));
        });
      }, 'Load'),
    coinOrderResult,
  ]));

  return VACO.mount(body, out);
}

VACO.app({
  id: 'vex',
  name: 'VEX',
  tagline: 'Cvltvre Card brokerage',
  //: VEX's identity: a cool graphite-blue. Trading-terminal restraint —
  //: markets should look sober, and it must not read as VOKEN, whose
  //: cards it trades.
  accent: '#6b8299',
  accentDim: '#4f6479',
  accentInk: '#050a0f',
  tabs: [
    { id: 'gates', label: 'Compliance', heading: 'Gates', render: renderGates },
    { id: 'account', label: 'Accounts', heading: 'Brokerage accounts', render: renderAccount },
    { id: 'trade', label: 'Trade', heading: 'Place an order', render: renderTrade },
    { id: 'coin', label: 'VXC', heading: 'VXC coin market', render: renderCoin },
  ],
});
</script>
</body>
</html>
