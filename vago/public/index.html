<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VAGO</title>
<link rel="stylesheet" href="/vaco-design.css" />
<style>
  /* Layout only — every colour comes from the design system. */
  .board {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: var(--vaco-space-2);
    max-width: 360px;
  }
  .tile {
    aspect-ratio: 1;
    border: 1px solid var(--vaco-border);
    border-radius: var(--vaco-radius-sm);
    background: var(--vaco-surface);
    font-size: var(--vaco-text-lg);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background var(--vaco-duration) var(--vaco-ease),
                border-color var(--vaco-duration) var(--vaco-ease);
  }
  .tile:hover:not(:disabled) { background: var(--vaco-surface-hover); border-color: var(--vaco-accent); }
  .tile:disabled { cursor: default; }
  .tile-safe { background: var(--vaco-money-soft); border-color: var(--vaco-money); }
  .tile-mine { background: var(--vaco-danger-soft); border-color: var(--vaco-danger); }
  .multiplier { font-size: var(--vaco-text-3xl); font-weight: var(--vaco-weight-bold); font-variant-numeric: tabular-nums; }
  .seed { word-break: break-all; }
  .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: var(--vaco-space-3); }
  .stat { display: flex; flex-direction: column; gap: 2px; }
  .stat-value { font-size: var(--vaco-text-lg); font-weight: var(--vaco-weight-bold); font-variant-numeric: tabular-nums; }
</style>
</head>
<body class="vaco">
<script src="/vaco-ui.js"></script>
<script>
// VAGO — wagering, prediction markets, and the casino.
//
// The centrepiece is a real, playable Mines board. VAGO already had
// genuine provably-fair game logic (commit a server seed, hash it,
// reveal it at the end so a player can verify the board was fixed
// before they touched it) and no way for a human to play it. This is
// that surface.
//
// **The provable-fairness panel is not decoration.** It is the whole
// reason to trust an online casino at all, and it is shown while the
// round is live — the hash before, the seed after — rather than buried
// in a settings page nobody opens.
//
// All game logic stays server-side. This file never decides where a
// mine is, what a multiplier should be, or whether a round is lost.

var el = VACO.el;
var MINES_BOARD_SIZE = 25;

// The live round. A module-level object rather than re-fetched each
// render, because a Mines round is a conversation: the board a player
// is looking at must be the board they clicked into.
// `kind` picks which Originals game the start form/board below render
// -- 'mines' (the original build), or 'plinko'/'hilo' (added here,
// same real session+round flow, same `lib/originals.js` engine).
var game = { session: null, round: null, currency: 'gold-coin', stake: 10, mines: 3, kind: 'mines' };

// `lib/originals.js`'s own real HILO_CARD_VALUES (Ace low through
// King) -- also exposed on GET /api/health as `hiloCardValues`, kept
// here as a literal since it is a fixed game constant, not live data.
var HILO_CARD_VALUES = 13;

// -- Casino -----------------------------------------------------------

function renderCasino(body) {
  var out = el('div', 'vaco-stack');

  if (!VACO.userId()) {
    out.appendChild(el('div', 'vaco-empty', 'Sign in to play. Gold Coin is free to play with; VCoin is real money.'));
    return VACO.mount(body, out);
  }

  out.appendChild(goldCoinCard());

  if (!game.round) {
    out.appendChild(gameSwitcher());
    out.appendChild(newRoundCard());
  } else {
    out.appendChild(boardCard());
    out.appendChild(fairnessCard());
  }

  return VACO.mount(body, out);
}

// Three real Originals games share this one session+round flow —
// `lib/originals.js`'s own `startMinesRound`/`startPlinkoRound`/
// `startHiloRound` are siblings, not variants of one game, so this is
// a switcher between them rather than a parameter on Mines.
function gameSwitcher() {
  var row = el('div', 'vaco-row-tight');
  [['mines', 'Mines'], ['plinko', 'Plinko'], ['hilo', 'Hi-Lo']].forEach(function (pair) {
    row.appendChild(VACO.button(pair[1], function () {
      game.kind = pair[0];
      VACO.render();
    }, game.kind === pair[0] ? 'primary vaco-btn-sm' : 'ghost vaco-btn-sm'));
  });
  return row;
}

function newRoundCard() {
  if (game.kind === 'plinko') return plinkoStartCard();
  if (game.kind === 'hilo') return hiloStartCard();
  return minesStartCard();
}

function boardCard() {
  if (game.round.game === 'plinko') return plinkoBoardCard();
  if (game.round.game === 'hilo') return hiloBoardCard();
  return minesBoardCard();
}

function goldCoinCard() {
  var card = VACO.card('Gold Coin', ['Free-to-play currency. A daily AMOE entry grants more at no cost — the "no purchase necessary" path that makes a sweepstakes model lawful.']);
  var row = el('div', 'vaco-row');
  var balance = el('strong', 'vaco-num stat-value', '…');
  row.appendChild(balance);
  row.appendChild(el('span', 'vaco-spacer'));
  row.appendChild(VACO.button('Claim daily AMOE entry', function () {
    return VACO.post('/api/amoe-entry', { userId: VACO.userId() }).then(function () {
      VACO.toast('AMOE entry claimed — Gold Coin granted.', 'money');
      VACO.render();
    });
  }));
  card.appendChild(row);

  VACO.api('/api/gold-coin/balance/' + encodeURIComponent(VACO.userId()))
    .then(function (b) { balance.textContent = VACO.round(b.balance); })
    .catch(function () { balance.textContent = '—'; });

  return card;
}

function minesStartCard() {
  return VACO.card('Mines', [
    el('p', 'vaco-small vaco-dim',
      'Reveal tiles one at a time. Every safe tile raises the multiplier; one mine ends the round. Cash out whenever you like.'),
    VACO.form([
      { name: 'currency', label: 'Currency', options: [
        { value: 'gold-coin', label: 'Gold Coin (free)' },
        { value: 'vcoin', label: 'VCoin (real)' },
      ] },
      { name: 'stakeAmount', label: 'Stake', type: 'number', min: 1, value: game.stake, width: '90px' },
      { name: 'minesCount', label: 'Mines', type: 'number', min: 1, value: game.mines, width: '80px' },
      { name: 'clientSeed', label: 'Your seed', value: randomSeed(), width: '160px' },
    ], startMines, 'Deal'),
  ]);
}

function randomSeed() {
  return Math.random().toString(36).slice(2, 12);
}

function startMines(values) {
  if (values.minesCount < 1 || values.minesCount > 24) {
    throw new Error('Mines must be between 1 and 24 — a board of all mines is not a game.');
  }
  game.currency = values.currency;
  game.stake = values.stakeAmount;
  game.mines = values.minesCount;

  return VACO.post('/api/casino/sessions', {
    userId: VACO.userId(),
    gameType: 'originals',
    currency: values.currency,
    stakeAmount: values.stakeAmount,
    amoeEntryUsed: false,
  }).then(function (session) {
    game.session = session;
    return VACO.post('/api/casino/mines/start', {
      sessionId: session.id,
      clientSeed: values.clientSeed,
      minesCount: values.minesCount,
    });
  }).then(function (round) {
    game.round = round;
    VACO.refreshBalances().then(VACO.renderIdentity);
    VACO.render();
  });
}

// A real casino session, shared by every Originals game here — only
// `gameType: 'originals'` and the stake/currency differ, never the
// round itself, which each game's own `/api/casino/<game>/start` builds.
function startOriginalsSession(currency, stakeAmount) {
  return VACO.post('/api/casino/sessions', {
    userId: VACO.userId(),
    gameType: 'originals',
    currency: currency,
    stakeAmount: stakeAmount,
    amoeEntryUsed: false,
  });
}

function plinkoStartCard() {
  return VACO.card('Plinko', [
    el('p', 'vaco-small vaco-dim',
      'Drop a ball through a 16-row board. Where it lands sets the multiplier — edges pay more than the center.'),
    VACO.form([
      { name: 'currency', label: 'Currency', options: [
        { value: 'gold-coin', label: 'Gold Coin (free)' },
        { value: 'vcoin', label: 'VCoin (real)' },
      ] },
      { name: 'stakeAmount', label: 'Stake', type: 'number', min: 1, value: game.stake, width: '90px' },
      { name: 'clientSeed', label: 'Your seed', value: randomSeed(), width: '160px' },
    ], startPlinko, 'Deal'),
  ]);
}

function startPlinko(values) {
  game.currency = values.currency;
  game.stake = values.stakeAmount;

  return startOriginalsSession(values.currency, values.stakeAmount).then(function (session) {
    game.session = session;
    return VACO.post('/api/casino/plinko/start', { sessionId: session.id, clientSeed: values.clientSeed });
  }).then(function (round) {
    game.round = round;
    VACO.refreshBalances().then(VACO.renderIdentity);
    VACO.render();
  });
}

function hiloStartCard() {
  return VACO.card('Hi-Lo', [
    el('p', 'vaco-small vaco-dim',
      'Guess whether the next card is higher or lower than the one showing. Correct guesses compound the multiplier — cash out any time after your first.'),
    VACO.form([
      { name: 'currency', label: 'Currency', options: [
        { value: 'gold-coin', label: 'Gold Coin (free)' },
        { value: 'vcoin', label: 'VCoin (real)' },
      ] },
      { name: 'stakeAmount', label: 'Stake', type: 'number', min: 1, value: game.stake, width: '90px' },
      { name: 'clientSeed', label: 'Your seed', value: randomSeed(), width: '160px' },
    ], startHilo, 'Deal'),
  ]);
}

function startHilo(values) {
  game.currency = values.currency;
  game.stake = values.stakeAmount;

  return startOriginalsSession(values.currency, values.stakeAmount).then(function (session) {
    game.session = session;
    return VACO.post('/api/casino/hilo/start', { sessionId: session.id, clientSeed: values.clientSeed });
  }).then(function (round) {
    game.round = round;
    VACO.refreshBalances().then(VACO.renderIdentity);
    VACO.render();
  });
}

function minesBoardCard() {
  var round = game.round;
  var lost = round.status === 'lost';
  var over = round.status !== 'active';

  var head = el('div', 'vaco-row');
  var mult = el('span', 'multiplier', '×' + VACO.round(round.currentMultiplier || 1));
  head.appendChild(mult);
  head.appendChild(el('span', 'vaco-spacer'));
  head.appendChild(VACO.badge(round.status));

  var board = el('div', 'board');
  for (var i = 0; i < MINES_BOARD_SIZE; i++) {
    board.appendChild(tile(i, round, over));
  }

  var actions = el('div', 'vaco-row');
  if (!over && (round.revealedTiles || []).length > 0) {
    var potential = VACO.round(game.stake * (round.currentMultiplier || 1));
    actions.appendChild(VACO.button('Cash out ' + potential, function () {
      return VACO.post('/api/casino/mines/' + round.id + '/cash-out', {}).then(function (result) {
        game.round = null;
        game.session = null;
        VACO.toast('Cashed out ' + VACO.round(result.payout !== undefined ? result.payout : potential), 'money');
        VACO.refreshBalances().then(VACO.renderIdentity);
        VACO.render();
      });
    }, 'primary'));
  }
  if (over) {
    actions.appendChild(VACO.button('New round', function () {
      game.round = null;
      game.session = null;
      VACO.render();
    }, 'primary'));
  }

  var stats = el('div', 'stat-row');
  [['Stake', game.stake], ['Mines', round.minesCount],
   ['Revealed', (round.revealedTiles || []).length],
   ['Currency', game.currency]].forEach(function (pair) {
    var s = el('div', 'stat');
    s.appendChild(el('span', 'vaco-label', pair[0]));
    s.appendChild(el('span', 'stat-value', pair[1]));
    stats.appendChild(s);
  });

  var children = [head, board, stats, actions];
  if (lost) {
    children.splice(1, 0, VACO.notice(
      'Mine hit — the round is over. The mine positions were fixed before your first click, and the seed below proves it.', 'danger'));
  }
  return VACO.card(null, children);
}

// Plinko has no player choice once the ball is in play — a round opens
// `pending`, `POST .../drop` resolves it in one call to `resolved`, and
// `publicRoundView` only reveals `path`/`bucket`/`multiplier` once it
// has. There is no board animation here: the real path (a sequence of
// L/R draws) is shown as the fairness proof it is, not a recreation of
// the physical board.
function plinkoBoardCard() {
  var round = game.round;
  var over = round.status !== 'pending';
  var children = [];

  if (!over) {
    children.push(el('p', 'vaco-small vaco-dim', 'Ball ready — drop it to resolve the round.'));
    children.push(VACO.button('Drop ball', function () {
      return VACO.post('/api/casino/plinko/' + round.id + '/drop', {}).then(function (result) {
        game.round = result;
        VACO.toast('Landed in bucket ' + result.bucket + ' — ×' + VACO.round(result.multiplier)
          + ' (' + VACO.round(result.payout) + ')', result.payout > 0 ? 'money' : 'danger');
        VACO.refreshBalances().then(VACO.renderIdentity);
        VACO.render();
      });
    }, 'primary'));
  } else {
    children.push(el('p', 'vaco-mono vaco-small seed', 'Path: ' + (round.path || []).join(' ')));
    var stats = el('div', 'stat-row');
    [['Stake', game.stake], ['Bucket', round.bucket], ['Multiplier', '×' + VACO.round(round.multiplier)],
     ['Payout', VACO.round(round.payout)]].forEach(function (pair) {
      var s = el('div', 'stat');
      s.appendChild(el('span', 'vaco-label', pair[0]));
      s.appendChild(el('span', 'stat-value', pair[1]));
      stats.appendChild(s);
    });
    children.push(stats);
    children.push(VACO.button('New round', function () {
      game.round = null;
      game.session = null;
      VACO.render();
    }, 'primary'));
  }
  return VACO.card('Plinko', children);
}

// Hi-Lo is active across several guesses, like Mines — but with one
// number instead of a board. `round.currentMultiplier > 1` is the real
// signal at least one correct guess has landed (it starts at exactly 1
// and only `computeHiloMultiplier` after a win moves it), which is also
// exactly when `cashOutHilo` itself allows a cash-out, so the button's
// visibility matches the server's own guard rather than inventing a
// separate one. The guaranteed-loss guess (e.g. "higher" from 13) is
// disabled here for the same reason `guessHilo` rejects it server-side.
function hiloBoardCard() {
  var round = game.round;
  var over = round.status !== 'active';

  var head = el('div', 'vaco-row');
  head.appendChild(el('span', 'multiplier', '×' + VACO.round(round.currentMultiplier || 1)));
  head.appendChild(el('span', 'vaco-spacer'));
  head.appendChild(VACO.badge(round.status));

  var current = el('div', 'stat');
  current.appendChild(el('span', 'vaco-label', 'Current card value (1 = Ace low, ' + HILO_CARD_VALUES + ' = King)'));
  current.appendChild(el('span', 'stat-value', round.currentValue + ' / ' + HILO_CARD_VALUES));

  var children = [head, current];

  if (!over) {
    var actions = el('div', 'vaco-row');
    var higherBtn = VACO.button('Higher', function () {
      return VACO.post('/api/casino/hilo/' + round.id + '/guess', { direction: 'higher' }).then(function (updated) {
        game.round = updated;
        if (updated.status === 'lost') VACO.toast('Wrong guess — round over.', 'danger');
        VACO.render();
      });
    }, 'primary');
    var lowerBtn = VACO.button('Lower', function () {
      return VACO.post('/api/casino/hilo/' + round.id + '/guess', { direction: 'lower' }).then(function (updated) {
        game.round = updated;
        if (updated.status === 'lost') VACO.toast('Wrong guess — round over.', 'danger');
        VACO.render();
      });
    }, 'primary');
    if (round.currentValue >= HILO_CARD_VALUES) higherBtn.disabled = true;
    if (round.currentValue <= 1) lowerBtn.disabled = true;
    actions.appendChild(higherBtn);
    actions.appendChild(lowerBtn);
    if (round.currentMultiplier > 1) {
      actions.appendChild(VACO.button('Cash out', function () {
        return VACO.post('/api/casino/hilo/' + round.id + '/cash-out', {}).then(function (result) {
          game.round = null;
          game.session = null;
          VACO.toast('Cashed out ' + VACO.round(result.payout), 'money');
          VACO.refreshBalances().then(VACO.renderIdentity);
          VACO.render();
        });
      }, 'ghost'));
    }
    children.push(actions);
  } else {
    children.push(VACO.notice(
      round.status === 'lost' ? 'Wrong guess — the round is over.' : 'Cashed out.',
      round.status === 'lost' ? 'danger' : 'money'));
    children.push(VACO.button('New round', function () {
      game.round = null;
      game.session = null;
      VACO.render();
    }, 'primary'));
  }
  return VACO.card('Hi-Lo', children);
}

function tile(index, round, over) {
  var revealed = (round.revealedTiles || []).indexOf(index) !== -1;
  var isMine = (round.minePositions || []).indexOf(index) !== -1;

  var btn = el('button', 'tile');
  // Mine positions only come back from the server once the round is
  // over, so nothing here can leak the board mid-game.
  if (revealed && isMine) { btn.className += ' tile-mine'; btn.textContent = '✳'; }
  else if (revealed) { btn.className += ' tile-safe'; btn.textContent = '◆'; }
  else if (over && isMine) { btn.className += ' tile-mine'; btn.style.opacity = '0.45'; btn.textContent = '✳'; }

  btn.disabled = revealed || over;
  btn.setAttribute('aria-label', 'Tile ' + (index + 1));
  if (!btn.disabled) {
    btn.addEventListener('click', function () {
      btn.disabled = true;
      VACO.post('/api/casino/mines/' + round.id + '/reveal', { tileIndex: index })
        .then(function (updated) {
          game.round = updated.round || updated;
          if (game.round.status === 'lost') VACO.toast('Mine. Round over.', 'danger');
          VACO.render();
        })
        .catch(function (err) { VACO.error(err); btn.disabled = false; });
    });
  }
  return btn;
}

// The trust surface. Shown during the round, not after.
function fairnessCard() {
  var round = game.round;
  var rows = el('div', 'vaco-stack-sm');

  rows.appendChild(el('p', 'vaco-small vaco-dim',
    'The server committed to a board before your first click and published its hash. '
    + 'When the round ends the seed itself is revealed — hash it yourself and it will match, '
    + 'which proves the board could not have moved while you played.'));

  function line(label, value) {
    var wrap = el('div', 'vaco-stack-sm');
    wrap.appendChild(el('span', 'vaco-label', label));
    wrap.appendChild(el('code', 'vaco-mono vaco-small seed', value || '— revealed when the round ends —'));
    return wrap;
  }
  rows.appendChild(line('Your seed', round.clientSeed));
  rows.appendChild(line('Server seed hash (committed up front)', round.serverSeedHash));
  rows.appendChild(line('Server seed', round.serverSeed));

  return VACO.card('Provably fair', [rows]);
}

// -- Fantasy ----------------------------------------------------------

// `fantasy.js`'s own real bounds -- a real entry holds 2 to 6 picks,
// and Flex play needs at least 3 (DK's own reasoning: a 2-pick miss-one
// result is too weak to price a payout against).
var FANTASY_MIN_PICKS = 2;
var FANTASY_MAX_PICKS = 6;
var FANTASY_FLEX_MIN_PICKS = 3;

// Picks accumulate here across re-renders, the same module-level-state
// pattern `game` already uses for Mines -- a half-built entry must
// survive a tab redraw (e.g. after "Add pick"), not reset to empty.
var fantasyBuilder = { picks: [], playType: 'perfect', stakeAmount: 10 };

function renderFantasy(body) {
  var out = el('div', 'vaco-stack');
  out.appendChild(VACO.notice(
    'Pick more/less on player props. Every pick in an entry must hit — the DraftKings Pick6 shape, not a parlay against the house.'));

  out.appendChild(VACO.card('Look up a prop', [
    VACO.form([{ name: 'id', label: 'Prop id', type: 'number', min: 1, value: 1, width: '100px' }],
      function (values) {
        return VACO.api('/api/fantasy/props/' + values.id).then(function (prop) {
          VACO.toast(prop.playerName + ' — ' + prop.statType + ' ' + prop.line);
        });
      }, 'Fetch'),
  ]));

  var id = VACO.userId();
  if (!id) {
    out.appendChild(el('div', 'vaco-empty', 'Sign in to build an entry or see your entries.'));
    return VACO.mount(body, out);
  }

  out.appendChild(entryBuilderCard());

  return VACO.api('/api/fantasy/users/' + encodeURIComponent(id) + '/entries')
    .then(function (data) {
      var entries = data.entries || data;
      out.appendChild(VACO.card('Your entries', [
        VACO.table([
          { key: 'id', label: 'Entry' },
          { label: 'Type', render: function (r) { return r.playType || 'perfect'; } },
          { label: 'Picks', render: function (r) { return (r.picks || []).length; }, num: true },
          { label: 'Stake', num: true, render: function (r) { return VACO.price(r.stakeAmount, { freeLabel: false }); } },
          { label: 'Status', render: function (r) { return VACO.badge(r.status); } },
          { label: 'Payout', num: true, render: function (r) { return r.payout === null ? '—' : VACO.round(r.payout); } },
        ], entries, { empty: 'No entries yet.' }),
      ]));
      VACO.mount(body, out);
    });
}

// A real entry builder for `POST /api/fantasy/entries` -- picks are
// built up by prop id + direction (the real fields `fantasy.js`'s
// `createFantasyEntry` expects), then staked as one real entry. Perfect
// pays the full table only on a clean sweep; Flex (3+ picks) still pays
// a reduced multiplier on exactly one miss. The payout tables themselves
// live server-side (`PERFECT_PAYOUT_TABLE`/`FLEX_PAYOUT_TABLE`) -- this
// is deliberately just the picks + stake, never a duplicated multiplier.
function entryBuilderCard() {
  var rows = el('div', 'vaco-stack-sm');
  if (!fantasyBuilder.picks.length) {
    rows.appendChild(el('p', 'vaco-small vaco-dim', 'No picks added yet — look up a prop id above, then add it below.'));
  } else {
    fantasyBuilder.picks.forEach(function (pick, i) {
      var row = el('div', 'vaco-row-tight');
      row.appendChild(el('span', 'vaco-small', 'Prop #' + pick.propId + ' — ' + pick.direction));
      row.appendChild(el('span', 'vaco-spacer'));
      row.appendChild(VACO.button('Remove', function () {
        fantasyBuilder.picks.splice(i, 1);
        VACO.render();
      }, 'ghost vaco-btn-sm'));
      rows.appendChild(row);
    });
  }

  var addForm = VACO.form([
    { name: 'propId', label: 'Prop id', type: 'number', min: 1, width: '90px' },
    { name: 'direction', label: 'Pick', options: [
      { value: 'more', label: 'More' }, { value: 'less', label: 'Less' },
    ] },
  ], function (values) {
    if (fantasyBuilder.picks.length >= FANTASY_MAX_PICKS) {
      throw new Error('An entry may hold at most ' + FANTASY_MAX_PICKS + ' picks.');
    }
    if (fantasyBuilder.picks.some(function (p) { return p.propId === values.propId; })) {
      throw new Error('Prop #' + values.propId + ' is already in this entry.');
    }
    fantasyBuilder.picks.push({ propId: values.propId, direction: values.direction });
    VACO.render();
  }, 'Add pick');

  var submitForm = VACO.form([
    { name: 'playType', label: 'Play type', options: [
      { value: 'perfect', label: 'Perfect (all correct)' },
      { value: 'flex', label: 'Flex (miss one OK, 3+ picks)' },
    ], value: fantasyBuilder.playType },
    { name: 'stakeAmount', label: 'Stake', type: 'number', min: 1, value: fantasyBuilder.stakeAmount, width: '90px' },
  ], function (values) {
    if (fantasyBuilder.picks.length < FANTASY_MIN_PICKS) {
      throw new Error('An entry needs at least ' + FANTASY_MIN_PICKS + ' picks.');
    }
    if (values.playType === 'flex' && fantasyBuilder.picks.length < FANTASY_FLEX_MIN_PICKS) {
      throw new Error('Flex play needs at least ' + FANTASY_FLEX_MIN_PICKS + ' picks.');
    }
    fantasyBuilder.playType = values.playType;
    fantasyBuilder.stakeAmount = values.stakeAmount;
    return VACO.post('/api/fantasy/entries', {
      userId: VACO.userId(),
      stakeAmount: values.stakeAmount,
      playType: values.playType,
      picks: fantasyBuilder.picks,
    }).then(function (entry) {
      VACO.toast('Entry #' + entry.id + ' placed with ' + entry.picks.length + ' picks.', 'money');
      fantasyBuilder.picks = [];
      VACO.refreshBalances().then(VACO.renderIdentity);
      VACO.render();
    });
  }, 'Submit entry');

  return VACO.card('Build an entry', [
    el('p', 'vaco-small vaco-dim',
      'Add ' + FANTASY_MIN_PICKS + '–' + FANTASY_MAX_PICKS + ' picks by prop id and direction, then stake. '
      + 'Perfect needs a clean sweep; Flex (3+ picks) still pays a reduced multiplier on exactly one miss.'),
    rows,
    addForm,
    submitForm,
  ]);
}

// -- Markets ----------------------------------------------------------

// A probability as a percentage, which is the only form most people
// read fluently. `0.58` renders as `58%`.
function pct(p) {
  return (typeof p === 'number') ? Math.round(p * 100) + '%' : '—';
}

// The margin gets a decimal place. Rounded to whole percent, a 4.49%
// book and a 5.0% book both read as "4%" and "5%" from numbers that are
// half a point apart — which hides exactly the quantity this column
// exists to expose.
function pct1(p) {
  return (typeof p === 'number') ? (p * 100).toFixed(1) + '%' : '—';
}

function renderMarkets(body) {
  var out = el('div', 'vaco-stack');
  out.appendChild(VACO.notice(
    'Peer-to-peer contracts priced by the market itself, settling in VCoin. A price IS a '
    + 'probability: 58c to buy YES is the market saying 58%. Payouts are pooled pari-mutuel, '
    + 'so the pool can only ever pay out what was actually staked into it.'));

  return Promise.all([
    VACO.api('/api/predictions/real-world').catch(function () { return { markets: [] }; }),
    VACO.api('/api/predictions/vdp').catch(function () { return { markets: [] }; }),
    VACO.api('/api/predictions/vacancy').catch(function () { return { markets: [] }; }),
    VACO.api('/api/predictions/voken').catch(function () { return { markets: [] }; }),
  ]).then(function (results) {
    [['Real-world', results[0]], ['From VDP', results[1]], ['From VACON-C', results[2]],
     ["From VOKEN's Cvltvre Card market", results[3]]]
      .forEach(function (pair) {
        var markets = pair[1].markets || pair[1] || [];
        var children = [
          VACO.table([
            { key: 'question', label: 'Question' },
            { label: 'YES', render: function (r) { return pct(r.yesPrice); } },
            { label: 'NO', render: function (r) { return pct(r.noPrice); } },
            { label: 'Pool', render: function (r) {
              return (Math.round(((r.yesPool || 0) + (r.noPool || 0)) * 100) / 100) + ' VC';
            } },
            { label: 'Status', render: function (r) { return VACO.badge(r.status); } },
          ], markets, { empty: 'No markets from this source yet.' }),
        ];
        if (markets.length) {
          children.push(VACO.userId() ? tradeForms(markets) : el('div', 'vaco-empty', 'Sign in to trade.'));
        }
        out.appendChild(VACO.card(pair[0], children));
      });
    VACO.mount(body, out);
  });
}

// Real peer-to-peer trading, one real route for each direction: buy and
// sell pari-mutuel contracts on any market listed above by picking its
// id from the same list the table just rendered. `buyContract` returns
// `{ price, cost, fee }`; `sellContract` returns `{ price, proceeds,
// capped }` (capped when a sell asked for more than that side's pool
// actually holds). Re-renders the whole tab after either so the
// price/pool columns reflect the trade that was just made.
function tradeForms(markets) {
  function fields() {
    return [
      { name: 'marketId', label: 'Market', options: markets.map(function (m) {
        return { value: String(m.id), label: '#' + m.id + ' — ' + String(m.question).slice(0, 44) };
      }) },
      { name: 'side', label: 'Side', options: [{ value: 'yes', label: 'YES' }, { value: 'no', label: 'NO' }] },
      { name: 'quantity', label: 'Qty', type: 'number', min: 1, value: 1, width: '70px' },
    ];
  }

  var wrap = el('div', 'vaco-row');
  wrap.appendChild(VACO.form(fields(), function (values) {
    return VACO.post('/api/markets/' + values.marketId + '/buy', {
      userId: VACO.userId(), side: values.side, quantity: values.quantity,
    }).then(function (result) {
      VACO.toast('Bought ' + values.quantity + ' ' + values.side.toUpperCase() + ' @ '
        + VACO.round(result.price) + ' (cost ' + VACO.round(result.cost)
        + (result.fee ? ' + fee ' + VACO.round(result.fee) : '') + ')', 'money');
      VACO.refreshBalances().then(VACO.renderIdentity);
      VACO.render();
    });
  }, 'Buy'));
  wrap.appendChild(VACO.form(fields(), function (values) {
    return VACO.post('/api/markets/' + values.marketId + '/sell', {
      userId: VACO.userId(), side: values.side, quantity: values.quantity,
    }).then(function (result) {
      VACO.toast('Sold ' + values.quantity + ' ' + values.side.toUpperCase() + ' for '
        + VACO.round(result.proceeds) + (result.capped ? ' (capped by the pool)' : ''), 'money');
      VACO.refreshBalances().then(VACO.renderIdentity);
      VACO.render();
    });
  }, 'Sell'));
  return wrap;
}

// **The sportsbook, with its odds translated.** This is the whole point
// of the percentage work: -150 and 60% are the same statement, and only
// one of them is readable without training.
//
// The house margin is shown per event rather than hidden. A book with
// no margin is not a book, and a reader comparing the posted number to
// the fair one can see exactly what the edge costs them — which is the
// honest version of putting a percentage on a betting line at all.
function renderSportsbook(body) {
  var out = el('div', 'vaco-stack');
  out.appendChild(VACO.notice(
    'House-set odds, settled in VCoin. Posted % is what the line implies and includes the '
    + 'house margin, so the posted numbers add up to more than 100%. Fair % has that margin '
    + 'divided out — it is what the book actually thinks, and what a paired market opens at.'));

  return VACO.api('/api/sports/events').catch(function () { return { events: [] }; })
    .then(function (data) {
      var events = data.events || [];
      if (!events.length) {
        out.appendChild(VACO.card('No events yet', [
          el('p', 'vaco-dim', 'Seeded events appear here once the demo data is loaded.'),
        ]));
        VACO.mount(body, out);
        return;
      }
      events.forEach(function (ev) {
        var rows = ev.probabilities || [];
        var children = [
          VACO.table([
            { key: 'label', label: 'Outcome' },
            { label: 'Odds', render: function (r) { return r.odds > 0 ? '+' + r.odds : String(r.odds); } },
            { label: 'Posted %', render: function (r) { return pct(r.impliedProbability); } },
            { label: 'Fair %', render: function (r) { return pct(r.fairProbability); } },
          ], rows, { empty: 'No outcomes.' }),
          el('p', 'vaco-dim', 'House margin on this event: ' + pct1(ev.houseMargin)),
        ];
        if (ev.market) {
          children.push(el('p', 'vaco-dim',
            'Paired market #' + ev.market.id + ' — traders say YES ' + pct(ev.market.yesPrice)
            + ' / NO ' + pct(ev.market.noPrice)
            + '. It opened at the fair line above; every move since is real stake disagreeing with the book.'));
        }
        if (ev.status === 'open') {
          children.push(VACO.userId() ? sportsBetForm(ev) : el('div', 'vaco-empty', 'Sign in to place a bet.'));
        }
        out.appendChild(VACO.card(ev.description + (ev.status === 'open' ? '' : ' (settled)'), children));
      });
      VACO.mount(body, out);
    });
}

// A real house-odds bet, locked in at the posted line the instant it is
// placed (`sportsbook.js`'s own rule — a bet's payout never changes
// even if the line moves afterward). `POST /api/sports/:eventId/bet`
// takes { userId, outcomeId, stakeVCoin } and returns the bet with its
// `potentialPayout` already computed from American-odds math.
function sportsBetForm(ev) {
  return VACO.form([
    { name: 'outcomeId', label: 'Pick', options: ev.outcomes.map(function (o) {
      return { value: o.outcomeId, label: o.label + ' (' + (o.odds > 0 ? '+' + o.odds : o.odds) + ')' };
    }) },
    { name: 'stakeVCoin', label: 'Stake (VCoin)', type: 'number', min: 1, value: 10, width: '110px' },
  ], function (values) {
    return VACO.post('/api/sports/' + ev.eventId + '/bet', {
      userId: VACO.userId(),
      outcomeId: values.outcomeId,
      stakeVCoin: values.stakeVCoin,
    }).then(function (bet) {
      VACO.toast('Bet placed on ' + bet.outcomeId + ' — potential payout ' + VACO.round(bet.potentialPayout), 'money');
      VACO.refreshBalances().then(VACO.renderIdentity);
    });
  }, 'Place bet');
}

// -- Group Wagers -------------------------------------------------------

// §29's own narrow slice: a Group Wager is a creator-owned, named
// wrapper around one real `predictionMarkets.js` market -- joining is
// `buyContract`, and `GET /api/group-wagers/:id` already merges the
// group's own fields with the market's live pools/participant count
// (`groupWagerView`), so there is no second price to compute here.
// `viewedGroupWagerId` persists across re-renders the same way `game`
// and `fantasyBuilder` already do, so "View" and "Join" survive a tab
// redraw.
var viewedGroupWagerId = null;

function renderGroupWagers(body) {
  var out = el('div', 'vaco-stack');
  out.appendChild(VACO.notice(
    'A named, creator-owned wrapper around one real pari-mutuel prediction market — binary (yes/no) '
    + 'only. Joining is a real trade on that market, solvent by the same construction the Markets tab uses.'));

  if (VACO.userId()) {
    out.appendChild(createGroupWagerCard());
  } else {
    out.appendChild(el('div', 'vaco-empty', 'Sign in to create a group wager.'));
  }
  out.appendChild(findGroupWagerCard());

  var detailSlot = el('div');
  out.appendChild(detailSlot);
  var leaderboardSlot = el('div');
  out.appendChild(leaderboardSlot);

  var detailPromise = viewedGroupWagerId
    ? VACO.api('/api/group-wagers/' + viewedGroupWagerId)
      .then(function (gw) { VACO.mount(detailSlot, groupWagerDetailCard(gw)); })
      .catch(function (err) {
        VACO.mount(detailSlot, VACO.notice(
          'Could not load group wager #' + viewedGroupWagerId + ': ' + VACO.escapeHtml(err.message), 'danger'));
      })
    : Promise.resolve();

  // §10's leaderboard, platform-wide (no `ids` = every settled group
  // wager) -- a pure recomputation over already-resolved markets, never
  // a second copy of standings.
  var leaderboardPromise = VACO.api('/api/group-wagers/leaderboard')
    .then(function (data) {
      VACO.mount(leaderboardSlot, VACO.card('Leaderboard', [
        VACO.table([
          { key: 'userId', label: 'User' },
          { label: 'W-L', render: function (r) { return r.wins + '-' + r.losses; } },
          { label: 'Staked', num: true, render: function (r) { return VACO.round(r.totalStaked); } },
          { label: 'Payout', num: true, render: function (r) { return VACO.round(r.totalPayout); } },
          { label: 'Net', num: true, render: function (r) { return VACO.round(r.netEarnings); } },
          { label: 'Streak', num: true, render: function (r) { return r.currentStreak; } },
        ], data.leaderboard, { empty: 'No settled group wagers yet.' }),
      ]));
    })
    .catch(function () {
      VACO.mount(leaderboardSlot, VACO.notice('Leaderboard unavailable right now.', 'warn'));
    });

  return Promise.all([detailPromise, leaderboardPromise]).then(function () { return VACO.mount(body, out); });
}

// `POST /api/group-wagers` takes { creatorId, name, question, category,
// source, visibility, entryDeadline, maxParticipants?, invitedUserIds? }
// -- entryDeadline is a real future timestamp, built here from "closes
// in N hours" since that is what a creator actually thinks in, not a
// raw epoch millisecond they would have to compute themselves.
function createGroupWagerCard() {
  return VACO.card('Create a group wager', [
    el('p', 'vaco-small vaco-dim',
      'Binary (yes/no) only. A private group wager needs at least one invited user id.'),
    VACO.form([
      { name: 'name', label: 'Name', width: '200px' },
      { name: 'question', label: 'Question (yes/no)', width: '240px' },
      { name: 'category', label: 'Category', value: 'social', width: '100px' },
      { name: 'entryDeadlineHours', label: 'Closes in (hrs)', type: 'number', min: 1, value: 24, width: '90px' },
      { name: 'maxParticipants', label: 'Max (optional)', type: 'number', min: 2, width: '90px' },
      { name: 'visibility', label: 'Visibility', options: [
        { value: 'open', label: 'Open' }, { value: 'private', label: 'Private' },
      ] },
      { name: 'invitedUserIds', label: 'Invite (comma ids, private only)', width: '200px' },
    ], function (values) {
      var payload = {
        creatorId: VACO.userId(),
        name: values.name,
        question: values.question,
        category: values.category,
        source: 'real-world',
        visibility: values.visibility,
        entryDeadline: Date.now() + values.entryDeadlineHours * 60 * 60 * 1000,
      };
      if (values.maxParticipants) payload.maxParticipants = values.maxParticipants;
      if (values.visibility === 'private') {
        payload.invitedUserIds = String(values.invitedUserIds || '')
          .split(',').map(function (s) { return s.trim(); }).filter(Boolean);
      }
      return VACO.post('/api/group-wagers', payload).then(function (gw) {
        VACO.toast('Group wager #' + gw.id + ' created.', 'money');
        viewedGroupWagerId = gw.id;
        VACO.render();
      });
    }, 'Create'),
  ]);
}

function findGroupWagerCard() {
  return VACO.card('Find a group wager', [
    VACO.form([{ name: 'id', label: 'Group wager id', type: 'number', min: 1, width: '120px' }],
      function (values) {
        viewedGroupWagerId = values.id;
        VACO.render();
      }, 'View'),
  ]);
}

// `groupWagerView` (what `GET /api/group-wagers/:id` returns) merges
// the group's own fields with the market's already-live pools and
// participant count -- shown directly rather than re-deriving a price,
// since no route attaches one for this market and inventing the same
// virtual-liquidity formula client-side would risk drifting from it.
function groupWagerDetailCard(gw) {
  var children = [];
  if (gw.description) children.push(el('p', 'vaco-small vaco-dim', gw.description));
  children.push(el('p', 'vaco-dim', 'Question: ' + (gw.market ? gw.market.question : '—')));

  var yesLabel = (gw.teamNames && gw.teamNames.yes) || 'YES';
  var noLabel = (gw.teamNames && gw.teamNames.no) || 'NO';

  var stats = el('div', 'stat-row');
  [['Visibility', gw.visibility], ['Status', gw.status], ['Locked', gw.locked ? 'yes' : 'no'],
    ['Participants', gw.participantCount + (gw.maxParticipants ? ' / ' + gw.maxParticipants : '')],
    [yesLabel + ' pool', VACO.round(gw.market ? gw.market.yesPool : 0)],
    [noLabel + ' pool', VACO.round(gw.market ? gw.market.noPool : 0)],
    ['Closes', new Date(gw.entryDeadline).toLocaleString()]]
    .forEach(function (pair) {
      var s = el('div', 'stat');
      s.appendChild(el('span', 'vaco-label', pair[0]));
      s.appendChild(el('span', 'stat-value', pair[1]));
      stats.appendChild(s);
    });
  children.push(stats);

  if (!VACO.userId()) {
    children.push(el('div', 'vaco-empty', 'Sign in to join.'));
  } else if (gw.locked || gw.status !== 'open') {
    children.push(el('p', 'vaco-dim', 'This group wager is locked or settled — joining is closed.'));
  } else {
    children.push(VACO.form([
      { name: 'side', label: 'Side', options: [
        { value: 'yes', label: yesLabel }, { value: 'no', label: noLabel },
      ] },
      { name: 'quantity', label: 'Qty', type: 'number', min: 1, value: 1, width: '70px' },
    ], function (values) {
      return VACO.post('/api/group-wagers/' + gw.id + '/join', {
        userId: VACO.userId(), side: values.side, quantity: values.quantity,
      }).then(function () {
        VACO.toast('Joined group wager #' + gw.id + '.', 'money');
        VACO.refreshBalances().then(VACO.renderIdentity);
        VACO.render();
      });
    }, 'Join'));
  }

  return VACO.card(gw.name, children);
}

VACO.app({
  id: 'vago',
  name: 'VAGO',
  tagline: 'Wagering & casino',
  //: VAGO's identity: a warm brass. Casino gold without the garishness,
  //: and clearly distinct from the money-green semantic token so a
  //: payout never reads as brand chrome.
  accent: '#d9a23f',
  accentDim: '#b07f26',
  accentInk: '#1a1204',
  tabs: [
    { id: 'casino', label: 'Casino', heading: 'Originals: Mines, Plinko, Hi-Lo',
      blurb: 'Real provably-fair game logic, playable. Every round’s commitment hash is published before your first move and the seed is revealed once it resolves.',
      render: renderCasino },
    { id: 'fantasy', label: 'Fantasy', heading: 'Player props', render: renderFantasy },
    { id: 'sportsbook', label: 'Sportsbook', heading: 'Events and lines',
      blurb: 'Every line shown as a percentage as well as American odds, with the house margin stated rather than buried.',
      render: renderSportsbook },
    { id: 'markets', label: 'Markets', heading: 'Prediction markets',
      blurb: 'Peer-to-peer contracts where the price is the probability.',
      render: renderMarkets },
    { id: 'groupwagers', label: 'Group Wagers', heading: 'Group Wagers',
      blurb: 'A named, creator-owned wrapper around one real prediction market — invite friends, join a side, climb the leaderboard.',
      render: renderGroupWagers },
  ],
});
</script>
