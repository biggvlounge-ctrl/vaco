<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CVNVO</title>
<link rel="stylesheet" href="/vaco-design.css" />
<style>
  .score-ring {
    width: 56px; height: 56px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: var(--vaco-weight-bold); font-variant-numeric: tabular-nums;
    background: var(--vaco-accent-soft); color: var(--vaco-accent);
    flex: 0 0 auto;
  }
  .match-row { display: flex; align-items: center; gap: var(--vaco-space-3); }
  .safety-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: var(--vaco-space-3); }
</style>
</head>
<body class="vaco">
<script src="/vaco-ui.js"></script>
<script>
// CVNVO — dating, with safety as the spine rather than a settings page.
//
// Real client of CVNVO's own 59 routes. Compatibility scoring, stable
// matching, message screening, and every safety gate are server-side.
//
// **The safety tab is deliberately not last.** Check-ins, trusted
// contacts, and escalation run through VSAFE and are the reason this
// app is shaped the way it is; burying them under a gear icon would
// misrepresent what was built.

var el = VACO.el;

// -- Discover ---------------------------------------------------------

function renderDiscover(body) {
  var out = el('div', 'vaco-stack');

  out.appendChild(VACO.card('Check compatibility', [
    el('p', 'vaco-small vaco-dim',
      'A real score from CVNVO’s own compatibility engine — the same one the matcher uses, not a preview of it.'),
    VACO.form([
      { name: 'a', label: 'You', value: VACO.userId() || '', width: '140px' },
      { name: 'b', label: 'Them', placeholder: 'their user id', width: '140px' },
    ], function (values) {
      return VACO.api('/api/compatibility/' + encodeURIComponent(values.a) + '/' + encodeURIComponent(values.b))
        .then(function (result) {
          var score = result.score !== undefined ? result.score : result.compatibilityScore;
          var row = el('div', 'match-row');
          row.appendChild(el('div', 'score-ring', Math.round(score)));
          var text = el('div', 'vaco-stack-sm');
          text.appendChild(el('strong', null, values.a + ' & ' + values.b));
          if (result.factors) {
            text.appendChild(el('p', 'vaco-small vaco-dim',
              Object.keys(result.factors).map(function (k) {
                return k + ' ' + VACO.round(result.factors[k]);
              }).join(' · ')));
          }
          row.appendChild(text);
          out.appendChild(VACO.card('Result', [row]));
          VACO.mount(body, out);
        });
    }, 'Score'),
  ]));

  var id = VACO.userId();
  if (!id) {
    out.appendChild(el('div', 'vaco-empty', 'Sign in to see your profile and matches.'));
    return VACO.mount(body, out);
  }

  return VACO.api('/api/profiles/' + encodeURIComponent(id))
    .then(function (profile) {
      var lines = el('div', 'vaco-stack-sm');
      // **Prompts, not a bio.** This used to render
      // `profile.bio || 'No bio yet.'`, and there is no `bio` on a
      // CVNVO profile -- deliberately. `lib/profiles.js` names its
      // source of truth as CVNVO_ARCHITECTURE.md's
      // `UserProfile { id, prompts, verifiedBadge, compatibilityInputs }`,
      // and CVNVO_CORE_FEATURES.md gives the reason: "prompt-based
      // profiles are what actually feeds a compatibility algorithm
      // meaningful signal, not just photos".
      //
      // So the card advertised a missing field while ignoring the one
      // thing the product is built around. Every profile read "No bio
      // yet." no matter how complete it was.
      var prompts = Array.isArray(profile.prompts) ? profile.prompts : [];
      if (prompts.length === 0) {
        lines.appendChild(el('p', 'vaco-small vaco-dim', 'No prompts answered yet.'));
      } else {
        prompts.forEach(function (p) {
          var block = el('div', 'vaco-stack-sm');
          block.appendChild(el('p', 'vaco-small vaco-dim', p.question));
          block.appendChild(el('p', null, p.answer));
          lines.appendChild(block);
        });
      }
      var meta = el('div', 'vaco-row-tight');
      // A VACA-verified badge is a real identity claim checked against
      // another service, which is exactly the thing a dating app should
      // not fake.
      meta.appendChild(profile.verifiedBadge
        ? VACO.badge('VACA verified', 'money')
        : VACO.badge('not verified', 'warn'));
      if (profile.age) meta.appendChild(VACO.badge(profile.age));
      lines.appendChild(meta);
      out.appendChild(VACO.card('Your profile', [lines]));
      VACO.mount(body, out);
    })
    .catch(function () {
      out.appendChild(VACO.card('Your profile', [
        el('p', 'vaco-small vaco-dim', 'No profile yet — create one.'),
        VACO.form([
          { name: 'bio', label: 'Bio', placeholder: 'a sentence about you', width: '300px' },
          { name: 'age', label: 'Age', type: 'number', min: 18, value: 28, width: '80px' },
        ], function (values) {
          return VACO.post('/api/profiles', { userId: id, bio: values.bio, age: values.age })
            .then(function () { VACO.toast('Profile created.'); VACO.render(); });
        }, 'Create'),
      ]));
      VACO.mount(body, out);
    });
}

// -- Events -----------------------------------------------------------

// `createDateEvent` (lib/dateEvents.js) only ever reads `participants`,
// `huntId`, `voidRideId` from its own options -- it has no `title`/
// `venue` field at all, and never did (checked directly against the
// module, not assumed). The card below used to send `{hostId, title,
// venue}`: `requireListedParticipant('participants')` saw no real
// `participants` array in that body and refused every submission with
// a 403, and the lookup card below it read `e.title`/`e.venue`, fields
// that never existed on a real `DateEvent` either. Both are real bugs,
// not stale copy -- fixed here rather than left in place while new
// cards were added next to them.
function splitIds(raw) {
  return String(raw || '').split(',').map(function (s) { return s.trim(); }).filter(function (s) { return s; });
}

// Every check-in/scheduling route across this app takes a real ms
// timestamp, never a date string — same helper and reasoning as
// void/public/index.html's own dateInputToMs.
function dateInputToMs(value) {
  if (!value) return null;
  var ms = Date.parse(value);
  return isNaN(ms) ? null : ms;
}

function renderEvents(body) {
  var out = el('div', 'vaco-stack');
  var id = VACO.userId();
  out.appendChild(VACO.notice(
    'Date events are real, RSVP-able, and can be linked to a real HVNTZ hunt — '
    + 'a date that is a scavenger-hunt activity rather than a drink and an interview. '
    + '<code>visibleAttendeeCount</code> is a real, live-derived count of who has RSVP’d '
    + '<em>and</em> opted into being seen, never a settable field.'));

  if (!id) {
    out.appendChild(el('div', 'vaco-empty', 'Sign in to create or RSVP to a date event.'));
  } else {
    out.appendChild(VACO.card('Create a date event', [
      el('p', 'vaco-small vaco-dim',
        'Everyone who will see and RSVP to this event, including you — the real guard on this route checks that you are one of them.'),
      VACO.form([
        { name: 'participants', label: 'Participants', placeholder: 'user ids, comma-separated', value: id, width: '220px' },
        { name: 'huntId', label: 'Hunt id (optional)', placeholder: 'HVNTZ hunt id', width: '140px' },
        { name: 'voidRideId', label: 'VOID ride id (optional)', placeholder: 'void job id', width: '140px' },
      ], function (values) {
        var participants = splitIds(values.participants);
        if (!participants.includes(id)) throw new Error('You must be one of the participants to create this event.');
        return VACO.post('/api/date-events', {
          participants: participants,
          huntId: values.huntId || null,
          voidRideId: values.voidRideId || null,
        }).then(function (e) { VACO.toast('Event #' + e.id + ' created.'); VACO.render(); });
      }, 'Create'),
    ]));

    out.appendChild(VACO.card('RSVP to an event', [
      VACO.form([
        { name: 'id', label: 'Event id', type: 'number', min: 1, value: 1, width: '90px' },
        { name: 'visible', label: 'Visible to others?', options: [{ label: 'No — I’m going, just not listed', value: 'false' }, { label: 'Yes — show me in the live count', value: 'true' }], width: '220px' },
      ], function (values) {
        return VACO.post('/api/date-events/' + values.id + '/rsvp', { userId: id, visible: values.visible === 'true' })
          .then(function () { VACO.toast('RSVP recorded.'); });
      }, 'RSVP'),
    ]));

    out.appendChild(VACO.card('Link a HVNTZ hunt', [
      el('p', 'vaco-small vaco-dim', 'Checks the hunt against HVNTZ’s own real hunt lookup — a made-up huntId is rejected, not stored.'),
      VACO.form([
        { name: 'id', label: 'Event id', type: 'number', min: 1, value: 1, width: '90px' },
        { name: 'huntId', label: 'Hunt id', placeholder: 'HVNTZ hunt id', width: '140px' },
      ], function (values) {
        return VACO.post('/api/date-events/' + values.id + '/link-hunt', { huntId: values.huntId })
          .then(function (e) { VACO.toast('Linked — ' + (e.huntTitle || e.huntId)); });
      }, 'Link'),
    ]));
  }

  var lookupResult = el('div', 'vaco-stack-sm');
  out.appendChild(VACO.card('Look up an event', [
    VACO.form([{ name: 'id', label: 'Event id', type: 'number', min: 1, value: 1, width: '90px' }],
      function (values) {
        return VACO.api('/api/date-events/' + values.id).then(function (e) {
          var card = el('div', 'vaco-stack-sm');
          card.appendChild(el('strong', null, 'Event #' + e.id));
          card.appendChild(el('p', 'vaco-small vaco-dim', 'Participants: ' + (e.participants || []).join(', ')));
          var meta = el('div', 'vaco-row-tight');
          meta.appendChild(VACO.badge(e.huntId ? ('hunt: ' + (e.huntTitle || e.huntId)) : 'no hunt linked', e.huntId ? 'money' : null));
          meta.appendChild(VACO.badge(e.voidRideId ? ('ride: ' + e.voidRideId) : 'no ride linked', e.voidRideId ? 'money' : null));
          meta.appendChild(VACO.badge((e.visibleAttendeeCount || 0) + ' visibly going'));
          card.appendChild(meta);
          VACO.mount(lookupResult, card);
        });
      }, 'Fetch'),
    lookupResult,
  ]));

  return VACO.mount(body, out);
}

// -- Safety -----------------------------------------------------------

function renderSafety(body) {
  var out = el('div', 'vaco-stack');
  out.appendChild(VACO.notice(
    'Safety here is a set of <strong>real mechanics</strong>, not promises: timed check-ins that escalate '
    + 'to a trusted contact, message screening before delivery, anonymous calls that never expose a number, '
    + 'and a BarBuddy mode that is deliberately invisible to other people at the venue.'));

  var id = VACO.userId();
  if (!id) {
    out.appendChild(el('div', 'vaco-empty', 'Sign in to use safety features.'));
    return VACO.mount(body, out);
  }

  var grid = el('div', 'safety-grid');

  grid.appendChild(VACO.card('Reliability', [
    (function () {
      var value = el('p', 'vaco-body', 'Loading…');
      VACO.api('/api/safety/reliability/' + encodeURIComponent(id))
        .then(function (r) {
          value.textContent = 'Score ' + VACO.round(r.score !== undefined ? r.score : r.reliabilityScore)
            + (r.completedCheckIns !== undefined ? ' from ' + r.completedCheckIns + ' check-ins' : '');
        })
        .catch(function () { value.textContent = 'No reliability history yet.'; });
      return value;
    }()),
  ]));

  grid.appendChild(VACO.card('BarBuddy', [
    el('p', 'vaco-small vaco-dim',
      'Check in at a venue so a trusted contact knows where you are. Other people at the venue cannot see you — that is fixed, not a preference.'),
    VACO.form([{ name: 'venueId', label: 'Venue', placeholder: 'venue id', width: '130px' }],
      function (values) {
        return VACO.post('/api/barbuddy/check-in', { userId: id, venueId: values.venueId })
          .then(function () { VACO.toast('Checked in — visible only to your trusted contacts.'); });
      }, 'Check in'),
  ]));

  grid.appendChild(VACO.card('Flash notes', [
    el('p', 'vaco-small vaco-dim', 'Short-lived notes that expire on their own.'),
    (function () {
      var list = el('div', null);
      list.textContent = 'Loading…';
      VACO.api('/api/flash-notes/' + encodeURIComponent(id))
        .then(function (data) {
          var notes = data.notes || data || [];
          VACO.mount(list, notes.length
            ? VACO.table([{ key: 'body', label: 'Note' }, { key: 'expiresAt', label: 'Expires' }], notes)
            : el('p', 'vaco-small vaco-faint', 'No active notes.'));
        })
        .catch(function () { list.textContent = 'Unavailable.'; });
      return list;
    }()),
  ]));

  // -- First Date Safety: the real check-in that CVNVO keeps its own
  // dating-specific data on (itinerary, "We Met" feedback, the VOID
  // ride) while VSAFE owns the actual safety-critical state. None of
  // this had a frontend before — a full date's worth of real safety
  // mechanics only reachable by curl.

  grid.appendChild(VACO.card('Start a date check-in', [
    el('p', 'vaco-small vaco-dim', 'Creates a real VSAFE check-in for a scheduled date tied to one of your matches.'),
    VACO.form([
      { name: 'matchId', label: 'Match id', type: 'number', min: 1, value: 1, width: '90px' },
      { name: 'dateScheduledAt', label: 'Date time', type: 'datetime-local', width: '170px' },
      { name: 'itinerary', label: 'Itinerary', placeholder: 'Dinner at Union Loafers, then a walk', width: '200px' },
      { name: 'trustedContactIds', label: 'Trusted contacts', placeholder: 'user ids, comma-separated', width: '170px' },
      { name: 'checkInWindowMinutes', label: 'Window (min)', type: 'number', min: 10, value: 120, width: '100px' },
    ], function (values) {
      var dateScheduledAt = dateInputToMs(values.dateScheduledAt);
      if (!dateScheduledAt) throw new Error('Pick a real date/time.');
      return VACO.post('/api/safety/check-ins', {
        userId: id, matchId: values.matchId, dateScheduledAt: dateScheduledAt,
        itinerary: values.itinerary, trustedContactIds: splitIds(values.trustedContactIds),
        checkInWindowMinutes: values.checkInWindowMinutes,
      }).then(function (c) { VACO.toast('Check-in #' + c.id + ' created — save that id.'); });
    }, 'Start check-in'),
  ]));

  var checkInStatusOut = el('div', 'vaco-stack-sm');
  grid.appendChild(VACO.card('Check-in status', [
    el('p', 'vaco-small vaco-dim', 'A real, live read from VSAFE plus CVNVO’s own dating-specific extension data.'),
    VACO.form([{ name: 'id', label: 'Check-in id', type: 'number', min: 1, value: 1, width: '100px' }],
      function (values) {
        return VACO.api('/api/safety/check-ins/' + values.id + '/full-status').then(function (c) {
          var card = el('div', 'vaco-stack-sm');
          card.appendChild(el('p', 'vaco-small vaco-dim', c.itinerary || '(no itinerary)'));
          var meta = el('div', 'vaco-row-tight');
          meta.appendChild(VACO.badge(c.vsafeStatus && c.vsafeStatus.status ? c.vsafeStatus.status : 'unknown'));
          if (c.actuallyMet !== null) meta.appendChild(VACO.badge(c.actuallyMet ? 'We Met: yes' : 'We Met: no'));
          if (c.voidRide) meta.appendChild(VACO.badge('ride: ' + c.voidRide.voidJobStatus));
          card.appendChild(meta);
          VACO.mount(checkInStatusOut, card);
        });
      }, 'Check status'),
    checkInStatusOut,
  ]));

  grid.appendChild(VACO.card('“We Met” — confirm safe', [
    el('p', 'vaco-small vaco-dim',
      'The real, literal "one user action, two uses": confirms you’re safe with VSAFE, and folds in whether the date happened — real match-quality feedback for future matching.'),
    VACO.form([
      { name: 'id', label: 'Check-in id', type: 'number', min: 1, value: 1, width: '100px' },
      { name: 'actuallyMet', label: 'Did the date happen?', options: [{ label: 'Yes', value: 'true' }, { label: 'No', value: 'false' }], width: '140px' },
      { name: 'dateRating', label: 'Rating (1–5, optional)', type: 'number', min: 1, max: 5, width: '110px' },
    ], function (values) {
      var dateRating = values.dateRating === '' || values.dateRating === undefined ? null : Number(values.dateRating);
      return VACO.post('/api/safety/check-ins/' + values.id + '/confirm-safe', {
        actuallyMet: values.actuallyMet === 'true', dateRating: dateRating,
      }).then(function () { VACO.toast('Confirmed safe.'); });
    }, 'Confirm safe'),
  ]));

  grid.appendChild(VACO.card('Attach a VOID ride', [
    el('p', 'vaco-small vaco-dim', 'Pulls the real driver and status from a VOID transportation job onto this check-in.'),
    VACO.form([
      { name: 'id', label: 'Check-in id', type: 'number', min: 1, value: 1, width: '100px' },
      { name: 'voidJobId', label: 'VOID job id', placeholder: 'void job id', width: '130px' },
    ], function (values) {
      return VACO.post('/api/safety/check-ins/' + values.id + '/void-ride', { voidJobId: values.voidJobId })
        .then(function (c) { VACO.toast('Ride attached — driver ' + (c.voidRide && c.voidRide.driverId)); });
    }, 'Attach ride'),
  ]));

  grid.appendChild(VACO.card('Schedule a photo check-in', [
    el('p', 'vaco-small vaco-dim', 'A missed photo check-in genuinely escalates this same VSAFE check-in.'),
    VACO.form([
      { name: 'id', label: 'Check-in id', type: 'number', min: 1, value: 1, width: '100px' },
      { name: 'intervalMinutes', label: 'Interval (min)', type: 'number', min: 5, value: 30, width: '110px' },
      { name: 'missedCheckInAction', label: 'If missed', options: [{ label: 'Notify contacts', value: 'notify-contacts' }, { label: 'Escalate emergency', value: 'escalate-emergency' }], width: '160px' },
    ], function (values) {
      return VACO.post('/api/safety/check-ins/' + values.id + '/photo-check-in', {
        intervalMinutes: values.intervalMinutes, missedCheckInAction: values.missedCheckInAction,
      }).then(function () { VACO.toast('Photo check-in scheduled.'); });
    }, 'Schedule'),
  ]));

  grid.appendChild(VACO.card('Submit a photo check-in', [
    VACO.form([
      { name: 'id', label: 'Check-in id', type: 'number', min: 1, value: 1, width: '100px' },
      { name: 'photoUrl', label: 'Photo URL', placeholder: 'https://…', width: '200px' },
    ], function (values) {
      return VACO.post('/api/safety/check-ins/' + values.id + '/photo-check-in/submit', { photoUrl: values.photoUrl })
        .then(function () { VACO.toast('Photo submitted.'); });
    }, 'Submit'),
  ]));

  grid.appendChild(VACO.card('Fake call', [
    el('p', 'vaco-small vaco-dim', 'A real VSAFE fake incoming call, scheduled to ring after a delay — a quiet exit from an uncomfortable date.'),
    VACO.form([
      { name: 'callerName', label: 'Caller name', placeholder: 'Mom', value: 'Mom', width: '120px' },
      { name: 'callerPhotoUrl', label: 'Photo URL (optional)', placeholder: 'https://…', width: '160px' },
      { name: 'delaySeconds', label: 'Delay (sec)', type: 'number', min: 1, value: 30, width: '100px' },
    ], function (values) {
      return VACO.post('/api/safety/fake-call', {
        userId: id, callerName: values.callerName, callerPhotoUrl: values.callerPhotoUrl || null, delaySeconds: values.delaySeconds,
      }).then(function () { VACO.toast('Fake call scheduled.'); });
    }, 'Schedule call'),
  ]));

  grid.appendChild(VACO.card('Screen time', [
    el('p', 'vaco-small vaco-dim', 'Records a real VSAFE screen-time session against the daily limit.'),
    VACO.form([{ name: 'sessionDurationMinutes', label: 'Minutes', type: 'number', min: 1, value: 15, width: '100px' }],
      function (values) {
        return VACO.post('/api/safety/screen-time', { userId: id, sessionDurationMinutes: values.sessionDurationMinutes })
          .then(function (r) { VACO.toast('Recorded' + (r.dailyTotalMinutes !== undefined ? ' — ' + r.dailyTotalMinutes + ' min today' : '') + '.'); });
      }, 'Record'),
  ]));

  out.appendChild(grid);
  return VACO.mount(body, out);
}

VACO.app({
  id: 'cvnvo',
  name: 'CVNVO',
  tagline: 'Dating, safety first',
  //: CVNVO's identity: a muted coral-rose. Warm without being the
  //: saturated hot-pink every dating app defaults to, and distinct from
  //: CVLTVRE's magenta in the register.
  accent: '#e2716b',
  accentDim: '#bd524d',
  accentInk: '#1a0806',
  tabs: [
    { id: 'discover', label: 'Discover', heading: 'People', render: renderDiscover },
    { id: 'events', label: 'Events', heading: 'Date events', render: renderEvents },
    { id: 'safety', label: 'Safety', heading: 'Check-ins & screening', render: renderSafety },
  ],
});
</script>
</body>
</html>
