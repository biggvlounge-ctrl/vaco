<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CVNVO</title>
<link rel="stylesheet" href="/vaco-design.css" />
<style>
  .score-ring {
    width: 56px; height: 56px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: var(--vaco-weight-bold); font-variant-numeric: tabular-nums;
    background: var(--vaco-accent-soft); color: var(--vaco-accent);
    flex: 0 0 auto;
  }
  .match-row { display: flex; align-items: center; gap: var(--vaco-space-3); }
  .safety-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: var(--vaco-space-3); }
</style>
</head>
<body class="vaco">
<script src="/vaco-ui.js"></script>
<script>
// CVNVO — dating, with safety as the spine rather than a settings page.
//
// Real client of CVNVO's own 59 routes. Compatibility scoring, stable
// matching, message screening, and every safety gate are server-side.
//
// **The safety tab is deliberately not last.** Check-ins, trusted
// contacts, and escalation run through VSAFE and are the reason this
// app is shaped the way it is; burying them under a gear icon would
// misrepresent what was built.

var el = VACO.el;

// -- Discover ---------------------------------------------------------

function renderDiscover(body) {
  var out = el('div', 'vaco-stack');

  out.appendChild(VACO.card('Check compatibility', [
    el('p', 'vaco-small vaco-dim',
      'A real score from CVNVO’s own compatibility engine — the same one the matcher uses, not a preview of it.'),
    VACO.form([
      { name: 'a', label: 'You', value: VACO.userId() || '', width: '140px' },
      { name: 'b', label: 'Them', placeholder: 'their user id', width: '140px' },
    ], function (values) {
      return VACO.api('/api/compatibility/' + encodeURIComponent(values.a) + '/' + encodeURIComponent(values.b))
        .then(function (result) {
          var score = result.score !== undefined ? result.score : result.compatibilityScore;
          var row = el('div', 'match-row');
          row.appendChild(el('div', 'score-ring', Math.round(score)));
          var text = el('div', 'vaco-stack-sm');
          text.appendChild(el('strong', null, values.a + ' & ' + values.b));
          if (result.factors) {
            text.appendChild(el('p', 'vaco-small vaco-dim',
              Object.keys(result.factors).map(function (k) {
                return k + ' ' + VACO.round(result.factors[k]);
              }).join(' · ')));
          }
          row.appendChild(text);
          out.appendChild(VACO.card('Result', [row]));
          VACO.mount(body, out);
        });
    }, 'Score'),
  ]));

  var id = VACO.userId();
  if (!id) {
    out.appendChild(el('div', 'vaco-empty', 'Sign in to see your profile and matches.'));
    return VACO.mount(body, out);
  }

  return VACO.api('/api/profiles/' + encodeURIComponent(id))
    .then(function (profile) {
      var lines = el('div', 'vaco-stack-sm');
      // **Prompts, not a bio.** This used to render
      // `profile.bio || 'No bio yet.'`, and there is no `bio` on a
      // CVNVO profile -- deliberately. `lib/profiles.js` names its
      // source of truth as CVNVO_ARCHITECTURE.md's
      // `UserProfile { id, prompts, verifiedBadge, compatibilityInputs }`,
      // and CVNVO_CORE_FEATURES.md gives the reason: "prompt-based
      // profiles are what actually feeds a compatibility algorithm
      // meaningful signal, not just photos".
      //
      // So the card advertised a missing field while ignoring the one
      // thing the product is built around. Every profile read "No bio
      // yet." no matter how complete it was.
      var prompts = Array.isArray(profile.prompts) ? profile.prompts : [];
      if (prompts.length === 0) {
        lines.appendChild(el('p', 'vaco-small vaco-dim', 'No prompts answered yet.'));
      } else {
        prompts.forEach(function (p) {
          var block = el('div', 'vaco-stack-sm');
          block.appendChild(el('p', 'vaco-small vaco-dim', p.question));
          block.appendChild(el('p', null, p.answer));
          lines.appendChild(block);
        });
      }
      var meta = el('div', 'vaco-row-tight');
      // A VACA-verified badge is a real identity claim checked against
      // another service, which is exactly the thing a dating app should
      // not fake.
      meta.appendChild(profile.verifiedBadge
        ? VACO.badge('VACA verified', 'money')
        : VACO.badge('not verified', 'warn'));
      if (profile.age) meta.appendChild(VACO.badge(profile.age));
      lines.appendChild(meta);
      out.appendChild(VACO.card('Your profile', [lines]));
      VACO.mount(body, out);
    })
    .catch(function () {
      out.appendChild(VACO.card('Your profile', [
        el('p', 'vaco-small vaco-dim', 'No profile yet — create one.'),
        VACO.form([
          { name: 'bio', label: 'Bio', placeholder: 'a sentence about you', width: '300px' },
          { name: 'age', label: 'Age', type: 'number', min: 18, value: 28, width: '80px' },
        ], function (values) {
          return VACO.post('/api/profiles', { userId: id, bio: values.bio, age: values.age })
            .then(function () { VACO.toast('Profile created.'); VACO.render(); });
        }, 'Create'),
      ]));
      VACO.mount(body, out);
    });
}

// -- Events -----------------------------------------------------------

// `createDateEvent` (lib/dateEvents.js) only ever reads `participants`,
// `huntId`, `voidRideId` from its own options -- it has no `title`/
// `venue` field at all, and never did (checked directly against the
// module, not assumed). The card below used to send `{hostId, title,
// venue}`: `requireListedParticipant('participants')` saw no real
// `participants` array in that body and refused every submission with
// a 403, and the lookup card below it read `e.title`/`e.venue`, fields
// that never existed on a real `DateEvent` either. Both are real bugs,
// not stale copy -- fixed here rather than left in place while new
// cards were added next to them.
function splitIds(raw) {
  return String(raw || '').split(',').map(function (s) { return s.trim(); }).filter(function (s) { return s; });
}

// Every check-in/scheduling route across this app takes a real ms
// timestamp, never a date string — same helper and reasoning as
// void/public/index.html's own dateInputToMs.
function dateInputToMs(value) {
  if (!value) return null;
  var ms = Date.parse(value);
  return isNaN(ms) ? null : ms;
}

function renderEvents(body) {
  var out = el('div', 'vaco-stack');
  var id = VACO.userId();
  out.appendChild(VACO.notice(
    'Date events are real, RSVP-able, and can be linked to a real HVNTZ hunt — '
    + 'a date that is a scavenger-hunt activity rather than a drink and an interview. '
    + '<code>visibleAttendeeCount</code> is a real, live-derived count of who has RSVP’d '
    + '<em>and</em> opted into being seen, never a settable field.'));

  if (!id) {
    out.appendChild(el('div', 'vaco-empty', 'Sign in to create or RSVP to a date event.'));
  } else {
    out.appendChild(VACO.card('Create a date event', [
      el('p', 'vaco-small vaco-dim',
        'Everyone who will see and RSVP to this event, including you — the real guard on this route checks that you are one of them.'),
      VACO.form([
        { name: 'participants', label: 'Participants', placeholder: 'user ids, comma-separated', value: id, width: '220px' },
        { name: 'huntId', label: 'Hunt id (optional)', placeholder: 'HVNTZ hunt id', width: '140px' },
        { name: 'voidRideId', label: 'VOID ride id (optional)', placeholder: 'void job id', width: '140px' },
      ], function (values) {
        var participants = splitIds(values.participants);
        if (!participants.includes(id)) throw new Error('You must be one of the participants to create this event.');
        return VACO.post('/api/date-events', {
          participants: participants,
          huntId: values.huntId || null,
          voidRideId: values.voidRideId || null,
        }).then(function (e) { VACO.toast('Event #' + e.id + ' created.'); VACO.render(); });
      }, 'Create'),
    ]));

    out.appendChild(VACO.card('RSVP to an event', [
      VACO.form([
        { name: 'id', label: 'Event id', type: 'number', min: 1, value: 1, width: '90px' },
        { name: 'visible', label: 'Visible to others?', options: [{ label: 'No — I’m going, just not listed', value: 'false' }, { label: 'Yes — show me in the live count', value: 'true' }], width: '220px' },
      ], function (values) {
        return VACO.post('/api/date-events/' + values.id + '/rsvp', { userId: id, visible: values.visible === 'true' })
          .then(function () { VACO.toast('RSVP recorded.'); });
      }, 'RSVP'),
    ]));

    out.appendChild(VACO.card('Link a HVNTZ hunt', [
      el('p', 'vaco-small vaco-dim', 'Checks the hunt against HVNTZ’s own real hunt lookup — a made-up huntId is rejected, not stored.'),
      VACO.form([
        { name: 'id', label: 'Event id', type: 'number', min: 1, value: 1, width: '90px' },
        { name: 'huntId', label: 'Hunt id', placeholder: 'HVNTZ hunt id', width: '140px' },
      ], function (values) {
        return VACO.post('/api/date-events/' + values.id + '/link-hunt', { huntId: values.huntId })
          .then(function (e) { VACO.toast('Linked — ' + (e.huntTitle || e.huntId)); });
      }, 'Link'),
    ]));
  }

  var lookupResult = el('div', 'vaco-stack-sm');
  out.appendChild(VACO.card('Look up an event', [
    VACO.form([{ name: 'id', label: 'Event id', type: 'number', min: 1, value: 1, width: '90px' }],
      function (values) {
        return VACO.api('/api/date-events/' + values.id).then(function (e) {
          var card = el('div', 'vaco-stack-sm');
          card.appendChild(el('strong', null, 'Event #' + e.id));
          card.appendChild(el('p', 'vaco-small vaco-dim', 'Participants: ' + (e.participants || []).join(', ')));
          var meta = el('div', 'vaco-row-tight');
          meta.appendChild(VACO.badge(e.huntId ? ('hunt: ' + (e.huntTitle || e.huntId)) : 'no hunt linked', e.huntId ? 'money' : null));
          meta.appendChild(VACO.badge(e.voidRideId ? ('ride: ' + e.voidRideId) : 'no ride linked', e.voidRideId ? 'money' : null));
          meta.appendChild(VACO.badge((e.visibleAttendeeCount || 0) + ' visibly going'));
          card.appendChild(meta);
          VACO.mount(lookupResult, card);
        });
      }, 'Fetch'),
    lookupResult,
  ]));

  return VACO.mount(body, out);
}

// -- Safety -----------------------------------------------------------

function renderSafety(body) {
  var out = el('div', 'vaco-stack');
  out.appendChild(VACO.notice(
    'Safety here is a set of <strong>real mechanics</strong>, not promises: timed check-ins that escalate '
    + 'to a trusted contact, message screening before delivery, anonymous calls that never expose a number, '
    + 'and a BarBuddy mode that is deliberately invisible to other people at the venue.'));

  var id = VACO.userId();
  if (!id) {
    out.appendChild(el('div', 'vaco-empty', 'Sign in to use safety features.'));
    return VACO.mount(body, out);
  }

  var grid = el('div', 'safety-grid');

  grid.appendChild(VACO.card('Reliability', [
    (function () {
      var value = el('p', 'vaco-body', 'Loading…');
      VACO.api('/api/safety/reliability/' + encodeURIComponent(id))
        .then(function (r) {
          value.textContent = 'Score ' + VACO.round(r.score !== undefined ? r.score : r.reliabilityScore)
            + (r.completedCheckIns !== undefined ? ' from ' + r.completedCheckIns + ' check-ins' : '');
        })
        .catch(function () { value.textContent = 'No reliability history yet.'; });
      return value;
    }()),
  ]));

  grid.appendChild(VACO.card('BarBuddy', [
    el('p', 'vaco-small vaco-dim',
      'Check in at a venue so a trusted contact knows where you are. Other people at the venue cannot see you — that is fixed, not a preference.'),
    VACO.form([{ name: 'venueId', label: 'Venue', placeholder: 'venue id', width: '130px' }],
      function (values) {
        return VACO.post('/api/barbuddy/check-in', { userId: id, venueId: values.venueId })
          .then(function () { VACO.toast('Checked in — visible only to your trusted contacts.'); });
      }, 'Check in'),
  ]));

  grid.appendChild(VACO.card('Flash notes', [
    el('p', 'vaco-small vaco-dim', 'Short-lived notes that expire on their own.'),
    (function () {
      var list = el('div', null);
      list.textContent = 'Loading…';
      VACO.api('/api/flash-notes/' + encodeURIComponent(id))
        .then(function (data) {
          var notes = data.notes || data || [];
          VACO.mount(list, notes.length
            ? VACO.table([{ key: 'body', label: 'Note' }, { key: 'expiresAt', label: 'Expires' }], notes)
            : el('p', 'vaco-small vaco-faint', 'No active notes.'));
        })
        .catch(function () { list.textContent = 'Unavailable.'; });
      return list;
    }()),
  ]));

  // -- First Date Safety: the real check-in that CVNVO keeps its own
  // dating-specific data on (itinerary, "We Met" feedback, the VOID
  // ride) while VSAFE owns the actual safety-critical state. None of
  // this had a frontend before — a full date's worth of real safety
  // mechanics only reachable by curl.

  grid.appendChild(VACO.card('Start a date check-in', [
    el('p', 'vaco-small vaco-dim', 'Creates a real VSAFE check-in for a scheduled date tied to one of your matches.'),
    VACO.form([
      { name: 'matchId', label: 'Match id', type: 'number', min: 1, value: 1, width: '90px' },
      { name: 'dateScheduledAt', label: 'Date time', type: 'datetime-local', width: '170px' },
      { name: 'itinerary', label: 'Itinerary', placeholder: 'Dinner at Union Loafers, then a walk', width: '200px' },
      { name: 'trustedContactIds', label: 'Trusted contacts', placeholder: 'user ids, comma-separated', width: '170px' },
      { name: 'checkInWindowMinutes', label: 'Window (min)', type: 'number', min: 10, value: 120, width: '100px' },
    ], function (values) {
      var dateScheduledAt = dateInputToMs(values.dateScheduledAt);
      if (!dateScheduledAt) throw new Error('Pick a real date/time.');
      return VACO.post('/api/safety/check-ins', {
        userId: id, matchId: values.matchId, dateScheduledAt: dateScheduledAt,
        itinerary: values.itinerary, trustedContactIds: splitIds(values.trustedContactIds),
        checkInWindowMinutes: values.checkInWindowMinutes,
      }).then(function (c) { VACO.toast('Check-in #' + c.id + ' created — save that id.'); });
    }, 'Start check-in'),
  ]));

  var checkInStatusOut = el('div', 'vaco-stack-sm');
  grid.appendChild(VACO.card('Check-in status', [
    el('p', 'vaco-small vaco-dim', 'A real, live read from VSAFE plus CVNVO’s own dating-specific extension data.'),
    VACO.form([{ name: 'id', label: 'Check-in id', type: 'number', min: 1, value: 1, width: '100px' }],
      function (values) {
        return VACO.api('/api/safety/check-ins/' + values.id + '/full-status').then(function (c) {
          var card = el('div', 'vaco-stack-sm');
          card.appendChild(el('p', 'vaco-small vaco-dim', c.itinerary || '(no itinerary)'));
          var meta = el('div', 'vaco-row-tight');
          meta.appendChild(VACO.badge(c.vsafeStatus && c.vsafeStatus.status ? c.vsafeStatus.status : 'unknown'));
          if (c.actuallyMet !== null) meta.appendChild(VACO.badge(c.actuallyMet ? 'We Met: yes' : 'We Met: no'));
          if (c.voidRide) meta.appendChild(VACO.badge('ride: ' + c.voidRide.voidJobStatus));
          card.appendChild(meta);
          VACO.mount(checkInStatusOut, card);
        });
      }, 'Check status'),
    checkInStatusOut,
  ]));

  grid.appendChild(VACO.card('“We Met” — confirm safe', [
    el('p', 'vaco-small vaco-dim',
      'The real, literal "one user action, two uses": confirms you’re safe with VSAFE, and folds in whether the date happened — real match-quality feedback for future matching.'),
    VACO.form([
      { name: 'id', label: 'Check-in id', type: 'number', min: 1, value: 1, width: '100px' },
      { name: 'actuallyMet', label: 'Did the date happen?', options: [{ label: 'Yes', value: 'true' }, { label: 'No', value: 'false' }], width: '140px' },
      { name: 'dateRating', label: 'Rating (1–5, optional)', type: 'number', min: 1, max: 5, width: '110px' },
    ], function (values) {
      var dateRating = values.dateRating === '' || values.dateRating === undefined ? null : Number(values.dateRating);
      return VACO.post('/api/safety/check-ins/' + values.id + '/confirm-safe', {
        actuallyMet: values.actuallyMet === 'true', dateRating: dateRating,
      }).then(function () { VACO.toast('Confirmed safe.'); });
    }, 'Confirm safe'),
  ]));

  grid.appendChild(VACO.card('Attach a VOID ride', [
    el('p', 'vaco-small vaco-dim', 'Pulls the real driver and status from a VOID transportation job onto this check-in.'),
    VACO.form([
      { name: 'id', label: 'Check-in id', type: 'number', min: 1, value: 1, width: '100px' },
      { name: 'voidJobId', label: 'VOID job id', placeholder: 'void job id', width: '130px' },
    ], function (values) {
      return VACO.post('/api/safety/check-ins/' + values.id + '/void-ride', { voidJobId: values.voidJobId })
        .then(function (c) { VACO.toast('Ride attached — driver ' + (c.voidRide && c.voidRide.driverId)); });
    }, 'Attach ride'),
  ]));

  grid.appendChild(VACO.card('Schedule a photo check-in', [
    el('p', 'vaco-small vaco-dim', 'A missed photo check-in genuinely escalates this same VSAFE check-in.'),
    VACO.form([
      { name: 'id', label: 'Check-in id', type: 'number', min: 1, value: 1, width: '100px' },
      { name: 'intervalMinutes', label: 'Interval (min)', type: 'number', min: 5, value: 30, width: '110px' },
      { name: 'missedCheckInAction', label: 'If missed', options: [{ label: 'Notify contacts', value: 'notify-contacts' }, { label: 'Escalate emergency', value: 'escalate-emergency' }], width: '160px' },
    ], function (values) {
      return VACO.post('/api/safety/check-ins/' + values.id + '/photo-check-in', {
        intervalMinutes: values.intervalMinutes, missedCheckInAction: values.missedCheckInAction,
      }).then(function () { VACO.toast('Photo check-in scheduled.'); });
    }, 'Schedule'),
  ]));

  grid.appendChild(VACO.card('Submit a photo check-in', [
    VACO.form([
      { name: 'id', label: 'Check-in id', type: 'number', min: 1, value: 1, width: '100px' },
      { name: 'photoUrl', label: 'Photo URL', placeholder: 'https://…', width: '200px' },
    ], function (values) {
      return VACO.post('/api/safety/check-ins/' + values.id + '/photo-check-in/submit', { photoUrl: values.photoUrl })
        .then(function () { VACO.toast('Photo submitted.'); });
    }, 'Submit'),
  ]));

  grid.appendChild(VACO.card('Fake call', [
    el('p', 'vaco-small vaco-dim', 'A real VSAFE fake incoming call, scheduled to ring after a delay — a quiet exit from an uncomfortable date.'),
    VACO.form([
      { name: 'callerName', label: 'Caller name', placeholder: 'Mom', value: 'Mom', width: '120px' },
      { name: 'callerPhotoUrl', label: 'Photo URL (optional)', placeholder: 'https://…', width: '160px' },
      { name: 'delaySeconds', label: 'Delay (sec)', type: 'number', min: 1, value: 30, width: '100px' },
    ], function (values) {
      return VACO.post('/api/safety/fake-call', {
        userId: id, callerName: values.callerName, callerPhotoUrl: values.callerPhotoUrl || null, delaySeconds: values.delaySeconds,
      }).then(function () { VACO.toast('Fake call scheduled.'); });
    }, 'Schedule call'),
  ]));

  grid.appendChild(VACO.card('Screen time', [
    el('p', 'vaco-small vaco-dim', 'Records a real VSAFE screen-time session against the daily limit.'),
    VACO.form([{ name: 'sessionDurationMinutes', label: 'Minutes', type: 'number', min: 1, value: 15, width: '100px' }],
      function (values) {
        return VACO.post('/api/safety/screen-time', { userId: id, sessionDurationMinutes: values.sessionDurationMinutes })
          .then(function (r) { VACO.toast('Recorded' + (r.dailyTotalMinutes !== undefined ? ' — ' + r.dailyTotalMinutes + ' min today' : '') + '.'); });
      }, 'Record'),
  ]));

  out.appendChild(grid);
  return VACO.mount(body, out);
}

// -- Messages & Calls ---------------------------------------------------

function renderMessages(body) {
  var out = el('div', 'vaco-stack');
  out.appendChild(VACO.notice(
    'Every message is real-screened before delivery (external-contact solicitation, phone numbers, links, '
    + 'character flooding). Once a user owes a reply on too many conversations at once — Your Turn Limits — '
    + 'new matches pause for them until they catch up.'));

  var id = VACO.userId();
  if (!id) {
    out.appendChild(el('div', 'vaco-empty', 'Sign in to view matches and send messages.'));
    return VACO.mount(body, out);
  }

  var grid = el('div', 'safety-grid');

  grid.appendChild(VACO.card('Your turn-limit status', [
    (function () {
      var value = el('p', 'vaco-body', 'Loading…');
      VACO.api('/api/users/' + encodeURIComponent(id) + '/turn-limit-status')
        .then(function (r) {
          value.textContent = r.unansweredConversationCount + ' of ' + r.maxUnansweredConversations
            + ' unanswered conversations' + (r.overTurnLimit ? ' — new matches are paused.' : '.');
        })
        .catch(function () { value.textContent = 'Unavailable.'; });
      return value;
    }()),
  ]));

  var matchOut = el('div', 'vaco-stack-sm');
  grid.appendChild(VACO.card('Look up a match', [
    VACO.form([{ name: 'id', label: 'Match id', type: 'number', min: 1, value: 1, width: '90px' }],
      function (values) {
        return VACO.api('/api/matches/' + values.id).then(function (m) {
          var card = el('div', 'vaco-stack-sm');
          var row = el('div', 'match-row');
          row.appendChild(el('div', 'score-ring', Math.round(m.compatibilityScore)));
          row.appendChild(el('strong', null, m.userAId + ' & ' + m.userBId));
          card.appendChild(row);
          var meta = el('div', 'vaco-row-tight');
          meta.appendChild(VACO.badge(m.matchType));
          meta.appendChild(VACO.badge(Date.now() < m.expiresAt ? 'active' : 'expired'));
          meta.appendChild(VACO.badge(m.unansweredCount + ' unanswered'));
          if (m.awaitingReplyFromUserId) meta.appendChild(el('span', 'vaco-small vaco-dim', 'awaiting: ' + m.awaitingReplyFromUserId));
          card.appendChild(meta);
          VACO.mount(matchOut, card);
        });
      }, 'Fetch'),
    matchOut,
  ]));

  var messagesOut = el('div', 'vaco-stack-sm');
  messagesOut.appendChild(el('p', 'vaco-small vaco-faint', 'Load a conversation to see its messages.'));
  grid.appendChild(VACO.card('Conversation', [
    VACO.form([{ name: 'matchId', label: 'Match id', type: 'number', min: 1, value: 1, width: '90px' }],
      function (values) {
        return VACO.api('/api/matches/' + values.matchId + '/messages').then(function (data) {
          var messages = data.messages || [];
          VACO.mount(messagesOut, messages.length
            ? VACO.table([
              { key: 'senderId', label: 'From' },
              { key: 'text', label: 'Message' },
              { key: 'flagged', label: 'Flagged', render: function (m) { return m.flagged ? VACO.badge('flagged (' + m.severity + '): ' + m.reasons.join(', '), 'danger') : el('span', 'vaco-small vaco-faint', '—'); } },
            ], messages)
            : el('p', 'vaco-small vaco-faint', 'No messages yet.'));
        });
      }, 'Load'),
    messagesOut,
    VACO.form([
      { name: 'matchId', label: 'Match id', type: 'number', min: 1, value: 1, width: '90px' },
      { name: 'text', label: 'Message', placeholder: 'say something', width: '220px' },
    ], function (values) {
      return VACO.post('/api/matches/' + values.matchId + '/messages', { senderId: id, text: values.text })
        .then(function (m) {
          VACO.toast(m.flagged ? 'Sent — but flagged (' + m.severity + '): ' + m.reasons.join(', ') : 'Sent.');
        });
    }, 'Send'),
  ]));

  var screenOut = el('div', 'vaco-stack-sm');
  grid.appendChild(VACO.card('Screen a message', [
    el('p', 'vaco-small vaco-dim', 'Runs the same real, deterministic scan every message gets (via VSAFE), without actually sending anything.'),
    VACO.form([{ name: 'text', label: 'Draft text', placeholder: 'type a draft', width: '220px' }],
      function (values) {
        return VACO.post('/api/messages/screen', { text: values.text }).then(function (r) {
          VACO.mount(screenOut, r.flagged
            ? VACO.badge('flagged (' + r.severity + '): ' + r.reasons.join(', '), 'danger')
            : VACO.badge('clean', 'money'));
        });
      }, 'Check'),
    screenOut,
  ]));

  var callOut = el('div', 'vaco-stack-sm');
  grid.appendChild(VACO.card('Anonymous call', [
    el('p', 'vaco-small vaco-dim', 'A real call-session record — never a phone number — tracking who called whom on which match.'),
    VACO.form([
      { name: 'matchId', label: 'Match id', type: 'number', min: 1, value: 1, width: '90px' },
      { name: 'calleeId', label: 'Call', placeholder: 'their user id', width: '140px' },
    ], function (values) {
      return VACO.post('/api/calls', { matchId: values.matchId, callerId: id, calleeId: values.calleeId })
        .then(function (c) { VACO.toast('Call #' + c.id + ' started — save that id to end it.'); });
    }, 'Start call'),
    VACO.form([{ name: 'id', label: 'Call id', type: 'number', min: 1, value: 1, width: '90px' }],
      function (values) {
        return VACO.api('/api/calls/' + values.id).then(function (c) {
          VACO.mount(callOut, VACO.badge(c.status, c.status === 'active' ? 'warn' : null));
        });
      }, 'Check status'),
    callOut,
    VACO.form([{ name: 'id', label: 'Call id', type: 'number', min: 1, value: 1, width: '90px' }],
      function (values) {
        return VACO.post('/api/calls/' + values.id + '/end', {}).then(function () { VACO.toast('Call ended.'); });
      }, 'End call'),
  ]));

  out.appendChild(grid);
  return VACO.mount(body, out);
}

// -- Nearby: Happn-style proximity + FlashNotes + the rest of BarBuddy --
//
// BarBuddy check-in itself lives on the Safety tab (it's the safety
// entry point this app was built around — see that tab's own card).
// Everything else lib/proximity.js owns — the real crossing-paths feed,
// sending a flash note, and the rest of a BarBuddy session (checking
// out, toggling visibility, seeing who else at a venue opted in) — had
// no frontend at all, so it lives here as one real client of that one
// module rather than a second, parallel BarBuddy surface.

function renderNearby(body) {
  var out = el('div', 'vaco-stack');
  out.appendChild(VACO.notice(
    'Happn-style crossings are only ever stored as the real intersection point, never a continuous location trail — '
    + 'and only when two real coordinate pairs are genuinely within the 250m crossing radius.'));

  var id = VACO.userId();
  if (!id) {
    out.appendChild(el('div', 'vaco-empty', 'Sign in to use proximity and BarBuddy features.'));
    return VACO.mount(body, out);
  }

  var grid = el('div', 'safety-grid');

  grid.appendChild(VACO.card('Record a crossing', [
    el('p', 'vaco-small vaco-dim', 'Rejected server-side if the two coordinate pairs are more than 250m apart.'),
    VACO.form([
      { name: 'otherUserId', label: 'Crossed with', placeholder: 'their user id', width: '130px' },
      { name: 'lat', label: 'Your lat', type: 'number', step: '0.0001', value: 38.627, width: '100px' },
      { name: 'lng', label: 'Your lng', type: 'number', step: '0.0001', value: -90.1994, width: '100px' },
      { name: 'otherLat', label: 'Their lat', type: 'number', step: '0.0001', value: 38.6271, width: '100px' },
      { name: 'otherLng', label: 'Their lng', type: 'number', step: '0.0001', value: -90.1993, width: '100px' },
    ], function (values) {
      return VACO.post('/api/proximity', {
        userId: id, otherUserId: values.otherUserId, lat: values.lat, lng: values.lng, otherLat: values.otherLat, otherLng: values.otherLng,
      }).then(function (e) { VACO.toast('Crossing recorded — ' + Math.round(e.distanceKm * 1000) + 'm apart.'); });
    }, 'Record'),
  ]));

  grid.appendChild(VACO.card('Your crossings', [
    (function () {
      var list = el('div', null);
      list.textContent = 'Loading…';
      VACO.api('/api/proximity/' + encodeURIComponent(id))
        .then(function (data) {
          var feed = data.feed || [];
          VACO.mount(list, feed.length
            ? VACO.table([
              { key: 'otherUserId', label: 'With' },
              { key: 'distanceKm', label: 'Distance (km)', num: true },
              { key: 'timestamp', label: 'When', render: function (r) { return new Date(r.timestamp).toLocaleString(); } },
            ], feed)
            : el('p', 'vaco-small vaco-faint', 'No crossings yet.'));
        })
        .catch(function () { list.textContent = 'Unavailable.'; });
      return list;
    }()),
  ]));

  grid.appendChild(VACO.card('Send a flash note', [
    el('p', 'vaco-small vaco-dim', 'A real icebreaker sent before any match exists — doesn’t touch your regular conversations.'),
    VACO.form([
      { name: 'recipientId', label: 'To', placeholder: 'their user id', width: '130px' },
      { name: 'text', label: 'Note', placeholder: 'hey, nice crossfit shirt', width: '200px' },
    ], function (values) {
      return VACO.post('/api/flash-notes', { senderId: id, recipientId: values.recipientId, text: values.text })
        .then(function () { VACO.toast('Flash note sent.'); });
    }, 'Send'),
  ]));

  var venueOut = el('div', 'vaco-stack-sm');
  grid.appendChild(VACO.card('BarBuddy venue', [
    el('p', 'vaco-small vaco-dim',
      'Check in from the Safety tab first. From here: see who else at the venue opted in, toggle your own visibility, or check out.'),
    VACO.form([{ name: 'venueId', label: 'Venue', placeholder: 'venue id', width: '130px' }],
      function (values) {
        return VACO.api('/api/barbuddy/venues/' + encodeURIComponent(values.venueId)).then(function (v) {
          var users = v.visibleUsers || [];
          VACO.mount(venueOut, users.length
            ? VACO.table([{ key: 'userId', label: 'Visible there now' }], users.map(function (u) { return { userId: u }; }))
            : el('p', 'vaco-small vaco-faint', 'Nobody visible there right now.'));
        });
      }, 'Who’s there'),
    venueOut,
    VACO.form([
      { name: 'venueId', label: 'Venue', placeholder: 'venue id', width: '130px' },
      { name: 'isVisibleToOthersAtVenue', label: 'Visible to others there?', options: [{ label: 'No', value: 'false' }, { label: 'Yes', value: 'true' }], width: '200px' },
    ], function (values) {
      return VACO.post('/api/barbuddy/visibility', {
        userId: id, venueId: values.venueId, isVisibleToOthersAtVenue: values.isVisibleToOthersAtVenue === 'true',
      }).then(function () { VACO.toast('Visibility updated.'); });
    }, 'Set visibility'),
    VACO.form([{ name: 'venueId', label: 'Venue', placeholder: 'venue id', width: '130px' }],
      function (values) {
        return VACO.post('/api/barbuddy/check-out', { userId: id, venueId: values.venueId })
          .then(function () { VACO.toast('Checked out.'); });
      }, 'Check out'),
  ]));

  out.appendChild(grid);
  return VACO.mount(body, out);
}

// -- Dating Formats: Speed/Group Dating, Gift Dating, Long-Distance,
// Blind Date -- four real, distinct formats sitting on top of the same
// core matching engine (per this app's own README framing), bundled
// into one tab the same way void/public/index.html's own "Scheduling"
// tab bundled that app's four real scheduling surfaces together.

function renderFormats(body) {
  var out = el('div', 'vaco-stack');
  out.appendChild(VACO.notice(
    'Four real, distinct dating formats — Speed/Group Dating, Gift Dating, Long-Distance Mode, and Blind Date — '
    + 'all reuse the same real compatibility and matching engine underneath, not parallel systems.'));

  var id = VACO.userId();
  if (!id) {
    out.appendChild(el('div', 'vaco-empty', 'Sign in to use any dating format below.'));
    return VACO.mount(body, out);
  }

  var grid = el('div', 'safety-grid');

  // -- Speed / Group Dating --

  var speedOut = el('div', 'vaco-stack-sm');
  grid.appendChild(VACO.card('Speed & Group Dating', [
    el('p', 'vaco-small vaco-dim', 'Requires every participant to hold a real VACA-verified badge. 2 participants is standard; 3+ is a rotating group slot.'),
    VACO.form([
      { name: 'format', label: 'Format', options: [{ label: 'In person', value: 'in-person' }, { label: 'All-FaceTime', value: 'all-facetime' }], width: '140px' },
      { name: 'participants', label: 'Participants', placeholder: 'user ids, comma-separated', value: id, width: '200px' },
      { name: 'durationSec', label: 'Duration (sec)', type: 'number', min: 1, value: 180, width: '110px' },
    ], function (values) {
      var participants = splitIds(values.participants);
      if (!participants.includes(id)) throw new Error('You must be one of the participants.');
      return VACO.post('/api/speed-dates', { format: values.format, participants: participants, durationSec: values.durationSec })
        .then(function (d) { VACO.toast('Speed date slot #' + d.id + ' scheduled.'); });
    }, 'Schedule'),
    VACO.form([{ name: 'id', label: 'Slot id', type: 'number', min: 1, value: 1, width: '90px' }],
      function (values) {
        return VACO.api('/api/speed-dates/' + values.id).then(function (s) {
          var card = el('div', 'vaco-stack-sm');
          card.appendChild(el('p', 'vaco-small vaco-dim', s.participants.join(', ') + ' — ' + s.durationSec + 's (' + s.format + ')'));
          if (s.participants.length > 2) {
            return VACO.api('/api/speed-dates/' + values.id + '/rotation').then(function (r) {
              card.appendChild(VACO.table([{ key: 'userAId', label: 'A' }, { key: 'userBId', label: 'B' }], r.rounds));
              VACO.mount(speedOut, card);
            });
          }
          VACO.mount(speedOut, card);
        });
      }, 'View slot'),
    speedOut,
    VACO.form([
      { name: 'id', label: 'Slot id', type: 'number', min: 1, value: 1, width: '90px' },
      { name: 'additionalSec', label: 'Extend by (sec)', type: 'number', min: 1, value: 180, width: '110px' },
    ], function (values) {
      return VACO.post('/api/speed-dates/' + values.id + '/extend', { additionalSec: values.additionalSec })
        .then(function () { VACO.toast('Extended once — a slot can only extend one time.'); });
    }, 'Extend'),
  ]));

  // -- Gift Dating --

  var giftThresholdOut = el('div', 'vaco-stack-sm');
  var giftRequestsOut = el('div', 'vaco-stack-sm');
  grid.appendChild(VACO.card('Gift Dating', [
    el('p', 'vaco-small vaco-dim', 'The real, deliberate replacement for a "sugar dating" feature — a recipient-set VCoin minimum before a date request is even created.'),
    VACO.form([{ name: 'minGiftValueVCoin', label: 'Your minimum (VCoin)', type: 'number', min: 0, value: 50, width: '140px' }],
      function (values) {
        return VACO.post('/api/gift-dating/threshold', { userId: id, minGiftValueVCoin: values.minGiftValueVCoin })
          .then(function () { VACO.toast('Threshold set.'); loadGiftThreshold(); });
      }, 'Set threshold'),
    giftThresholdOut,
    VACO.form([
      { name: 'recipientId', label: 'Request a date with', placeholder: 'their user id', width: '140px' },
      { name: 'giftValueVCoin', label: 'Gift (VCoin)', type: 'number', min: 1, value: 50, width: '110px' },
    ], function (values) {
      return VACO.post('/api/gift-dating/request', { requesterId: id, recipientId: values.recipientId, giftValueVCoin: values.giftValueVCoin })
        .then(function (r) { VACO.toast('Request #' + r.id + ' sent — real VCoin transferred.'); });
    }, 'Send gift + request'),
    el('p', 'vaco-small vaco-dim', 'Requests you’ve received:'),
    giftRequestsOut,
  ]));

  function loadGiftThreshold() {
    VACO.api('/api/gift-dating/threshold/' + encodeURIComponent(id))
      .then(function (t) { VACO.mount(giftThresholdOut, VACO.badge('current minimum: ' + t.minGiftValueVCoin + ' VCoin')); })
      .catch(function () { VACO.mount(giftThresholdOut, el('p', 'vaco-small vaco-faint', 'No threshold set — any gift is accepted.')); });
  }
  loadGiftThreshold();
  VACO.api('/api/gift-dating/requests/' + encodeURIComponent(id))
    .then(function (data) {
      var requests = data.requests || [];
      VACO.mount(giftRequestsOut, requests.length
        ? VACO.table([
          { key: 'requesterId', label: 'From' },
          { key: 'giftValueVCoin', label: 'Gift', num: true },
        ], requests)
        : el('p', 'vaco-small vaco-faint', 'None yet.'));
    })
    .catch(function () { /* no requests yet */ });

  // -- Long-Distance Mode --

  var ldPinOut = el('div', 'vaco-stack-sm');
  var ldRoadmapOut = el('div', 'vaco-stack-sm');
  grid.appendChild(VACO.card('Long-Distance Mode', [
    el('p', 'vaco-small vaco-dim', 'A Bumble Travel-style pin, one Coffee Meets Bagel-style curated match per real day, and a one-directional "closing the distance" roadmap.'),
    VACO.form([
      { name: 'lat', label: 'Lat', type: 'number', step: '0.0001', value: 40.7128, width: '100px' },
      { name: 'lng', label: 'Lng', type: 'number', step: '0.0001', value: -74.006, width: '100px' },
      { name: 'isTravelPin', label: 'Travel pin?', options: [{ label: 'No — I live here', value: 'false' }, { label: 'Yes — upcoming travel', value: 'true' }], width: '180px' },
    ], function (values) {
      return VACO.post('/api/long-distance/pin', { userId: id, lat: values.lat, lng: values.lng, isTravelPin: values.isTravelPin === 'true' })
        .then(function () { VACO.toast('Pin set.'); loadLdPin(); });
    }, 'Set pin'),
    ldPinOut,
    VACO.form([{ name: 'candidateIds', label: 'Candidates', placeholder: 'user ids, comma-separated', width: '180px' }],
      function (values) {
        return VACO.post('/api/long-distance/daily-match', { userId: id, candidateIds: splitIds(values.candidateIds) })
          .then(function (m) { VACO.toast('Today’s curated match: ' + m.candidateId + ' (one per real day).'); });
      }, 'Get daily match'),
    VACO.form([{ name: 'matchId', label: 'Match id', type: 'number', min: 1, value: 1, width: '90px' }],
      function (values) {
        return VACO.api('/api/long-distance/roadmap/' + values.matchId).then(function (r) {
          VACO.mount(ldRoadmapOut, VACO.badge(r.stage, r.stage === 'closing-distance' ? 'money' : 'warn'));
        });
      }, 'View roadmap'),
    ldRoadmapOut,
    VACO.form([{ name: 'matchId', label: 'Match id', type: 'number', min: 1, value: 1, width: '90px' }],
      function (values) {
        return VACO.post('/api/long-distance/roadmap/' + values.matchId + '/advance', {})
          .then(function (r) { VACO.toast('Advanced to ' + r.stage + '.'); });
      }, 'Advance stage'),
  ]));

  function loadLdPin() {
    VACO.api('/api/long-distance/pin/' + encodeURIComponent(id))
      .then(function (p) { VACO.mount(ldPinOut, VACO.badge((p.isTravelPin ? 'travel pin' : 'home pin') + ': ' + p.lat.toFixed(2) + ', ' + p.lng.toFixed(2))); })
      .catch(function () { VACO.mount(ldPinOut, el('p', 'vaco-small vaco-faint', 'No pin set yet.')); });
  }
  loadLdPin();

  // -- Blind Date Mode --

  var blockedOut = el('div', 'vaco-stack-sm');
  var sessionOut = el('div', 'vaco-stack-sm');
  grid.appendChild(VACO.card('Blind Date Mode', [
    el('p', 'vaco-small vaco-dim',
      'A $20 VCoin date token, one AI-ranked match at a time with photos hidden until 3 real messages, and a block after 2 cancellations in a row.'),
    blockedOut,
    VACO.form([], function () {
      return VACO.post('/api/blind-date/token', { userId: id })
        .then(function (t) { VACO.toast('Token #' + t.id + ' purchased — 20 VCoin.'); });
    }, 'Buy a date token (20 VCoin)'),
    VACO.form([{ name: 'candidateIds', label: 'Candidates', placeholder: 'user ids, comma-separated', width: '180px' }],
      function (values) {
        return VACO.post('/api/blind-date/assign', { userId: id, candidateIds: splitIds(values.candidateIds) })
          .then(function (s) { VACO.toast('Blind date session #' + s.id + ' assigned.'); });
      }, 'Assign'),
    VACO.form([{ name: 'id', label: 'Session id', type: 'number', min: 1, value: 1, width: '90px' }],
      function (values) {
        return VACO.api('/api/blind-date/' + values.id).then(function (s) {
          var row = el('div', 'vaco-row-tight');
          row.appendChild(VACO.badge(s.photosRevealed ? 'photos revealed' : 'photos hidden', s.photosRevealed ? 'money' : 'warn'));
          if (s.cancelled) row.appendChild(VACO.badge('cancelled', 'danger'));
          VACO.mount(sessionOut, row);
        });
      }, 'View session'),
    sessionOut,
    VACO.form([{ name: 'id', label: 'Session id', type: 'number', min: 1, value: 1, width: '90px' }],
      function (values) {
        return VACO.post('/api/blind-date/' + values.id + '/reveal', {})
          .then(function () { VACO.toast('Photos revealed.'); });
      }, 'Reveal photos'),
    VACO.form([{ name: 'id', label: 'Session id', type: 'number', min: 1, value: 1, width: '90px' }],
      function (values) {
        return VACO.post('/api/blind-date/' + values.id + '/cancel', {})
          .then(function () { VACO.toast('Cancelled.'); });
      }, 'Cancel'),
  ]));

  VACO.api('/api/blind-date/blocked/' + encodeURIComponent(id))
    .then(function (r) {
      if (r.blocked) VACO.mount(blockedOut, VACO.badge('temporarily blocked after 2 cancellations in a row', 'danger'));
    })
    .catch(function () { /* unknown, say nothing rather than guess */ });

  out.appendChild(grid);
  return VACO.mount(body, out);
}

// -- Snap Map: graduated location privacy + radius search --

function renderSnapMap(body) {
  var out = el('div', 'vaco-stack');
  out.appendChild(VACO.notice(
    'Three real privacy tiers, not a plain on/off toggle: <strong>Ghost Mode</strong> (invisible to everyone), '
    + '<strong>My Friends</strong> (visible only to your real, active matches — the closest real substitute for a '
    + 'friend graph this app doesn’t have), and <strong>Select Friends</strong> (visible only to people you name).'));

  var id = VACO.userId();
  if (!id) {
    out.appendChild(el('div', 'vaco-empty', 'Sign in to share or view locations.'));
    return VACO.mount(body, out);
  }

  var grid = el('div', 'safety-grid');

  grid.appendChild(VACO.card('Your sharing preference', [
    VACO.form([
      { name: 'tier', label: 'Visible to', options: [
        { label: 'Ghost Mode (nobody)', value: 'ghost-mode' },
        { label: 'My Friends (active matches)', value: 'my-friends' },
        { label: 'Select Friends (choose below)', value: 'select-friends' },
      ], width: '220px' },
      { name: 'selectedUserIds', label: 'Select Friends list', placeholder: 'user ids, comma-separated', width: '200px' },
    ], function (values) {
      return VACO.post('/api/location/sharing-preference', {
        userId: id, tier: values.tier, selectedUserIds: splitIds(values.selectedUserIds),
      }).then(function () { VACO.toast('Preference set to ' + values.tier + '.'); });
    }, 'Save'),
  ]));

  grid.appendChild(VACO.card('Share your location', [
    el('p', 'vaco-small vaco-dim', 'Only your latest position is kept — not a trail.'),
    VACO.form([
      { name: 'lat', label: 'Lat', type: 'number', step: '0.0001', value: 38.627, width: '110px' },
      { name: 'lng', label: 'Lng', type: 'number', step: '0.0001', value: -90.1994, width: '110px' },
    ], function (values) {
      return VACO.post('/api/location/share', { userId: id, lat: values.lat, lng: values.lng })
        .then(function () { VACO.toast('Location shared, subject to your privacy tier.'); });
    }, 'Share'),
  ]));

  grid.appendChild(VACO.card('Who you can see', [
    (function () {
      var list = el('div', null);
      list.textContent = 'Loading…';
      VACO.api('/api/location/visible/' + encodeURIComponent(id))
        .then(function (data) {
          var locs = data.visibleLocations || [];
          VACO.mount(list, locs.length
            ? VACO.table([{ key: 'userId', label: 'User' }, { key: 'lat', label: 'Lat', num: true }, { key: 'lng', label: 'Lng', num: true }], locs)
            : el('p', 'vaco-small vaco-faint', 'Nobody has shared a visible location with you yet.'));
        })
        .catch(function () { list.textContent = 'Unavailable.'; });
      return list;
    }()),
  ]));

  var searchOut = el('div', 'vaco-stack-sm');
  grid.appendChild(VACO.card('Search nearby (1–100 miles)', [
    VACO.form([
      { name: 'lat', label: 'Lat', type: 'number', step: '0.0001', value: 38.627, width: '100px' },
      { name: 'lng', label: 'Lng', type: 'number', step: '0.0001', value: -90.1994, width: '100px' },
      { name: 'radiusKm', label: 'Radius (km)', type: 'number', min: 1.61, max: 160.93, step: '0.1', value: 10, width: '110px' },
    ], function (values) {
      return VACO.api('/api/location/search?lat=' + values.lat + '&lng=' + values.lng + '&radiusKm=' + values.radiusKm)
        .then(function (r) { VACO.mount(searchOut, VACO.badge(r.openForContactCount + ' open for contact nearby')); });
    }, 'Search'),
    searchOut,
  ]));

  out.appendChild(grid);
  return VACO.mount(body, out);
}

VACO.app({
  id: 'cvnvo',
  name: 'CVNVO',
  tagline: 'Dating, safety first',
  //: CVNVO's identity: a muted coral-rose. Warm without being the
  //: saturated hot-pink every dating app defaults to, and distinct from
  //: CVLTVRE's magenta in the register.
  accent: '#e2716b',
  accentDim: '#bd524d',
  accentInk: '#1a0806',
  tabs: [
    { id: 'discover', label: 'Discover', heading: 'People', render: renderDiscover },
    { id: 'events', label: 'Events', heading: 'Date events', render: renderEvents },
    { id: 'messages', label: 'Messages', heading: 'Matches, messages & calls', render: renderMessages },
    { id: 'safety', label: 'Safety', heading: 'Check-ins & screening', render: renderSafety },
    { id: 'nearby', label: 'Nearby', heading: 'Proximity & BarBuddy', render: renderNearby },
    { id: 'formats', label: 'Formats', heading: 'Dating formats', render: renderFormats },
    { id: 'snapmap', label: 'Snap Map', heading: 'Location privacy', render: renderSnapMap },
  ],
});
</script>
</body>
</html>
