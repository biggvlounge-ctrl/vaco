<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vvltvre Studios</title>
<link rel="stylesheet" href="/vaco-design.css" />
<style>
  .cap-table { display: flex; height: 14px; border-radius: var(--vaco-radius-sm); overflow: hidden; background: var(--vaco-surface-hover); }
  .cap-seg { height: 100%; }
  .raise-track { height: 8px; border-radius: var(--vaco-radius-pill); background: var(--vaco-surface-hover); overflow: hidden; }
  .raise-fill { height: 100%; background: var(--vaco-money); }
</style>
</head>
<body class="vaco">
<script src="/vaco-ui.js"></script>
<script>
// Vvltvre Studios — the fund-and-produce arm.
//
// Browse what's greenlit and raising, and invest real VCoin for real
// equity. Real client of `GET /api/projects`, `GET
// /api/projects/:id/equity`, and `POST /api/projects/:id/invest` --
// every field checked against `lib/projects.js`'s real return shape,
// not guessed. Equity maths is entirely server-side.
//
// **No "greenlight a project" form here.** `POST /api/projects` is
// mounted behind `requireCallingService()` (server.js) -- it is "for
// internal schedulers... requires a service credential", explicitly
// refusing even a real, valid user session (confirmed live: a signed-in
// user's own Bearer token still gets refused with "requires a service
// credential", since `requireCallingService` only ever checks
// `req.callingService`, which a user session never sets). A browser
// frontend has no legitimate way to hold that credential -- presenting
// one here would mean shipping a service secret to every visitor's
// browser. The previous version of this tab had a real-looking
// Greenlight form that POSTed here anyway (and, on top of that, with
// field names -- `creatorId`/`projectType`/`fundingTarget` -- that
// don't exist on `greenlightProject`'s real signature at all, which
// wants `title`/`medium`/`synopsis`/`budgetRequested`): it could not
// have worked for any real visitor, on either count. Removed rather
// than fixed into a fake-admin form; greenlighting stays the real
// internal-operations action it already is, same posture VOID's own
// frontend coverage pass took for every `requireCallingService`/
// `requireOperator` route (starting production, completing, distributing,
// and reporting revenue here are all `requireOperator(...)`-gated the
// same way, and none of them get a form either).
//
// **The cap table is the screen.** Everything else about film
// financing is negotiation; who owns what percentage after the raise is
// the fact, and it is what an investor actually needs to see.

var el = VACO.el;

function renderProjects(body) {
  var out = el('div', 'vaco-stack');

  return VACO.api('/api/projects').then(function (data) {
    var projects = data.projects || [];
    if (!projects.length) {
      out.appendChild(el('div', 'vaco-empty', 'No projects are greenlit yet.'));
      return VACO.mount(body, out);
    }

    var pending = projects.map(function (p) {
      return VACO.api('/api/projects/' + p.id + '/equity')
        .then(function (e) { return { project: p, equity: e }; })
        .catch(function () { return { project: p, equity: null }; });
    });

    return Promise.all(pending).then(function (loaded) {
      out.appendChild(VACO.grid(loaded.map(function (entry) {
        var p = entry.project;
        var lines = el('div', 'vaco-stack-sm');
        // Real fields on the project record (`lib/projects.js`) --
        // `medium`, not `projectType`; there is no `creatorId` at all
        // (`greenlightProject` names no owner — the studio greenlights,
        // investors buy in afterwards, per this app's own README).
        lines.appendChild(el('p', 'vaco-small vaco-dim', p.medium));

        var raised = p.amountRaised || 0;
        var target = p.budgetRequested || 1;
        var pct = Math.min(100, Math.round((raised / target) * 100));
        var track = el('div', 'raise-track');
        var fill = el('div', 'raise-fill');
        fill.style.width = pct + '%';
        track.appendChild(fill);
        lines.appendChild(track);
        lines.appendChild(el('p', 'vaco-small', VACO.round(raised) + ' of ' + VACO.round(target) + ' raised · ' + pct + '%'));

        // The cap table, as a shape. Who owns what after the money.
        // Real shape from `getProjectEquity`: `{ investors:
        // [{investorId, contributed, equityPercent}] }` -- `equityPercent`
        // is a raw fraction (0–1), not a 0–100 percent, so it's scaled
        // here rather than used directly as a CSS width.
        if (entry.equity) {
          var holders = entry.equity.investors || [];
          if (holders.length) {
            var hues = ['var(--vaco-accent)', 'var(--vaco-info)', 'var(--vaco-money)', 'var(--vaco-warn)'];
            var cap = el('div', 'cap-table');
            holders.forEach(function (h, i) {
              var holderPct = Math.round((h.equityPercent || 0) * 100);
              var seg = el('div', 'cap-seg');
              seg.style.width = holderPct + '%';
              seg.style.background = hues[i % hues.length];
              seg.title = h.investorId + ' — ' + holderPct + '%';
              cap.appendChild(seg);
            });
            lines.appendChild(el('span', 'vaco-label', 'Cap table'));
            lines.appendChild(cap);
            lines.appendChild(el('p', 'vaco-small vaco-faint',
              holders.map(function (h) {
                var holderPct = Math.round((h.equityPercent || 0) * 100);
                return h.investorId + ' ' + holderPct + '%';
              }).join(' · ')));
          }
        }

        var invest = el('div', 'vaco-row-tight');
        var amount = el('input', 'vaco-input vaco-num');
        amount.type = 'number'; amount.min = 1; amount.value = 500;
        amount.style.width = '96px';
        amount.setAttribute('aria-label', 'Investment amount');
        invest.appendChild(amount);
        invest.appendChild(VACO.button('Invest', function () {
          if (!VACO.userId()) throw new Error('Sign in to invest.');
          return VACO.post('/api/projects/' + p.id + '/invest', {
            investorId: VACO.userId(), amount: Number(amount.value),
          }).then(function () {
            VACO.toast('Invested ' + amount.value + ' in ' + p.title + ' for real equity.', 'money');
            VACO.refreshBalances().then(VACO.renderIdentity);
            VACO.render();
          });
        }, 'primary'));
        lines.appendChild(invest);

        return VACO.card(p.title, [lines], { trailing: VACO.badge(p.status) });
      }), true));
      VACO.mount(body, out);
    });
  });
}

VACO.app({
  id: 'vulture-studios',
  name: 'Vvltvre Studios',
  tagline: 'Fund & produce',
  //: Vvltvre Studios' identity: a steel blue. Institutional and
  //: financial rather than creative-warm — this is the arm that writes
  //: cheques, and it should not look like the label.
  accent: '#5a8fd6',
  accentDim: '#3f6fb0',
  accentInk: '#04101f',
  tabs: [
    { id: 'projects', label: 'Projects', heading: 'Greenlit & raising',
      blurb: 'Real financing for real equity. Investing moves VCoin and changes the cap table — it is not a pledge.',
      render: renderProjects },
  ],
});
</script>
</body>
</html>
