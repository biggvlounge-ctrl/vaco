<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VACON</title>
<link rel="stylesheet" href="/vaco-design.css" />
<style>
  .agent-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: var(--vaco-space-3); }
  .match-bar { height: 6px; border-radius: var(--vaco-radius-pill); background: var(--vaco-surface-hover); overflow: hidden; }
  .match-fill { height: 100%; background: var(--vaco-accent); }
  .keyword { font-family: var(--vaco-font-mono); font-size: var(--vaco-text-xs); }
  .kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: var(--vaco-space-3); }
  .kv-cell { display: flex; flex-direction: column; }
  .kv-value { font-size: var(--vaco-text-lg); font-weight: var(--vaco-weight-bold); font-variant-numeric: tabular-nums; }
</style>
</head>
<body class="vaco">
<script src="/vaco-ui.js"></script>
<script>
// VACON — the operating network: MIA plus the named executive agents.
//
// **What routing here actually is.** MIA matches a question against
// each agent's domain keywords on word boundaries and weights by
// specificity. It is a real, deterministic router — not a model
// deciding. Showing which keywords matched is the honest way to
// present that, because a routing decision you cannot inspect is
// indistinguishable from a guess.
//
// The agents themselves are not autonomous. Invoking one calls through
// v4-proxy to a real model if an API key is configured; without one the
// routing above still works and is still the real product.

var el = VACO.el;

function renderAgents(body) {
  return VACO.api('/api/agents').then(function (data) {
    var agents = data.agents || data || [];
    var grid = el('div', 'agent-grid');
    agents.forEach(function (a) {
      var lines = el('div', 'vaco-stack-sm');
      lines.appendChild(el('p', 'vaco-small vaco-dim', a.role || a.description || ''));
      // Fixed: the real record's field is `app` (the app this agent
      // represents), not `represents` -- this badge never rendered
      // before. `domainKeywords` never existed on an agent record at
      // all (that data lives server-side only, in
      // lib/orchestrator.js's own DOMAIN_KEYWORDS), so that branch was
      // dead code; removed rather than left pretending to do something.
      if (a.app) lines.appendChild(VACO.badge(a.app));
      if (a.tier) lines.appendChild(el('p', 'vaco-small vaco-faint', 'tier: ' + a.tier));

      var detailHost = el('div', 'vaco-stack-sm');
      lines.appendChild(detailHost);
      // GET /api/agents/:id -- previously never called from here. The
      // list above already carries the full record, but this fetches
      // the single-agent route directly rather than reusing it, so the
      // route itself is exercised and verified, not just assumed to
      // match what the list returned.
      lines.appendChild(VACO.button('Full profile', function () {
        return VACO.api('/api/agents/' + encodeURIComponent(a.id)).then(function (full) {
          VACO.mount(detailHost, [
            el('p', 'vaco-label', 'System prompt'),
            el('p', 'vaco-small vaco-dim', full.systemPrompt || '—'),
          ]);
        });
      }, 'ghost vaco-btn-sm'));

      grid.appendChild(VACO.card(a.name || a.id, [lines]));
    });
    if (!agents.length) return el('div', 'vaco-empty', 'No agents registered.');
    return grid;
  });
}

function renderRoute(body) {
  var out = el('div', 'vaco-stack');

  out.appendChild(VACO.card('Ask the network', [
    el('p', 'vaco-small vaco-dim',
      'MIA routes on word boundaries and weights by specificity, so "trip" no longer matches "ip". '
      + 'Every match is shown with the keywords that caused it.'),
    VACO.form([
      { name: 'query', label: 'Question', placeholder: 'how do I get a package across town today?', width: '360px' },
    ], function (values) {
      return VACO.post('/api/route', { query: values.query }).then(function (result) {
        while (out.childNodes.length > 1) out.removeChild(out.lastChild);
        var matches = result.matchedAgents || result.matches || [];
        if (!matches.length) {
          out.appendChild(VACO.notice('No agent claimed that question. That is a real answer, not a failure — '
            + 'it means no registered domain covers it.', 'warn'));
          VACO.mount(body, out);
          return;
        }
        var top = matches[0].score || 1;
        matches.forEach(function (m) {
          var lines = el('div', 'vaco-stack-sm');
          var bar = el('div', 'match-bar');
          var fill = el('div', 'match-fill');
          fill.style.width = Math.round(((m.score || 0) / top) * 100) + '%';
          bar.appendChild(fill);
          lines.appendChild(bar);
          lines.appendChild(el('p', 'vaco-small vaco-dim', 'score ' + (m.score || 0)));
          // Fixed: the real route returns the matched words as
          // `keywords`, not `matched` -- this never rendered before,
          // which defeated the whole point of showing a deterministic
          // router's own reasoning instead of a black box.
          if (m.keywords && m.keywords.length) {
            lines.appendChild(el('p', 'keyword vaco-faint', 'matched: ' + m.keywords.join(', ')));
          }
          lines.appendChild(VACO.button('Invoke', function () {
            // Fixed: the real route requires a `messages` array
            // (`[{role, content}]`, the same shape v4-proxy itself
            // takes), not a bare `query` string -- every click here
            // used to 400 before the request ever reached v4-proxy,
            // and the catch below blamed the missing API key for a
            // failure that was actually a malformed payload.
            return VACO.post('/api/agents/' + encodeURIComponent(m.agentId || m.id) + '/invoke',
              { messages: [{ role: 'user', content: values.query }] })
              .then(function (r) {
                VACO.toast('Agent replied.');
                lines.appendChild(el('pre', 'vaco-mono vaco-small',
                  JSON.stringify(r, null, 2).slice(0, 1200)));
              })
              .catch(function (err) {
                lines.appendChild(VACO.notice(
                  'No completion: ' + VACO.escapeHtml(err.message)
                  + ' — expected here, since v4-proxy has no API key configured. The routing above is still real.',
                  'warn'));
              });
          }));
          out.appendChild(VACO.card(m.agentName || m.agentId || m.id, [lines]));
        });
        VACO.mount(body, out);
      });
    }, 'Route'),
  ]));

  return VACO.mount(body, out);
}

function renderHistory(body) {
  return VACO.api('/api/route/history').then(function (data) {
    var history = data.history || data || [];
    return VACO.card('Routing history', [
      el('p', 'vaco-small vaco-dim',
        'Every routing decision the network has made. This is the audit trail that makes a deterministic router worth having.'),
      VACO.table([
        { key: 'query', label: 'Question' },
        // Fixed: a logged entry carries `routedTo` (one agent id) and
        // a `fallback` flag (lib/orchestrator.js's own `recordRouting`),
        // not a `matchedAgents` array -- this column showed nothing
        // but "—" for every real row before.
        { label: 'Routed to', render: function (h) {
          if (!h.routedTo) return '—';
          return h.routedTo + (h.fallback ? ' (fallback)' : ''); } },
        { key: 'at', label: 'When', render: function (h) {
          var t = h.at || h.createdAt;
          return t ? new Date(t).toLocaleString() : '—'; } },
      ], history, { empty: 'Nothing routed yet.' }),
    ]);
  });
}

// GET /api/health -- previously never called from here. Shows the
// network's own real liveness/config: agent count, how many
// invocations have actually happened, and the trusted-service
// allowlist's own posture (mode + which callers it has seen without a
// credential). Never shows a token -- `serviceAuth.describe()` itself
// never returns one, by design (see lib/serviceAuth.cjs).
function renderStatus(body) {
  return VACO.api('/api/health').then(function (health) {
    var out = el('div', 'vaco-stack');

    var kv = el('div', 'kv');
    Object.keys(health).forEach(function (k) {
      if (typeof health[k] === 'object') return;
      var cell = el('div', 'kv-cell');
      cell.appendChild(el('span', 'vaco-label', k.replace(/([A-Z])/g, ' $1')));
      cell.appendChild(el('span', 'kv-value', String(health[k])));
      kv.appendChild(cell);
    });
    out.appendChild(VACO.card('Network status', [kv]));

    var auth = health.serviceAuth || {};
    var authLines = el('div', 'vaco-stack-sm');
    authLines.appendChild(el('p', 'vaco-small vaco-dim',
      'Reads here are open. Writes — routing a request, invoking an agent — require either a signed-in '
      + 'session or a trusted-service credential (X-Service-Name + X-Service-Token). This is the real '
      + 'posture this network enforces, not a description of one.'));
    authLines.appendChild(VACO.badge(auth.mode || 'unknown', auth.mode === 'enforce' ? 'money' : 'warn'));
    if (auth.allowlistedServices && auth.allowlistedServices.length) {
      authLines.appendChild(el('p', 'vaco-small vaco-faint',
        'Allowlisted services: ' + auth.allowlistedServices.join(', ')));
    }
    out.appendChild(VACO.card('Service authorization', [authLines]));

    if (auth.unauthenticatedCallers && auth.unauthenticatedCallers.length) {
      out.appendChild(VACO.card('Unauthenticated callers seen', [
        el('p', 'vaco-small vaco-dim',
          'Names and counts only, never tokens — a real caller here needs wiring, not necessarily a threat.'),
        VACO.table([
          { key: 'name', label: 'Name' },
          { key: 'count', label: 'Count', num: true },
          { label: 'Last seen', render: function (c) {
            return c.lastSeenAt ? new Date(c.lastSeenAt).toLocaleString() : '—'; } },
        ], auth.unauthenticatedCallers),
      ]));
    }

    return out;
  });
}

VACO.app({
  id: 'vacon',
  name: 'VACON',
  tagline: 'The operating network',
  //: VACON's identity: a cool slate-indigo. Infrastructure rather than
  //: product — deliberately quieter than the consumer apps it routes to.
  accent: '#8a90b8',
  accentDim: '#6a7196',
  accentInk: '#0a0c14',
  tabs: [
    { id: 'route', label: 'Route', heading: 'Ask MIA', render: renderRoute },
    { id: 'agents', label: 'Agents', heading: 'The executive agents', render: renderAgents },
    { id: 'history', label: 'History', heading: 'Routing audit trail', render: renderHistory },
    { id: 'status', label: 'Status', heading: 'Network status', render: renderStatus },
  ],
});
</script>
</body>
</html>
