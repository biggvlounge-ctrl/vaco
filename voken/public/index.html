<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CVLTVRE</title>
<link rel="stylesheet" href="/vaco-design.css" />
<style>
  .card-art {
    height: 130px;
    border-radius: var(--vaco-radius-sm);
    border: 1px solid var(--vaco-border-subtle);
    background:
      radial-gradient(circle at 70% 20%, var(--vaco-accent-soft), transparent 62%),
      var(--vaco-bg-raised);
    display: flex; align-items: flex-end; justify-content: space-between;
    padding: var(--vaco-space-2) var(--vaco-space-3);
  }
  .cat-rail { display: flex; gap: var(--vaco-space-2); flex-wrap: wrap; }
  .bid-row { display: flex; gap: var(--vaco-space-2); align-items: flex-end; flex-wrap: wrap; }
</style>
</head>
<body class="vaco">
<script src="/vaco-ui.js"></script>
<script>
// VOKEN — the CVLTVRE collectibles marketplace.
//
// The brand name shown to a person is CVLTVRE; VOKEN is the standard
// underneath it (the VDAS tokenization layer). That split is real and
// comes from the app's own `/api/brand`, so this page reads it rather
// than hardcoding either name.
//
// Real client of VOKEN's own 103 routes, across 9 tabs (see the
// "Frontend coverage pass" section of README.md for which route group
// each tab covers, and which stay deliberately backend-only). No
// pricing, rarity, or auction logic here — bidding, Dutch price decay,
// and value scoring are all decided server-side.

var el = VACO.el;
var state = { category: 'vehicles', categories: [], brand: null, complianceGates: [], rarityTiers: [], historicSubjectTypes: [], cardDetailId: null };

// -- Auctions ---------------------------------------------------------

function renderAuctions(body) {
  return VACO.api('/api/auctions/open').then(function (data) {
    var auctions = data.auctions || [];
    var cards = auctions.map(function (a) {
      var art = el('div', 'card-art');
      art.appendChild(VACO.badge(a.auctionType));
      art.appendChild(VACO.badge('#' + a.editionNumber + ' · ' + a.format));

      var lines = el('div', 'vaco-stack-sm');
      var priceRow = el('div', 'vaco-row-tight');
      priceRow.appendChild(el('span', 'vaco-label', a.currentBid ? 'Top bid' : 'Starting'));
      priceRow.appendChild(VACO.price(a.currentBid || a.startingPrice, { freeLabel: false }));
      if (a.reservePrice) {
        priceRow.appendChild(el('span', 'vaco-spacer'));
        priceRow.appendChild(VACO.badge('reserve ' + a.reservePrice, 'warn'));
      }
      lines.appendChild(priceRow);
      if (a.highestBidderId) {
        lines.appendChild(el('p', 'vaco-small vaco-dim', 'Held by ' + a.highestBidderId));
      }

      // A Dutch auction's price falls over time, so the number on the
      // card is only true at this instant. Fetched live rather than
      // computed here — the decay curve is the server's business.
      if (a.auctionType === 'dutch') {
        var dutch = el('p', 'vaco-small vaco-dim', 'Fetching current Dutch price…');
        lines.appendChild(dutch);
        VACO.api('/api/auction/' + a.id + '/dutch-price')
          .then(function (d) { dutch.textContent = 'Right now: ' + VACO.round(d.price) + ' VC — falling'; })
          .catch(function () { dutch.textContent = 'Dutch price unavailable.'; });
      }

      var bid = el('div', 'bid-row');
      var amount = el('input', 'vaco-input vaco-num');
      amount.type = 'number';
      amount.min = 1;
      amount.value = (a.currentBid || a.startingPrice) + 10;
      amount.style.width = '96px';
      amount.setAttribute('aria-label', 'Bid amount');
      bid.appendChild(amount);
      bid.appendChild(VACO.button('Bid', function () {
        if (!VACO.userId()) throw new Error('Sign in to bid.');
        return VACO.post('/api/auction/' + a.id + '/bid', {
          bidderId: VACO.userId(), amount: Number(amount.value),
        }).then(function () {
          VACO.toast('Bid placed on lot ' + a.id, 'money');
          VACO.refreshBalances().then(VACO.renderIdentity);
          VACO.render();
        });
      }, 'primary'));
      lines.appendChild(bid);

      return VACO.card('Lot ' + a.id + ' · card ' + a.cardId, [art, lines],
        { trailing: VACO.badge(a.status) });
    });

    if (!cards.length) return el('div', 'vaco-empty', 'No open auctions right now.');
    return VACO.grid(cards, true);
  });
}

// -- Cards by category ------------------------------------------------

function renderCards(body) {
  if (state.cardDetailId !== null) return renderCardDetailView(body, state.cardDetailId);

  var out = el('div', 'vaco-stack');

  var rail = el('div', 'cat-rail');
  state.categories.forEach(function (cat) {
    var btn = el('button', 'vaco-btn vaco-btn-sm' + (cat === state.category ? ' vaco-btn-primary' : ''), cat);
    btn.addEventListener('click', function () { state.category = cat; VACO.render(); });
    rail.appendChild(btn);
  });
  out.appendChild(rail);

  return VACO.api('/api/cards/category/' + encodeURIComponent(state.category)).then(function (data) {
    var cards = data.cards || [];
    if (!cards.length) {
      out.appendChild(el('div', 'vaco-empty', 'No cards in "' + state.category + '" yet.'));
      return VACO.mount(body, out);
    }
    out.appendChild(VACO.grid(cards.map(function (c) {
      var art = el('div', 'card-art');
      art.appendChild(VACO.badge(c.rarityTier || 'standard'));
      if (c.tokenizationType) art.appendChild(VACO.badge(c.tokenizationType));

      var lines = el('div', 'vaco-stack-sm');
      if (c.creatorId) lines.appendChild(el('p', 'vaco-small vaco-dim', 'by ' + c.creatorId));

      // The value score is VOKEN's own algorithm, fetched rather than
      // guessed — it is the number the whole marketplace is built on.
      // (Was a GET against a POST-only route and always failed silently
      // -- fixed here to the real method, requiring a session the same
      // way the detail view's own "Score this card" action does.)
      var score = el('p', 'vaco-small vaco-faint', 'scoring…');
      lines.appendChild(score);
      if (VACO.userId()) {
        VACO.post('/api/card/' + c.id + '/value-score', {})
          .then(function (v) { score.textContent = 'Value score ' + VACO.round(v.combinedRealValueScore); })
          .catch(function () { score.textContent = 'No value score yet.'; });
      } else {
        score.textContent = 'Sign in to see its value score.';
      }

      lines.appendChild(VACO.button('View details', function () {
        state.cardDetailId = c.id;
        VACO.render();
      }, 'ghost vaco-btn-sm'));

      return VACO.card(c.name || ('Card ' + c.id), [art, lines]);
    }), true));
    VACO.mount(body, out);
  });
}

// -- Card detail: the per-card actions beyond browsing -----------------
//
// `GET /api/card/:id/full` collapses ~8 separate real calls into one
// (see cardFullDetail.js), so this is the one real request the detail
// view needs to open. Every action below is its own real route,
// grouped here rather than as a separate top-level tab because each
// one only makes sense in the context of one specific card.

function renderCardDetailView(body, cardId) {
  var out = el('div', 'vaco-stack');
  out.appendChild(VACO.button('← Back to browse', function () { state.cardDetailId = null; VACO.render(); }));

  return VACO.api('/api/card/' + cardId + '/full').then(function (full) {
    var card = full.card;
    var lastScore = null; // filled in by "Score this card", consumed by sell-back actions below

    var head = el('div', 'vaco-row-tight');
    head.appendChild(VACO.badge(card.rarityTier));
    head.appendChild(VACO.badge(card.tokenizationType));
    head.appendChild(VACO.badge(card.category));
    if (card.verifiedBySubject) head.appendChild(VACO.badge('verified', 'money'));
    out.appendChild(VACO.card('Card #' + card.id, [
      head,
      card.subjectPersonId ? ('Subject: ' + card.subjectPersonId) : 'No living subject.',
      'Market price: ' + (full.marketPrice ? VACO.round(full.marketPrice.marketPrice) + ' VC' : 'not yet scored'),
      full.vehicleValue ? ('Vehicle value: ' + VACO.round(full.vehicleValue.vehicleCardValue) + ' VC') : null,
      full.royaltyRecipient ? ('Resale royalty: ' + (full.royaltyRate * 100) + '% to ' + full.royaltyRecipient) : null,
      'Followers: ' + full.followerCount + ' · Views: ' + full.engagement.views + ' · Likes: ' + full.engagement.likes + ' · Shares: ' + full.engagement.shares,
    ]));

    // -- Engagement: view fires once per real session automatically
    // (deduped server-side), like/share/comment are explicit actions.
    if (VACO.userId()) {
      VACO.post('/api/card/' + cardId + '/engagement', { type: 'view' }).catch(function () { /* already viewed, or no session -- not worth surfacing */ });
    }
    var engagementRow = el('div', 'vaco-row-tight');
    ['like', 'share', 'comment'].forEach(function (type) {
      engagementRow.appendChild(VACO.button(type, function () {
        if (!VACO.userId()) throw new Error('Sign in to ' + type + ' a card.');
        return VACO.post('/api/card/' + cardId + '/engagement', { type: type }).then(function () {
          VACO.toast('Recorded a ' + type);
        });
      }));
    });
    out.appendChild(VACO.card('Engagement', [engagementRow]));

    // -- Follow
    var followRow = el('div', 'vaco-row-tight');
    followRow.appendChild(VACO.button('Follow', function () {
      if (!VACO.userId()) throw new Error('Sign in to follow a card.');
      return VACO.post('/api/card/' + cardId + '/follow', {}).then(function () { VACO.toast('Following card #' + cardId); });
    }, 'primary'));
    followRow.appendChild(VACO.button('Unfollow', function () {
      if (!VACO.userId()) throw new Error('Sign in to unfollow a card.');
      return VACO.del('/api/card/' + cardId + '/follow').then(function () { VACO.toast('Unfollowed card #' + cardId); });
    }));
    out.appendChild(VACO.card('Follow', [followRow]));

    // -- Verify (only the card's own real subject can succeed)
    out.appendChild(VACO.card('Verify your identity', [
      'Only card #' + cardId + "'s own real subject can verify it.",
      VACO.button('Verify this is me', function () {
        if (!VACO.userId()) throw new Error('Sign in to verify.');
        return VACO.post('/api/card/' + cardId + '/verify', { verifierId: VACO.userId() }).then(function () {
          VACO.toast('Verified');
          VACO.render();
        });
      }, 'primary'),
    ]));

    // -- Statistics (verified subject, approved family rep, or verified owner only)
    var statsOut = el('p', 'vaco-small vaco-dim', JSON.stringify(card.statistics));
    out.appendChild(VACO.card('Statistics', [
      statsOut,
      VACO.form([
        { name: 'key', label: 'Field', placeholder: 'referenceValue' },
        { name: 'value', label: 'Value', placeholder: '45000' },
      ], function (values) {
        if (!VACO.userId()) throw new Error('Sign in to update statistics.');
        var numeric = Number(values.value);
        var stat = {};
        stat[values.key] = Number.isFinite(numeric) && values.value.trim() !== '' ? numeric : values.value;
        return VACO.post('/api/card/' + cardId + '/statistics', { updaterId: VACO.userId(), statistics: stat }).then(function (updated) {
          statsOut.textContent = JSON.stringify(updated.statistics);
          VACO.toast('Statistics updated');
        });
      }, 'Update'),
    ]));

    // -- Transfer an edition you own
    out.appendChild(VACO.card('Transfer an edition', [
      VACO.form([
        { name: 'editionNumber', label: 'Edition #', type: 'number', value: 1 },
        { name: 'format', label: 'Format', options: ['digital', 'physical'] },
        { name: 'toOwnerId', label: 'Transfer to (user id)', placeholder: 'bob' },
      ], function (values) {
        if (!VACO.userId()) throw new Error('Sign in to transfer an edition you own.');
        return VACO.post('/api/card/' + cardId + '/transfer', {
          fromOwnerId: VACO.userId(), editionNumber: Number(values.editionNumber), format: values.format, toOwnerId: values.toOwnerId,
        }).then(function () { VACO.toast('Edition transferred'); });
      }, 'Transfer'),
    ]));

    // -- Sell-back: score, then quote, then sell
    var sellBackOut = el('p', 'vaco-small vaco-dim', 'Score this card first to enable a sell-back quote.');
    out.appendChild(VACO.card('Score & sell back', [
      VACO.button('Score this card (live)', function () {
        if (!VACO.userId()) throw new Error('Sign in to score a card.');
        return VACO.post('/api/card/' + cardId + '/value-score', {}).then(function (result) {
          lastScore = result.combinedRealValueScore;
          sellBackOut.textContent = 'Combined real value score: ' + VACO.round(lastScore) + ' -- use the form below to quote a sell-back.';
        });
      }, 'primary'),
      sellBackOut,
      VACO.button('Get sell-back quote', function () {
        if (!VACO.userId()) throw new Error('Sign in to get a sell-back quote.');
        if (lastScore === null) throw new Error('Score this card first.');
        return VACO.post('/api/card/' + cardId + '/sell-back-quote', { combinedRealValueScore: lastScore }).then(function (quote) {
          sellBackOut.textContent = 'Quote: ' + VACO.round(quote.fairMarketValue) + ' VC (range ' + quote.range.min + '-' + quote.range.max + ')';
        });
      }),
      VACO.form([
        { name: 'editionNumber', label: 'Edition #', type: 'number', value: 1 },
        { name: 'format', label: 'Format', options: ['digital', 'physical'] },
      ], function (values) {
        if (!VACO.userId()) throw new Error('Sign in to sell back an edition you own.');
        if (lastScore === null) throw new Error('Score this card first.');
        return VACO.post('/api/card/' + cardId + '/sell-back', {
          sellerId: VACO.userId(), editionNumber: Number(values.editionNumber), format: values.format, combinedRealValueScore: lastScore,
        }).then(function (result) {
          VACO.toast('Sold back for ' + VACO.round(result.fairMarketValue) + ' VC', 'money');
          VACO.refreshBalances().then(VACO.renderIdentity);
        });
      }, 'Sell back now'),
    ]));

    // -- Editions, with real serial numbers
    var editionsOut = el('div', 'vaco-empty', 'Loading…');
    out.appendChild(VACO.card('Editions', [editionsOut]));
    VACO.api('/api/card/' + cardId + '/editions').then(function (data) {
      VACO.mount(editionsOut, VACO.table([
        { key: 'displayLabel', label: 'Serial' },
        { key: 'format', label: 'Format' },
        { key: 'ownerId', label: 'Owner' },
      ], data.editions));
    }).catch(VACO.error);

    // -- Commerce: linked merch and real production collectibles
    if (full.merch.length || full.collectibles.length) {
      var commerceBody = el('div', 'vaco-stack-sm');
      if (full.merch.length) {
        commerceBody.appendChild(VACO.table([
          { key: 'itemType', label: 'Item' },
          { label: 'Price', num: true, render: function (r) { return VACO.round(r.currentDynamicPrice); } },
          { label: 'Remaining', num: true, render: function (r) { return r.remainingSupply + '/' + r.totalSupply; } },
          { label: '', render: function (r) {
            return VACO.button('Buy', function () {
              if (!VACO.userId()) throw new Error('Sign in to buy merch.');
              return VACO.post('/api/merch/' + r.id + '/purchase', { buyerId: VACO.userId() }).then(function (purchase) {
                VACO.toast('Bought for ' + VACO.round(purchase.pricePaid) + ' VC', 'money');
                VACO.refreshBalances().then(VACO.renderIdentity);
                VACO.render();
              });
            }, 'primary vaco-btn-sm');
          } },
        ], full.merch));
      }
      if (full.collectibles.length) {
        commerceBody.appendChild(el('p', 'vaco-small vaco-dim', full.collectibles.length + ' real CVLLEX production collectible(s) linked to this subject.'));
      }
      out.appendChild(VACO.card('Merch & collectibles', [commerceBody]));
    }

    // -- Value history
    if (full.valueHistory.length) {
      out.appendChild(VACO.card('Value history', [
        VACO.table([
          { label: 'Scored at', render: function (r) { return new Date(r.scoredAt || r.at || r.timestamp).toLocaleString(); } },
          { label: 'Score', num: true, render: function (r) { return VACO.round(r.combinedRealValueScore !== undefined ? r.combinedRealValueScore : r.score); } },
        ], full.valueHistory.slice(-10)),
      ]));
    }

    VACO.mount(body, out);
  }).catch(function (err) {
    out.appendChild(VACO.notice(VACO.escapeHtml(err.message), 'danger'));
    VACO.mount(body, out);
  });
}

// -- Explore ----------------------------------------------------------

function renderExplore(body) {
  return VACO.api('/api/explore').then(function (data) {
    var out = el('div', 'vaco-stack');
    Object.keys(data).forEach(function (key) {
      var value = data[key];
      if (!Array.isArray(value) || !value.length) return;
      out.appendChild(VACO.card(key.replace(/([A-Z])/g, ' $1'), [
        VACO.table([
          { key: 'id', label: 'Id' },
          { label: 'Name', render: function (r) { return r.name || r.title || r.cardId || '—'; } },
          { label: 'Status', render: function (r) { return r.status ? VACO.badge(r.status) : '—'; } },
        ], value.slice(0, 12)),
      ]));
    });
    if (!out.childNodes.length) out.appendChild(el('div', 'vaco-empty', 'Nothing to explore yet.'));
    return out;
  });
}

// -- Fractional -------------------------------------------------------

function renderSecondaryListingsForListing(container, fractionalListingId) {
  return VACO.api('/api/fractional/listing/' + fractionalListingId + '/secondary-listings').then(function (data) {
    VACO.mount(container, VACO.table([
      { key: 'id', label: 'Id' },
      { key: 'sellerId', label: 'Seller' },
      { key: 'shareCount', label: 'Shares', num: true },
      { label: 'Price/share', num: true, render: function (r) { return VACO.round(r.pricePerShare); } },
      { label: '', render: function (r) {
        var row = el('div', 'vaco-row-tight');
        row.appendChild(VACO.button('Buy', function () {
          if (!VACO.userId()) throw new Error('Sign in to buy secondary shares.');
          return VACO.post('/api/fractional/secondary-listing/' + r.id + '/buy', { buyerId: VACO.userId() }).then(function (result) {
            VACO.toast('Bought ' + result.secondaryListing.shareCount + ' share(s) for ' + VACO.round(result.amountPaid) + ' VC', 'money');
            VACO.refreshBalances().then(VACO.renderIdentity);
            renderSecondaryListingsForListing(container, fractionalListingId);
          });
        }, 'primary vaco-btn-sm'));
        row.appendChild(VACO.button('Cancel (seller only)', function () {
          if (!VACO.userId()) throw new Error('Sign in as the seller to cancel this listing.');
          return VACO.post('/api/fractional/secondary-listing/' + r.id + '/cancel', { requesterId: VACO.userId() }).then(function () {
            renderSecondaryListingsForListing(container, fractionalListingId);
          });
        }, 'ghost vaco-btn-sm'));
        return row;
      } },
    ], data.secondaryListings, { empty: 'No open secondary listings for this fractional listing.' }));
  });
}

function renderFractionalListing(container, listing) {
  var box = el('div', 'vaco-stack-sm');
  var head = el('div', 'vaco-row-tight');
  head.appendChild(el('span', null, 'Listing #' + listing.id + ' -- card ' + listing.cardId));
  head.appendChild(VACO.badge(listing.status));
  box.appendChild(head);
  box.appendChild(el('p', 'vaco-small vaco-dim', listing.soldShares + '/' + listing.totalShares + ' shares sold at ' + VACO.round(listing.pricePerShare) + ' VC each'));

  var buyOut = el('p', 'vaco-small vaco-dim');
  box.appendChild(VACO.form([{ name: 'shareCount', label: 'Shares to buy', type: 'number', value: 1 }], function (values) {
    if (!VACO.userId()) throw new Error('Sign in to buy shares.');
    return VACO.post('/api/fractional/listing/' + listing.id + '/buy', { buyerId: VACO.userId(), shareCount: Number(values.shareCount) })
      .then(function (purchase) {
        VACO.toast('Bought ' + purchase.sharesPurchased + ' share(s) for ' + VACO.round(purchase.amountPaid) + ' VC', 'money');
        VACO.refreshBalances().then(VACO.renderIdentity);
        renderFractionalListing(container, purchase.listing);
      });
  }, 'Buy shares (primary)'));
  box.appendChild(buyOut);

  box.appendChild(el('h3', 'vaco-h3', 'Secondary market'));
  box.appendChild(VACO.form([
    { name: 'shareCount', label: 'Shares to list', type: 'number', value: 1 },
    { name: 'pricePerShare', label: 'Price/share', type: 'number' },
  ], function (values) {
    if (!VACO.userId()) throw new Error('Sign in to list your shares.');
    return VACO.post('/api/fractional/secondary-listing', {
      sellerId: VACO.userId(), fractionalListingId: listing.id, shareCount: Number(values.shareCount), pricePerShare: Number(values.pricePerShare),
    }).then(function (secondary) {
      VACO.toast('Secondary listing #' + secondary.id + ' created');
      renderSecondaryListingsForListing(secondaryOut, listing.id);
    });
  }, 'List shares for resale'));

  var secondaryOut = el('div', 'vaco-empty', 'Loading…');
  box.appendChild(secondaryOut);
  renderSecondaryListingsForListing(secondaryOut, listing.id).catch(VACO.error);

  VACO.mount(container, box);
}

function renderFractional(body) {
  var out = el('div', 'vaco-stack');
  out.appendChild(VACO.notice(
    'Fractional ownership splits one high-value card into shares. The <strong>secondary market</strong> '
    + 'is where those shares change hands after the initial offering — a real resale market, not a resale claim. '
    + 'Buying (primary or secondary) is gated behind VOKEN’s own fractional-ownership compliance flag, which is '
    + 'held closed pending real legal review -- listing and holdings lookups are ungated.'));

  var id = VACO.userId();
  if (id) {
    out.appendChild(VACO.card('Your shares', [
      (function () {
        var holdingsBox = el('div', 'vaco-empty', 'Loading…');
        VACO.api('/api/fractional/holdings/' + encodeURIComponent(id)).then(function (data) {
          VACO.mount(holdingsBox, VACO.table([
            { key: 'listingId', label: 'Listing' },
            { key: 'cardId', label: 'Card' },
            { key: 'shares', label: 'Shares', num: true },
            { label: 'Ownership', num: true, render: function (r) { return VACO.round(r.ownershipFraction * 100) + '%'; } },
            { label: 'Sellable now', num: true, render: function (r) { return r.sellableShares; } },
          ], data.holdings, { empty: 'You hold no fractional shares.' }));
        }).catch(VACO.error);
        return holdingsBox;
      }()),
    ]));
  } else {
    out.appendChild(el('div', 'vaco-empty', 'Sign in to see your holdings.'));
  }

  var listingResult = el('div');
  out.appendChild(VACO.card('List an edition you own', [
    VACO.form([
      { name: 'cardId', label: 'Card id', type: 'number' },
      { name: 'editionNumber', label: 'Edition #', type: 'number', value: 1 },
      { name: 'format', label: 'Format', options: ['digital', 'physical'] },
      { name: 'totalShares', label: 'Total shares', type: 'number', value: 10 },
      { name: 'pricePerShare', label: 'Price/share', type: 'number' },
    ], function (values) {
      if (!VACO.userId()) throw new Error('Sign in to fractionalize an edition you own.');
      return VACO.post('/api/fractional/listing', {
        sellerId: VACO.userId(), cardId: Number(values.cardId), editionNumber: Number(values.editionNumber), format: values.format,
        totalShares: Number(values.totalShares), pricePerShare: Number(values.pricePerShare),
      }).then(function (listing) {
        VACO.toast('Fractional listing #' + listing.id + ' created');
        renderFractionalListing(listingResult, listing);
      });
    }, 'Create listing'),
  ]));

  out.appendChild(VACO.card('Look up a fractional listing', [
    VACO.form([{ name: 'listingId', label: 'Listing id', type: 'number' }], function (values) {
      return VACO.api('/api/fractional/listing/' + encodeURIComponent(values.listingId)).then(function (listing) {
        renderFractionalListing(listingResult, listing);
      });
    }, 'Look up'),

// -- Packs & mint guidance --------------------------------------------
//
// Pack tiers are platform inventory (`requireCallingService()` on
// create) -- this app has no service credential, so there is no
// "create a pack tier" form here. What a real session CAN do: look up
// an existing tier by id, see its real pre-purchase odds disclosure
// before buying, and open it. A fresh install has no pack tiers at
// all (seedDemoData.js never creates one) -- this tab is honest about
// that rather than inventing a tier to browse.

function renderOdds(container, odds) {
  var box = el('div', 'vaco-stack-sm');
  if (odds.guaranteeNote) box.appendChild(el('p', 'vaco-small vaco-dim', odds.guaranteeNote));
  var tiers = Object.keys(odds.bestCardRarityOdds);
  box.appendChild(VACO.table([
    { key: 'rarityTier', label: 'Rarity' },
    { label: 'Best card is exactly this', num: true, render: function (r) { return VACO.round(r.bestCardOdds * 100) + '%'; } },
    { label: 'At least one of this or better', num: true, render: function (r) { return VACO.round(r.atLeastOdds * 100) + '%'; } },
  ], tiers.map(function (tier) {
    return { rarityTier: tier, bestCardOdds: odds.bestCardRarityOdds[tier], atLeastOdds: odds.atLeastOneOfRarityOrBetter[tier] };
  })));
  VACO.mount(container, box);
}

function renderPackTier(container, tier) {
  var box = el('div', 'vaco-stack-sm');
  var head = el('div', 'vaco-row-tight');
  head.appendChild(VACO.badge(tier.tierName));
  head.appendChild(VACO.price(tier.price, { freeLabel: false }));
  head.appendChild(el('span', 'vaco-small vaco-dim', tier.cardsPerPack + ' cards/pack'));
  if (tier.guaranteedMinimumRarity) head.appendChild(VACO.badge('guarantees ' + tier.guaranteedMinimumRarity + '+'));
  box.appendChild(head);
  box.appendChild(el('p', 'vaco-small vaco-dim', 'Pool: ' + tier.categoryPool + ' · ' + tier.digitalOrPhysical));

  var oddsOut = el('div');
  box.appendChild(VACO.form([
    { name: 'candidateCardIds', label: 'Candidate card ids (comma-separated)', placeholder: '1,2,3' },
  ], function (values) {
    var ids = String(values.candidateCardIds || '').split(',').map(function (s) { return Number(s.trim()); }).filter(function (n) { return Number.isFinite(n); });
    return VACO.post('/api/pack-tier/' + tier.packTierId + '/odds', { candidateCardIds: ids })
      .then(function (odds) { renderOdds(oddsOut, odds); });
  }, 'Get odds'));
  box.appendChild(oddsOut);

  var openOut = el('p', 'vaco-small vaco-dim');
  box.appendChild(VACO.form([
    { name: 'buyerId', label: 'Buyer id', value: VACO.userId() || '' },
    { name: 'candidateCardIds', label: 'Candidate card ids (comma-separated)', placeholder: '1,2,3' },
  ], function (values) {
    if (!VACO.userId()) throw new Error('Sign in to open a pack.');
    var ids = String(values.candidateCardIds || '').split(',').map(function (s) { return Number(s.trim()); }).filter(function (n) { return Number.isFinite(n); });
    return VACO.post('/api/pack-tier/' + tier.packTierId + '/open', { buyerId: values.buyerId, candidateCardIds: ids })
      .then(function (result) {
        VACO.toast('Pack opened -- ' + result.cardsReceived.length + ' card(s) received', 'money');
        VACO.refreshBalances().then(VACO.renderIdentity);
        openOut.textContent = result.cardsReceived.map(function (c) {
          return 'Card ' + c.card.id + ' (' + c.card.rarityTier + ', edition #' + c.edition.editionNumber + ')';
        }).join('; ');
      });
  }, 'Open pack (charges the buyer)'));
  box.appendChild(openOut);

  VACO.mount(container, box);
}

function renderPacks(body) {
  var out = el('div', 'vaco-stack');

// -- Trading, Raffles & Referrals --------------------------------------
//
// Three real, previously backend-only mechanics grouped into one tab:

// growth loop. Raffle and pack-tier *creation* stay operator/service
// surfaces with no frontend credential (see the Packs tab's own note);

function renderTradeResult(container, trade) {
  var box = el('div', 'vaco-stack-sm');
  box.appendChild(el('h3', 'vaco-h3', 'Trade #' + trade.tradeId));
  var head = el('div', 'vaco-row-tight');
  head.appendChild(el('span', 'vaco-small vaco-dim', trade.fromUserId + ' → ' + trade.toUserId));
  head.appendChild(VACO.badge(trade.status));
  box.appendChild(head);
  box.appendChild(el('p', 'vaco-small vaco-dim', 'Offered: ' + JSON.stringify(trade.cardIdsOffered)));
  box.appendChild(el('p', 'vaco-small vaco-dim', 'Requested: ' + JSON.stringify(trade.cardIdsRequested)));

  if (trade.status === 'pending') {
    var row = el('div', 'vaco-row-tight');
    row.appendChild(VACO.button('Accept (as recipient)', function () {
      if (!VACO.userId()) throw new Error('Sign in to accept a trade.');
      return VACO.post('/api/trade/' + trade.tradeId + '/accept', {}).then(function (updated) {
        VACO.toast('Trade accepted -- editions transferred', 'money');
        renderTradeResult(container, updated);
      });
    }, 'primary'));
    row.appendChild(VACO.button('Reject (as recipient)', function () {
      if (!VACO.userId()) throw new Error('Sign in to reject a trade.');
      return VACO.post('/api/trade/' + trade.tradeId + '/reject', {}).then(function (updated) {
        renderTradeResult(container, updated);
      });
    }));
    row.appendChild(VACO.button('Cancel (as proposer)', function () {
      if (!VACO.userId()) throw new Error('Sign in to cancel a trade.');
      return VACO.post('/api/trade/' + trade.tradeId + '/cancel', { requestedByUserId: VACO.userId() }).then(function (updated) {
        renderTradeResult(container, updated);
      });
    }));
    box.appendChild(row);
  }

  VACO.mount(container, box);
}

function renderTradeSection() {
  var out = el('div', 'vaco-stack-sm');

  out.appendChild(VACO.form([

function renderReferralsSection() {
  var out = el('div', 'vaco-stack-sm');
  var progressOut = el('div', 'vaco-empty', 'Sign in to see your referral progress.');
  out.appendChild(progressOut);

  function refreshProgress() {
    var id = VACO.userId();
    if (!id) return;
    return VACO.api('/api/referrals/' + encodeURIComponent(id) + '/progress').then(function (p) {
      var box = el('div', 'vaco-stack-sm');
      box.appendChild(el('p', null, p.referralCount + ' referral(s) · ' + p.spinsAvailable + ' spin(s) available'));
      box.appendChild(el('p', 'vaco-small vaco-dim',
        p.nextTierThreshold
          ? (p.referralsUntilNextTier + ' more to reach the ' + p.nextTierThreshold + '-referral tier (' + p.progressPercent + '%)')
          : 'Every tier reached.'));
      VACO.mount(progressOut, box);
    });
  }
  refreshProgress().catch(function () { /* not signed in yet */ });

  out.appendChild(VACO.form([{ name: 'refereeId', label: 'Referee (user you referred)', placeholder: 'new-user-id' }], function (values) {
    if (!VACO.userId()) throw new Error('Sign in to record a referral.');
    return VACO.post('/api/referrals', { referrerId: VACO.userId(), refereeId: values.refereeId }).then(function (result) {
      VACO.toast(result.tierReached ? ('Tier reached! +' + result.tierReached.bonusVCoin + ' VCoin') : 'Referral recorded');
      VACO.refreshBalances().then(VACO.renderIdentity);
      refreshProgress();
    });
  }, 'Record referral'));

  var spinOut = el('p', 'vaco-small vaco-dim');
  out.appendChild(VACO.form([{ name: 'clientSeed', label: 'Client seed (provably-fair)', placeholder: 'any text you choose' }], function (values) {
    if (!VACO.userId()) throw new Error('Sign in to spin.');
    return VACO.post('/api/referrals/' + encodeURIComponent(VACO.userId()) + '/spin', { clientSeed: values.clientSeed }).then(function (spin) {
      spinOut.textContent = 'Result: ' + spin.prizeLabel + ' (server seed hash ' + spin.serverSeedHash.slice(0, 12) + '…, verified: ' + spin.verified + ')';
      VACO.toast('Spin result: ' + spin.prizeLabel, spin.vcoinWon > 0 ? 'money' : null);
      VACO.refreshBalances().then(VACO.renderIdentity);
      refreshProgress();
    });
  }, 'Spin'));
  out.appendChild(spinOut);

  return VACO.card('Referrals & spin-to-win', [out]);
}

function renderActivity(body) {
  var out = el('div', 'vaco-stack');
  out.appendChild(renderTradeSection());

    if (!VACO.userId()) throw new Error('Sign in to mint an art Cvltvre card.');
    return VACO.post('/api/art-card', {
      artistId: VACO.userId(),
      rarityTier: values.rarityTier,
      digitalEditionCount: Number(values.digitalEditionCount),
      physicalOriginalExists: values.physicalOriginalExists === 'true',
    }).then(function (created) {
      VACO.toast('Art card minted as card #' + created.card.id);
      renderArtRecord(result, created.artRecord);
    });
  }, 'Mint art card'));

  out.appendChild(VACO.form([{ name: 'cardId', label: 'Look up art card id', type: 'number' }], function (values) {
    return VACO.api('/api/art-card/' + encodeURIComponent(values.cardId)).then(function (record) {
      renderArtRecord(result, record);
    });
  }, 'Look up'));
  out.appendChild(result);

  return VACO.card('Art Cvltvre cards', [out]);
}

function renderArtFrame(container, frame) {
  var box = el('div', 'vaco-stack-sm');
  box.appendChild(el('p', null, 'Frame #' + frame.frameId + ' owned by ' + frame.ownerId + ' (' + frame.screenTechnology + ')'));
  box.appendChild(el('p', 'vaco-small vaco-dim', frame.loadedArtCardId ? ('Showing card ' + frame.loadedArtCardId) : 'Nothing loaded.'));
  box.appendChild(VACO.form([{ name: 'artCardId', label: 'Load art card id', type: 'number' }], function (values) {
    if (!VACO.userId()) throw new Error('Sign in as this frame\'s owner to load art onto it.');
    return VACO.post('/api/art-frame/' + frame.frameId + '/load', { requesterId: VACO.userId(), artCardId: Number(values.artCardId) })
      .then(function (updated) { renderArtFrame(container, updated); });
  }, 'Load'));
  VACO.mount(container, box);
}

function renderArtFrameSection() {
  var out = el('div', 'vaco-stack-sm');

  out.appendChild(VACO.button('Register a digital art frame', function () {
    if (!VACO.userId()) throw new Error('Sign in to register a frame.');
    return VACO.post('/api/art-frame', { ownerId: VACO.userId() }).then(function (frame) {

    });
  }, 'primary'));

  out.appendChild(VACO.form([{ name: 'frameId', label: 'Look up frame id', type: 'number' }], function (values) {

      renderArtFrame(result, frame);
    });
  }, 'Look up'));
  out.appendChild(result);

  return VACO.card('Digital art frames', [out]);
}

function renderVadoExploreSection() {
  var box = el('div', 'vaco-empty', 'Loading…');
  VACO.api('/api/vado/explore').then(function (data) {
    var out = el('div', 'vaco-stack');

function renderGalleryArt(body) {
  var out = el('div', 'vaco-stack');
  out.appendChild(renderGalleryAccountSection());
  out.appendChild(renderArtCardSection());
  out.appendChild(renderArtFrameSection());
  out.appendChild(renderVadoExploreSection());

// -- Creator Hub: applications, assessment, digital profile, family --
//
// Four real onboarding/credibility surfaces that had zero frontend
// exposure. Kenji's own analysis (`POST /api/application/:id/analyze`)
// and every claim/nomination *review* route are requireOperator()-only
// -- no frontend credential for either, so this tab submits and looks
// up, it never decides.

function parseList(raw) {
  return String(raw || '').split(',').map(function (s) { return s.trim(); }).filter(Boolean);
}

function renderApplicationSection() {
  var out = el('div', 'vaco-stack-sm');
  var result = el('div');

  out.appendChild(VACO.form([
    { name: 'applicationPath', label: 'Path', options: ['self-initiated-request', 'community-nomination'] },
    { name: 'nominatedPersonId', label: 'Nominated person id (community-nomination only)', placeholder: 'leave blank otherwise' },
    { name: 'category', label: 'Category', options: state.categories },
    { name: 'socialMediaPresence', label: 'Social presence (platform:followers, comma-separated)', placeholder: 'instagram:50000,tiktok:120000' },
    { name: 'credentials', label: 'Credentials (comma-separated)', placeholder: 'Grammy nominee' },
  ], function (values) {
    if (!VACO.userId()) throw new Error('Sign in to submit an application.');
    var socialMediaPresence = parseList(values.socialMediaPresence).map(function (pair) {
      var parts = pair.split(':');
      return { platform: parts[0], followerCount: Number(parts[1]) || 0 };
    });
    return VACO.post('/api/application', {
      applicantId: VACO.userId(),
      applicationPath: values.applicationPath,
      nominatedPersonId: values.applicationPath === 'community-nomination' ? (values.nominatedPersonId || null) : undefined,
      submittedInfo: {
        category: values.category,
        socialMediaPresence: socialMediaPresence,
        credentials: parseList(values.credentials),
      },
    }).then(function (application) {
      VACO.toast('Application #' + application.applicationId + ' submitted');
      VACO.mount(result, VACO.badge(application.status));
    });
  }, 'Submit application'));

  out.appendChild(VACO.form([{ name: 'applicationId', label: 'Look up application id', type: 'number' }], function (values) {
    return VACO.api('/api/application/' + encodeURIComponent(values.applicationId)).then(function (app) {
      var box = el('div', 'vaco-stack-sm');
      box.appendChild(VACO.badge(app.status));
      box.appendChild(el('p', 'vaco-small vaco-dim', app.applicationPath));
      if (app.kenjiAnalysisResult) box.appendChild(el('p', 'vaco-small', JSON.stringify(app.kenjiAnalysisResult)));
      VACO.mount(result, box);
    });
  }, 'Look up'));
  out.appendChild(result);

  return VACO.card('Cvltvre Card applications', [out]);
}

function renderAssessmentSection() {
  var out = el('div', 'vaco-stack-sm');
  var result = el('div');

  out.appendChild(VACO.form([
    { name: 'occupationCategory', label: 'Occupation', options: ['influencer', 'musician', 'political', 'author', 'athlete', 'other'] },
    { name: 'realSocialFollowing', label: 'Real social following (all platforms)', type: 'number', value: 0 },
    { name: 'realPressCoverageCount', label: 'Real press articles', type: 'number', value: 0 },
    { name: 'realIndustryRecognition', label: 'Formal industry recognition?', options: [{ label: 'No', value: 'false' }, { label: 'Yes', value: 'true' }] },
  ], function (values) {
    if (!VACO.userId()) throw new Error('Sign in to request an established-creator assessment.');
    return VACO.post('/api/established-creator-assessment', {
      creatorId: VACO.userId(),
      occupationCategory: values.occupationCategory,
      realSocialFollowing: Number(values.realSocialFollowing) || 0,
      realPressCoverageCount: Number(values.realPressCoverageCount) || 0,
      realIndustryRecognition: values.realIndustryRecognition === 'true',
    }).then(function (assessment) {
      VACO.mount(result, VACO.card('External score: ' + assessment.externalScore, [
        'Suggested starting tier: ' + assessment.suggestedStartingTier,
      ]));
    });
  }, 'Request assessment'));
  out.appendChild(result);

  return VACO.card('Established-creator assessment', [out]);
}

function renderDigitalProfileSection() {
  var out = el('div', 'vaco-stack-sm');
  var result = el('div');
  out.appendChild(VACO.form([{ name: 'creatorId', label: 'Creator id', value: VACO.userId() || '' }], function (values) {
    return VACO.api('/api/creator-digital-profile/' + encodeURIComponent(values.creatorId)).then(function (profile) {
      var box = el('div', 'vaco-stack-sm');
      box.appendChild(el('p', null, 'Aggregated engagement score: ' + VACO.round(profile.aggregatedEngagementScore) + ' across ' + profile.cardCount + ' card(s)'));
      if (profile.risingIndicator) box.appendChild(VACO.badge('rising', 'money'));
      VACO.mount(result, box);
    });
  }, 'Look up'));
  out.appendChild(result);
  return VACO.card('Creator digital profile', [out]);
}

function renderFamilyClaimSection() {
  var out = el('div', 'vaco-stack-sm');
  var result = el('div');

  out.appendChild(VACO.form([
    { name: 'historicSlug', label: 'Historic register slug', placeholder: 'nikola-tesla' },
    { name: 'relationship', label: 'Relationship', placeholder: 'great-granddaughter' },
    { name: 'evidence', label: 'Evidence (comma-separated)', placeholder: 'birth certificate, family archive letter' },
  ], function (values) {
    if (!VACO.userId()) throw new Error('Sign in to submit a family-representative claim.');
    return VACO.post('/api/family-representative-claim', {
      claimantId: VACO.userId(),
      historicSlug: values.historicSlug,
      relationship: values.relationship,
      evidence: parseList(values.evidence),
    }).then(function (claim) {
      VACO.toast('Claim #' + claim.claimId + ' submitted');
      VACO.mount(result, VACO.badge(claim.status));
    });
  }, 'Submit claim'));

  out.appendChild(VACO.form([{ name: 'claimId', label: 'Look up claim id', type: 'number' }], function (values) {
    return VACO.api('/api/family-representative-claim/' + encodeURIComponent(values.claimId)).then(function (claim) {
      VACO.mount(result, VACO.card('Claim #' + claim.claimId, [
        VACO.badge(claim.status),
        claim.relationship + ' of ' + claim.historicSlug,
      ]));
    });
  }, 'Look up'));
  out.appendChild(result);

  return VACO.card('Family-representative claims', [out]);
}

function renderCreatorHub(body) {
  var out = el('div', 'vaco-stack');
  out.appendChild(renderApplicationSection());
  out.appendChild(renderAssessmentSection());
  out.appendChild(renderDigitalProfileSection());
  out.appendChild(renderFamilyClaimSection());
  return out;
}

// -- Historic register & community nominations -------------------------
//
// Only places/monuments/homes can be community-nominated
// (`placeNominations.js`'s own `NOMINABLE_SUBJECT_TYPES`) -- a
// person/invention/book nomination goes through the Creator Hub's
// `community-nomination` application path instead. Reviewing either
// kind is requireOperator()-only; this tab submits and browses.

var NOMINABLE_SUBJECT_TYPES = ['place', 'monument', 'home'];

function renderHistoricBrowseSection() {
  var out = el('div', 'vaco-stack-sm');
  var result = el('div', 'vaco-empty', 'Loading…');

  function load(subjectType, ranked) {
    var path = ranked ? '/api/historic-register/rank' : '/api/historic-register';
    var query = subjectType ? ('?subjectType=' + encodeURIComponent(subjectType)) : '';
    return VACO.api(path + query).then(function (data) {
      var rows = data.ranked || data.entries;
      VACO.mount(result, VACO.table(ranked ? [
        { key: 'rank', label: 'Rank', num: true },
        { key: 'name', label: 'Name' },
        { key: 'subjectType', label: 'Type' },
        { key: 'ageYears', label: 'Age (years)', num: true },
        { key: 'rarityScore', label: 'Recognitions', num: true },
      ] : [
        { key: 'slug', label: 'Slug' },
        { key: 'name', label: 'Name' },
        { key: 'subjectType', label: 'Type' },
        { key: 'era', label: 'Era' },
      ], rows));
    });
  }

  out.appendChild(VACO.form([
    { name: 'subjectType', label: 'Subject type', options: [{ label: 'All', value: '' }].concat(state.historicSubjectTypes) },
  ], function (values) { return load(values.subjectType || null, false); }, 'Browse'));
  out.appendChild(VACO.button('Rank by age & recognition', function () { return load(null, true); }));
  out.appendChild(result);

  var entryOut = el('div');
  out.appendChild(VACO.form([{ name: 'slug', label: 'Look up a slug', placeholder: 'nikola-tesla' }], function (values) {
    return VACO.api('/api/historic-register/' + encodeURIComponent(values.slug)).then(function (entry) {
      VACO.mount(entryOut, VACO.card(entry.name, [
        entry.era + ' -- ' + entry.summary,
        entry.recognitions.length ? ('Recognitions: ' + entry.recognitions.join(', ')) : 'No recorded recognitions.',
      ]));
    });
  }, 'Look up'));
  out.appendChild(entryOut);

  load(null, false).catch(VACO.error);
  return VACO.card('Fixed historic register', [out]);
}

function renderPlaceNominationSection() {
  var out = el('div', 'vaco-stack-sm');
  var result = el('div');

  out.appendChild(VACO.form([
    { name: 'subjectType', label: 'Subject type', options: NOMINABLE_SUBJECT_TYPES },
    { name: 'name', label: 'Name', placeholder: 'The Lighthouse of Alexandria' },
    { name: 'era', label: 'Era', placeholder: 'c. 3rd century BCE' },
    { name: 'earliestYear', label: 'Earliest year (negative for BCE)', type: 'number' },
    { name: 'summary', label: 'Summary', placeholder: 'One real paragraph' },
    { name: 'recognitions', label: 'Recognitions (comma-separated)', placeholder: 'UNESCO World Heritage Site' },
  ], function (values) {
    if (!VACO.userId()) throw new Error('Sign in to nominate a place.');
    return VACO.post('/api/place-nomination', {
      nominatorId: VACO.userId(),
      subjectType: values.subjectType,
      name: values.name,
      era: values.era,
      earliestYear: Number(values.earliestYear),
      summary: values.summary,
      recognitions: parseList(values.recognitions),
    }).then(function (nomination) {
      VACO.toast('Nomination #' + nomination.nominationId + ' submitted');
      VACO.mount(result, VACO.badge(nomination.status));
    });
  }, 'Nominate a place'));

  out.appendChild(VACO.form([{ name: 'nominationId', label: 'Look up nomination id', type: 'number' }], function (values) {
    return VACO.api('/api/place-nomination/' + encodeURIComponent(values.nominationId)).then(function (nomination) {
      VACO.mount(result, VACO.card(nomination.name, [VACO.badge(nomination.status), nomination.summary]));
    });
  }, 'Look up'));
  out.appendChild(result);

  var approvedOut = el('div');
  out.appendChild(VACO.button('Browse approved community nominations', function () {
    return VACO.api('/api/place-nomination/approved/list').then(function (data) {
      VACO.mount(approvedOut, VACO.table([
        { key: 'slug', label: 'Slug' },
        { key: 'name', label: 'Name' },
        { key: 'subjectType', label: 'Type' },
      ], data.entries, { empty: 'No approved community nominations yet.' }));
    });
  }));
  out.appendChild(approvedOut);

  return VACO.card('Community place nominations', [out]);
}

function renderHistoricExploreSection() {
  var box = el('div', 'vaco-empty', 'Loading…');
  VACO.api('/api/explore/historic').then(function (data) {
    var out = el('div', 'vaco-stack');
    (data.sections || []).forEach(function (section) {
      if (!section.cards.length) return;
      out.appendChild(VACO.card(section.subjectType, [
        VACO.table([
          { label: 'Name', render: function (r) { return r.historicFact ? r.historicFact.name : ('Card ' + r.contentId); } },
          { label: 'Attention', num: true, render: function (r) { return VACO.round(r.attentionScore); } },
          { label: 'Genuine significance', num: true, render: function (r) { return VACO.round(r.genuineSignificanceScore); } },
        ], section.cards),
      ]));
    });
    if (!out.childNodes.length) out.appendChild(el('div', 'vaco-empty', 'No historic cards minted yet.'));
    VACO.mount(box, out);
  }).catch(function (err) { VACO.mount(box, VACO.notice(VACO.escapeHtml(err.message), 'danger')); });
  return VACO.card('Historic explore', [box]);
}

function renderHistoric(body) {
  var out = el('div', 'vaco-stack');
  out.appendChild(renderHistoricBrowseSection());
  out.appendChild(renderPlaceNominationSection());
  out.appendChild(renderHistoricExploreSection());
  return out;
}

// Boot needs the brand and category list before the first render, since
// both are real server-owned values rather than constants in this file.
VACO.api('/api/health').then(function (health) {
  state.categories = health.categories || [];
  state.category = state.categories[0] || 'vehicles';
  state.complianceGates = health.complianceGates || [];
  state.rarityTiers = health.rarityTiers || [];
  state.historicSubjectTypes = health.historicSubjectTypes || [];

  VACO.app({
    id: 'voken',
    name: (health.brand && health.brand.name) || 'VOKEN',
    tagline: 'Collect · trade · auction',
    //: CVLTVRE's identity: a deep magenta-rose. Cvltvre and collecting
    //: rather than the gold every collectibles site reaches for — and
    //: VAGO already owns brass in the register.
    accent: '#e0559b',
    accentDim: '#b83b7b',
    accentInk: '#1a0611',
    tabs: [
      { id: 'auctions', label: 'Auctions', heading: 'Open lots',
        blurb: (health.brand && health.brand.tagline) || 'Live auctions across every category.',
        render: renderAuctions },
      { id: 'cards', label: 'Cards', heading: 'Browse by category', render: renderCards },
      { id: 'explore', label: 'Explore', heading: 'What is moving', render: renderExplore },
      { id: 'fractional', label: 'Fractional', heading: 'Shares & resale', render: renderFractional },
      { id: 'packs', label: 'Packs', heading: 'Packs & mint guidance', render: renderPacks },
      { id: 'car-clubs', label: 'Car Clubs', heading: 'Culture Car Clubs', render: renderCarClubs },
      { id: 'activity', label: 'Activity', heading: 'Trading, raffles & referrals', render: renderActivity },
      { id: 'account', label: 'Account', heading: 'Notifications & wallet', render: renderAccount },
      { id: 'gallery-art', label: 'Gallery & Art', heading: 'VADO gallery, art cards & frames', render: renderGalleryArt },
      { id: 'creator-hub', label: 'Creator Hub', heading: 'Applications, assessment & claims', render: renderCreatorHub },
      { id: 'historic', label: 'Historic', heading: 'Historic register & nominations', render: renderHistoric },
    ],
  });
});
