<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vvltvre Music</title>
<link rel="stylesheet" href="/vaco-design.css" />
<style>
  .split-bar { display: flex; height: 10px; border-radius: var(--vaco-radius-pill); overflow: hidden; background: var(--vaco-surface-hover); }
  .split-seg { height: 100%; }
</style>
</head>
<body class="vaco">
<script src="/vaco-ui.js"></script>
<script>
// Vvltvre Music / Distribution — flat-fee release distribution.
//
// Real client of its own 22 routes. Royalty splits, label deal shapes,
// and beat licence terms are all server-decided.
//
// **Frontend coverage pass (30 Oct 2026).** The original 3 tabs made
// only 5 real calls, and one of those — the Beats tab's "License"
// button — called `POST /api/beat-purchases`, a route that never
// existed in `server.js` (the real route is
// `POST /api/beats/:id/purchase`); fixed. Every new call below was
// checked against `server.js` and its `lib/*.js` handler before being
// written, and two invented data shapes were corrected along the way:
// a `Release` has no `releaseType`/`trackCount`/`collaborators` field
// (the real fields are `format` and `coWriters`, each a
// `{userId, splitPercent}` with `splitPercent` a 0–1 fraction, not
// 0–100), and a `Beat` has no `bpm`/`key`/`genre`/`priceVcoin` field
// (the real fields are `price` and `previewUrl`).
//
// Still backend-only, by design, across every new tab: this frontend
// has no login for either credential a handful of real routes need —
// `requireOperator` (advancing a release through `distributing`/
// `live`, reporting streaming revenue: real operator decisions,
// recorded in vaco-audit) or `requireCallingService` (signing an
// artist to a manager's roster, opening a fresh label deal: real
// two-sided contracts this app has no offer/accept flow for yet — see
// `server.js`'s own "Authorization" comment on why both stay
// service-only rather than actor-guarded).
//
// **The split bar is the point of this screen.** Unrecouped advances
// and silent splits are the oldest complaint in music; showing who owns
// what percentage, as a shape rather than a paragraph, is the honest
// version.

var el = VACO.el;

function splitBar(coWriters) {
  var bar = el('div', 'split-bar');
  var hues = ['var(--vaco-accent)', 'var(--vaco-info)', 'var(--vaco-money)', 'var(--vaco-warn)'];
  (coWriters || []).forEach(function (c, i) {
    var pct = Math.round((c.splitPercent || 0) * 100);
    var seg = el('div', 'split-seg');
    seg.style.width = pct + '%';
    seg.style.background = hues[i % hues.length];
    seg.title = c.userId + ' — ' + pct + '%';
    bar.appendChild(seg);
  });
  return bar;
}

// -- releases: submit, browse, and act on one --------------------------

// Real `PRODUCTION_ITEM_TYPES` from CVLLEX's own `lib/physicalProduction.js`
// -- this app forwards the order straight through, so the same real
// catalog applies (and pressed media -- cd/vinyl/cassette -- carries
// CVLLEX's own real 100-unit minimum run).
var PHYSICAL_ITEM_TYPES = [
  'cd', 'vinyl', 'cassette', 't-shirt', 'hoodie', 'hat',
  'magazine', 'zine', 'poster', 'canvas-print', 'pin', 'sticker', 'tote-bag', 'phone-case', 'other',
];

// One release card, used both in the artist catalogue grid and the
// single-release look-up. `onChange` re-runs whatever load produced
// the card currently on screen, so an action here refreshes in place.
function releaseCard(rel, onChange) {
  var lines = el('div', 'vaco-stack-sm');
  lines.appendChild(el('p', 'vaco-small vaco-dim',
    rel.format + ' · ' + (rel.targetPlatforms || []).join(', ')));
  lines.appendChild(el('p', 'vaco-small vaco-faint',
    'Distribution fee ' + VACO.round(rel.distributionFee) + ' · artist retains ' + rel.ownershipRetainedPercent + '% of streaming revenue'));

  if (rel.coWriters && rel.coWriters.length) {
    lines.appendChild(splitBar(rel.coWriters));
    lines.appendChild(el('p', 'vaco-small vaco-faint',
      rel.coWriters.map(function (c) { return c.userId + ' ' + Math.round(c.splitPercent * 100) + '%'; }).join(' · ')));
  }

  var streamLine = el('p', 'vaco-small vaco-faint', 'Streams: —');
  lines.appendChild(streamLine);
  VACO.api('/api/releases/' + rel.id + '/stream-count')
    .then(function (sc) { streamLine.textContent = 'Streams: ' + sc.streamCount; })
    .catch(function () { /* leave the dash -- not worth a toast */ });

  if (rel.vaultStvdiosPostId) {
    lines.appendChild(el('p', 'vaco-small vaco-faint', 'Music video attached (Vavlt Stvdios post #' + rel.vaultStvdiosPostId + ')'));
  }
  if (rel.physicalProductionOrderIds && rel.physicalProductionOrderIds.length) {
    lines.appendChild(el('p', 'vaco-small vaco-faint', rel.physicalProductionOrderIds.length + ' physical run(s) ordered via CVLLEX'));
  }

  var userId = VACO.userId();
  var isOwner = !!userId && userId === rel.artistId;

  var actions = el('div', 'vaco-row-tight');
  actions.appendChild(VACO.button('Play', function () {
    if (!userId) throw new Error('Sign in to record a stream.');
    return VACO.post('/api/releases/' + rel.id + '/stream', { userId: userId })
      .then(function () { return VACO.api('/api/releases/' + rel.id + '/stream-count'); })
      .then(function (sc) {
        streamLine.textContent = 'Streams: ' + sc.streamCount;
        VACO.toast('Streamed “' + rel.title + '”.');
      });
  }, 'sm'));

  if (isOwner && rel.status === 'live') {
    actions.appendChild(VACO.button('Take down', function () {
      var reason = prompt('Reason for taking down "' + rel.title + '" (required):');
      if (!reason) return Promise.resolve();
      return VACO.post('/api/releases/' + rel.id + '/take-down', { reason: reason })
        .then(function () { VACO.toast('Release taken down.'); return onChange(); });
    }, 'danger'));
  }
  lines.appendChild(actions);

  if (isOwner && !rel.vaultStvdiosPostId) {
    lines.appendChild(VACO.card('Attach a music video', [
      VACO.form([
        { name: 'mediaUrl', label: 'Media URL', placeholder: 'https://…', width: '200px' },
        { name: 'durationSeconds', label: 'Duration (s)', type: 'number', min: 1, value: 180, width: '90px' },
        { name: 'caption', label: 'Caption', value: rel.title, width: '160px' },
      ], function (values) {
        return VACO.post('/api/releases/' + rel.id + '/video', values)
          .then(function () { VACO.toast('Video attached — posted to Vavlt Stvdios as a Reel.', 'money'); return onChange(); });
      }, 'Attach'),
    ]));
  }

  if (isOwner && rel.status === 'live') {
    lines.appendChild(VACO.card('Order a physical run (CVLLEX)', [
      VACO.form([
        { name: 'itemType', label: 'Item', options: PHYSICAL_ITEM_TYPES, width: '120px' },
        { name: 'quantity', label: 'Qty', type: 'number', min: 1, value: 100, width: '70px' },
        { name: 'estimatedUnitCost', label: 'Unit cost', type: 'number', min: 0, step: '0.01', value: 2.5, width: '90px' },
      ], function (values) {
        return VACO.post('/api/releases/' + rel.id + '/physical-run', values)
          .then(function (result) { VACO.toast('Physical run ordered — CVLLEX order #' + result.order.id + '.', 'money'); return onChange(); });
      }, 'Order run'),
      el('p', 'vaco-small vaco-faint', 'Pressed media (cd/vinyl/cassette) carries CVLLEX’s real 100-unit minimum run.'),
    ]));
  }

  return VACO.card(rel.title || ('Release ' + rel.id), [lines], { trailing: VACO.badge(rel.status) });
}

function renderReleases(body) {
  var out = el('div', 'vaco-stack');
  out.appendChild(VACO.notice(
    'Flat-fee distribution: the artist pays once and keeps the royalties, rather than surrendering a percentage forever. '
    + 'Splits below are real records — every collaborator is paid from the same ledger entry.'));

  out.appendChild(VACO.card('Submit a release', [
    VACO.form([
      { name: 'artistId', label: 'Artist', value: VACO.userId() || '', width: '140px' },
      { name: 'title', label: 'Title', width: '180px' },
      { name: 'format', label: 'Format', options: ['single', 'album', 'video', 'podcast-episode'] },
      { name: 'targetPlatforms', label: 'Platforms (comma-separated)', placeholder: 'Spotify, Apple Music', width: '220px' },
    ], function (values) {
      if (!VACO.userId()) throw new Error('Sign in to submit a release.');
      var targetPlatforms = String(values.targetPlatforms || '').split(',')
        .map(function (s) { return s.trim(); }).filter(Boolean);
      return VACO.post('/api/releases', {
        artistId: values.artistId, title: values.title, format: values.format, targetPlatforms: targetPlatforms,
      }).then(function (release) {
        VACO.toast('Submitted “' + release.title + '” — flat fee ' + VACO.round(release.distributionFee) + ' charged.', 'money');
        VACO.refreshBalances().then(VACO.renderIdentity);
        return loadArtist(release.artistId);
      });
    }, 'Submit'),
  ]));

  out.appendChild(VACO.card('Look up an artist', [
    VACO.form([{ name: 'artistId', label: 'Artist', value: VACO.userId() || '', width: '160px' }],
      function (values) { return loadArtist(values.artistId); }, 'Load'),
  ]));

  out.appendChild(VACO.card('Look up a release', [
    VACO.form([{ name: 'id', label: 'Release id', type: 'number', min: 1, value: 1, width: '90px' }],
      function (values) { return loadRelease(values.id); }, 'Load'),
  ]));

  out.appendChild(VACO.card('Collaborator earnings', [
    VACO.form([{ name: 'userId', label: 'User id', value: VACO.userId() || '', width: '160px' }],
      function (values) { return loadCollaboratorEarnings(values.userId); }, 'Load'),
  ]));

  // Everything appended from here down is one swappable result panel.
  var BASE = out.childNodes.length;
  function clearResults() { while (out.childNodes.length > BASE) out.removeChild(out.lastChild); }

  function loadArtist(artistId) {
    return Promise.all([
      VACO.api('/api/artists/' + encodeURIComponent(artistId) + '/releases'),
      VACO.api('/api/artists/' + encodeURIComponent(artistId) + '/summary').catch(function () { return null; }),
      VACO.api('/api/artists/' + encodeURIComponent(artistId) + '/album-count').catch(function () { return null; }),
      VACO.api('/api/artists/' + encodeURIComponent(artistId) + '/stream-count').catch(function () { return null; }),
    ]).then(function (r) {
      var releases = r[0].releases || r[0] || [];
      var summary = r[1];
      var albumCount = r[2];
      var totalStreams = r[3];
      clearResults();

      if (summary) {
        var extra = [];
        if (albumCount) extra.push(albumCount.albumCount + ' album(s)');
        if (totalStreams) extra.push(totalStreams.totalStreamCount + ' total streams across every release');
        out.appendChild(VACO.card('Summary', [
          VACO.table(Object.keys(summary).filter(function (k) { return typeof summary[k] !== 'object'; })
            .map(function (k) { return { key: k, label: k.replace(/([A-Z])/g, ' $1') }; }),
            [summary]),
          extra.length ? el('p', 'vaco-small vaco-dim', extra.join(' · ')) : null,
        ]));
      }

      out.appendChild(VACO.grid(releases.map(function (rel) {
        return releaseCard(rel, function () { return loadArtist(artistId); });
      }), true));

      if (!releases.length) out.appendChild(el('div', 'vaco-empty', 'No releases for that artist yet.'));
      VACO.mount(body, out);
    });
  }

  function loadRelease(id) {
    return VACO.api('/api/releases/' + id).then(function (rel) {
      clearResults();
      out.appendChild(releaseCard(rel, function () { return loadRelease(id); }));
      VACO.mount(body, out);
    });
  }

  function loadCollaboratorEarnings(userId) {
    return VACO.api('/api/collaborators/' + encodeURIComponent(userId) + '/earnings').then(function (data) {
      clearResults();
      out.appendChild(VACO.card('Collaborator earnings — ' + userId, [
        VACO.table(
          [
            { key: 'releaseTitle', label: 'Release' },
            { key: 'splitPercent', label: 'Split', num: true, render: function (row) { return Math.round(row.splitPercent * 100) + '%'; } },
            { key: 'grossShare', label: 'Gross', num: true, render: function (row) { return VACO.round(row.grossShare); } },
            { key: 'managerCommission', label: 'Mgr commission', num: true, render: function (row) { return VACO.round(row.managerCommission); } },
            { key: 'netShare', label: 'Net', num: true, render: function (row) { return VACO.round(row.netShare); } },
          ],
          data.earnings, { empty: 'No cross-release earnings found for that user yet.' },
        ),
        el('p', 'vaco-small vaco-dim', 'Total net earnings across every release: ' + VACO.round(data.totalNetEarnings)),
      ]));
      VACO.mount(body, out);
    });
  }

  return VACO.mount(body, out);
}

function beatCard(b, onChange) {
  var lines = el('div', 'vaco-stack-sm');
  lines.appendChild(el('p', 'vaco-small vaco-dim', 'Listed ' + new Date(b.createdAt).toLocaleDateString()));
  if (b.previewUrl) {
    var link = el('a', 'vaco-small', 'Preview');
    link.href = b.previewUrl;
    link.target = '_blank';
    link.rel = 'noopener';
    lines.appendChild(link);
  } else {
    lines.appendChild(el('p', 'vaco-small vaco-faint', 'No preview audio registered yet.'));
  }

  var row = el('div', 'vaco-row-tight');
  row.appendChild(VACO.price(b.price, { freeLabel: false }));
  row.appendChild(el('span', 'vaco-spacer'));
  var userId = VACO.userId();
  if (userId && userId === b.producerId) {
    row.appendChild(VACO.button('Take down', function () {
      return VACO.post('/api/beats/' + b.id + '/take-down', { producerId: userId })
        .then(function () { VACO.toast('Took down “' + b.title + '”.'); return onChange(); });
    }, 'danger'));
  } else {
    row.appendChild(VACO.button('License', function () {
      if (!userId) throw new Error('Sign in to license a beat.');
      return VACO.post('/api/beats/' + b.id + '/purchase', { buyerId: userId })
        .then(function () {
          VACO.toast('Licensed “' + (b.title || b.id) + '”.', 'money');
          VACO.refreshBalances().then(VACO.renderIdentity);
          return onChange();
        });
    }, 'primary'));
  }
  lines.appendChild(row);
  return VACO.card(b.title || ('Beat ' + b.id), [lines],
    { trailing: b.licenseType ? VACO.badge(b.licenseType) : null });
}

function renderBeats(body) {
  var out = el('div', 'vaco-stack');
  out.appendChild(VACO.notice(
    'The beat marketplace: producers license instrumentals, and a purchase moves real VCoin. '
    + 'The producer keeps 100% of every sale — no platform account sits in the payment path.'));

  out.appendChild(VACO.card('List a beat', [
    VACO.form([
      { name: 'title', label: 'Title', width: '160px' },
      { name: 'price', label: 'Price', type: 'number', min: 0.01, step: '0.01', value: 29.99, width: '90px' },
      { name: 'licenseType', label: 'Licence', options: ['non-exclusive', 'exclusive'] },
      { name: 'previewUrl', label: 'Preview URL (optional)', placeholder: 'https://…', width: '200px' },
    ], function (values) {
      if (!VACO.userId()) throw new Error('Sign in to list a beat.');
      return VACO.post('/api/beats', {
        producerId: VACO.userId(), title: values.title, price: values.price,
        licenseType: values.licenseType, previewUrl: values.previewUrl || null,
      }).then(function (beat) {
        VACO.toast('Listed “' + beat.title + '”.', 'money');
        return loadBeats();
      });
    }, 'List'),
  ]));

  var beatsHost = el('div', 'vaco-stack');
  out.appendChild(beatsHost);

  out.appendChild(VACO.card('My beat activity', [
    VACO.button('Show my purchases', function () { return loadMyBeatActivity('buyer'); }, 'sm'),
    VACO.button('Show my sales', function () { return loadMyBeatActivity('producer'); }, 'sm'),
  ]));

  var activityHost = el('div', 'vaco-stack');
  out.appendChild(activityHost);

  function loadBeats() {
    return VACO.api('/api/beats').then(function (data) {
      var beats = data.beats || [];
      if (!beats.length) {
        VACO.mount(beatsHost, el('div', 'vaco-empty', 'No beats listed yet.'));
        return;
      }
      VACO.mount(beatsHost, VACO.grid(beats.map(function (b) { return beatCard(b, loadBeats); }), true));
    });
  }

  function loadMyBeatActivity(role) {
    var userId = VACO.userId();
    if (!userId) throw new Error('Sign in to see your own beat activity.');
    var path = role === 'buyer'
      ? '/api/beat-purchases/buyer/' + encodeURIComponent(userId)
      : '/api/beat-purchases/producer/' + encodeURIComponent(userId);
    return VACO.api(path).then(function (data) {
      var rows = data.purchases || data.sales || [];
      VACO.mount(activityHost, VACO.card(role === 'buyer' ? 'My purchases' : 'My sales', [
        VACO.table(
          [
            { key: 'beatTitle', label: 'Beat' },
            role === 'buyer' ? { key: 'producerId', label: 'Producer' } : { key: 'buyerId', label: 'Buyer' },
            { key: 'licenseType', label: 'Licence' },
            { key: 'pricePaid', label: 'Price', num: true, render: function (row) { return VACO.round(row.pricePaid); } },
          ],
          rows, { empty: role === 'buyer' ? 'No purchases yet.' : 'No sales yet.' },
        ),
      ]));
    });
  }

  VACO.mount(body, out);
  return loadBeats();
}

function renderDeals(body) {
  var out = el('div', 'vaco-stack');
  out.appendChild(VACO.notice(
    'Label deals and personal-management deals are real, separate shapes — a label’s advance/recoupment/share '
    + 'differs from a manager’s straight commission, and the difference lives in the data rather than a PDF.'));

  out.appendChild(VACO.card('Look up an artist’s manager', [
    VACO.form([{ name: 'artistId', label: 'Artist', value: VACO.userId() || '', width: '160px' }],
      function (values) { return loadManagerDeal(values.artistId); }, 'Load'),
  ]));

  out.appendChild(VACO.card('Look up a manager', [
    VACO.form([{ name: 'managerId', label: 'Manager id', width: '160px' }],
      function (values) { return loadManagerRoster(values.managerId); }, 'Load'),
  ]));

  out.appendChild(VACO.card('Look up a label deal', [
    VACO.form([{ name: 'id', label: 'Deal id', type: 'number', min: 1, value: 1, width: '90px' }],
      function (values) { return loadLabelDeal(values.id); }, 'Load'),
  ]));

  var BASE = out.childNodes.length;
  function clearResults() { while (out.childNodes.length > BASE) out.removeChild(out.lastChild); }

  function dealTable(deal) {
    var rows = Object.keys(deal).filter(function (k) { return typeof deal[k] !== 'object'; })
      .map(function (k) { return { field: k.replace(/([A-Z])/g, ' $1'), value: String(deal[k]) }; });
    return VACO.table([{ key: 'field', label: 'Term' }, { key: 'value', label: 'Value' }], rows);
  }

  // Either side of a management deal may end it -- `requireDealParty`
  // on the server accepts the manager or the artist, so this button
  // shows for either, matching server.js's own comment on the route.
  function loadManagerDeal(artistId) {
    return VACO.api('/api/artists/' + encodeURIComponent(artistId) + '/manager').then(function (data) {
      clearResults();
      var deal = data.deal;
      if (!deal) {
        out.appendChild(el('div', 'vaco-empty', artistId + ' has no active management deal.'));
      } else {
        var userId = VACO.userId();
        var children = [dealTable(deal)];
        if (deal.status === 'active' && userId && (userId === deal.artistId || userId === deal.managerId)) {
          var actions = el('div', 'vaco-row-tight');
          actions.appendChild(VACO.button('Terminate', function () {
            var reason = prompt('Reason for ending this management deal (required):');
            if (!reason) return Promise.resolve();
            return VACO.post('/api/deals/' + deal.id + '/terminate', { reason: reason })
              .then(function () { VACO.toast('Management deal terminated.'); return loadManagerDeal(artistId); });
          }, 'danger'));
          children.push(actions);
        }
        out.appendChild(VACO.card('Management deal #' + deal.id, children));
      }
      VACO.mount(body, out);
    });
  }

  function loadManagerRoster(managerId) {
    return Promise.all([
      VACO.api('/api/managers/' + encodeURIComponent(managerId) + '/roster'),
      VACO.api('/api/managers/' + encodeURIComponent(managerId) + '/summary'),
    ]).then(function (r) {
      clearResults();
      var roster = r[0].roster || [];
      var summary = r[1];
      var userId = VACO.userId();
      var columns = [
        { key: 'artistId', label: 'Artist' },
        { key: 'commissionPercent', label: 'Commission', num: true, render: function (row) { return Math.round(row.commissionPercent * 100) + '%'; } },
        { key: 'startedAt', label: 'Signed', render: function (row) { return new Date(row.startedAt).toLocaleDateString(); } },
      ];
      // Only the manager themself gets a per-row Terminate action --
      // the server would refuse anyone else's attempt anyway, but
      // there is no reason to show a button that always 403s.
      if (userId && userId === managerId) {
        columns.push({ key: 'id', label: '', render: function (row) {
          return VACO.button('Terminate', function () {
            var reason = prompt('Reason for ending the deal with ' + row.artistId + ' (required):');
            if (!reason) return Promise.resolve();
            return VACO.post('/api/deals/' + row.id + '/terminate', { reason: reason })
              .then(function () { VACO.toast('Deal terminated.'); return loadManagerRoster(managerId); });
          }, 'danger');
        } });
      }
      out.appendChild(VACO.card('Manager ' + managerId, [
        el('p', 'vaco-small vaco-dim',
          summary.rosterSize + ' active artist(s) · ' + VACO.round(summary.totalCommissionEarned) + ' total commission earned'),
        VACO.table(columns, roster, { empty: 'No active artists on this roster.' }),
      ]));
      VACO.mount(body, out);
    });
  }

  function loadLabelDeal(id) {
    return VACO.api('/api/label-deals/' + id).then(function (deal) {
      clearResults();
      var userId = VACO.userId();
      var children = [dealTable(deal)];
      if (deal.status !== 'terminated' && userId && (userId === deal.artistId || userId === deal.labelId)) {
        var actions = el('div', 'vaco-row-tight');
        actions.appendChild(VACO.button('Terminate', function () {
          var reason = prompt('Reason for ending this label deal (required):');
          if (!reason) return Promise.resolve();
          return VACO.post('/api/label-deals/' + id + '/terminate', { reason: reason })
            .then(function () { VACO.toast('Label deal terminated.'); return loadLabelDeal(id); });
        }, 'danger'));
        children.push(actions);
      }
      out.appendChild(VACO.card('Deal ' + id, children));
      VACO.mount(body, out);
    });
  }

  return VACO.mount(body, out);
}

VACO.app({
  id: 'vulture-music',
  name: 'Vvltvre Music',
  tagline: 'Distribution & beats',
  //: Vvltvre Music's identity: an orchid-magenta. Part of the Vvltvre
  //: family's warm band, distinct from CVLTVRE's pink by sitting
  //: further toward violet.
  accent: '#c45ad4',
  accentDim: '#a03cb0',
  accentInk: '#180420',
  tabs: [
    { id: 'releases', label: 'Releases', heading: 'Catalogue & splits', render: renderReleases },
    { id: 'beats', label: 'Beats', heading: 'Beat marketplace', render: renderBeats },
    { id: 'deals', label: 'Deals', heading: 'Label & management deals', render: renderDeals },
  ],
});
</script>
</body>
</html>
