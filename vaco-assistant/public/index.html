<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vaco Assistant</title>
<link rel="stylesheet" href="/vaco-design.css" />
</head>
<body class="vaco">
<script src="/vaco-ui.js"></script>
<script>
// Vaco Assistant — one personal AI assistant per signed-in user,
// personalized to how they describe themselves, with a real
// connection into VACON's own named executive agents for anything
// domain-specific.
//
// Extracted out of vaco-shell's own "Assistant" tab (15 Oct 2026) —
// this is the same UI, same behavior, now served by this app directly
// rather than only reachable from one dashboard. `VACO.api` attaches
// the Shield session token automatically on same-origin calls, which
// is why a write here satisfies requireActor with no header handling
// in this file.

var el = VACO.el;

// -- small shared helpers (same shapes void/public/index.html already
// uses for a datetime-local input and a human-readable timestamp) --
function dateInputToMs(value) {
  if (!value) return null;
  var ms = Date.parse(value);
  return isNaN(ms) ? null : ms;
}

function fmtDateTime(ts) {
  if (!ts) return '—';
  return new Date(ts).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

// `blocked-no-connector` isn't in vaco-ui.js's shared STATUS_KIND map
// (it is specific to this app), so it renders as a plain, uncoloured
// badge unless told otherwise. Named here rather than patched into
// the shared file for one app's one status word.
function goalStatusBadge(status) {
  return VACO.badge(status, status === 'blocked-no-connector' ? 'danger' : null);
}

function renderAssistantMessage(message) {
  var row = el('div', 'vaco-stack-sm');
  var label = message.role === 'user' ? 'You'
    : (message.routedTo ? 'Assistant (via ' + message.routedTo + ')' : 'Assistant');
  row.appendChild(el('span', 'vaco-label', label));
  row.appendChild(el('p', 'vaco-body', message.content));
  return row;
}

function renderAssistant(body) {
  var out = el('div', 'vaco-stack');

  out.appendChild(VACO.notice(
    'Every reply is a real completion through V4 — a real <strong>ANTHROPIC_API_KEY</strong> '
    + 'must be configured behind v4-proxy for either path to answer. Routing to the right '
    + 'specialist (finance, legal, travel, dating, logistics, advertising, production, market '
    + 'research, music) is real either way; this never fabricates a reply when the key is '
    + 'missing or a service is unreachable.',
    'warn',
  ));

  if (!VACO.session) {
    out.appendChild(el('div', 'vaco-empty', 'Sign in above to set up your assistant.'));
    return VACO.mount(body, out);
  }

  var userId = VACO.userId();

  var profileDetails = el('details', 'vaco-card');
  var summary = el('summary', 'vaco-h3', 'Personalize your assistant');
  summary.style.cursor = 'pointer';
  profileDetails.appendChild(summary);

  var profileForm = el('form', 'vaco-stack');
  profileForm.style.marginTop = 'var(--vaco-space-3)';

  var nameWrap = el('label', 'vaco-stack-sm');
  nameWrap.appendChild(el('span', 'vaco-label', 'Name'));
  var nameInput = el('input', 'vaco-input');
  nameInput.placeholder = 'Vaco';
  nameInput.maxLength = 40;
  nameWrap.appendChild(nameInput);
  profileForm.appendChild(nameWrap);

  var toneWrap = el('label', 'vaco-stack-sm');
  toneWrap.appendChild(el('span', 'vaco-label', 'Tone'));
  var toneSelect = el('select', 'vaco-select');
  ['friendly', 'direct', 'professional', 'motivational'].forEach(function (t) {
    var o = el('option', null, t.charAt(0).toUpperCase() + t.slice(1));
    o.value = t;
    toneSelect.appendChild(o);
  });
  toneWrap.appendChild(toneSelect);
  profileForm.appendChild(toneWrap);

  var lifestyleWrap = el('label', 'vaco-stack-sm');
  lifestyleWrap.appendChild(el('span', 'vaco-label', 'Your life, interests, and preferences'));
  var lifestyleInput = el('textarea', 'vaco-input');
  lifestyleInput.rows = 3;
  lifestyleInput.placeholder = 'e.g. training for a marathon, run a small shop on VENVS, two kids, night owl';
  lifestyleWrap.appendChild(lifestyleInput);
  profileForm.appendChild(lifestyleWrap);

  var saveBtn = el('button', 'vaco-btn vaco-btn-primary', 'Save');
  saveBtn.type = 'submit';
  saveBtn.style.alignSelf = 'flex-start';
  profileForm.appendChild(saveBtn);

  profileForm.addEventListener('submit', function (e) {
    e.preventDefault();
    VACO.post('/api/assistant/profile', {
      userId: userId,
      name: nameInput.value.trim() || 'Vaco',
      tone: toneSelect.value,
      lifestyle: lifestyleInput.value.trim(),
    }).then(function () {
      VACO.toast('Assistant personalized.', 'money');
      profileDetails.removeAttribute('open');
    }).catch(VACO.error);
  });

  profileDetails.appendChild(profileForm);
  out.appendChild(profileDetails);

  var chatCard = el('div', 'vaco-card');
  chatCard.style.marginTop = 'var(--vaco-space-4)';
  var messagesBox = el('div', 'vaco-stack-sm');
  messagesBox.style.maxHeight = '420px';
  messagesBox.style.overflowY = 'auto';
  chatCard.appendChild(messagesBox);

  var chatForm = el('form', 'vaco-row');
  chatForm.style.marginTop = 'var(--vaco-space-3)';
  var chatInput = el('input', 'vaco-input');
  chatInput.style.flex = '1';
  chatInput.style.minWidth = '200px';
  chatInput.placeholder = 'Ask anything…';
  chatForm.appendChild(chatInput);
  var sendBtn = el('button', 'vaco-btn vaco-btn-primary', 'Send');
  sendBtn.type = 'submit';
  chatForm.appendChild(sendBtn);

  chatForm.addEventListener('submit', function (e) {
    e.preventDefault();
    var content = chatInput.value.trim();
    if (!content) return;
    var empty = messagesBox.querySelector('.vaco-empty');
    if (empty) empty.remove();
    messagesBox.appendChild(renderAssistantMessage({ role: 'user', content: content }));
    chatInput.value = '';
    var thinking = el('p', 'vaco-small vaco-dim', 'Thinking…');
    messagesBox.appendChild(thinking);
    messagesBox.scrollTop = messagesBox.scrollHeight;
    VACO.post('/api/assistant/chat', { userId: userId, content: content }).then(function (reply) {
      thinking.remove();
      messagesBox.appendChild(renderAssistantMessage(reply));
      messagesBox.scrollTop = messagesBox.scrollHeight;
    }).catch(function (err) {
      thinking.remove();
      messagesBox.appendChild(el('p', 'vaco-small vaco-dim', 'No reply: ' + err.message));
      messagesBox.scrollTop = messagesBox.scrollHeight;
    });
  });

  chatCard.appendChild(chatForm);
  out.appendChild(chatCard);

  VACO.mount(body, out);

  return VACO.api('/api/assistant/profile/' + encodeURIComponent(userId)).then(function (profile) {
    nameInput.value = profile.name || '';
    toneSelect.value = profile.tone || 'friendly';
    lifestyleInput.value = profile.lifestyle || '';
  }).catch(VACO.error).then(function () {
    return VACO.api('/api/assistant/history/' + encodeURIComponent(userId));
  }).then(function (history) {
    messagesBox.innerHTML = '';
    if (!history.messages.length) {
      messagesBox.appendChild(el('div', 'vaco-empty', 'Say something to start.'));
    } else {
      history.messages.forEach(function (m) { messagesBox.appendChild(renderAssistantMessage(m)); });
      messagesBox.scrollTop = messagesBox.scrollHeight;
    }
  }).catch(VACO.error);
}

// -- Tasks: Goals, Subscriptions, Reminders, Suggestions --------------
//
// The real, buildable half of a Meta-Muse-style personal agent (see
// lib/assistantTasks.js's own header and this app's README). Every
// route here previously had zero frontend caller — the only existing
// tab only ever drove /api/assistant/profile, /history and /chat.
// `/api/assistant/chat` already surfaces a blocked goal through a
// chat reply when a payment/booking/purchase-sounding message is
// intercepted, but a person who wants their own task list rather than
// hunting through a chat transcript had no way to see or manage one
// directly until now.

function buildGoalsTable(goals) {
  return VACO.table([
    { key: 'id', label: 'Id' },
    { key: 'kind', label: 'Kind' },
    { key: 'description', label: 'Description' },
    { label: 'Status', render: function (g) {
      var cell = el('div', 'vaco-stack-sm');
      cell.appendChild(goalStatusBadge(g.status));
      if (g.blockedReason) cell.appendChild(el('p', 'vaco-small vaco-dim', g.blockedReason));
      return cell;
    } },
    { label: '', render: function (g) {
      if (g.status === 'completed' || g.status === 'cancelled') return '—';
      var row = el('div', 'vaco-row-tight');
      if (g.status !== 'blocked-no-connector') {
        row.appendChild(VACO.button('Complete', function () {
          return VACO.post('/api/assistant/goals/' + g.id + '/complete', {}).then(function () {
            VACO.toast('Goal #' + g.id + ' completed.', 'money');
            VACO.render();
          });
        }, 'primary vaco-btn-sm'));
      }
      row.appendChild(VACO.button('Cancel', function () {
        return VACO.post('/api/assistant/goals/' + g.id + '/cancel', {}).then(function () {
          VACO.toast('Goal #' + g.id + ' cancelled.');
          VACO.render();
        });
      }, 'ghost vaco-btn-sm'));
      return row;
    } },
  ], goals, { empty: 'No goals yet — ask for one below, or just tell your assistant in chat.' });
}

function buildSubscriptionsTable(subscriptions) {
  return VACO.table([
    { key: 'id', label: 'Id' },
    { key: 'name', label: 'Name' },
    { key: 'amount', label: 'Amount', num: true, render: function (s) { return VACO.price(s.amount); } },
    { key: 'cadence', label: 'Cadence' },
    { label: 'Status', render: function (s) {
      return s.cancellationRequested ? VACO.badge('cancellation requested', 'warn') : VACO.badge('tracked', 'accent');
    } },
    { label: '', render: function (s) {
      if (s.cancellationRequested) return '—';
      return VACO.button('Request cancellation', function () {
        return VACO.post('/api/assistant/subscriptions/' + s.id + '/request-cancellation', {}).then(function (result) {
          VACO.toast('Opened goal #' + result.goal.id + ' — cancelling ' + s.name + ' still needs a real connector.', 'warn');
          VACO.render();
        });
      }, 'danger vaco-btn-sm');
    } },
  ], subscriptions, { empty: 'Nothing tracked yet — you enter these yourself, nothing is auto-discovered.' });
}

function buildRemindersTable(reminders) {
  return VACO.table([
    { key: 'text', label: 'Reminder' },
    { label: 'Due', render: function (r) { return fmtDateTime(r.dueAt); } },
    { label: '', render: function (r) {
      return VACO.button('Acknowledge', function () {
        return VACO.post('/api/assistant/reminders/' + r.id + '/acknowledge', {}).then(function () {
          VACO.toast('Acknowledged.');
          VACO.render();
        });
      }, 'ghost vaco-btn-sm');
    } },
  ], reminders, { empty: 'Nothing due right now.' });
}

function buildSuggestionsTable(suggestions) {
  return VACO.table([
    { label: 'Type', render: function (s) { return VACO.badge(s.kind, 'accent'); } },
    { key: 'text', label: 'Suggestion' },
  ], suggestions, { empty: 'Nothing to proactively flag right now — this reads straight off your own goals, subscriptions and reminders, no model call involved.' });
}

function renderTasks(body) {
  var out = el('div', 'vaco-stack');

  if (!VACO.session) {
    out.appendChild(el('div', 'vaco-empty', 'Sign in above to manage goals, subscriptions and reminders.'));
    return VACO.mount(body, out);
  }

  var userId = VACO.userId();

  var connectorsHost = el('div');
  out.appendChild(connectorsHost);

  var suggestionsHost = el('div');
  out.appendChild(VACO.card('Suggestions', [
    el('p', 'vaco-small vaco-dim', 'Due reminders, blocked goals, and pending cancellations — pulled straight from your own stored data below, nothing generated.'),
    suggestionsHost,
  ]));

  out.appendChild(VACO.card('New goal', [
    el('p', 'vaco-small vaco-dim',
      'Open-ended — "general" for anything your assistant can just do; a kind like pay-bill, book-appointment, '
      + 'make-purchase, or cancel-external-subscription starts blocked-no-connector immediately, since none of '
      + 'those rails exist in this environment yet (see this app\'s README).'),
    VACO.form([
      { name: 'kind', label: 'Kind', value: 'general', placeholder: 'general', width: '160px' },
      { name: 'description', label: 'Description', placeholder: 'What should your assistant do?', width: '280px' },
    ], function (values) {
      var description = values.description.trim();
      if (!description) throw new Error('Describe the goal first.');
      return VACO.post('/api/assistant/goals', {
        userId: userId, kind: values.kind.trim() || 'general', description: description,
      }).then(function (goal) {
        VACO.toast('Goal #' + goal.id + ' — ' + goal.status, goal.status === 'blocked-no-connector' ? 'warn' : 'money');
        VACO.render();
      });
    }, 'Add goal'),
  ]));
  var goalsHost = el('div');
  out.appendChild(VACO.card('Your goals', [goalsHost]));

  out.appendChild(VACO.card('Track a subscription', [
    el('p', 'vaco-small vaco-dim', 'User-entered, not auto-discovered — there is no real bank-linking here to find a recurring charge from.'),
    VACO.form([
      { name: 'name', label: 'Name', placeholder: 'Streaming Plus', width: '170px' },
      { name: 'amount', label: 'Amount', type: 'number', value: 10, step: '0.01', width: '100px' },
      { name: 'cadence', label: 'Cadence', value: 'monthly',
        options: ['weekly', 'monthly', 'yearly'].map(function (c) { return { label: c, value: c }; }) },
    ], function (values) {
      var name = values.name.trim();
      if (!name) throw new Error('Name the subscription first.');
      if (!(values.amount > 0)) throw new Error('Amount must be a positive number.');
      return VACO.post('/api/assistant/subscriptions', {
        userId: userId, name: name, amount: values.amount, cadence: values.cadence,
      }).then(function () {
        VACO.toast('Tracking ' + name + '.', 'money');
        VACO.render();
      });
    }, 'Track'),
  ]));
  var subscriptionsHost = el('div');
  out.appendChild(VACO.card('Your subscriptions', [subscriptionsHost]));

  out.appendChild(VACO.card('New reminder', [
    VACO.form([
      { name: 'text', label: 'Reminder', placeholder: 'Call the dentist', width: '220px' },
      { name: 'dueAt', label: 'Due', type: 'datetime-local', width: '190px' },
    ], function (values) {
      var text = values.text.trim();
      if (!text) throw new Error('Write the reminder text first.');
      var dueAt = dateInputToMs(values.dueAt);
      if (!dueAt) throw new Error('Pick a due date and time.');
      return VACO.post('/api/assistant/reminders', { userId: userId, text: text, dueAt: dueAt }).then(function () {
        VACO.toast('Reminder set.', 'money');
        VACO.render();
      });
    }, 'Remind me'),
  ]));
  var remindersHost = el('div');
  out.appendChild(VACO.card('Due now', [
    el('p', 'vaco-small vaco-dim', 'Only reminders already due appear here — there is no "list all" route, so one you just set for later will not show until its time comes.'),
    remindersHost,
  ]));

  VACO.mount(body, out);

  return VACO.api('/api/connectors/status').then(function (connectors) {
    VACO.mount(connectorsHost, VACO.notice(
      'Sandbox connectors — Stripe Issuing: <strong>' + (connectors.stripeIssuing.configured ? 'configured' : 'not configured')
      + '</strong>, Plaid Sandbox: <strong>' + (connectors.plaidSandbox.configured ? 'configured' : 'not configured')
      + '</strong>. Neither is real bill-pay even when configured, and neither changes whether a goal below can start — '
      + 'see this app\'s README.', 'warn',
    ));
  }).catch(function () { /* open route; a failure here is not worth blocking the rest of the tab on */ })
    .then(function () { return VACO.api('/api/assistant/goals/' + encodeURIComponent(userId)); })
    .then(function (data) {
      VACO.mount(goalsHost, buildGoalsTable(data.goals));
      return VACO.api('/api/assistant/subscriptions/' + encodeURIComponent(userId));
    })
    .then(function (data) {
      VACO.mount(subscriptionsHost, buildSubscriptionsTable(data.subscriptions));
      return VACO.api('/api/assistant/reminders/' + encodeURIComponent(userId) + '/due');
    })
    .then(function (data) {
      VACO.mount(remindersHost, buildRemindersTable(data.reminders));
      return VACO.api('/api/assistant/suggestions/' + encodeURIComponent(userId));
    })
    .then(function (data) {
      VACO.mount(suggestionsHost, buildSuggestionsTable(data.suggestions));
    })
    .catch(VACO.error);
}

VACO.app({
  id: 'vaco-assistant',
  name: 'Vaco Assistant',
  tagline: 'One personal AI assistant per user, that relays to VACON\'s real specialists.',
  //: Registered in vaco-shell/VACO_PALETTE_REGISTER.md. Per-app identity
  //: is colour only — the shared layer owns structure.
  accent: '#8674dc',
  accentDim: '#6557a5',
  accentInk: '#0b0912',
  tabs: [
    { id: 'assistant', label: 'Assistant', heading: 'Your Assistant', render: renderAssistant },
    { id: 'tasks', label: 'Tasks', heading: 'Goals, subscriptions & reminders', render: renderTasks },
  ],
});
</script>
</body>
</html>
