<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VOID</title>
<link rel="stylesheet" href="/vaco-design.css" />
<style>
  /* Layout only. Every colour and size comes from the design system. */
  .day-row {
    display: grid;
    grid-template-columns: 64px 1fr auto;
    gap: var(--vaco-space-3);
    align-items: center;
    padding: var(--vaco-space-3) 0;
    border-top: 1px solid var(--vaco-border-subtle);
  }
  .day-row:first-child { border-top: 0; }
  .day-time { font-variant-numeric: tabular-nums; font-weight: var(--vaco-weight-bold); }
  .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: var(--vaco-space-3); }
  .stat { display: flex; flex-direction: column; gap: 2px; }
  .stat-value { font-size: var(--vaco-text-xl); font-weight: var(--vaco-weight-bold); font-variant-numeric: tabular-nums; }
  /* Utilisation reads as a bar because the number alone hides the gap
     between "six hours of work" and "eight hours away from home". */
  .util-track { height: 6px; border-radius: var(--vaco-radius-pill); background: var(--vaco-surface-hover); overflow: hidden; }
  .util-fill { height: 100%; background: var(--vaco-accent); }
</style>
</head>
<body class="vaco">
<script src="/vaco-ui.js"></script>
<script>
// VOID — the provider-facing frontend.
//
// `VOID_SERVICE_APPS_AND_THE_WORKDAY.md` named this exact gap: "No
// provider-facing frontend. Everything above is API-only. The day plan
// is the screen a provider would open first, and it does not exist
// yet." So the day plan is the first tab, not a secondary one.
//
// Everything here is a real client of VOID's own 157 routes. No
// scheduling, pricing, or eligibility logic lives in this file — the
// server decides, this renders what it decided, including the
// rejections.

var el = VACO.el;

function fmtTime(ts) {
  return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function fmtDate(ts) {
  if (!ts) return '—';
  return new Date(ts).toLocaleDateString();
}

// A `<input type="date">` value ("2026-11-01") to a ms epoch timestamp,
// or null if it was left blank -- every booking route across this app
// takes real ms timestamps, never a date string.
function dateInputToMs(value) {
  if (!value) return null;
  var ms = Date.parse(value);
  return isNaN(ms) ? null : ms;
}

// The provider being viewed. Defaults to the signed-in user, because a
// provider is a user — but stays editable, since a dispatcher looking
// at someone else's day is a real use of this screen.
function providerId() {
  return document.getElementById('providerInput')
    ? document.getElementById('providerInput').value.trim()
    : (VACO.userId() || '');
}

function providerPicker(onChange) {
  var row = el('div', 'vaco-row');
  row.appendChild(el('span', 'vaco-label', 'Provider'));
  var input = el('input', 'vaco-input');
  input.id = 'providerInput';
  input.value = VACO.userId() || '';
  input.placeholder = 'provider id';
  input.style.width = '180px';
  row.appendChild(input);
  row.appendChild(VACO.button('Load', onChange, 'primary'));
  return row;
}

// -- My Day -----------------------------------------------------------

function renderDay(body) {
  var out = el('div', 'vaco-stack');
  out.appendChild(providerPicker(function () { VACO.render(); }));

  var id = providerId();
  if (!id) {
    out.appendChild(el('div', 'vaco-empty', 'Sign in, or enter a provider id, to build a day.'));
    return VACO.mount(body, out);
  }

  // A whole working day, today. Real timestamps because the engine
  // filters jobs by scheduledFor and would return an empty plan for a
  // window with nothing in it.
  var start = new Date(); start.setHours(6, 0, 0, 0);
  var end = new Date(); end.setHours(22, 0, 0, 0);

  return Promise.all([
    VACO.post('/api/provider/' + encodeURIComponent(id) + '/service-day',
      { dayStart: start.getTime(), dayEnd: end.getTime() }),
    VACO.post('/api/provider/' + encodeURIComponent(id) + '/skill-suggestions',
      { dayStart: start.getTime(), dayEnd: end.getTime() }).catch(function () { return null; }),
    VACO.api('/api/provider/' + encodeURIComponent(id) + '/capabilities')
      .catch(function () { return null; }),
  ]).then(function (results) {
    var day = results[0], suggestions = results[1], caps = results[2];
    var s = day.summary;

    // The headline: what the day is worth and what it actually costs in
    // hours, side by side.
    var stats = el('div', 'stat-row');
    function stat(label, value, node) {
      var wrap = el('div', 'stat');
      wrap.appendChild(el('span', 'vaco-label', label));
      wrap.appendChild(node || el('span', 'stat-value', value));
      return wrap;
    }
    stats.appendChild(stat('Earnings', null, (function () {
      var v = el('span', 'stat-value');
      v.appendChild(VACO.price(s.totalEarnings, { freeLabel: false }));
      return v;
    }())));
    stats.appendChild(stat('Jobs', s.jobCount));
    stats.appendChild(stat('Verticals', s.verticalsSpanned));
    stats.appendChild(stat('Worked', s.workedMinutes + 'm'));
    stats.appendChild(stat('Travel', s.travelMinutes + 'm'));
    out.appendChild(VACO.card(null, [stats]));

    // Utilisation, with travel shown against it. Surfacing unpaid travel
    // is deliberate — it is the most common thing gig platforms hide.
    var util = el('div', 'vaco-stack-sm');
    var utilHead = el('div', 'vaco-row-tight');
    utilHead.appendChild(el('span', 'vaco-label', 'Utilisation'));
    utilHead.appendChild(el('span', 'vaco-spacer'));
    utilHead.appendChild(el('strong', 'vaco-num', s.utilisationPercent + '%'));
    util.appendChild(utilHead);
    var track = el('div', 'util-track');
    var fill = el('div', 'util-fill');
    fill.style.width = s.utilisationPercent + '%';
    track.appendChild(fill);
    util.appendChild(track);
    util.appendChild(el('p', 'vaco-small vaco-faint',
      'Worked minutes against worked plus travel. Travel is unpaid here and on every comparable platform — it is shown rather than hidden.'));
    out.appendChild(VACO.card(null, [util]));

    // The schedule itself, chronological on purpose: a provider reading
    // their day wants it in order, not optimally resequenced.
    if (day.plan.length) {
      var sched = el('div', 'vaco-stack-sm');
      day.plan.forEach(function (item) {
        var row = el('div', 'day-row');
        row.appendChild(el('span', 'day-time', fmtTime(item.scheduledFor)));
        var mid = el('div', 'vaco-stack-sm');
        mid.appendChild(el('strong', null, item.verticalName || item.verticalId));
        mid.appendChild(el('span', 'vaco-small vaco-dim',
          'ends ' + fmtTime(item.endsAt)
          + (item.travelMinutes ? ' · ' + item.travelMinutes + 'm travel to get here' : ' · no travel')));
        row.appendChild(mid);
        row.appendChild(VACO.price(item.earns, { freeLabel: false }));
        sched.appendChild(row);
      });
      out.appendChild(VACO.card('The day', [sched]));
    } else {
      out.appendChild(VACO.card('The day', [el('div', 'vaco-empty',
        'No jobs fit this day. Every reason is listed below — nothing is silently dropped.')]));
    }

    // Every rejection with its reason. "Why isn't this job in my day" is
    // always answerable, which is the half most schedulers leave out.
    if (day.rejected && day.rejected.length) {
      out.appendChild(VACO.card('Not scheduled — ' + day.rejected.length, [
        VACO.table([
          { key: 'jobId', label: 'Job' },
          { key: 'verticalId', label: 'Vertical' },
          { key: 'reason', label: 'Why not' },
        ], day.rejected, { empty: 'Nothing rejected.' }),
      ]));
    }

    // The growth loop: what one more skill would have earned today, from
    // real open jobs rather than a marketing estimate.
    if (suggestions && suggestions.length) {
      out.appendChild(VACO.card('Add a skill', [
        el('p', 'vaco-small vaco-dim',
          'What each of these would have earned you today, from jobs actually open right now. Licensing-gated verticals are never suggested.'),
        VACO.table([
          { key: 'verticalName', label: 'Vertical', render: function (r) { return r.verticalName || r.verticalId; } },
          { key: 'additionalJobs', label: 'Extra jobs', num: true },
          { label: 'Would have earned', num: true, render: function (r) { return VACO.price(r.additionalEarnings, { freeLabel: false }); } },
        ], suggestions),
      ]));
    }

    if (caps && caps.skills) {
      out.appendChild(VACO.card('Skills held', [
        VACO.table([
          { key: 'verticalId', label: 'Vertical' },
          { label: 'Status', render: function (r) { return VACO.badge(r.status || (r.verified ? 'verified' : 'claimed')); } },
        ], caps.skills, { empty: 'No skills claimed yet.' }),
      ]));
    }

    VACO.mount(body, out);
  });
}

// -- Services ---------------------------------------------------------

function renderServices(body) {
  return VACO.api('/api/services').then(function (data) {
    var services = Array.isArray(data) ? data : (data.services || data.verticals || []);
    var cards = services.map(function (v) {
      // A licensing-gated vertical is called out first, because that is
      // the one property that changes whether you may work it at all.
      var trailing = v.licensingGated ? VACO.badge('licence required', 'danger') : null;
      var lines = el('div', 'vaco-stack-sm');

      if (v.services && v.services.length) {
        lines.appendChild(el('p', 'vaco-small vaco-dim', v.services.join(' · ')));
      }

      var meta = el('div', 'vaco-row-tight');
      if (v.archetype) meta.appendChild(VACO.badge(v.archetype));
      if (typeof v.takeRate === 'number') meta.appendChild(VACO.badge(Math.round(v.takeRate * 100) + '% take'));
      if (v.pricingUnit) meta.appendChild(VACO.badge(v.pricingUnit));
      lines.appendChild(meta);

      // Vetting is the safety gate. Showing it on the card is the
      // difference between "we check people" as a claim and as a fact
      // you can read per vertical.
      var gates = el('div', 'vaco-row-tight');
      if (v.requiredVetting && v.requiredVetting !== 'none') {
        gates.appendChild(VACO.badge(v.requiredVetting, 'warn'));
      }
      if (v.requiresIntroSession) gates.appendChild(VACO.badge('meet first', 'warn'));
      if (gates.childNodes.length) lines.appendChild(gates);

      return VACO.card(v.name || v.verticalId, [lines], { trailing: trailing });
    });
    return VACO.grid(cards, true);
  });
}

// -- Jobs -------------------------------------------------------------

function renderJobs(body) {
  var out = el('div', 'vaco-stack');

  out.appendChild(VACO.card('Request a job', [
    VACO.form([
      { name: 'verticalId', label: 'Vertical', placeholder: 'courier', width: '150px' },
      { name: 'customerId', label: 'Customer', value: VACO.userId() || '', width: '130px' },
      { name: 'description', label: 'Description', placeholder: 'what needs doing', width: '220px' },
      { name: 'offeredPrice', label: 'Price', type: 'number', min: 1, value: 40, width: '90px' },
    ], function (values) {
      return VACO.post('/api/job', values).then(function (job) {
        VACO.toast('Job ' + job.id + ' requested in ' + job.verticalId, 'money');
        VACO.render();
      });
    }, 'Request'),
  ]));

  var id = VACO.userId();
  if (!id) {
    out.appendChild(el('div', 'vaco-empty', 'Sign in to see your jobs.'));
    return VACO.mount(body, out);
  }

  return VACO.api('/api/jobs/user/' + encodeURIComponent(id)).then(function (data) {
    var jobs = data.jobs || data;
    out.appendChild(VACO.card('Your jobs', [
      VACO.table([
        { key: 'id', label: 'Job' },
        { key: 'verticalId', label: 'Vertical' },
        { key: 'description', label: 'Description' },
        { label: 'Price', num: true, render: function (r) { return VACO.price(r.offeredPrice, { freeLabel: false }); } },
        { label: 'Status', render: function (r) { return VACO.badge(r.status); } },
      ], jobs, { empty: 'No jobs yet — request one above.' }),
    ]));
    VACO.mount(body, out);
  });
}

// -- Network ----------------------------------------------------------

function renderNetwork(body) {
  var out = el('div', 'vaco-stack');
  out.appendChild(VACO.notice(
    'Stations, drones, and docks are <strong>not built as hardware</strong>. '
    + 'This is the real network model the routing and dispatch engines run against.'));

  return VACO.api('/api/health').then(function (health) {
    var stats = el('div', 'stat-row');
    Object.keys(health).forEach(function (key) {
      if (typeof health[key] !== 'number') return;
      var wrap = el('div', 'stat');
      wrap.appendChild(el('span', 'vaco-label', key.replace(/([A-Z])/g, ' $1')));
      wrap.appendChild(el('span', 'stat-value', health[key]));
      stats.appendChild(wrap);
    });
    out.appendChild(VACO.card('Network', [stats]));

    return VACO.api('/api/no-fly-zones').then(function (data) {
      var zones = data.zones || data.noFlyZones || [];
      out.appendChild(VACO.card('No-fly zones', [
        VACO.table([
          { key: 'id', label: 'Zone' },
          { key: 'name', label: 'Name' },
          { key: 'radiusKm', label: 'Radius km', num: true },
        ], zones, { empty: 'No no-fly zones registered.' }),
      ]));

      // Real Dijkstra hub-to-hub relay -- hop by real drone leg where
      // stations (and 'drone-support' affiliates) are close enough,
      // reporting honestly when no drone-only chain connects them.
      var relayResult = el('div', 'vaco-stack-sm');
      var relayForm = VACO.form([
        { name: 'regionId', label: 'Region', value: 'stl', width: '90px' },
        { name: 'originStationId', label: 'Origin station', type: 'number', value: 1, width: '110px' },
        { name: 'destinationStationId', label: 'Destination station', type: 'number', value: 2, width: '140px' },
        { name: 'maxDroneLegRangeKm', label: 'Max leg range (km)', type: 'number', value: 10, width: '140px' },
      ], function (values) {
        var qs = 'regionId=' + encodeURIComponent(values.regionId)
          + '&originStationId=' + values.originStationId
          + '&destinationStationId=' + values.destinationStationId
          + '&maxDroneLegRangeKm=' + values.maxDroneLegRangeKm;
        return VACO.api('/api/relay-path?' + qs).then(function (result) {
          VACO.mount(relayResult, result.found
            ? VACO.notice('Found a ' + result.hopCount + '-hop relay, ' + result.totalDistanceKm
              + 'km total: ' + result.path.join(' → '), 'money')
            : VACO.notice('No drone-only relay connects those stations at this leg range — a ground/autonomous handoff is needed.', 'warn'));
        });
      }, 'Find relay');
      out.appendChild(VACO.card('Hub-to-hub drone relay', [relayForm, relayResult]));

      VACO.mount(body, out);
    });
  });
}

// -- VOID Academy -------------------------------------------------------

function courseFormatLabel(format) {
  return {
    'self-paced-online': 'Self-paced online',
    'in-app': 'In the app',
    'live-virtual': 'Live virtual class',
    'recorded-virtual': 'Recorded virtual class',
    'in-person-city': 'In-person',
  }[format] || format;
}

function renderAcademy(body) {
  var out = el('div', 'vaco-stack');
  out.appendChild(providerPicker(function () { VACO.render(); }));

  var id = providerId();
  if (!id) {
    out.appendChild(el('div', 'vaco-empty', 'Sign in, or enter a provider id, to see your courses.'));
    return VACO.mount(body, out);
  }

  return Promise.all([
    VACO.api('/api/training/courses'),
    VACO.api('/api/training/recommended/' + encodeURIComponent(id)).catch(function () { return null; }),
    VACO.api('/api/training/progress/' + encodeURIComponent(id)).catch(function () { return null; }),
  ]).then(function (r) {
    var courses = r[0].courses, recommended = r[1], progress = r[2];
    var statusByCourse = {};
    if (progress) {
      progress.enrollments.forEach(function (e) { statusByCourse[e.courseId] = e.status; });
    }

    if (!progress) {
      out.appendChild(VACO.notice(
        'Sign in as this provider to see recommendations, enroll, and track progress.', 'warn'));
    } else {
      // Computed from the provider's own real claimed skills -- see
      // `getRecommendedCourses` in lib/training.js -- not a fixed list.
      out.appendChild(VACO.card('Recommended for you', [
        el('p', 'vaco-small vaco-dim', 'Chosen from your own claimed skills, not a fixed list.'),
        VACO.table([
          { key: 'title', label: 'Course' },
          { label: 'Format', render: function (c) {
            return courseFormatLabel(c.format) + (c.city ? ' · ' + c.city : '');
          } },
        ], recommended.recommended, { empty: 'Nothing recommended right now — you are caught up.' }),
      ]));

      out.appendChild(VACO.card('Your progress', [
        el('p', 'vaco-small', progress.completedCount + ' of ' + progress.totalCourses + ' courses completed'),
      ]));
    }

    out.appendChild(VACO.card('Full catalog', [
      VACO.table([
        { key: 'title', label: 'Course' },
        { label: 'Format', render: function (c) {
          return courseFormatLabel(c.format) + (c.city ? ' · ' + c.city : '');
        } },
        { label: 'Status', render: function (c) {
          var status = statusByCourse[c.id];
          return status ? VACO.badge(status) : el('span', 'vaco-small vaco-dim', 'Not enrolled');
        } },
        { label: '', render: function (c) {
          if (!progress) return null;
          var status = statusByCourse[c.id];
          if (status === 'completed') return null;
          if (status === 'enrolled') {
            return VACO.button('Mark complete', function () {
              return VACO.post('/api/training/complete', { providerId: id, courseId: c.id })
                .then(function () { VACO.toast('Marked complete'); VACO.render(); });
            }, 'sm');
          }
          return VACO.button('Enroll', function () {
            return VACO.post('/api/training/enroll', { providerId: id, courseId: c.id })
              .then(function () { VACO.toast('Enrolled'); VACO.render(); });
          }, 'sm');
        } },
      ], courses, { empty: 'No courses yet.' }),
    ]));

    return VACO.mount(body, out);
  }).catch(function (err) {
    out.appendChild(VACO.notice('Could not load VOID Academy: ' + VACO.escapeHtml(err.message), 'danger'));
    return VACO.mount(body, out);
  });
}

// -- VOID DROP ----------------------------------------------------------
//
// Select -> book -> deliver -> deploy -> use -> retrieve -> redeploy.
// Previously zero frontend exposure at all. Self-service here is the
// customer side only: approval, dispatch, inspection, and maintenance
// are real fleet-operations steps gated to a vaco-operator credential
// this frontend has no login for -- a deliberate scope line (see
// CLAUDE.md), not an oversight.

function renderDrop(body) {
  var out = el('div', 'vaco-stack');

  out.appendChild(VACO.notice(
    'Select &rarr; book &rarr; deliver &rarr; deploy &rarr; use &rarr; retrieve &rarr; redeploy. '
    + 'A real human operator always approves a booking before a unit moves &mdash; nothing here auto-approves.'));

  return VACO.api('/api/drop/categories').then(function (categoryData) {
    var cards = (categoryData.categories || []).map(function (c) {
      var lines = el('div', 'vaco-stack-sm');
      lines.appendChild(el('p', 'vaco-small vaco-dim', c.description));
      if (c.uses && c.uses.length) {
        lines.appendChild(el('p', 'vaco-small vaco-faint', c.uses.slice(0, 4).join(' · ')));
      }
      return VACO.card(c.label, [lines], { trailing: el('span', 'vaco-small vaco-dim', c.id) });
    });
    out.appendChild(VACO.card('16 named products', [VACO.grid(cards, true)]));

    // -- Book a unit --------------------------------------------------
    var bookingForm = VACO.form([
      { name: 'assetId', label: 'Asset', placeholder: 'VOID-DROP-0001', width: '140px' },
      { name: 'category', label: 'Category', placeholder: 'dropShop', width: '110px' },
      { name: 'rentalModel', label: 'Rental model', placeholder: 'daily', width: '110px' },
      { name: 'startDate', label: 'Start', type: 'date', width: '140px' },
      { name: 'endDate', label: 'End', type: 'date', width: '140px' },
      { name: 'zoneId', label: 'Zone (optional)', placeholder: 'VOID-ZONE-0001', width: '150px' },
      { name: 'locationType', label: 'Location type', placeholder: 'residential-driveway', width: '170px' },
      { name: 'deliveryLat', label: 'Delivery lat', type: 'number', step: 'any', width: '110px' },
      { name: 'deliveryLng', label: 'Delivery lng', type: 'number', step: 'any', width: '110px' },
      { name: 'intendedUse', label: 'Intended use', placeholder: 'pop-up retail', width: '150px' },
    ], function (values) {
      var customerId = VACO.userId();
      if (!customerId) throw new Error('Sign in to book a VOID DROP unit.');
      var startDate = dateInputToMs(values.startDate);
      var endDate = dateInputToMs(values.endDate);
      if (!startDate || !endDate) throw new Error('Pick a start and end date.');
      var payload = {
        customerId: customerId,
        assetId: values.assetId,
        category: values.category,
        rentalModel: values.rentalModel,
        startDate: startDate,
        endDate: endDate,
        intendedUse: values.intendedUse,
      };
      // A zone's own proven site overrides anything typed below --
      // see voidDropZones.js: registering a zone already is the
      // real-world proof this site supports drop deliveries.
      if (values.zoneId) {
        payload.zoneId = values.zoneId;
      } else {
        payload.locationType = values.locationType;
        payload.deliveryLat = values.deliveryLat;
        payload.deliveryLng = values.deliveryLng;
        payload.roadAccessConfirmed = true;
      }
      return VACO.post('/api/drop/booking', payload).then(function (booking) {
        VACO.toast('Booking #' + booking.id + ' is ' + booking.status + ' — awaiting operator approval', 'money');
        VACO.render();
      });
    }, 'Request booking');

    out.appendChild(VACO.card('Book a unit', [
      el('p', 'vaco-small vaco-dim',
        'Give a zone id to inherit its already-proven site (road access, location), or fill in a delivery '
        + 'location yourself. Every booking still needs a real operator’s sign-off before anything ships.'),
      bookingForm,
    ]));

    // -- Find a unit near you ------------------------------------------
    var searchResultsHost = el('div', 'vaco-stack-sm');
    searchResultsHost.appendChild(el('div', 'vaco-empty', 'Search to see real bookable units nearby.'));

    var searchForm = VACO.form([
      { name: 'lat', label: 'Lat', type: 'number', step: 'any', value: 38.627, width: '100px' },
      { name: 'lng', label: 'Lng', type: 'number', step: 'any', value: -90.1994, width: '100px' },
      { name: 'startDate', label: 'Start', type: 'date', width: '140px' },
      { name: 'endDate', label: 'End', type: 'date', width: '140px' },
      { name: 'category', label: 'Category', placeholder: 'any', width: '110px' },
    ], function (values) {
      var startDate = dateInputToMs(values.startDate);
      var endDate = dateInputToMs(values.endDate);
      if (!startDate || !endDate) throw new Error('Pick a start and end date.');
      var qs = 'lat=' + encodeURIComponent(values.lat) + '&lng=' + encodeURIComponent(values.lng)
        + '&startDate=' + startDate + '&endDate=' + endDate
        + (values.category ? '&category=' + encodeURIComponent(values.category) : '');
      return VACO.api('/api/drop/assets/nearby?' + qs).then(function (data) {
        var results = data.results || [];
        VACO.mount(searchResultsHost, VACO.table([
          { label: 'Asset', render: function (r) { return r.asset.id; } },
          { label: 'Category', render: function (r) { return r.asset.category; } },
          { label: 'Distance', num: true, render: function (r) { return r.distanceKm + ' km'; } },
          { label: 'Daily rate', num: true, render: function (r) { return VACO.price(r.asset.dailyRate, { freeLabel: false }); } },
          { label: 'Total (both legs + setup)', num: true, render: function (r) { return VACO.price(r.pricing.totalPrice, { freeLabel: false }); } },
          { label: '', render: function (r) {
            return VACO.button('Use for booking', function () {
              bookingForm.querySelector('[name="assetId"]').value = r.asset.id;
              bookingForm.querySelector('[name="category"]').value = r.asset.category;
              bookingForm.querySelector('[name="startDate"]').value = values.startDate;
              bookingForm.querySelector('[name="endDate"]').value = values.endDate;
              bookingForm.querySelector('[name="deliveryLat"]').value = values.lat;
              bookingForm.querySelector('[name="deliveryLng"]').value = values.lng;
              VACO.toast('Filled the booking form above with ' + r.asset.id);
            }, 'sm');
          } },
        ], results, { empty: 'No bookable unit within range for these dates.' }));
      });
    }, 'Search');

    out.appendChild(VACO.card('Find a unit near you', [searchForm, searchResultsHost]));

    // -- Drop Zones: small villages of co-located units ----------------
    return VACO.api('/api/drop/zones').then(function (zoneData) {
      var zones = zoneData.zones || [];
      var occupancyHost = el('div', 'vaco-stack-sm');
      out.appendChild(VACO.card('Drop Zones', [
        el('p', 'vaco-small vaco-dim', 'Several real units co-located into a small village or shopping center, with a real integer capacity.'),
        VACO.table([
          { key: 'id', label: 'Zone' },
          { key: 'name', label: 'Name' },
          { key: 'locationType', label: 'Location type' },
          { key: 'maxUnits', label: 'Capacity', num: true },
          { label: 'Status', render: function (z) { return VACO.badge(z.status); } },
          { label: '', render: function (z) {
            return VACO.button('Occupancy', function () {
              return VACO.api('/api/drop/zone/' + encodeURIComponent(z.id) + '/occupancy').then(function (occ) {
                VACO.mount(occupancyHost, VACO.card('On site at ' + occ.zone.name + ' now — ' + occ.occupiedCount + '/' + occ.capacity, [
                  VACO.table([
                    { key: 'bookingId', label: 'Booking' },
                    { key: 'assetId', label: 'Asset' },
                    { key: 'category', label: 'Category' },
                    { label: 'Status', render: function (u) { return VACO.badge(u.status); } },
                  ], occ.units, { empty: 'Nothing deployed there right now.' }),
                ]));
              });
            }, 'sm');
          } },
        ], zones, { empty: 'No drop zones registered yet.' }),
        occupancyHost,
      ]));

      var id = VACO.userId();
      if (!id) {
        out.appendChild(el('div', 'vaco-empty', 'Sign in to see and manage your own VOID DROP bookings.'));
        return VACO.mount(body, out);
      }

      return VACO.api('/api/drop/bookings/user/' + encodeURIComponent(id)).then(function (data) {
        var bookings = data.bookings || [];
        out.appendChild(VACO.card('Your bookings', [
          VACO.table([
            { key: 'id', label: 'Booking' },
            { key: 'assetId', label: 'Asset' },
            { key: 'category', label: 'Category' },
            { label: 'Dates', render: function (b) { return fmtDate(b.startDate) + ' → ' + fmtDate(b.endDate); } },
            { label: 'Total', num: true, render: function (b) { return VACO.price(b.pricing.totalPrice, { freeLabel: false }); } },
            { label: 'Status', render: function (b) { return VACO.badge(b.status); } },
            { label: '', render: function (b) {
              if (b.status !== 'pending-approval' && b.status !== 'booked') return null;
              return VACO.button('Cancel', function () {
                return VACO.post('/api/drop/booking/' + b.id + '/cancel', {}).then(function () {
                  VACO.toast('Booking cancelled');
                  VACO.render();
                });
              }, 'sm');
            } },
          ], bookings, { empty: 'No bookings yet — book a unit above.' }),
        ]));
        return VACO.mount(body, out);
      });
    });
  }).catch(function (err) {
    out.appendChild(VACO.notice('Could not load VOID DROP: ' + VACO.escapeHtml(err.message), 'danger'));
    return VACO.mount(body, out);
  });
}

// -- Scheduling: four real surfaces on one engine -----------------------
//
// reserveBooking.js, hourlyBooking.js, dedicatedLanes.js, and
// commuteScheduling.js -- CLAUDE.md's own grouping. None of the four
// had any frontend exposure. Matching and batch-opening are dispatcher
// actions (`requireCallingService`) this frontend cannot call -- each
// panel below does the real customer-side half (book, claim, cancel,
// join, look up) and is honest where it stops.

function renderScheduling(body) {
  var out = el('div', 'vaco-stack');
  out.appendChild(VACO.notice(
    'Four real booking surfaces, one engine: Reserve (book a ride ahead), Hourly (a driver for a time block), '
    + 'Dedicated Lanes &amp; Spot Loads (freight), and Commute (recurring carpool batches).'));

  // -- VOID Reserve -------------------------------------------------
  var reserveResult = el('div', 'vaco-stack-sm');
  var reserveForm = VACO.form([
    { name: 'pickupTime', label: 'Pickup', type: 'datetime-local', width: '190px' },
    { name: 'pickupLocation', label: 'Pickup location', placeholder: '123 Main St', width: '160px' },
    { name: 'dropoffLocation', label: 'Dropoff location', placeholder: 'Airport', width: '160px' },
    { name: 'estimatedFare', label: 'Est. fare', type: 'number', value: 35, width: '90px' },
  ], function (values) {
    var riderId = VACO.userId();
    if (!riderId) throw new Error('Sign in to book VOID Reserve.');
    var pickupTime = dateInputToMs(values.pickupTime);
    if (!pickupTime) throw new Error('Pick a pickup time.');
    return VACO.post('/api/reserve-booking', {
      riderId: riderId, pickupTime: pickupTime,
      pickupLocation: values.pickupLocation, dropoffLocation: values.dropoffLocation,
      estimatedFare: values.estimatedFare,
    }).then(function (booking) {
      VACO.toast('Reserve booking #' + booking.id + ' scheduled');
      VACO.mount(reserveResult, VACO.notice(
        'Booking #' + booking.id + ' is <strong>' + booking.status + '</strong> for ' + fmtTime(booking.pickupTime)
        + '. Save this id to cancel it later.'));
    });
  }, 'Book Reserve');

  var reserveCancelForm = VACO.form([
    { name: 'bookingId', label: 'Booking id', type: 'number', width: '100px' },
  ], function (values) {
    return VACO.post('/api/reserve-booking/' + values.bookingId + '/cancel', {}).then(function (result) {
      var fee = result.cancellationFeeApplies
        ? 'a cancellation fee applies (inside the 60-minute free window)'
        : 'free — outside the 60-minute window';
      VACO.toast('Booking #' + values.bookingId + ' cancelled — ' + fee);
    });
  }, 'Cancel');

  out.appendChild(VACO.card('VOID Reserve — book up to 90 days ahead', [
    reserveForm, reserveResult,
    el('p', 'vaco-small vaco-dim', 'Matching is attempted before pickup time, not at it. Free to cancel more than 60 minutes out.'),
    reserveCancelForm,
  ]));

  // -- VOID Hourly ----------------------------------------------------
  var hourlyResult = el('div', 'vaco-stack-sm');
  var hourlyForm = VACO.form([
    { name: 'driverId', label: 'Driver', placeholder: 'driver-jordan', width: '120px' },
    { name: 'blockHours', label: 'Hours (2–8)', type: 'number', min: 2, value: 4, width: '90px' },
    { name: 'hourlyRate', label: 'Rate/hr', type: 'number', value: 30, width: '80px' },
    { name: 'overageRatePerMile', label: 'Overage/mi', type: 'number', value: 2, width: '100px' },
    { name: 'overageRatePerMinute', label: 'Overage/min', type: 'number', value: 1, width: '100px' },
  ], function (values) {
    var riderId = VACO.userId();
    if (!riderId) throw new Error('Sign in to book VOID Hourly.');
    return VACO.post('/api/hourly-booking', {
      riderId: riderId, driverId: values.driverId, blockHours: values.blockHours,
      hourlyRate: values.hourlyRate, overageRatePerMile: values.overageRatePerMile,
      overageRatePerMinute: values.overageRatePerMinute,
    }).then(function (booking) {
      VACO.mount(hourlyResult, VACO.notice(
        'Booking #' + booking.id + ' booked — ' + booking.blockHours + 'h with ' + booking.driverId + '.'));
    });
  }, 'Book Hourly');

  var stopResult = el('div', 'vaco-stack-sm');
  var stopForm = VACO.form([
    { name: 'bookingId', label: 'Booking id', type: 'number', width: '90px' },
    { name: 'location', label: 'Stop', placeholder: 'Grocery store', width: '160px' },
  ], function (values) {
    return VACO.post('/api/hourly-booking/' + values.bookingId + '/stop', { location: values.location }).then(function () {
      VACO.mount(stopResult, VACO.notice('Stop added to booking #' + values.bookingId + '.'));
    });
  }, 'Add stop');

  var chargeResult = el('div', 'vaco-stack-sm');
  var chargeForm = VACO.form([
    { name: 'bookingId', label: 'Booking id', type: 'number', width: '90px' },
    { name: 'actualHours', label: 'Actual hours', type: 'number', value: 4, width: '100px' },
    { name: 'actualMiles', label: 'Actual miles', type: 'number', value: 50, width: '100px' },
  ], function (values) {
    var qs = 'actualHours=' + values.actualHours + '&actualMiles=' + values.actualMiles;
    return VACO.api('/api/hourly-booking/' + values.bookingId + '/charge?' + qs).then(function (charge) {
      VACO.mount(chargeResult, VACO.table([
        { label: 'Base', num: true, render: function (c) { return VACO.price(c.baseCharge, { freeLabel: false }); } },
        { label: 'Mileage overage', num: true, render: function (c) { return VACO.price(c.mileageOverageCharge, { freeLabel: false }); } },
        { label: 'Time overage', num: true, render: function (c) { return VACO.price(c.timeOverageCharge, { freeLabel: false }); } },
        { label: 'Total', num: true, render: function (c) { return VACO.price(c.totalCharge, { freeLabel: false }); } },
      ], [charge]));
    });
  }, 'Compute charge');

  out.appendChild(VACO.card('VOID Hourly — the same driver for a time block', [
    hourlyForm, hourlyResult,
    el('p', 'vaco-small vaco-dim', 'Multiple stops, one driver. Mileage and time past the included allowance charge separately.'),
    stopForm, stopResult,
    chargeForm, chargeResult,
  ]));

  // -- Dedicated Lanes & Spot Loads -------------------------------------
  var laneResult = el('div', 'vaco-stack-sm');
  var laneForm = VACO.form([
    { name: 'originHubId', label: 'Origin hub', type: 'number', width: '90px' },
    { name: 'destinationHubId', label: 'Destination hub', type: 'number', width: '110px' },
    { name: 'recurrenceSchedule', label: 'Schedule', options: [{ label: 'Daily', value: 'daily' }, { label: 'Weekly', value: 'weekly' }] },
    { name: 'ratePerRun', label: 'Rate/run', type: 'number', value: 200, width: '90px' },
  ], function (values) {
    var shipperId = VACO.userId();
    if (!shipperId) throw new Error('Sign in to post a dedicated lane.');
    return VACO.post('/api/dedicated-lane', {
      shipperId: shipperId, originHubId: values.originHubId, destinationHubId: values.destinationHubId,
      recurrenceSchedule: values.recurrenceSchedule, ratePerRun: values.ratePerRun,
    }).then(function (lane) {
      VACO.mount(laneResult, VACO.notice('Lane #' + lane.id + ' is open for a carrier to claim.'));
    });
  }, 'Post lane');

  var laneActionResult = el('div', 'vaco-stack-sm');
  var laneClaimForm = VACO.form([
    { name: 'laneId', label: 'Lane id', type: 'number', width: '80px' },
    { name: 'carrierId', label: 'Carrier id', value: VACO.userId() || '', width: '120px' },
  ], function (values) {
    return VACO.post('/api/dedicated-lane/' + values.laneId + '/claim', { carrierId: values.carrierId }).then(function (lane) {
      VACO.mount(laneActionResult, VACO.notice('Lane #' + lane.id + ' claimed by ' + lane.carrierId + '.'));
    });
  }, 'Claim lane');

  var laneReleaseForm = VACO.form([
    { name: 'laneId', label: 'Lane id (yours)', type: 'number', width: '120px' },
  ], function (values) {
    return VACO.post('/api/dedicated-lane/' + values.laneId + '/release', {}).then(function () {
      VACO.mount(laneActionResult, VACO.notice('Lane #' + values.laneId + ' released back to open.'));
    });
  }, 'Release lane');

  out.appendChild(VACO.card('Dedicated Lanes — a carrier’s recurring commitment', [
    laneForm, laneResult, laneClaimForm, laneReleaseForm, laneActionResult,
  ]));

  var spotResult = el('div', 'vaco-stack-sm');
  var spotForm = VACO.form([
    { name: 'originHubId', label: 'Origin hub', type: 'number', width: '90px' },
    { name: 'destinationHubId', label: 'Destination hub', type: 'number', width: '110px' },
    { name: 'payout', label: 'Payout', type: 'number', value: 60, width: '90px' },
  ], function (values) {
    var shipperId = VACO.userId();
    if (!shipperId) throw new Error('Sign in to post a spot load.');
    return VACO.post('/api/spot-load', {
      shipperId: shipperId, originHubId: values.originHubId, destinationHubId: values.destinationHubId,
      payout: values.payout,
    }).then(function (load) {
      VACO.mount(spotResult, VACO.notice('Spot load #' + load.id + ' posted — one-click "Book It Now" for any carrier.'));
    });
  }, 'Post spot load');

  var spotBookResult = el('div', 'vaco-stack-sm');
  var spotBookForm = VACO.form([
    { name: 'loadId', label: 'Load id', type: 'number', width: '80px' },
    { name: 'carrierId', label: 'Carrier id', value: VACO.userId() || '', width: '120px' },
  ], function (values) {
    return VACO.post('/api/spot-load/' + values.loadId + '/book', { carrierId: values.carrierId }).then(function (load) {
      VACO.mount(spotBookResult, VACO.notice('Spot load #' + load.id + ' booked by ' + load.carrierId + '.'));
    });
  }, 'Book It Now');

  out.appendChild(VACO.card('Spot Loads — one-off, one-click "Book It Now"', [
    spotForm, spotResult, spotBookForm, spotBookResult,
  ]));

  // -- VOID Commute -----------------------------------------------------
  var commuteJoinResult = el('div', 'vaco-stack-sm');
  var commuteJoinForm = VACO.form([
    { name: 'batchId', label: 'Batch id', type: 'number', width: '80px' },
    { name: 'pickupLat', label: 'Pickup lat', type: 'number', step: 'any', width: '110px' },
    { name: 'pickupLng', label: 'Pickup lng', type: 'number', step: 'any', width: '110px' },
  ], function (values) {
    var riderId = VACO.userId();
    if (!riderId) throw new Error('Sign in to join a commute batch.');
    return VACO.post('/api/commute-batch/' + values.batchId + '/request', {
      riderId: riderId, pickupLat: values.pickupLat, pickupLng: values.pickupLng,
    }).then(function () {
      VACO.mount(commuteJoinResult, VACO.notice(
        'Joined batch #' + values.batchId + '. The real match runs once, at the batch’s own deadline.'));
    });
  }, 'Join batch');

  var commuteViewResult = el('div', 'vaco-stack-sm');
  var commuteViewForm = VACO.form([
    { name: 'batchId', label: 'Batch id', type: 'number', width: '80px' },
  ], function (values) {
    return VACO.api('/api/commute-batch/' + values.batchId).then(function (batch) {
      var groupsNode = el('div', 'vaco-stack-sm');
      groupsNode.appendChild(el('p', 'vaco-small vaco-dim',
        batch.window + ' window · deadline ' + fmtTime(batch.deadline) + ' · status ' + batch.status));
      if (batch.status === 'accepting') {
        groupsNode.appendChild(el('p', 'vaco-small', batch.requests.length + ' rider(s) waiting for the deadline match.'));
      } else {
        batch.carpoolGroups.forEach(function (group, i) {
          groupsNode.appendChild(el('p', 'vaco-small', 'Carpool ' + (i + 1) + ': '
            + group.map(function (r) { return r.riderId; }).join(', ')));
        });
        if (batch.unmatchedRiders.length) {
          groupsNode.appendChild(el('p', 'vaco-small vaco-dim', 'Backup on-demand guaranteed for: '
            + batch.unmatchedRiders.map(function (r) { return r.riderId; }).join(', ')));
        }
      }
      VACO.mount(commuteViewResult, VACO.card('Batch #' + batch.id, [groupsNode]));
    });
  }, 'View batch');

  out.appendChild(VACO.card('VOID Commute — recurring carpool batches', [
    el('p', 'vaco-small vaco-dim',
      'A batch is opened by VOID’s own scheduler, not from here. Join one you know the id of, or look one up to see how it matched.'),
    commuteJoinForm, commuteJoinResult, commuteViewForm, commuteViewResult,
  ]));

  return VACO.mount(body, out);
}

// A small textarea field, same visual shape as VACO.form's own
// labeled inputs, for the handful of real payloads here that are
// genuinely variable-length arrays (opportunities, stops) rather than
// a fixed set of fields VACO.form's own schema can express.
function textareaField(label, defaultValue) {
  var wrap = el('label', 'vaco-stack-sm');
  wrap.style.gap = '4px';
  wrap.appendChild(el('span', 'vaco-label', label));
  var ta = el('textarea', 'vaco-input');
  ta.value = defaultValue;
  ta.rows = 3;
  ta.style.width = '100%';
  ta.style.fontFamily = 'monospace';
  ta.style.fontSize = 'var(--vaco-text-sm)';
  wrap.appendChild(ta);
  return { wrap: wrap, el: ta };
}

// -- Dispatch: Gibson & Kyle's deterministic rules ------------------------
//
// Neither Gibson nor Kyle exists as an actual AI agent anywhere in
// this app -- dispatchIntelligence.js and sequencing.js are the real,
// testable logic underneath their stated behavior. All had zero
// frontend exposure. Every POST here is requireSession() (any signed-in
// user, no actor match) since these compute a result from the request
// body and read/write no record of their own.
function renderDispatch(body) {
  var out = el('div', 'vaco-stack');
  out.appendChild(VACO.notice(
    'Neither Gibson nor Kyle is a real AI agent &mdash; these are the deterministic rules underneath their stated '
    + 'behavior. Sign in to run the calculators below; they read and change nothing.'));

  function requireSignedIn() {
    if (!VACO.userId()) throw new Error('Sign in to use VOID’s dispatch tools.');
    return VACO.userId();
  }

  // -- Air vs. Ground ---------------------------------------------------
  var airResult = el('div', 'vaco-stack-sm');
  var airForm = VACO.form([
    { name: 'hasGroundCapacity', label: 'Ground capacity heading there?',
      options: [{ label: 'Yes', value: 'true' }, { label: 'No', value: 'false' }] },
    { name: 'estimatedGroundDeliveryHours', label: 'Ground ETA (hrs)', type: 'number', value: 20, width: '110px' },
    { name: 'acceptableWindowHours', label: 'Acceptable window (hrs)', type: 'number', value: 48, width: '140px' },
  ], function (values) {
    requireSignedIn();
    return VACO.post('/api/dispatch/air-vs-ground', {
      hasGroundCapacityHeadingToDestination: values.hasGroundCapacity === 'true',
      estimatedGroundDeliveryHours: values.estimatedGroundDeliveryHours,
      acceptableWindowHours: values.acceptableWindowHours,
    }).then(function (decision) {
      VACO.mount(airResult, VACO.notice(
        'Mode: <strong>' + decision.mode.toUpperCase() + '</strong> — ' + VACO.escapeHtml(decision.reason),
        decision.mode === 'air' ? 'warn' : null));
    });
  }, 'Decide');
  out.appendChild(VACO.card('Air vs. Ground', [airForm, airResult]));

  // -- Load Intelligence -------------------------------------------------
  var loadResult = el('div', 'vaco-stack-sm');
  var loadForm = VACO.form([
    { name: 'passengerCount', label: 'Passengers', type: 'number', value: 2, width: '90px' },
    { name: 'seatingCapacity', label: 'Seats', type: 'number', value: 4, width: '80px' },
    { name: 'cargoVolumeUsed', label: 'Cargo used (ft³)', type: 'number', value: 10, width: '120px' },
    { name: 'cargoCapacity', label: 'Cargo capacity (ft³)', type: 'number', value: 30, width: '140px' },
  ], function (values) {
    requireSignedIn();
    return VACO.post('/api/dispatch/load-intelligence', values).then(function (score) {
      VACO.mount(loadResult, VACO.table([
        { label: 'Utilization', num: true, render: function (s) { return s.utilizationScore + '%'; } },
        { label: 'Seats left', num: true, render: function (s) { return s.availableSeats; } },
        { label: 'Cargo left', num: true, render: function (s) { return s.availableCargoVolume + ' ft³'; } },
        { label: 'Room for more?', render: function (s) {
          return VACO.badge(s.hasCapacityForMoreWork ? 'yes' : 'no', s.hasCapacityForMoreWork ? 'money' : 'warn');
        } },
      ], [score]));
    });
  }, 'Score');
  out.appendChild(VACO.card('Load Intelligence', [loadForm, loadResult]));

  // -- Dead-time recommendation (Kyle) -----------------------------------
  var deadTimeOpps = textareaField('Available opportunities (JSON array)',
    '[\n  {"verticalId":"courier","estimatedDurationMinutes":20,"payout":18},\n'
    + '  {"verticalId":"foodDelivery","estimatedDurationMinutes":15,"payout":12}\n]');
  var deadTimeResult = el('div', 'vaco-stack-sm');
  var certifiedInput = el('input', 'vaco-input');
  certifiedInput.placeholder = 'courier, foodDelivery';
  certifiedInput.style.width = '200px';
  var deadTimeMinutesInput = el('input', 'vaco-input vaco-num');
  deadTimeMinutesInput.type = 'number';
  deadTimeMinutesInput.value = 25;
  deadTimeMinutesInput.style.width = '90px';
  var certifiedWrap = el('label', 'vaco-stack-sm');
  certifiedWrap.style.gap = '4px';
  certifiedWrap.appendChild(el('span', 'vaco-label', 'Certified verticals (comma-separated)'));
  certifiedWrap.appendChild(certifiedInput);
  var minutesWrap = el('label', 'vaco-stack-sm');
  minutesWrap.style.gap = '4px';
  minutesWrap.appendChild(el('span', 'vaco-label', 'Dead-time minutes'));
  minutesWrap.appendChild(deadTimeMinutesInput);
  var deadTimeRow = el('div', 'vaco-row');
  deadTimeRow.appendChild(certifiedWrap);
  deadTimeRow.appendChild(minutesWrap);
  deadTimeRow.appendChild(VACO.button('Recommend', function () {
    requireSignedIn();
    var opportunities;
    try { opportunities = JSON.parse(deadTimeOpps.el.value); } catch (e) { throw new Error('Opportunities must be valid JSON.'); }
    var certified = certifiedInput.value.split(',').map(function (s) { return s.trim(); }).filter(function (s) { return s; });
    return VACO.post('/api/dispatch/dead-time-recommendation', {
      certifiedVerticals: certified,
      deadTimeMinutes: Number(deadTimeMinutesInput.value),
      availableOpportunities: opportunities,
    }).then(function (rec) {
      VACO.mount(deadTimeResult, rec
        ? VACO.notice('Best fit: <strong>' + VACO.escapeHtml(rec.verticalId) + '</strong> — '
          + rec.estimatedDurationMinutes + 'm, pays ' + rec.payout, 'money')
        : VACO.notice('Nothing fits this certification and time window.', 'warn'));
    });
  }, 'primary'));
  out.appendChild(VACO.card('Dead-time Recommendation', [
    el('p', 'vaco-small vaco-dim',
      'Real demand forecasting (V4’s job) is not built here — this filters to what the driver is certified for and what fits the window, then picks the best real payout.'),
    deadTimeOpps.wrap, deadTimeRow, deadTimeResult,
  ]));

  // -- Delivery priority ----------------------------------------------
  var priorityResult = el('div', 'vaco-stack-sm');
  var priorityForm = VACO.form([
    { name: 'orderType', label: 'Order type',
      options: [{ label: 'Food', value: 'food' }, { label: 'General package', value: 'general-package' }] },
  ], function (values) {
    return VACO.api('/api/dispatch/delivery-priority/' + values.orderType).then(function (p) {
      VACO.mount(priorityResult, VACO.notice(
        p.orderType + ' tolerates up to <strong>' + p.maxAcceptableDelayMinutes + ' minutes</strong> of delay.'));
    });
  }, 'Look up');
  out.appendChild(VACO.card('Delivery priority', [priorityForm, priorityResult]));

  // -- Demand smoothing (acceptance delay) -------------------------------
  var delayResult = el('div', 'vaco-stack-sm');
  var delayForm = VACO.form([
    { name: 'currentActiveJobCount', label: 'Active jobs in region', type: 'number', value: 12, width: '150px' },
    { name: 'maxConcurrentJobsPerRegion', label: 'Max concurrent', type: 'number', value: 10, width: '130px' },
  ], function (values) {
    requireSignedIn();
    return VACO.post('/api/dispatch/acceptance-delay', values).then(function (d) {
      VACO.mount(delayResult, d.isSmoothed
        ? VACO.notice('Smoothed: new orders staggered by <strong>' + d.delayMinutes + ' minutes</strong>.', 'warn')
        : VACO.notice('Under capacity — no smoothing applied.'));
    });
  }, 'Compute');
  out.appendChild(VACO.card('Demand smoothing', [delayForm, delayResult]));

  // -- Mixed-transportation sequencing -----------------------------------
  var stopsField = textareaField('Stops (JSON array)',
    '[\n  {"type":"passenger"},\n  {"type":"food"},\n  {"type":"package"}\n]');
  var sequencingResult = el('div', 'vaco-stack-sm');
  var dedicatedSelect = el('select', 'vaco-select');
  [{ label: 'Mixed route', value: 'false' }, { label: 'Dedicated delivery route', value: 'true' }].forEach(function (opt) {
    var o = el('option', null, opt.label);
    o.value = opt.value;
    dedicatedSelect.appendChild(o);
  });
  var dedicatedWrap = el('label', 'vaco-stack-sm');
  dedicatedWrap.style.gap = '4px';
  dedicatedWrap.appendChild(el('span', 'vaco-label', 'Route type'));
  dedicatedWrap.appendChild(dedicatedSelect);
  var sequencingRow = el('div', 'vaco-row');
  sequencingRow.appendChild(dedicatedWrap);
  sequencingRow.appendChild(VACO.button('Sequence', function () {
    requireSignedIn();
    var stops;
    try { stops = JSON.parse(stopsField.el.value); } catch (e) { throw new Error('Stops must be valid JSON.'); }
    return VACO.post('/api/sequencing', {
      stops: stops, isDedicatedDeliveryRoute: dedicatedSelect.value === 'true',
    }).then(function (result) {
      var ranked = result.sequenced.map(function (s, i) { return { rank: i + 1, type: s.type, priority: s.priority }; });
      VACO.mount(sequencingResult, VACO.table([
        { key: 'rank', label: 'Order', num: true },
        { key: 'type', label: 'Type' },
        { key: 'priority', label: 'Priority', num: true },
      ], ranked));
    });
  }, 'primary'));
  out.appendChild(VACO.card('Mixed-transportation sequencing', [
    el('p', 'vaco-small vaco-dim',
      'Food &gt; passenger safety &gt; packages — unless the route is dedicated delivery, where packages hold parity with passenger stops.'),
    stopsField.wrap, sequencingRow, sequencingResult,
  ]));

  return VACO.mount(body, out);
}

// -- Cargo & Loads --------------------------------------------------------
//
// loadManagement.js + cargoPricing.js (CLAUDE.md's "Load/pricing"
// group) had zero frontend exposure: a trip's real passenger/cargo
// declaration, the real capacity-fit check against a vehicle profile,
// and the real dynamic cargo-pricing formula were all API-only.
// Registering a vehicle capacity profile is fleet operations
// (requireCallingService) and stays backend-only; this tab covers the
// rider/customer-declarable half.
function renderCargo(body) {
  var out = el('div', 'vaco-stack');
  out.appendChild(VACO.notice(
    'A trip’s real passenger count, oversized items, and packages — service animals and included bags are '
    + 'never counted toward cargo or fees. Declare a trip, then check it fits the vehicle and what it costs.'));

  // -- Vehicle capacity profile lookup --------------------------------
  var profileResult = el('div', 'vaco-stack-sm');
  var profileForm = VACO.form([
    { name: 'vehicleId', label: 'Vehicle id', placeholder: 'vehicle-1', width: '140px' },
  ], function (values) {
    return VACO.api('/api/vehicle-capacity-profile/' + encodeURIComponent(values.vehicleId)).then(function (p) {
      VACO.mount(profileResult, VACO.table([
        { label: 'Seats', num: true, render: function (r) { return r.seatingCapacity; } },
        { label: 'Cargo (ft³)', num: true, render: function (r) { return r.cargoCapacityCubicFt; } },
        { label: 'Max item (ft³)', num: true, render: function (r) { return r.maxPackageSizeCubicFt; } },
        { label: 'Fold-down seats', render: function (r) { return r.foldDownSeats ? 'yes' : 'no'; } },
        { label: 'Roof rack/hitch', render: function (r) { return r.hasRoofRackOrHitch ? 'yes' : 'no'; } },
      ], [p]));
    });
  }, 'Look up');
  out.appendChild(VACO.card('Vehicle capacity profile', [
    el('p', 'vaco-small vaco-dim', 'Registering a profile is a fleet-operations action; this looks up one already on file.'),
    profileForm, profileResult,
  ]));

  // -- Declare a trip ---------------------------------------------------
  var declareResult = el('div', 'vaco-stack-sm');
  var oversizedField = textareaField('Oversized items (JSON array, optional)', '[]');
  var packagesField = textareaField('Packages (JSON array, optional)', '[]');
  var declareForm = VACO.form([
    { name: 'tripId', label: 'Trip id', value: 'trip-' + Date.now(), width: '150px' },
    { name: 'vehicleId', label: 'Vehicle id', placeholder: 'vehicle-1', width: '120px' },
    { name: 'passengerCount', label: 'Passengers', type: 'number', value: 1, min: 1, width: '90px' },
    { name: 'carSeatsNeeded', label: 'Car seats needed', type: 'number', value: 0, min: 0, width: '130px' },
    { name: 'hasServiceAnimal', label: 'Service animal?',
      options: [{ label: 'No', value: 'false' }, { label: 'Yes', value: 'true' }] },
  ], function (values) {
    var oversizedItems, packages;
    try { oversizedItems = JSON.parse(oversizedField.el.value || '[]'); } catch (e) { throw new Error('Oversized items must be valid JSON.'); }
    try { packages = JSON.parse(packagesField.el.value || '[]'); } catch (e) { throw new Error('Packages must be valid JSON.'); }
    return VACO.post('/api/trip-declaration', {
      tripId: values.tripId, vehicleId: values.vehicleId, passengerCount: values.passengerCount,
      carSeatsNeeded: values.carSeatsNeeded, hasServiceAnimal: values.hasServiceAnimal === 'true',
      oversizedItems: oversizedItems, packages: packages,
    }).then(function (declaration) {
      fitTripInput.value = declaration.tripId;
      VACO.mount(declareResult, VACO.notice(
        'Declared trip <strong>' + VACO.escapeHtml(declaration.tripId) + '</strong> — '
        + declaration.bagsIncluded + ' bag(s) included automatically. Check fit below.', 'money'));
    });
  }, 'Declare trip');
  out.appendChild(VACO.card('Declare a trip', [
    declareForm, oversizedField.wrap, packagesField.wrap, declareResult,
    el('p', 'vaco-small vaco-faint',
      'Example item: {"type":"surfboard","sizeCubicFt":8}. Example package: {"category":"electronics","sizeCubicFt":3,"weightLbs":20}.'),
  ]));

  // -- Capacity fit & cargo pricing --------------------------------------
  var fitResult = el('div', 'vaco-stack-sm');
  var fitTripInput = el('input', 'vaco-input');
  fitTripInput.placeholder = 'trip id';
  fitTripInput.style.width = '160px';
  var fitRow = el('div', 'vaco-row');
  var fitWrap = el('label', 'vaco-stack-sm');
  fitWrap.style.gap = '4px';
  fitWrap.appendChild(el('span', 'vaco-label', 'Trip id'));
  fitWrap.appendChild(fitTripInput);
  fitRow.appendChild(fitWrap);
  fitRow.appendChild(VACO.button('Check capacity fit', function () {
    return VACO.api('/api/capacity-fit/' + encodeURIComponent(fitTripInput.value.trim())).then(function (fit) {
      VACO.mount(fitResult, VACO.notice(
        fit.fits
          ? 'Fits the ' + fit.vehicleId + ' vehicle — ' + fit.totalCargoVolume + 'ft³ used.'
          : 'Does not fit: ' + fit.reasons.join('; '),
        fit.fits ? 'money' : 'danger'));
    });
  }));
  fitRow.appendChild(VACO.button('Cargo pricing', function () {
    return VACO.api('/api/cargo-pricing/' + encodeURIComponent(fitTripInput.value.trim())).then(function (pricing) {
      VACO.mount(fitResult, VACO.table([
        { label: 'Oversized items', num: true, render: function (p) { return p.oversizedItemCount; } },
        { label: 'Total weight (lb)', num: true, render: function (p) { return p.totalWeightLbs; } },
        { label: 'Item fee', num: true, render: function (p) { return VACO.price(p.itemFee, { freeLabel: false }); } },
        { label: 'Weight fee', num: true, render: function (p) { return VACO.price(p.weightFee, { freeLabel: false }); } },
        { label: 'Total fee', num: true, render: function (p) { return VACO.price(p.totalFee, { freeLabel: false }); } },
      ], [pricing]));
    });
  }));
  out.appendChild(VACO.card('Capacity fit & dynamic cargo pricing', [fitRow, fitResult]));

  return VACO.mount(body, out);
}

VACO.app({
  id: 'void',
  name: 'VOID',
  tagline: 'Real-world execution',
  //: VOID's identity: a deep indigo. Logistics at night, and distinct
  //: from every sibling app's hue in the register.
  accent: '#7c85e8',
  accentDim: '#5a63c9',
  accentInk: '#080b14',
  tabs: [
    { id: 'day', label: 'My Day', heading: 'The service day',
      blurb: 'One provider, several verticals, one schedule. Given what you can do, where you are, and when you are free — what does a full day look like?',
      render: renderDay },
    { id: 'services', label: 'Services', heading: '25 service verticals',
      blurb: 'Each its own service app under VOID. One provider pool, one settlement, one safety layer — that is what makes a cross-vertical day possible at all.',
      render: renderServices },
    { id: 'jobs', label: 'Jobs', heading: 'Marketplace',
      blurb: 'Every vertical runs through one request → match → accept → complete → pay → rate loop.',
      render: renderJobs },
    { id: 'network', label: 'Network', heading: 'Stations & airspace',
      render: renderNetwork },
    { id: 'drop', label: 'VOID DROP', heading: 'Mobile space rental & deployment',
      blurb: 'Select a product, book a real physical unit, and watch it move through delivery, deployment, use, and retrieval.',
      render: renderDrop },
    { id: 'scheduling', label: 'Scheduling', heading: 'Reserve, Hourly, Lanes & Commute',
      blurb: 'Four real booking surfaces, one shared engine.',
      render: renderScheduling },
    { id: 'dispatch', label: 'Dispatch', heading: 'Gibson & Kyle, deterministically',
      blurb: 'Air-vs-ground, load intelligence, dead-time recommendations, demand smoothing, and sequencing — the real rules underneath two AI agents that do not exist as agents anywhere in this app.',
      render: renderDispatch },
    { id: 'cargo', label: 'Cargo & Loads', heading: 'Passenger, cargo & load management',
      blurb: 'Declare a trip’s real passengers and cargo, check it fits the vehicle, and see the dynamic cargo fee.',
      render: renderCargo },
    { id: 'academy', label: 'Academy', heading: 'VOID Academy',
      blurb: 'Real training on how VOID actually pays you, chosen from your own claimed skills.',
      render: renderAcademy },
  ],
});
</script>
</body>
</html>
