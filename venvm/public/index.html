<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VENVM</title>
<link rel="stylesheet" href="/vaco-design.css" />
<style>
  .pipeline { display: flex; align-items: center; gap: var(--vaco-space-2); flex-wrap: wrap; }
  .stage {
    padding: var(--vaco-space-2) var(--vaco-space-3);
    border-radius: var(--vaco-radius-pill);
    border: 1px solid var(--vaco-border);
    font-size: var(--vaco-text-xs);
    white-space: nowrap;
  }
  .stage-done { background: var(--vaco-accent-soft); border-color: var(--vaco-accent); color: var(--vaco-accent); }
  .stage-arrow { color: var(--vaco-text-faint); }
  .platform-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: var(--vaco-space-3); }
  .aspect-box { border: 1px solid var(--vaco-border); border-radius: var(--vaco-radius-sm);
                background: var(--vaco-bg-raised); display: flex; align-items: center; justify-content: center;
                color: var(--vaco-text-faint); font-size: var(--vaco-text-xs); }
</style>
</head>
<body class="vaco">
<script src="/vaco-ui.js"></script>
<script>
// VENVM — the AI production and marketing pipeline.
//
// **The most important thing on this page is what it refuses to
// claim.** VENVM models a production process; it does not generate
// media. There is no image, video, or audio generation anywhere in this
// ecosystem. A "generated" script is a recorded request moving through
// real stages, and a reformat returns real target dimensions rather
// than a re-encoded file.
//
// Saying that plainly is the difference between a pipeline tool and a
// demo that implies capabilities nobody built.

var el = VACO.el;
var STAGES = ['script-ready', 'storyboard-ready', 'render-queued', 'rendered'];

function pipeline(current) {
  var row = el('div', 'pipeline');
  var reachedIndex = STAGES.indexOf(current);
  STAGES.forEach(function (stage, i) {
    if (i) row.appendChild(el('span', 'stage-arrow', '→'));
    row.appendChild(el('span', 'stage' + (i <= reachedIndex ? ' stage-done' : ''), stage));
  });
  return row;
}

function renderScripts(body) {
  var out = el('div', 'vaco-stack');
  out.appendChild(VACO.notice(
    '<strong>VENVM cannot generate pixels.</strong> A script request moves through real stages and a production job '
    + 'records real state, but no model produces media here. Anything downstream needs art from elsewhere.', 'warn'));

  // `POST /api/scripts` and `.../generate` are `requireCallingService()`
  // — real internal-scheduler-only routes (their own 403 names the
  // reason), not something a signed-in person's browser session can
  // ever satisfy. Showing a "Request"/"Advance" button here would be a
  // control that always fails, which this ecosystem treats the same as
  // a placeholder video: don't. Scripts are created by whatever
  // internal system calls VENVM on a creator's behalf; this page can
  // only look one up by id.
  out.appendChild(VACO.notice(
    'A script is requested by an internal production system, not from this page — '
    + 'the creation route requires a trusted-service credential, the same boundary V3 holds on money routes. '
    + 'Look one up by id below once you have one.', 'warn'));

  out.appendChild(VACO.card('Look up a script', [
    VACO.form([{ name: 'id', label: 'Script id', type: 'number', min: 1, value: 1, width: '100px' }],
      function (values) {
        return VACO.api('/api/scripts/' + values.id).then(function (s) {
          while (out.childNodes.length > 2) out.removeChild(out.lastChild);
          var lines = el('div', 'vaco-stack-sm');
          lines.appendChild(VACO.badge(s.status));
          lines.appendChild(el('p', 'vaco-small vaco-dim', s.brief || ''));
          if (s.body) lines.appendChild(el('pre', 'vaco-mono vaco-small', s.body));
          out.appendChild(VACO.card('Script ' + values.id, [lines]));
          VACO.mount(body, out);
        });
      }, 'Load'),
  ]));

  return VACO.mount(body, out);
}

function renderReformat(body) {
  var out = el('div', 'vaco-stack');
  out.appendChild(VACO.card('Cross-platform reformat', [
    el('p', 'vaco-small vaco-dim',
      'One source, four platform targets. This returns the real dimensions and safe areas each platform needs — '
      + 'it does not re-encode a file, because there is no media here to re-encode.'),
    VACO.form([
      { name: 'sourceWidth', label: 'Source width', type: 'number', min: 1, value: 1920, width: '110px' },
      { name: 'sourceHeight', label: 'Source height', type: 'number', min: 1, value: 1080, width: '110px' },
    ], function (values) {
      return VACO.post('/api/reformat', values).then(function (result) {
        while (out.childNodes.length > 1) out.removeChild(out.lastChild);
        var targets = result.targets || result.outputs || result;
        var grid = el('div', 'platform-grid');
        Object.keys(targets).forEach(function (platform) {
          var t = targets[platform];
          if (!t || typeof t !== 'object') return;
          var cell = el('div', 'vaco-stack-sm');
          var box = el('div', 'aspect-box');
          // The box is drawn at the real aspect ratio, so a vertical
          // target actually looks vertical.
          box.style.aspectRatio = (t.width || 1) + ' / ' + (t.height || 1);
          box.textContent = t.width + '×' + t.height;
          cell.appendChild(box);
          cell.appendChild(el('span', 'vaco-small', platform));
          if (t.safeAreaPercent) {
            cell.appendChild(el('span', 'vaco-small vaco-faint', 'safe area ' + t.safeAreaPercent + '%'));
          }
          grid.appendChild(cell);
        });
        out.appendChild(VACO.card('Targets', [grid]));
        VACO.mount(body, out);
      });
    }, 'Reformat'),
  ]));
  return VACO.mount(body, out);
}

function renderJobs(body) {
  var out = el('div', 'vaco-stack');

  // Same real boundary as the Scripts tab: creating a job and
  // advancing its stage are `requireCallingService()` routes, run by
  // whatever internal system is actually producing the piece. This
  // page can watch a job, including the real external `videoUrl` once
  // one is genuinely supplied — never a button that advances it.
  out.appendChild(VACO.notice(
    'A production job is created and advanced by the internal system actually producing the piece — '
    + 'this page can only watch one by id.', 'warn'));

  out.appendChild(VACO.card('Track a job', [
    VACO.form([{ name: 'id', label: 'Job id', type: 'number', min: 1, value: 1, width: '90px' }],
      function (values) {
        return VACO.api('/api/production-jobs/' + values.id).then(function (job) {
          while (out.childNodes.length > 1) out.removeChild(out.lastChild);
          var lines = el('div', 'vaco-stack-sm');
          lines.appendChild(pipeline(job.stage));
          lines.appendChild(el('p', 'vaco-small vaco-dim', 'Script ' + job.scriptId));

          // `videoUrl` is real and externally supplied, or it is
          // honestly null — VENVM itself never produces one, so this
          // never renders a placeholder.
          if (job.stage === 'rendered' && job.videoUrl) {
            var video = el('video', null);
            video.src = job.videoUrl;
            video.controls = true;
            video.style.width = '100%';
            lines.appendChild(video);
          } else if (job.stage === 'rendered') {
            lines.appendChild(VACO.notice('Marked rendered with no external videoUrl supplied — nothing to play.', 'warn'));
          } else {
            lines.appendChild(el('p', 'vaco-small vaco-faint',
              'Each stage records real state. VENVM renders nothing itself.'));
          }
          out.appendChild(VACO.card('Job ' + values.id, [lines]));
          VACO.mount(body, out);
        });
      }, 'Track'),
  ]));

  return VACO.mount(body, out);
}

function renderConsent(body) {
  var out = el('div', 'vaco-stack');
  out.appendChild(VACO.notice(
    'Likeness consent is a <strong>hard gate</strong>: using someone’s likeness without a live, unrevoked consent '
    + 'record throws rather than warns. Consent can be revoked at any time, and revocation takes effect immediately.',
    'warn'));

  return VACO.api('/api/consent-scopes').then(function (data) {
    var scopes = data.scopes || data.consentScopes || data || [];
    out.appendChild(VACO.card('Consent scopes', [
      el('p', 'vaco-small vaco-dim', 'What a person can agree to, separately. Consent to one is not consent to all.'),
      VACO.table([{ key: 'scope', label: 'Scope', render: function (s) { return typeof s === 'string' ? s : (s.scope || s.name); } },
                  { key: 'description', label: 'Meaning', render: function (s) { return typeof s === 'string' ? '—' : (s.description || '—'); } }],
        Array.isArray(scopes) ? scopes : [], { empty: 'No scopes defined.' }),
    ]));

    out.appendChild(VACO.card('Grant consent', [
      VACO.form([
        { name: 'subjectId', label: 'Subject', value: VACO.userId() || '', width: '130px' },
        { name: 'grantedToId', label: 'Granted to', placeholder: 'who may use it', width: '150px' },
        { name: 'scope', label: 'Scope', placeholder: 'scope name', width: '140px' },
      ], function (values) {
        return VACO.post('/api/likeness-consents', values)
          .then(function (c) { VACO.toast('Consent ' + c.id + ' recorded.'); VACO.render(); });
      }, 'Grant'),
    ]));

    var userId = VACO.userId();
    if (userId) {
      return VACO.api('/api/likeness-consents?subjectId=' + encodeURIComponent(userId)).then(function (r) {
        var consents = r.consents || [];
        out.appendChild(VACO.card('Your consents', [
          VACO.table([
            { key: 'id', label: 'Id' },
            { key: 'grantedToId', label: 'Granted to' },
            { key: 'scope', label: 'Scope' },
            { label: 'Status', render: function (c) { return VACO.badge(c.revokedAt ? 'revoked' : 'active', c.revokedAt ? undefined : 'money'); } },
            { label: '', render: function (c) {
              if (c.revokedAt) return '';
              return VACO.button('Revoke', function () {
                return VACO.post('/api/likeness-consents/' + c.id + '/revoke', {})
                  .then(function () { VACO.toast('Consent ' + c.id + ' revoked.'); VACO.render(); });
              }, 'sm');
            } },
          ], consents, { empty: 'No consents recorded yet.' }),
        ]));
        VACO.mount(body, out);
      });
    }

    VACO.mount(body, out);
  });
}

VACO.app({
  id: 'venvm',
  name: 'VENVM',
  tagline: 'Production pipeline',
  //: VENVM's identity: a violet-purple, one step warmer than Vault
  //: Studios' electric violet — related, since both are production
  //: tools, without being confusable.
  accent: '#a45ce0',
  accentDim: '#8340bd',
  accentInk: '#12061c',
  tabs: [
    { id: 'scripts', label: 'Scripts', heading: 'Script requests', render: renderScripts },
    { id: 'reformat', label: 'Reformat', heading: 'Cross-platform targets', render: renderReformat },
    { id: 'jobs', label: 'Pipeline', heading: 'Production jobs', render: renderJobs },
    { id: 'consent', label: 'Consent', heading: 'Likeness consent', render: renderConsent },
  ],
});
</script>
</body>
</html>
