<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VENVM</title>
<link rel="stylesheet" href="/vaco-design.css" />
<style>
  .pipeline { display: flex; align-items: center; gap: var(--vaco-space-2); flex-wrap: wrap; }
  .stage {
    padding: var(--vaco-space-2) var(--vaco-space-3);
    border-radius: var(--vaco-radius-pill);
    border: 1px solid var(--vaco-border);
    font-size: var(--vaco-text-xs);
    white-space: nowrap;
  }
  .stage-done { background: var(--vaco-accent-soft); border-color: var(--vaco-accent); color: var(--vaco-accent); }
  .stage-arrow { color: var(--vaco-text-faint); }
  .platform-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: var(--vaco-space-3); }
  .aspect-box { border: 1px solid var(--vaco-border); border-radius: var(--vaco-radius-sm);
                background: var(--vaco-bg-raised); display: flex; align-items: center; justify-content: center;
                color: var(--vaco-text-faint); font-size: var(--vaco-text-xs); }
</style>
</head>
<body class="vaco">
<script src="/vaco-ui.js"></script>
<script>
// VENVM — the AI production and marketing pipeline.
//
// **The most important thing on this page is what it refuses to
// claim.** VENVM models a production process; it does not generate
// media. There is no image, video, or audio generation anywhere in this
// ecosystem. A "generated" script is a recorded request moving through
// real stages, and a reformat returns real target dimensions rather
// than a re-encoded file.
//
// Saying that plainly is the difference between a pipeline tool and a
// demo that implies capabilities nobody built.

var el = VACO.el;
var STAGES = ['script-ready', 'storyboard-ready', 'render-queued', 'rendered'];

function pipeline(current) {
  var row = el('div', 'pipeline');
  var reachedIndex = STAGES.indexOf(current);
  STAGES.forEach(function (stage, i) {
    if (i) row.appendChild(el('span', 'stage-arrow', '→'));
    row.appendChild(el('span', 'stage' + (i <= reachedIndex ? ' stage-done' : ''), stage));
  });
  return row;
}

function renderScripts(body) {
  var out = el('div', 'vaco-stack');
  out.appendChild(VACO.notice(
    '<strong>VENVM cannot generate pixels.</strong> A script request moves through real stages and a production job '
    + 'records real state, but no model produces media here. Anything downstream needs art from elsewhere.', 'warn'));

  // `POST /api/scripts` and `.../generate` are `requireCallingService()`
  // — real internal-scheduler-only routes (their own 403 names the
  // reason), not something a signed-in person's browser session can
  // ever satisfy. Showing a "Request"/"Advance" button here would be a
  // control that always fails, which this ecosystem treats the same as
  // a placeholder video: don't. Scripts are created by whatever
  // internal system calls VENVM on a creator's behalf; this page can
  // only look one up by id.
  out.appendChild(VACO.notice(
    'A script is requested by an internal production system, not from this page — '
    + 'the creation route requires a trusted-service credential, the same boundary V3 holds on money routes. '
    + 'Look one up by id below once you have one.', 'warn'));

  out.appendChild(VACO.card('Look up a script', [
    VACO.form([{ name: 'id', label: 'Script id', type: 'number', min: 1, value: 1, width: '100px' }],
      function (values) {
        return VACO.api('/api/scripts/' + values.id).then(function (s) {
          while (out.childNodes.length > 2) out.removeChild(out.lastChild);
          var lines = el('div', 'vaco-stack-sm');
          lines.appendChild(VACO.badge(s.status));
          lines.appendChild(el('p', 'vaco-small vaco-dim', s.brief || ''));
          if (s.body) lines.appendChild(el('pre', 'vaco-mono vaco-small', s.body));
          out.appendChild(VACO.card('Script ' + values.id, [lines]));
          VACO.mount(body, out);
        });
      }, 'Load'),
  ]));

  return VACO.mount(body, out);
}

function renderReformat(body) {
  var out = el('div', 'vaco-stack');
  out.appendChild(VACO.card('Cross-platform reformat', [
    el('p', 'vaco-small vaco-dim',
      'One source, four platform targets. This returns the real dimensions and safe areas each platform needs — '
      + 'it does not re-encode a file, because there is no media here to re-encode.'),
    VACO.form([
      { name: 'sourceWidth', label: 'Source width', type: 'number', min: 1, value: 1920, width: '110px' },
      { name: 'sourceHeight', label: 'Source height', type: 'number', min: 1, value: 1080, width: '110px' },
    ], function (values) {
      return VACO.post('/api/reformat', values).then(function (result) {
        while (out.childNodes.length > 1) out.removeChild(out.lastChild);
        var targets = result.targets || result.outputs || result;
        var grid = el('div', 'platform-grid');
        Object.keys(targets).forEach(function (platform) {
          var t = targets[platform];
          if (!t || typeof t !== 'object') return;
          var cell = el('div', 'vaco-stack-sm');
          var box = el('div', 'aspect-box');
          // The box is drawn at the real aspect ratio, so a vertical
          // target actually looks vertical.
          box.style.aspectRatio = (t.width || 1) + ' / ' + (t.height || 1);
          box.textContent = t.width + '×' + t.height;
          cell.appendChild(box);
          cell.appendChild(el('span', 'vaco-small', platform));
          if (t.safeAreaPercent) {
            cell.appendChild(el('span', 'vaco-small vaco-faint', 'safe area ' + t.safeAreaPercent + '%'));
          }
          grid.appendChild(cell);
        });
        out.appendChild(VACO.card('Targets', [grid]));
        VACO.mount(body, out);
      });
    }, 'Reformat'),
  ]));
  return VACO.mount(body, out);
}

function renderJobs(body) {
  var out = el('div', 'vaco-stack');

  // Same real boundary as the Scripts tab: creating a job and
  // advancing its stage are `requireCallingService()` routes, run by
  // whatever internal system is actually producing the piece. This
  // page can watch a job, including the real external `videoUrl` once
  // one is genuinely supplied — never a button that advances it.
  out.appendChild(VACO.notice(
    'A production job is created and advanced by the internal system actually producing the piece — '
    + 'this page can only watch one by id.', 'warn'));

  out.appendChild(VACO.card('Track a job', [
    VACO.form([{ name: 'id', label: 'Job id', type: 'number', min: 1, value: 1, width: '90px' }],
      function (values) {
        return VACO.api('/api/production-jobs/' + values.id).then(function (job) {
          while (out.childNodes.length > 1) out.removeChild(out.lastChild);
          var lines = el('div', 'vaco-stack-sm');
          lines.appendChild(pipeline(job.stage));
          lines.appendChild(el('p', 'vaco-small vaco-dim', 'Script ' + job.scriptId));

          // `videoUrl` is real and externally supplied, or it is
          // honestly null — VENVM itself never produces one, so this
          // never renders a placeholder.
          if (job.stage === 'rendered' && job.videoUrl) {
            var video = el('video', null);
            video.src = job.videoUrl;
            video.controls = true;
            video.style.width = '100%';
            lines.appendChild(video);
          } else if (job.stage === 'rendered') {
            lines.appendChild(VACO.notice('Marked rendered with no external videoUrl supplied — nothing to play.', 'warn'));
          } else {
            lines.appendChild(el('p', 'vaco-small vaco-faint',
              'Each stage records real state. VENVM renders nothing itself.'));
          }
          out.appendChild(VACO.card('Job ' + values.id, [lines]));
          VACO.mount(body, out);
        });
      }, 'Track'),
  ]));

  return VACO.mount(body, out);
}

function renderConsent(body) {
  var out = el('div', 'vaco-stack');
  out.appendChild(VACO.notice(
    'Likeness consent is a <strong>hard gate</strong>: using someone’s likeness without a live, unrevoked consent '
    + 'record throws rather than warns. Consent can be revoked at any time, and revocation takes effect immediately.',
    'warn'));

  return VACO.api('/api/consent-scopes').then(function (data) {
    var scopes = data.scopes || data.consentScopes || data || [];
    out.appendChild(VACO.card('Consent scopes', [
      el('p', 'vaco-small vaco-dim', 'What a person can agree to, separately. Consent to one is not consent to all.'),
      VACO.table([{ key: 'scope', label: 'Scope', render: function (s) { return typeof s === 'string' ? s : (s.scope || s.name); } },
                  { key: 'description', label: 'Meaning', render: function (s) { return typeof s === 'string' ? '—' : (s.description || '—'); } }],
        Array.isArray(scopes) ? scopes : [], { empty: 'No scopes defined.' }),
    ]));

    out.appendChild(VACO.card('Grant consent', [
      VACO.form([
        { name: 'subjectId', label: 'Subject', value: VACO.userId() || '', width: '130px' },
        { name: 'grantedToId', label: 'Granted to', placeholder: 'who may use it', width: '150px' },
        { name: 'scope', label: 'Scope', placeholder: 'scope name', width: '140px' },
      ], function (values) {
        return VACO.post('/api/likeness-consents', values)
          .then(function (c) { VACO.toast('Consent ' + c.id + ' recorded.'); VACO.render(); });
      }, 'Grant'),
    ]));

    var userId = VACO.userId();
    if (userId) {
      return VACO.api('/api/likeness-consents?subjectId=' + encodeURIComponent(userId)).then(function (r) {
        var consents = r.consents || [];
        out.appendChild(VACO.card('Your consents', [
          VACO.table([
            { key: 'id', label: 'Id' },
            { key: 'grantedToId', label: 'Granted to' },
            { key: 'scope', label: 'Scope' },
            { label: 'Status', render: function (c) { return VACO.badge(c.revokedAt ? 'revoked' : 'active', c.revokedAt ? undefined : 'money'); } },
            { label: '', render: function (c) {
              if (c.revokedAt) return '';
              return VACO.button('Revoke', function () {
                return VACO.post('/api/likeness-consents/' + c.id + '/revoke', {})
                  .then(function () { VACO.toast('Consent ' + c.id + ' revoked.'); VACO.render(); });
              }, 'sm');
            } },
          ], consents, { empty: 'No consents recorded yet.' }),
        ]));
        VACO.mount(body, out);
      });
    }

    VACO.mount(body, out);
  });
}

// Growth Programs: referrals, ambassador tiers, and growth missions
// (`lib/growthPrograms.js`, mounted under `/api/growth/...`). Unlike
// Scripts/Jobs/Marketing below, two of these routes genuinely are
// reachable from a signed-in person's own session —
// `POST /api/growth/referral-codes` and `POST /api/growth/referrals`
// are `requireActor('ambassadorId')`/`requireActor('referredId')`, the
// same "you may only act as yourself" shape `likeness-consents` above
// already uses — an ambassador creates their own code, and a new
// recruit records their own referral. Converting and rewarding a
// referral are operational facts an app observed (a real purchase, a
// real published video), gated `requireCallingService()`, so those
// stay real backend capabilities with no control here, same posture as
// every other trusted-service-only route on this page.
function renderGrowth(body) {
  var out = el('div', 'vaco-stack');
  out.appendChild(VACO.notice(
    'A referral code is created by the ambassador themselves, and a referral is recorded by the new recruit themselves — '
    + 'both real actions this session can take as the signed-in user. <strong>Converting and rewarding a referral are '
    + 'operational facts an app observed</strong> (a real purchase, a real published video) — a trusted-service credential '
    + 'this page has no login for records those, never the ambassador’s or recruit’s own say about themselves.',
    'warn'));

  return VACO.api('/api/health').then(function (health) {
    var missionKeys = health.growthMissions || [];
    var tiers = health.ambassadorTiers || [];

    out.appendChild(VACO.card('Ambassador tiers', [
      el('p', 'vaco-small vaco-dim', 'Real, named tiers, thresholded on real converted referrals (not raw signups).'),
      VACO.table([
        { key: 'tier', label: 'Tier' },
        { key: 'minConverted', label: 'Min converted', num: true },
      ], tiers, { empty: 'No tiers defined.' }),
    ]));

    out.appendChild(VACO.card('Create your referral code', [
      VACO.form([{ name: 'ambassadorId', label: 'Ambassador (you)', value: VACO.userId() || '', width: '150px' }],
        function (values) {
          return VACO.post('/api/growth/referral-codes', values).then(function (entry) {
            VACO.toast('Code ' + entry.code + ' created for ' + entry.ambassadorId + '.');
          });
        }, 'Create code'),
    ]));

    var codeResult = el('div', 'vaco-stack-sm');
    out.appendChild(VACO.card('Look up a referral code', [
      VACO.form([{ name: 'code', label: 'Code', placeholder: 'e.g. ABC12345-1', width: '170px' }],
        function (values) {
          return VACO.api('/api/growth/referral-codes/' + encodeURIComponent(values.code)).then(function (entry) {
            VACO.mount(codeResult, el('p', 'vaco-small vaco-dim',
              'Ambassador ' + entry.ambassadorId + ', created ' + new Date(entry.createdAt).toLocaleString() + '.'));
          });
        }, 'Look up'),
      codeResult,
    ]));

    out.appendChild(VACO.card('Record a referral', [
      el('p', 'vaco-small vaco-dim', 'Your own real signup against someone’s code — the new recruit’s own claim, not the ambassador’s.'),
      VACO.form([
        { name: 'code', label: 'Their code', placeholder: 'ambassador’s code', width: '150px' },
        { name: 'referredId', label: 'You (referredId)', value: VACO.userId() || '', width: '140px' },
        { name: 'referralType', label: 'Type', options: [
          { label: 'user', value: 'user' }, { label: 'creator', value: 'creator' }, { label: 'business', value: 'business' },
        ], width: '110px' },
      ], function (values) {
        return VACO.post('/api/growth/referrals', values).then(function (referral) {
          VACO.toast('Referral ' + referral.id + ' recorded — status ' + referral.status + '.');
        });
      }, 'Record'),
    ]));

    var referralResult = el('div', 'vaco-stack-sm');
    out.appendChild(VACO.card('Look up a referral', [
      VACO.form([{ name: 'id', label: 'Referral id', type: 'number', min: 1, value: 1, width: '110px' }],
        function (values) {
          return VACO.api('/api/growth/referrals/' + values.id).then(function (referral) {
            var lines = el('div', 'vaco-stack-sm');
            lines.appendChild(VACO.badge(referral.status));
            lines.appendChild(el('p', 'vaco-small vaco-dim',
              referral.ambassadorId + ' → ' + referral.referredId + ' (' + referral.referralType + ')'));
            if (referral.rewardAmount) lines.appendChild(el('p', 'vaco-small', 'Reward: ' + VACO.round(referral.rewardAmount)));
            VACO.mount(referralResult, lines);
          });
        }, 'Look up'),
      referralResult,
    ]));

    var userId = VACO.userId();
    var afterScorecard = Promise.resolve();
    if (userId) {
      afterScorecard = VACO.api('/api/growth/ambassadors/' + encodeURIComponent(userId) + '/scorecard').then(function (sc) {
        out.appendChild(VACO.card('Your ambassador scorecard', [
          VACO.badge(sc.tier),
          el('p', 'vaco-small vaco-dim',
            'Total referrals ' + sc.totalReferrals + ' — pending ' + sc.byStatus.pending
            + ', converted ' + sc.byStatus.converted + ', rewarded ' + sc.byStatus.rewarded
            + (sc.conversionRate !== null ? ' (conversion rate ' + sc.conversionRate + ')' : '')),
          el('p', 'vaco-small vaco-dim', 'Reward earned so far: ' + VACO.round(sc.totalRewardEarned)),
        ]));
      });
    }

    return afterScorecard.then(function () {
      var missionResult = el('div', 'vaco-stack-sm');
      out.appendChild(VACO.card('Check a growth mission', [
        VACO.form([
          { name: 'ambassadorId', label: 'Ambassador', value: userId || '', width: '140px' },
          { name: 'missionKey', label: 'Mission', options: missionKeys.map(function (k) { return { label: k, value: k }; }), width: '200px' },
        ], function (values) {
          return VACO.api('/api/growth/ambassadors/' + encodeURIComponent(values.ambassadorId)
            + '/missions/' + encodeURIComponent(values.missionKey)).then(function (progress) {
            var lines = el('div', 'vaco-stack-sm');
            lines.appendChild(el('p', 'vaco-small', progress.label));
            lines.appendChild(VACO.badge(progress.complete ? 'completed' : 'pending'));
            lines.appendChild(el('p', 'vaco-small vaco-dim', progress.currentCount + ' / ' + progress.requiredCount));
            VACO.mount(missionResult, lines);
          });
        }, 'Check'),
        missionResult,
      ]));
      return VACO.mount(body, out);
    });
  });
}

// Marketing/Campaign Dashboards (task #59) — lib/brandManagement.js,
// campaigns.js, assetLibrary.js, mounted under /api/marketing/...
// Every mutating route here (createBrand, createCampaign,
// catalogAsset, recordSpend, updateCampaignStatus, ...) is
// `requireCallingService()` — real internal marketing-tooling routes
// with no end-consumer session that owns a brand or campaign, the same
// boundary Scripts/Jobs already hold above. This page can only look
// things up, same posture, never a fake "admin" control pretending to
// hold a service credential it doesn't have.
function renderBrands(body) {
  var out = el('div', 'vaco-stack');
  out.appendChild(VACO.notice(
    'Brands, campaigns, and assets are created by whatever internal marketing system is actually running a brand’s '
    + 'account — those routes require a trusted-service credential, the same boundary Scripts and Pipeline hold above. '
    + 'This page can look things up.', 'warn'));

  function renderDashboardBody(dash) {
    var box = el('div', 'vaco-stack-sm');
    box.appendChild(el('p', 'vaco-small vaco-dim',
      'Total spend ' + VACO.round(dash.totalSpend) + ' · ' + dash.assetCount + ' catalogued asset(s)'));
    box.appendChild(VACO.table([
      { key: 'id', label: 'Id' },
      { key: 'name', label: 'Campaign' },
      { label: 'Status', render: function (c) { return VACO.badge(c.status); } },
      { label: 'Spend', num: true, render: function (c) { return VACO.round(c.spend); } },
      { label: 'Remaining', num: true, render: function (c) { return c.remainingBudget === null ? 'unbudgeted' : VACO.round(c.remainingBudget); } },
    ], dash.campaigns, { empty: 'No campaigns yet.' }));
    if (dash.upcomingContent && dash.upcomingContent.length) {
      box.appendChild(el('p', 'vaco-small vaco-dim', 'Upcoming content:'));
      box.appendChild(VACO.table([
        { key: 'id', label: 'Id' },
        { key: 'platform', label: 'Platform' },
        { label: 'When', render: function (e) { return new Date(e.scheduledAt).toLocaleString(); } },
      ], dash.upcomingContent, { empty: 'Nothing scheduled.' }));
    }
    if (dash.launches && dash.launches.length) {
      box.appendChild(el('p', 'vaco-small vaco-dim', 'Launch readiness:'));
      dash.launches.forEach(function (l) {
        box.appendChild(el('p', 'vaco-small', 'Launch ' + l.launchId + ': ' + l.completedMilestones + '/' + l.totalMilestones
          + ' milestones (' + Math.round(l.readiness * 100) + '%)' + (l.ready ? ' — ready' : '')));
      });
    }
    var a = dash.analytics;
    box.appendChild(el('p', 'vaco-small vaco-faint',
      'Analytics: ' + a.totalEvents + ' event(s) tracked'
      + (a.clickThroughRate !== null ? ', CTR ' + a.clickThroughRate : '')));
    return box;
  }

  var browseResult = el('div', 'vaco-stack-sm');
  out.appendChild(VACO.card('Browse brands', [
    VACO.form([{ name: 'ownerApp', label: 'Owner app (optional)', placeholder: 'e.g. dreams', width: '150px' }],
      function (values) {
        var path = '/api/marketing/brands' + (values.ownerApp ? '?ownerApp=' + encodeURIComponent(values.ownerApp) : '');
        return VACO.api(path).then(function (r) {
          VACO.mount(browseResult, VACO.table([
            { key: 'id', label: 'Id' },
            { key: 'name', label: 'Name' },
            { key: 'ownerApp', label: 'Owner app' },
          ], r.brands || [], { empty: 'No brands recorded yet.' }));
        });
      }, 'Browse'),
    browseResult,
  ]));

  var brandResult = el('div', 'vaco-stack-sm');
  out.appendChild(VACO.card('Brand detail & dashboard', [
    el('p', 'vaco-small vaco-dim', 'The real, unified Marketing Dashboard rollup — one brand’s campaigns, spend, upcoming content, launch readiness, and analytics, assembled from already-real calls.'),
    VACO.form([{ name: 'id', label: 'Brand id', type: 'number', min: 1, value: 1, width: '100px' }],
      function (values) {
        return VACO.api('/api/marketing/brands/' + values.id).then(function (brand) {
          return VACO.api('/api/marketing/brands/' + values.id + '/dashboard').then(function (dash) {
            var box = el('div', 'vaco-stack-sm');
            box.appendChild(VACO.badge(brand.ownerApp));
            box.appendChild(el('p', 'vaco-small vaco-dim', brand.voice || 'No voice guidelines recorded.'));
            box.appendChild(renderDashboardBody(dash));
            VACO.mount(brandResult, box);
          });
        });
      }, 'Load'),
    brandResult,
  ]));

  var brandCampaignsResult = el('div', 'vaco-stack-sm');
  out.appendChild(VACO.card('Campaigns for a brand', [
    VACO.form([{ name: 'brandId', label: 'Brand id', type: 'number', min: 1, value: 1, width: '100px' }],
      function (values) {
        return VACO.api('/api/marketing/brands/' + values.brandId + '/campaigns').then(function (r) {
          VACO.mount(brandCampaignsResult, VACO.table([
            { key: 'id', label: 'Id' },
            { key: 'name', label: 'Name' },
            { label: 'Status', render: function (c) { return VACO.badge(c.status); } },
            { label: 'Budget', num: true, render: function (c) { return c.budget === null ? 'unbudgeted' : VACO.round(c.budget); } },
          ], r.campaigns || [], { empty: 'No campaigns for this brand yet.' }));
        });
      }, 'List'),
    brandCampaignsResult,
  ]));

  var campaignResult = el('div', 'vaco-stack-sm');
  out.appendChild(VACO.card('Campaign detail & dashboard', [
    el('p', 'vaco-small vaco-dim', 'The real Campaign Dashboard rollup — this campaign’s spend/remaining budget, every real ad with performance, catalogued assets, and any A/B test scoped to it.'),
    VACO.form([{ name: 'id', label: 'Campaign id', type: 'number', min: 1, value: 1, width: '100px' }],
      function (values) {
        return VACO.api('/api/marketing/campaigns/' + values.id).then(function (campaign) {
          return VACO.api('/api/marketing/campaigns/' + values.id + '/dashboard').then(function (dash) {
            var box = el('div', 'vaco-stack-sm');
            box.appendChild(VACO.badge(campaign.status));
            box.appendChild(el('p', 'vaco-small vaco-dim',
              'Spend ' + VACO.round(dash.spend) + ' · remaining '
              + (dash.remainingBudget === null ? 'unbudgeted' : VACO.round(dash.remainingBudget))));
            box.appendChild(VACO.table([
              { key: 'id', label: 'Ad id' },
              { key: 'platform', label: 'Platform' },
              { label: 'CTR', num: true, render: function (a) { return a.performance.ctr === null ? '—' : a.performance.ctr; } },
              { label: 'CPA', num: true, render: function (a) { return a.performance.cpa === null ? '—' : VACO.round(a.performance.cpa); } },
            ], dash.ads || [], { empty: 'No ads under this campaign yet.' }));
            if (dash.abTests && dash.abTests.length) {
              box.appendChild(el('p', 'vaco-small vaco-dim', 'A/B tests:'));
              dash.abTests.forEach(function (t) {
                box.appendChild(el('p', 'vaco-small', 'Test ' + t.testId + ': leading variant '
                  + (t.leadingVariant || 'not enough samples yet')));
              });
            }
            VACO.mount(campaignResult, box);
          });
        });
      }, 'Load'),
    campaignResult,
  ]));

  var assetsResult = el('div', 'vaco-stack-sm');
  out.appendChild(VACO.card('Assets for a brand', [
    el('p', 'vaco-small vaco-dim', 'The real asset-library join: which script/production-job/external url belongs to this brand, and where it has been reused.'),
    VACO.form([{ name: 'brandId', label: 'Brand id', type: 'number', min: 1, value: 1, width: '100px' }],
      function (values) {
        return VACO.api('/api/marketing/brands/' + values.brandId + '/assets').then(function (r) {
          VACO.mount(assetsResult, VACO.table([
            { key: 'id', label: 'Id' },
            { key: 'assetType', label: 'Type' },
            { label: 'Consuming app', render: function (a) { return a.consumingApp || '—'; } },
            { label: 'Reused', num: true, render: function (a) { return (a.reusedIn || []).length; } },
          ], r.assets || [], { empty: 'No assets catalogued for this brand yet.' }));
        });
      }, 'List'),
    assetsResult,
  ]));

  var assetResult = el('div', 'vaco-stack-sm');
  out.appendChild(VACO.card('Look up an asset', [
    VACO.form([{ name: 'id', label: 'Asset id', type: 'number', min: 1, value: 1, width: '100px' }],
      function (values) {
        return VACO.api('/api/marketing/assets/' + values.id).then(function (asset) {
          var box = el('div', 'vaco-stack-sm');
          box.appendChild(VACO.badge(asset.assetType));
          box.appendChild(el('p', 'vaco-small vaco-dim', asset.url || 'No external url recorded.'));
          box.appendChild(el('p', 'vaco-small vaco-faint', 'Reused ' + (asset.reusedIn || []).length + ' time(s).'));
          VACO.mount(assetResult, box);
        });
      }, 'Look up'),
    assetResult,
  ]));

  return VACO.mount(body, out);
}

VACO.app({
  id: 'venvm',
  name: 'VENVM',
  tagline: 'Production pipeline',
  //: VENVM's identity: a violet-purple, one step warmer than Vault
  //: Studios' electric violet — related, since both are production
  //: tools, without being confusable.
  accent: '#a45ce0',
  accentDim: '#8340bd',
  accentInk: '#12061c',
  tabs: [
    { id: 'scripts', label: 'Scripts', heading: 'Script requests', render: renderScripts },
    { id: 'reformat', label: 'Reformat', heading: 'Cross-platform targets', render: renderReformat },
    { id: 'jobs', label: 'Pipeline', heading: 'Production jobs', render: renderJobs },
    { id: 'consent', label: 'Consent', heading: 'Likeness consent', render: renderConsent },
    { id: 'growth', label: 'Growth', heading: 'Growth programs', render: renderGrowth },
    { id: 'brands', label: 'Brands', heading: 'Brands & campaigns', render: renderBrands },
  ],
});
</script>
</body>
</html>
