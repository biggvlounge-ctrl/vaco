<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VXLLAGE</title>
<link rel="stylesheet" href="/vaco-design.css" />
<style>
  .post { display: flex; flex-direction: column; gap: var(--vaco-space-2); }
  .post-head { display: flex; align-items: baseline; gap: var(--vaco-space-2); }
  .post-author { font-weight: var(--vaco-weight-bold); }
  .post-body { white-space: pre-wrap; }
  .feed { max-width: 640px; display: flex; flex-direction: column; gap: var(--vaco-space-3); }
  .cosmetic-swatch {
    height: 72px; border-radius: var(--vaco-radius-sm);
    background: radial-gradient(circle at 40% 35%, var(--vaco-accent-soft), transparent 65%), var(--vaco-bg-raised);
    border: 1px solid var(--vaco-border-subtle);
  }
</style>
</head>
<body class="vaco">
<script src="/vaco-ui.js"></script>
<script>
// VXLLAGE — home feed, threads, villages, and the avatar cosmetic shop.
//
// Real client of VXLLAGE's own 64 routes. Feed ranking, boost levels,
// and cosmetic pricing are all server-decided; this renders them.

var el = VACO.el;

function fmtWhen(ts) {
  if (!ts) return '';
  var mins = Math.round((Date.now() - ts) / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + 'm ago';
  if (mins < 1440) return Math.round(mins / 60) + 'h ago';
  return new Date(ts).toLocaleDateString();
}

function fmtDate(ts) {
  if (!ts) return '—';
  return new Date(ts).toLocaleString();
}

// `opts.viewerId` drives real like/repost toggles (lib/posts.js's own
// `likedBy`/`repostedBy` arrays, not a decorative count) and a
// `Thread` toggle that opens the real recursive reply tree
// (GET /api/posts/:id/thread) plus a real reply composer, in place --
// closing the prototype's own flagged "reply/repost/share buttons --
// no action" gap. `opts.hideThread` suppresses the toggle for a
// postCard already rendered *inside* a thread node, so a reply's own
// card doesn't grow a second, redundant thread control.
function postCard(post, opts) {
  var options = opts || {};
  var viewerId = options.viewerId || null;

  var card = el('div', 'vaco-card post');
  var head = el('div', 'post-head');
  head.appendChild(el('span', 'post-author', post.authorId || post.userId || 'someone'));
  head.appendChild(el('span', 'vaco-small vaco-faint', fmtWhen(post.createdAt)));
  head.appendChild(el('span', 'vaco-spacer'));
  if (post.villageId) head.appendChild(VACO.badge('village ' + post.villageId));
  card.appendChild(head);
  card.appendChild(el('p', 'post-body', post.body || post.text || post.content || ''));

  var likedBy = post.likedBy || [];
  var repostedBy = post.repostedBy || [];

  var actions = el('div', 'vaco-row-tight');
  actions.appendChild(el('span', 'vaco-small vaco-dim', likedBy.length + (likedBy.length === 1 ? ' like' : ' likes')));
  actions.appendChild(el('span', 'vaco-small vaco-dim', repostedBy.length + (repostedBy.length === 1 ? ' repost' : ' reposts')));

  if (viewerId) {
    var liked = likedBy.indexOf(viewerId) !== -1;
    actions.appendChild(VACO.button(liked ? 'Unlike' : 'Like', function () {
      var path = '/api/posts/' + post.id + (liked ? '/unlike' : '/like');
      return VACO.post(path, { userId: viewerId })
        .then(function () { VACO.toast(liked ? 'Unliked.' : 'Liked.'); VACO.render(); });
    }, liked ? 'ghost' : undefined));

    var reposted = repostedBy.indexOf(viewerId) !== -1;
    actions.appendChild(VACO.button(reposted ? 'Unrepost' : 'Repost', function () {
      var path = '/api/posts/' + post.id + (reposted ? '/unrepost' : '/repost');
      return VACO.post(path, { userId: viewerId })
        .then(function () { VACO.toast(reposted ? 'Removed repost.' : 'Reposted.'); VACO.render(); });
    }, reposted ? 'ghost' : undefined));
  }

  var threadHost = null;
  if (!options.hideThread) {
    threadHost = el('div', 'vaco-stack-sm');
    var loaded = false;
    var threadBtn = VACO.button('Thread', function () {
      if (loaded) {
        VACO.mount(threadHost, []);
        loaded = false;
        threadBtn.textContent = 'Thread';
        return;
      }
      return loadThread(threadHost, post.id, viewerId).then(function () {
        loaded = true;
        threadBtn.textContent = 'Hide thread';
      });
    }, 'ghost');
    actions.appendChild(threadBtn);
  }

  card.appendChild(actions);
  if (threadHost) card.appendChild(threadHost);
  return card;
}

// Real, recursive reply-tree rendering over GET /api/posts/:id/thread's
// own `{post, replies: [...]}` shape, plus a real reply composer at
// every node (`createPost({replyToPostId})`) -- the prototype's own
// flagged "reply... no action" gap, closed in place rather than as a
// separate screen.
function renderThreadNode(node, depth, viewerId, onChange) {
  var wrap = el('div', 'vaco-stack-sm');
  if (depth > 0) wrap.style.marginLeft = (depth * 16) + 'px';
  wrap.appendChild(postCard(node.post, { viewerId: viewerId, hideThread: true }));

  if (viewerId) {
    wrap.appendChild(VACO.form([
      { name: 'text', label: 'Reply', placeholder: 'write a reply', width: '260px' },
    ], function (values) {
      return VACO.post('/api/posts', { authorId: viewerId, text: values.text, replyToPostId: node.post.id })
        .then(function () { VACO.toast('Reply posted.'); return onChange(); });
    }, 'Reply'));
  }

  (node.replies || []).forEach(function (child) {
    wrap.appendChild(renderThreadNode(child, depth + 1, viewerId, onChange));
  });
  return wrap;
}

function loadThread(host, postId, viewerId) {
  return VACO.api('/api/posts/' + postId + '/thread').then(function (thread) {
    function refresh() { return loadThread(host, postId, viewerId); }
    VACO.mount(host, renderThreadNode(thread, 0, viewerId, refresh));
  });
}

// -- Feed -------------------------------------------------------------

function renderFeed(body) {
  var out = el('div', 'vaco-stack');

  out.appendChild(VACO.card('Post', [
    VACO.form([
      { name: 'text', label: 'Say something', placeholder: 'what is happening', width: '380px' },
    ], function (values) {
      if (!VACO.userId()) throw new Error('Sign in to post.');
      return VACO.post('/api/posts', { authorId: VACO.userId(), text: values.text })
        .then(function () { VACO.toast('Posted.'); VACO.render(); });
    }, 'Post'),
  ]));

  var id = VACO.userId();
  if (!id) {
    out.appendChild(el('div', 'vaco-empty', 'Sign in to see your feed.'));
    return VACO.mount(body, out);
  }

  // "For you" and "Following" are genuinely different rankings on the
  // server, so both are offered rather than one being relabelled.
  return Promise.all([
    VACO.api('/api/feed/for-you/' + encodeURIComponent(id)).catch(function () { return { posts: [] }; }),
    VACO.api('/api/feed/following/' + encodeURIComponent(id)).catch(function () { return { posts: [] }; }),
  ]).then(function (results) {
    var forYou = results[0].feed || results[0].posts || results[0] || [];
    var following = results[1].feed || results[1].posts || results[1] || [];

    var feed = el('div', 'feed');
    (forYou.length ? forYou : following).forEach(function (p) { feed.appendChild(postCard(p, { viewerId: id })); });
    if (!feed.childNodes.length) {
      feed.appendChild(el('div', 'vaco-empty', 'Nothing in the feed yet — post above, or follow someone.'));
    }
    out.appendChild(VACO.card('For you — ' + forYou.length + ' · following ' + following.length, [feed]));
    VACO.mount(body, out);
  });
}

// -- Profile ------------------------------------------------------------
//
// Closes profiles.js/follows.js's own gap: a real computed profile
// (post/following/follower counts, authored posts) plus the real
// follow graph behind the Feed tab's own For You/Following split —
// neither had any frontend surface before this.

function renderProfile(body) {
  var out = el('div', 'vaco-stack');
  var defaultId = VACO.userId() || '';

  out.appendChild(VACO.card('Open a profile', [
    VACO.form([
      { name: 'userId', label: 'User id', placeholder: 'alice', width: '160px', value: defaultId },
    ], function (values) {
      return loadProfile(out, body, values.userId);
    }, 'Load'),
  ]));

  if (defaultId) return loadProfile(out, body, defaultId);
  out.appendChild(el('div', 'vaco-empty', 'Enter a user id above — sign in to load and manage your own.'));
  return VACO.mount(body, out);
}

function loadProfile(out, body, userId) {
  userId = String(userId || '').trim();
  if (!userId) return Promise.resolve();
  var viewerId = VACO.userId();

  return Promise.all([
    VACO.api('/api/profile/' + encodeURIComponent(userId)),
    VACO.api('/api/following/' + encodeURIComponent(userId)),
    VACO.api('/api/followers/' + encodeURIComponent(userId)),
    (viewerId && viewerId !== userId)
      ? VACO.api('/api/follow-status/' + encodeURIComponent(viewerId) + '/' + encodeURIComponent(userId))
        .catch(function () { return { following: false }; })
      : Promise.resolve(null),
  ]).then(function (r) {
    var profile = r[0];
    var following = r[1].following || [];
    var followers = r[2].followers || [];
    var followStatus = r[3];

    var replacement = el('div', 'vaco-stack');

    var stats = el('div', 'vaco-row-tight');
    stats.appendChild(VACO.badge(profile.postCount + ' posts'));
    stats.appendChild(VACO.badge(profile.followingCount + ' following'));
    stats.appendChild(VACO.badge(profile.followerCount + ' followers'));

    var followAction = null;
    if (viewerId && viewerId !== userId && followStatus) {
      followAction = followStatus.following
        ? VACO.button('Unfollow', function () {
          return VACO.post('/api/unfollow', { followerId: viewerId, followeeId: userId })
            .then(function () { VACO.toast('Unfollowed ' + userId); return loadProfile(out, body, userId); });
        }, 'ghost')
        : VACO.button('Follow', function () {
          return VACO.post('/api/follow', { followerId: viewerId, followeeId: userId })
            .then(function () { VACO.toast('Following ' + userId); return loadProfile(out, body, userId); });
        }, 'primary');
    }
    replacement.appendChild(VACO.card(userId, [stats], { trailing: followAction }));

    replacement.appendChild(VACO.card('Following (' + following.length + ')', [
      following.length
        ? el('p', 'vaco-small vaco-dim', following.join(', '))
        : el('div', 'vaco-empty', 'Not following anyone yet.'),
    ]));
    replacement.appendChild(VACO.card('Followers (' + followers.length + ')', [
      followers.length
        ? el('p', 'vaco-small vaco-dim', followers.join(', '))
        : el('div', 'vaco-empty', 'No followers yet.'),
    ]));

    replacement.appendChild(VACO.card('Posts', [
      VACO.table([
        { key: 'id', label: 'Id' },
        { label: 'Text', render: function (p) { return p.text; } },
        { label: 'Likes', num: true, render: function (p) { return (p.likedBy || []).length; } },
        { label: 'Reposts', num: true, render: function (p) { return (p.repostedBy || []).length; } },
        { label: 'When', render: function (p) { return fmtWhen(p.createdAt); } },
      ], profile.posts, { empty: 'No posts yet.' }),
    ]));

    while (out.childNodes.length > 1) out.removeChild(out.lastChild);
    out.appendChild(replacement);
    VACO.mount(body, out);
  }).catch(function (err) {
    while (out.childNodes.length > 1) out.removeChild(out.lastChild);
    out.appendChild(VACO.notice('Could not load that profile: ' + VACO.escapeHtml(err.message), 'danger'));
    VACO.mount(body, out);
  });
}

// -- Villages ---------------------------------------------------------

function renderVillages(body) {
  var out = el('div', 'vaco-stack');

  out.appendChild(VACO.card('Start a village', [
    VACO.form([
      { name: 'name', label: 'Name', placeholder: 'St. Louis Runners', width: '200px' },
      { name: 'description', label: 'About', placeholder: 'what it is for', width: '240px' },
    ], function (values) {
      if (!VACO.userId()) throw new Error('Sign in to start a village.');
      return VACO.post('/api/villages', { ownerId: VACO.userId(), name: values.name, description: values.description })
        .then(function () { VACO.toast('Village created.'); VACO.render(); });
    }, 'Create'),
  ]));

  return VACO.api('/api/villages').then(function (data) {
    var villages = data.villages || [];
    if (!villages.length) {
      out.appendChild(el('div', 'vaco-empty', 'No villages yet — start the first one above.'));
      return VACO.mount(body, out);
    }
    out.appendChild(VACO.grid(villages.map(function (v) {
      var lines = el('div', 'vaco-stack-sm');
      lines.appendChild(el('p', 'vaco-small vaco-dim', v.description || ''));
      var meta = el('div', 'vaco-row-tight');
      if (typeof v.memberCount === 'number') meta.appendChild(VACO.badge(v.memberCount + ' members'));

      // Boost level is bought with VCoin and is a real, server-computed
      // tier, so it is fetched rather than derived from a member count.
      var boost = VACO.badge('boost …');
      meta.appendChild(boost);
      VACO.api('/api/villages/' + v.id + '/boost')
        .then(function (b) { boost.textContent = 'boost level ' + (b.level !== undefined ? b.level : 0); })
        .catch(function () { boost.textContent = 'boost unknown'; });

      lines.appendChild(meta);
      lines.appendChild(VACO.button('Join', function () {
        if (!VACO.userId()) throw new Error('Sign in to join.');
        return VACO.post('/api/villages/' + v.id + '/join', { userId: VACO.userId() })
          .then(function () { VACO.toast('Joined ' + v.name); VACO.render(); });
      }));
      return VACO.card(v.name, [lines]);
    }), true));
    VACO.mount(body, out);
  });
}

// -- Search -------------------------------------------------------------
//
// Closes vxllageSearch.js's own flagged gap: "Search icons (Threads,
// Villages) -- decorative, no search executes." Real, case-insensitive
// substring search over village names and post text -- one query box
// for both, since that is genuinely all two routes do.

function renderSearch(body) {
  var out = el('div', 'vaco-stack');
  out.appendChild(VACO.card('Search', [
    VACO.form([
      { name: 'q', label: 'Query', placeholder: 'search villages and posts', width: '280px' },
    ], function (values) {
      return runSearch(out, body, values.q);
    }, 'Search'),
  ]));
  out.appendChild(el('div', 'vaco-empty', 'Villages match by name; posts match by text — both case-insensitive.'));
  return VACO.mount(body, out);
}

function runSearch(out, body, q) {
  q = String(q || '').trim();
  if (!q) return Promise.resolve();
  return Promise.all([
    VACO.api('/api/search/villages?q=' + encodeURIComponent(q)),
    VACO.api('/api/search/posts?q=' + encodeURIComponent(q)),
  ]).then(function (r) {
    var villages = r[0].results || [];
    var posts = r[1].results || [];
    var replacement = el('div', 'vaco-stack');

    replacement.appendChild(VACO.card('Villages — ' + villages.length, [
      VACO.table([
        { key: 'id', label: 'Id' },
        { key: 'name', label: 'Name' },
        { label: 'Members', num: true, render: function (v) { return (v.members || []).length; } },
      ], villages, { empty: 'No matching villages.' }),
    ]));
    replacement.appendChild(VACO.card('Posts — ' + posts.length, [
      VACO.table([
        { key: 'id', label: 'Id' },
        { key: 'authorId', label: 'Author' },
        { label: 'Text', render: function (p) { return p.text; } },
        { label: 'When', render: function (p) { return fmtWhen(p.createdAt); } },
      ], posts, { empty: 'No matching posts.' }),
    ]));

    while (out.childNodes.length > 1) out.removeChild(out.lastChild);
    out.appendChild(replacement);
    VACO.mount(body, out);
  }).catch(function (err) {
    while (out.childNodes.length > 1) out.removeChild(out.lastChild);
    out.appendChild(VACO.notice('Search failed: ' + VACO.escapeHtml(err.message), 'danger'));
    VACO.mount(body, out);
  });
}

// -- Cosmetics --------------------------------------------------------

function renderCosmetics(body) {
  var out = el('div', 'vaco-stack');
  out.appendChild(VACO.notice(
    'Cosmetics are <strong>personal and cross-village</strong> — bought once, worn everywhere, '
    + 'rather than re-bought per community. Purchases move real VCoin through V3.'));

  return VACO.api('/api/avatar-cosmetics/catalog').then(function (data) {
    var catalog = data.catalog || [];
    var owned = [];
    var id = VACO.userId();

    function draw() {
      var cards = catalog.map(function (c) {
        var isOwned = owned.some(function (o) { return (o.cosmeticId || o.id) === c.id; });
        var lines = el('div', 'vaco-stack-sm');
        lines.appendChild(el('div', 'cosmetic-swatch'));
        var row = el('div', 'vaco-row-tight');
        row.appendChild(VACO.price(c.priceVCoin, { freeLabel: false }));
        row.appendChild(el('span', 'vaco-spacer'));
        if (isOwned) {
          row.appendChild(VACO.badge('owned', 'money'));
          row.appendChild(VACO.button('Equip', function () {
            return VACO.post('/api/avatar-cosmetics/equip', { userId: id, cosmeticId: c.id })
              .then(function () { VACO.toast(c.name + ' equipped.'); });
          }));
        } else {
          row.appendChild(VACO.button('Buy', function () {
            if (!id) throw new Error('Sign in to buy cosmetics.');
            return VACO.post('/api/avatar-cosmetics/purchase', { userId: id, cosmeticId: c.id })
              .then(function () {
                VACO.toast(c.name + ' purchased.', 'money');
                VACO.refreshBalances().then(VACO.renderIdentity);
                VACO.render();
              });
          }, 'primary'));
        }
        lines.appendChild(row);
        return VACO.card(c.name, [lines]);
      });
      out.appendChild(VACO.grid(cards));
      VACO.mount(body, out);
    }

    if (!id) return draw();
    return VACO.api('/api/users/' + encodeURIComponent(id) + '/cosmetics')
      .then(function (mine) { owned = mine.cosmetics || mine || []; draw(); })
      .catch(draw);
  });
}

// -- Articles ---------------------------------------------------------

function renderArticles(body) {
  var out = el('div', 'vaco-stack');
  out.appendChild(VACO.notice(
    'Long-form publishing with real newsletter subscriptions — the Substack half of VXLLAGE, '
    + 'sharing one identity with the feed rather than living in a separate product.'));

  var id = VACO.userId();
  if (!id) {
    out.appendChild(el('div', 'vaco-empty', 'Sign in to see your articles and subscribers.'));
    return VACO.mount(body, out);
  }

  return Promise.all([
    VACO.api('/api/authors/' + encodeURIComponent(id) + '/articles').catch(function () { return { articles: [] }; }),
    VACO.api('/api/authors/' + encodeURIComponent(id) + '/subscribers').catch(function () { return { subscribers: [] }; }),
  ]).then(function (r) {
    var articles = r[0].articles || r[0] || [];
    var subs = r[1].subscribers || r[1] || [];
    out.appendChild(VACO.card('Your articles — ' + subs.length + ' subscriber(s)', [
      VACO.table([
        { key: 'id', label: 'Id' },
        { key: 'title', label: 'Title' },
        { label: 'Status', render: function (a) { return VACO.badge(a.status || 'draft'); } },
      ], articles, { empty: 'No articles yet.' }),
    ]));
    VACO.mount(body, out);
  });
}

VACO.app({
  id: 'vxllage',
  name: 'VXLLAGE',
  tagline: 'Feed · villages · publishing',
  //: VXLLAGE's identity: a fresh green-teal. Communal and outdoorsy —
  //: a village square rather than a timeline.
  accent: '#3fbf8f',
  accentDim: '#2a9670',
  accentInk: '#04140e',
  tabs: [
    { id: 'feed', label: 'Feed', heading: 'Home', render: renderFeed },
    { id: 'profile', label: 'Profile', heading: 'Profile',
      blurb: 'A real, computed profile — post/following/follower counts and a real follow graph, the same one that drives Following in the Feed tab.',
      render: renderProfile },
    { id: 'villages', label: 'Villages', heading: 'Communities',
      blurb: 'A village is a real community with members, events, Villas, and a boost level bought with VCoin.',
      render: renderVillages },
    { id: 'search', label: 'Search', heading: 'Search', render: renderSearch },
    { id: 'cosmetics', label: 'Cosmetics', heading: 'Avatar shop', render: renderCosmetics },
    { id: 'articles', label: 'Publishing', heading: 'Articles & newsletters', render: renderArticles },
  ],
});
</script>
</body>
</html>
