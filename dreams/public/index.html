<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DREAMS</title>
<link rel="stylesheet" href="/vaco-design.css" />
<style>
  .screen-tile {
    aspect-ratio: 16 / 10;
    border-radius: var(--vaco-radius-sm);
    border: 1px solid var(--vaco-border-subtle);
    background: linear-gradient(150deg, var(--vaco-accent-soft), transparent 70%), var(--vaco-bg-raised);
    display: flex; align-items: center; justify-content: center;
    color: var(--vaco-text-faint); font-size: var(--vaco-text-xs);
    letter-spacing: 0.1em; text-transform: uppercase;
  }
  .split-note { display: flex; gap: var(--vaco-space-4); flex-wrap: wrap; }
  .split-part { display: flex; flex-direction: column; }
  .split-value { font-size: var(--vaco-text-lg); font-weight: var(--vaco-weight-bold); font-variant-numeric: tabular-nums; }
</style>
</head>
<body class="vaco">
<script src="/vaco-ui.js"></script>
<script>
// DREAMS — the ad and screen network.
//
// Real client of its own 22 routes. Revenue splits per screen and
// offline-cache behaviour are server-side.
//
// **Two honest limits, stated on the surface.** There is no physical
// screen hardware anywhere in this ecosystem — a screen here is a
// registered venue endpoint, not a panel on a wall. And "offline
// plays" are recorded after the fact by whatever runs the screen;
// nothing here polls a device, because there is no device.

var el = VACO.el;

function renderScreens(body) {
  var out = el('div', 'vaco-stack');
  out.appendChild(VACO.notice(
    'A screen is a registered venue endpoint. <strong>No display hardware exists</strong> — '
    + 'hardware is a separate budget line from software, and this is the software half.', 'warn'));

  out.appendChild(VACO.card('Register a screen', [
    el('p', 'vaco-small vaco-dim',
      // Flat, not negotiable per screen -- SCREEN_OWNER_SHARE in lib/campaigns.js.
      // There used to be an editable "venue share %" field here; it was never
      // read by the server, so every venue got the same split regardless of
      // what they typed. Shown as a fact instead of a form field now.
      'You keep 70% of everything played on your screen — a flat platform split, the same for every screen in the network.'),
    VACO.form([
      { name: 'locationName', label: 'Location', placeholder: 'Magnolia Blues', width: '170px' },
      { name: 'locationAddress', label: 'Address', placeholder: '123 Main St', width: '190px' },
      { name: 'screenOwnerId', label: 'Owner', value: VACO.userId() || '', width: '130px' },
    ], function (values) {
      return VACO.post('/api/screens', values)
        .then(function (s) { VACO.toast('Screen ' + s.id + ' registered.'); VACO.render(); });
    }, 'Register'),
  ]));

  // Real screen lookup -- GET /api/screens/:id. The grid below only ever
  // shows *active* screens (listActiveScreens), so a deactivated screen
  // has nowhere else to be checked on.
  out.appendChild(VACO.card('Look up a screen', [
    VACO.form([{ name: 'id', label: 'Screen id', type: 'number', min: 1, width: '110px' }],
      function (values) {
        return VACO.api('/api/screens/' + values.id).then(function (s) {
          VACO.toast('Screen ' + s.id + ' (' + s.locationName + '): ' + s.status + '.');
        });
      }, 'Look up'),
  ]));

  return VACO.api('/api/screens').then(function (data) {
    var screens = data.screens || [];
    if (!screens.length) {
      out.appendChild(el('div', 'vaco-empty', 'No screens registered yet.'));
      return VACO.mount(body, out);
    }

    var pending = screens.map(function (s) {
      return VACO.api('/api/screens/' + s.id + '/revenue')
        .then(function (r) { return { screen: s, revenue: r }; })
        .catch(function () { return { screen: s, revenue: null }; });
    });

    return Promise.all(pending).then(function (loaded) {
      out.appendChild(VACO.grid(loaded.map(function (entry) {
        var s = entry.screen;
        var lines = el('div', 'vaco-stack-sm');
        var tile = el('div', 'screen-tile');
        tile.textContent = s.status || 'registered';
        lines.appendChild(tile);

        if (entry.revenue) {
          // Matches getScreenRevenue's real return shape exactly:
          // { screenId, impressionCount, totalRevenue }. The previous
          // version read venueShare/networkShare/playCount/ownerRevenue/
          // platformRevenue/plays, none of which the server has ever sent —
          // every pair silently skipped and the split note rendered empty.
          var r = entry.revenue;
          var split = el('div', 'split-note');
          [['Impressions', r.impressionCount], ['Earned', r.totalRevenue]].forEach(function (pair) {
            if (pair[1] === undefined) return;
            var part = el('div', 'split-part');
            part.appendChild(el('span', 'vaco-label', pair[0]));
            part.appendChild(el('span', 'split-value', VACO.round(pair[1])));
            split.appendChild(part);
          });
          lines.appendChild(split);
        }

        // Real "go dark" control -- POST /api/screens/:id/deactivate,
        // requireScreenOwner-guarded server-side (both the session and
        // deactivateScreen itself check screenOwnerId). Only the signed-in
        // owner sees it on their own screen; there was no frontend path to
        // this route at all before.
        if (VACO.userId() && s.screenOwnerId === VACO.userId()) {
          lines.appendChild(VACO.button('Deactivate', function () {
            return VACO.post('/api/screens/' + s.id + '/deactivate', { screenOwnerId: VACO.userId() })
              .then(function () { VACO.toast('Screen ' + s.id + ' deactivated.'); VACO.render(); });
          }, 'ghost'));
        }

        return VACO.card(s.locationName || ('Screen ' + s.id), [lines],
          { trailing: VACO.badge('70% to venue') });
      }), true));
      VACO.mount(body, out);
    });
  });
}

function renderAdvertisers(body) {
  var out = el('div', 'vaco-stack');
  out.appendChild(VACO.notice(
    'Self-serve: an advertiser signs up, funds a campaign, and it plays across the network — '
    + 'no sales call, which is the whole reason a small local business would use this at all.'));

  out.appendChild(VACO.card('Create an advertiser', [
    VACO.form([
      // signUpAdvertiser(store, { advertiserId, businessName }) is the real
      // signature -- `name` and `contactEmail` were never read server-side,
      // and advertiserId (the real primary key, chosen by the signer-up,
      // not auto-generated) had no field here at all, so this form could
      // never actually succeed.
      { name: 'advertiserId', label: 'Your user id', value: VACO.userId() || '', width: '150px' },
      { name: 'businessName', label: 'Business', placeholder: 'Cherokee Street Coffee', width: '190px' },
    ], function (values) {
      return VACO.post('/api/advertisers', values)
        .then(function (a) { VACO.toast('Advertiser ' + a.advertiserId + ' created.'); });
    }, 'Create'),
  ]));

  out.appendChild(VACO.card('Look up an advertiser', [
    VACO.form([{ name: 'id', label: 'Advertiser id', placeholder: 'owner1', width: '150px' }],
      function (values) {
        // GET /api/advertisers/:id -- the real profile (businessName,
        // createdAt). The lookup here used to go straight to campaigns and
        // never fetched the advertiser record itself at all.
        return VACO.api('/api/advertisers/' + values.id).then(function (advertiser) {
          return VACO.api('/api/advertisers/' + values.id + '/campaigns').then(function (data) {
            var campaigns = data.campaigns || [];
            while (out.childNodes.length > 3) out.removeChild(out.lastChild);
            out.appendChild(VACO.card(advertiser.businessName || advertiser.advertiserId, [
              el('p', 'vaco-small vaco-dim', 'Advertiser id: ' + advertiser.advertiserId
                + ' · signed up ' + new Date(advertiser.createdAt).toLocaleDateString()),
            ]));
            out.appendChild(VACO.card('Campaigns', [
              VACO.table([
                { key: 'id', label: 'Id' },
                { key: 'name', label: 'Campaign' },
                { label: 'Budget', num: true, render: function (c) { return VACO.price(c.budget, { freeLabel: false }); } },
                { label: 'Status', render: function (c) { return VACO.badge(c.status); } },
              ], campaigns, { empty: 'No campaigns for this advertiser.' }),
            ]));
            VACO.mount(body, out);
          });
        });
      }, 'Load'),
  ]));

  return VACO.mount(body, out);
}

// -- Self-serve campaign flow ------------------------------------------
//
// The real step-by-step flow `lib/campaigns.js` already enforces in
// order (draft -> screens -> creative -> budget -> incentive -> live)
// had no frontend at all — only a read-only lookup existed. Every step
// below hits the real route; the server still enforces order and
// completeness (`launchCampaign` refuses a campaign missing any of
// them), so this is a convenience, not a second source of truth.

function renderCampaignFlow(body) {
  var out = el('div', 'vaco-stack');
  var state = { campaign: null };

  function refresh(campaignId) {
    return VACO.api('/api/campaigns/' + campaignId).then(function (c) {
      state.campaign = c;
      renderStepCard();
    });
  }

  function renderStepCard() {
    while (out.childNodes.length > 1) out.removeChild(out.lastChild);
    var c = state.campaign;
    if (!c) return;

    var lines = el('div', 'vaco-stack-sm');
    lines.appendChild(VACO.badge(c.status));
    lines.appendChild(el('p', 'vaco-small vaco-dim', c.name + ' · screens: ' + (c.screenIds || []).length
      + ' · creative: ' + (c.creativeUrl || c.creativeText ? 'set' : 'none')
      + ' · budget: ' + (c.budget || 'none') + ' · incentive: ' + (c.incentive ? c.incentive.type : 'none')
      + ' · per-scan: ' + (c.costPerScan || 'not set') + ' · sale commission: '
      + (c.saleCommissionRate ? Math.round(c.saleCommissionRate * 100) + '%' : 'not set')));

    if (c.status === 'live') {
      lines.appendChild(VACO.notice('This campaign is live.', 'money'));
      out.appendChild(VACO.card('Campaign ' + c.id, [lines]));
      return;
    }

    lines.appendChild(VACO.form([{ name: 'screenIds', label: 'Screen ids (comma-separated)', placeholder: '1,2,3', width: '220px' }],
      function (values) {
        var screenIds = String(values.screenIds).split(',').map(Number).filter(function (n) { return !isNaN(n); });
        return VACO.post('/api/campaigns/' + c.id + '/screens', { screenIds: screenIds })
          .then(function () { return refresh(c.id); });
      }, 'Select screens'));

    lines.appendChild(VACO.form([{ name: 'creativeUrl', label: 'Creative URL', placeholder: 'https://…', width: '220px' }],
      function (values) {
        return VACO.post('/api/campaigns/' + c.id + '/creative', { creativeUrl: values.creativeUrl })
          .then(function () { return refresh(c.id); });
      }, 'Upload creative'));

    // generateCreativeText (lib/campaigns.js) requires a real `brief` --
    // this used to post an empty body and would 400 on every real call.
    lines.appendChild(VACO.form([{ name: 'brief', label: 'Creative brief (AI)', placeholder: 'What should the ad say?', width: '220px' }],
      function (values) {
        return VACO.post('/api/campaigns/' + c.id + '/generate-creative', { brief: values.brief })
          .then(function () { return refresh(c.id); });
      }, 'Generate creative (AI)'));

    lines.appendChild(VACO.form([{ name: 'budget', label: 'Budget', type: 'number', min: 1, width: '110px' }],
      function (values) {
        return VACO.post('/api/campaigns/' + c.id + '/budget', { budget: values.budget })
          .then(function () { return refresh(c.id); });
      }, 'Set budget'));

    // Real opt-in pricing for scan/sale revenue (README's "Scan and sale
    // revenue" section) -- setScanPricing/setSaleCommission in
    // lib/campaigns.js. Both optional, both draft-only, same as budget
    // and incentive above; recordScan/recordSale on the device side
    // refuse to run until these are set.
    lines.appendChild(VACO.form([{ name: 'costPerScan', label: 'Cost per scan', type: 'number', min: 0.01, step: '0.01', width: '120px' }],
      function (values) {
        return VACO.post('/api/campaigns/' + c.id + '/scan-pricing', { costPerScan: values.costPerScan })
          .then(function () { return refresh(c.id); });
      }, 'Set scan pricing'));

    lines.appendChild(VACO.form([{ name: 'saleCommissionRate', label: 'Sale commission (0–1)', type: 'number', min: 0.01, max: 1, step: '0.01', width: '140px' }],
      function (values) {
        return VACO.post('/api/campaigns/' + c.id + '/sale-commission', { saleCommissionRate: values.saleCommissionRate })
          .then(function () { return refresh(c.id); });
      }, 'Set sale commission'));

    lines.appendChild(VACO.form([
      { name: 'type', label: 'Incentive', options: ['percent-off', 'amount-off', 'coupon'] },
      { name: 'value', label: 'Value (%/amount)', type: 'number', min: 0, width: '100px' },
      { name: 'code', label: 'Coupon code', placeholder: 'optional', width: '120px' },
    ], function (values) {
      var payload = { type: values.type };
      if (values.type === 'coupon') payload.code = values.code;
      else payload.value = values.value;
      return VACO.post('/api/campaigns/' + c.id + '/incentive', payload)
        .then(function () { return refresh(c.id); });
    }, 'Set incentive'));

    lines.appendChild(el('p', 'vaco-small vaco-faint',
      'Every DREAMS ad gives something away — a coupon or a percent/amount off — before it can go live, no exception for size.'));

    lines.appendChild(VACO.button('Launch', function () {
      return VACO.post('/api/campaigns/' + c.id + '/launch', {})
        .then(function () { VACO.toast('Campaign ' + c.id + ' is live.', 'money'); return refresh(c.id); });
    }, 'primary'));

    out.appendChild(VACO.card('Campaign ' + c.id, [lines]));
  }

  out.appendChild(VACO.card('Start a campaign', [
    VACO.form([
      { name: 'advertiserId', label: 'Advertiser id', placeholder: 'from the Advertisers tab', width: '150px' },
      { name: 'name', label: 'Campaign name', placeholder: 'Gym Launch', width: '180px' },
    ], function (values) {
      return VACO.post('/api/campaigns', values).then(function (c) { return refresh(c.id); });
    }, 'Create'),
  ]));

  out.appendChild(VACO.card('Continue a draft', [
    VACO.form([{ name: 'id', label: 'Campaign id', type: 'number', min: 1, width: '110px' }],
      function (values) { return refresh(values.id); }, 'Load'),
  ]));

  return VACO.mount(body, out);
}

function renderOffline(body) {
  return VACO.api('/api/offline-plays').then(function (data) {
    var plays = data.plays || data.offlinePlays || [];
    return VACO.card('Offline plays', [
      el('p', 'vaco-small vaco-dim',
        'A screen that loses its connection keeps playing from cache and reports what it played when it comes back. '
        + 'Those reports land here. Nothing here polls a device — there is no device.'),
      VACO.table([
        { key: 'screenId', label: 'Screen' },
        { key: 'campaignId', label: 'Campaign' },
        { key: 'playCount', label: 'Plays', num: true },
        { key: 'reportedAt', label: 'Reported', render: function (p) {
          return p.reportedAt ? new Date(p.reportedAt).toLocaleString() : '—'; } },
      ], plays, { empty: 'No offline plays reported.' }),
    ]);
  });
}

VACO.app({
  id: 'dreams',
  name: 'DREAMS',
  tagline: 'Ad & screen network',
  //: DREAMS' identity: a bright cyan. Backlit-display glow, and the
  //: register's only cyan — distinct from VACO's aqua by being
  //: noticeably bluer.
  accent: '#3fbde0',
  accentDim: '#2b98b8',
  accentInk: '#03141a',
  tabs: [
    { id: 'screens', label: 'Screens', heading: 'The network', render: renderScreens },
    { id: 'advertisers', label: 'Advertisers', heading: 'Self-serve campaigns', render: renderAdvertisers },
    { id: 'campaign', label: 'New Campaign', heading: 'The self-serve flow', render: renderCampaignFlow },
    { id: 'offline', label: 'Offline', heading: 'Cached playback', render: renderOffline },
  ],
});
</script>
</body>
</html>
