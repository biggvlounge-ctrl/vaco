<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VACA</title>
<link rel="stylesheet" href="/vaco-design.css" />
<style>
  .grade { font-size: var(--vaco-text-3xl); font-weight: var(--vaco-weight-bold); line-height: 1; }
  .grade-row { display: flex; align-items: center; gap: var(--vaco-space-4); }
  .queue-note { display: flex; gap: var(--vaco-space-2); align-items: center; }
</style>
</head>
<body class="vaco">
<script src="/vaco-ui.js"></script>
<script>
// VACA — identity and authenticity verification.
//
// The third component of V3, and the service six other apps read before
// they trust a claim. Real client of its own 12 routes: the submit/
// review/lookup loop, plus the local blockchain ledger (its integrity
// check, per-block lookup, and public-chain anchoring posture/action).
//
// **Approval is a human act here, not an algorithm.** VACA records a
// verification request, and someone approves or rejects it. Nothing on
// this page or behind it inspects a document — there is no document
// verification vendor connected, and pretending there is would be the
// most damaging possible thing for a service whose entire product is
// trustworthiness.

var el = VACO.el;

function gradeColour(grade) {
  var g = String(grade || '').toUpperCase();
  if (g.charAt(0) === 'A') return 'var(--vaco-money)';
  if (g.charAt(0) === 'B') return 'var(--vaco-accent)';
  if (g.charAt(0) === 'C') return 'var(--vaco-warn)';
  return 'var(--vaco-danger)';
}

function shortHash(h) {
  if (!h) return '—';
  var s = String(h);
  return s.length > 18 ? s.slice(0, 10) + '…' + s.slice(-6) : s;
}

function renderLookup(body) {
  var out = el('div', 'vaco-stack');
  out.appendChild(VACO.notice(
    '<strong>No document verification vendor is connected.</strong> A verification is approved or rejected by a '
    + 'person, and this records that decision. Every consuming app reads the result, so the honesty of this '
    + 'screen matters more than most.', 'warn'));

  out.appendChild(VACO.card('Check a subject', [
    VACO.form([
      { name: 'subjectType', label: 'Type', options: ['user', 'business', 'creator', 'listing'] },
      { name: 'subjectId', label: 'Id', value: VACO.userId() || '', width: '160px' },
    ], function (values) {
      return Promise.all([
        VACO.api('/api/identity-status/' + encodeURIComponent(values.subjectType) + '/' + encodeURIComponent(values.subjectId)),
        VACO.api('/api/authenticity-grade/' + encodeURIComponent(values.subjectType) + '/' + encodeURIComponent(values.subjectId))
          .catch(function () { return null; }),
        VACO.api('/api/verifications/subject/' + encodeURIComponent(values.subjectType) + '/' + encodeURIComponent(values.subjectId))
          .catch(function () { return { verifications: [] }; }),
      ]).then(function (r) {
        var status = r[0], grade = r[1], list = r[2].verifications || r[2] || [];
        while (out.childNodes.length > 2) out.removeChild(out.lastChild);

        var lines = el('div', 'vaco-stack-sm');
        var row = el('div', 'grade-row');
        if (grade) {
          var g = el('span', 'grade', grade.grade || grade.authenticityGrade || '—');
          g.style.color = gradeColour(grade.grade || grade.authenticityGrade);
          row.appendChild(g);
        }
        var text = el('div', 'vaco-stack-sm');
        text.appendChild(status.verified
          ? VACO.badge('identity verified', 'money')
          : VACO.badge('not verified', 'warn'));
        text.appendChild(el('p', 'vaco-small vaco-dim',
          status.verified
            ? 'Consuming apps will accept identity-gated actions for this subject.'
            : 'Identity-gated actions elsewhere in the ecosystem will be refused.'));
        row.appendChild(text);
        lines.appendChild(row);
        out.appendChild(VACO.card(values.subjectType + ' · ' + values.subjectId, [lines]));

        out.appendChild(VACO.card('Verification history', [
          VACO.table([
            { key: 'id', label: 'Id' },
            { key: 'verificationType', label: 'Type' },
            { label: 'Status', render: function (v) { return VACO.badge(v.status); } },
            { key: 'createdAt', label: 'Requested', render: function (v) {
              return v.createdAt ? new Date(v.createdAt).toLocaleString() : '—'; } },
          ], list, { empty: 'No verification requests for this subject.' }),
        ]));
        VACO.mount(body, out);
      });
    }, 'Check'),
  ]));

  return VACO.mount(body, out);
}

function renderQueue(body) {
  var out = el('div', 'vaco-stack');

  out.appendChild(VACO.card('Submit a verification request', [
    VACO.form([
      { name: 'subjectType', label: 'Type', options: ['user', 'business', 'creator', 'listing'] },
      { name: 'subjectId', label: 'Subject', value: VACO.userId() || '', width: '140px' },
      { name: 'verificationType', label: 'Verification', placeholder: 'identity', width: '140px' },
    ], function (values) {
      return VACO.post('/api/verifications', values)
        .then(function (v) { VACO.toast('Verification ' + v.id + ' submitted for review.'); });
    }, 'Submit'),
  ]));

  out.appendChild(VACO.card('Review a request', [
    el('p', 'vaco-small vaco-dim',
      'A reviewer decides. Approving marks the subject verified across every app that reads VACA.'),
    VACO.form([{ name: 'id', label: 'Verification id', type: 'number', min: 1, value: 1, width: '120px' }],
      function (values) {
        return VACO.api('/api/verifications/' + values.id).then(function (v) {
          while (out.childNodes.length > 2) out.removeChild(out.lastChild);
          var lines = el('div', 'vaco-stack-sm');
          lines.appendChild(VACO.badge(v.status));
          lines.appendChild(el('p', 'vaco-small vaco-dim',
            v.subjectType + ' ' + v.subjectId + ' · ' + (v.verificationType || '')));
          var actions = el('div', 'vaco-row-tight');
          actions.appendChild(VACO.button('Approve', function () {
            return VACO.post('/api/verifications/' + values.id + '/approve', {})
              .then(function () { VACO.toast('Approved.', 'money'); });
          }, 'primary'));
          actions.appendChild(VACO.button('Reject', function () {
            return VACO.post('/api/verifications/' + values.id + '/reject', {})
              .then(function () { VACO.toast('Rejected.', 'danger'); });
          }, 'danger'));
          lines.appendChild(actions);
          out.appendChild(VACO.card('Verification ' + values.id, [lines]));
          VACO.mount(body, out);
        });
      }, 'Load'),
  ]));

  return VACO.mount(body, out);
}

function renderChain(body) {
  var out = el('div', 'vaco-stack');

  out.appendChild(VACO.notice(
    '<strong>This is a real local chain, not a distributed one.</strong> Every approve/reject decision VACA '
    + 'makes is appended here as a real block, cryptographically linked to the block before it — altering any '
    + 'past block changes every hash after it, and that is detectable below. There is no peer network and no '
    + 'consensus protocol; it is one ledger, inside VACA. Posting a block\'s hash to a real public chain '
    + '(Ethereum, Polygon, etc.) is a separate, genuinely different thing, configured only once a funded '
    + 'wallet and RPC provider exist — nothing here fabricates a transaction.', 'warn'));

  var postureCard = el('div');
  out.appendChild(postureCard);

  function loadPosture() {
    return VACO.api('/api/chain/posture').then(function (p) {
      VACO.mount(postureCard, VACO.card('Public-chain anchoring', [
        VACO.badge(p.configured ? 'configured' : 'not configured', p.configured ? 'money' : 'warn'),
        el('p', 'vaco-small vaco-dim', p.note),
      ]));
    });
  }

  var chainCard = el('div');
  out.appendChild(chainCard);

  function loadChain() {
    return VACO.api('/api/chain').then(function (r) {
      var chain = (r.chain || []).slice().reverse();
      var integrity = r.integrity || {};
      var header = el('div', 'vaco-row-tight');
      header.appendChild(VACO.badge(
        integrity.valid ? 'chain intact' : 'broken at block ' + integrity.brokenAtIndex,
        integrity.valid ? 'money' : 'danger'));
      header.appendChild(el('span', 'vaco-small vaco-dim',
        chain.length + ' block' + (chain.length === 1 ? '' : 's') + ' recorded'));

      VACO.mount(chainCard, VACO.card('Chain', [
        header,
        VACO.table([
          { key: 'index', label: 'Block', num: true },
          { label: 'When', render: function (b) { return new Date(b.timestamp).toLocaleString(); } },
          { label: 'Decision', render: function (b) {
            var d = b.data || {};
            return (d.claimType || '—') + ' · ' + (d.status || '—') + (d.grade ? ' (' + d.grade + ')' : '');
          } },
          { label: 'Hash', render: function (b) { return el('span', 'vaco-mono vaco-small', shortHash(b.hash)); } },
        ], chain, { empty: 'No decisions recorded yet — approve or reject a verification to append the first block.' }),
      ], { trailing: VACO.button('Refresh', function () { return loadChain(); }) }));
    });
  }

  var blockResult = el('div');
  out.appendChild(VACO.card('Look up one block', [
    el('p', 'vaco-small vaco-dim',
      'Each block is addressed by its index — the same index a verification\'s own blockIndex field records.'),
    VACO.form([{ name: 'index', label: 'Block index', type: 'number', min: 0, value: 0, width: '120px' }],
      function (values) {
        return VACO.api('/api/chain/block/' + values.index).then(function (b) {
          var lines = el('div', 'vaco-stack-sm');
          lines.appendChild(el('p', 'vaco-small', 'Block ' + b.index + ' · ' + new Date(b.timestamp).toLocaleString()));
          lines.appendChild(el('p', 'vaco-mono vaco-small vaco-dim', 'hash: ' + b.hash));
          lines.appendChild(el('p', 'vaco-mono vaco-small vaco-dim', 'previous: ' + b.previousHash));
          lines.appendChild(el('pre', 'vaco-mono vaco-small', JSON.stringify(b.data, null, 2)));
          VACO.mount(blockResult, lines);
        });
      }, 'Look up'),
    blockResult,
  ]));

  var anchorResult = el('div');
  out.appendChild(VACO.card('Anchor a decision on a public chain', [
    el('p', 'vaco-small vaco-dim',
      'Operator-gated. Posts this verification\'s own block hash as a real, minimal transaction on a real '
      + 'public chain — real gas, every call. Requires VACA_CHAIN_RPC_URL and VACA_CHAIN_PRIVATE_KEY to be set '
      + 'on the server first; until then this honestly refuses rather than making up a transaction hash, and '
      + 'the verification must already be approved or rejected (it needs a block to anchor).'),
    VACO.form([
      { name: 'credential', label: 'X-Operator-Credential', placeholder: 'from vaco-operator', width: '200px' },
      { name: 'id', label: 'Verification id', type: 'number', min: 1, value: 1, width: '120px' },
    ], function (values) {
      if (!values.credential) { VACO.toast('An operator credential is required to anchor.', 'warn'); return Promise.resolve(); }
      return VACO.api('/api/verifications/' + values.id + '/anchor-on-chain', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Operator-Credential': values.credential },
        body: JSON.stringify({}),
      }).then(function (r) {
        VACO.toast(
          r.chainConfigured ? 'Anchored: ' + shortHash(r.anchor.txHash) : 'Anchor call returned, but no real chain is configured.',
          r.chainConfigured ? 'money' : 'warn');
        VACO.mount(anchorResult, el('pre', 'vaco-mono vaco-small', JSON.stringify(r, null, 2)));
        loadChain();
      });
    }, 'Anchor'),
    anchorResult,
  ]));

  loadPosture();
  loadChain();

  return VACO.mount(body, out);
}

VACO.app({
  id: 'vaca',
  name: 'VACA',
  tagline: 'Identity & authenticity',
  //: VACA's identity: a deep teal-blue. Trust infrastructure — related
  //: to VSAFE's signal blue since both are safety services, pushed
  //: greener so the two consoles are never confused.
  accent: '#2f9fb8',
  accentDim: '#1f7d93',
  accentInk: '#031318',
  tabs: [
    { id: 'lookup', label: 'Lookup', heading: 'Check a subject', render: renderLookup },
    { id: 'queue', label: 'Review', heading: 'Verification requests', render: renderQueue },
    { id: 'chain', label: 'Chain', heading: 'Local chain & public anchoring', render: renderChain },
  ],
});
</script>
</body>
</html>
