<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VOID MAGIC</title>
<link rel="stylesheet" href="/vaco-design.css" />
<style>
  .exp-art {
    height: 120px;
    border-radius: var(--vaco-radius-sm);
    border: 1px solid var(--vaco-border-subtle);
    background: linear-gradient(140deg, var(--vaco-accent-soft), transparent 68%), var(--vaco-bg-raised);
    display: flex; align-items: flex-end; padding: var(--vaco-space-3);
  }
  .queue { display: flex; flex-direction: column; gap: var(--vaco-space-2); }
  .queue-item { display: flex; align-items: center; gap: var(--vaco-space-3);
                padding: var(--vaco-space-2) var(--vaco-space-3);
                border: 1px solid var(--vaco-border-subtle); border-radius: var(--vaco-radius-sm); }
  .queue-pos { font-variant-numeric: tabular-nums; font-weight: var(--vaco-weight-bold); width: 28px; }
  .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: var(--vaco-space-3); }
  .stat { display: flex; flex-direction: column; gap: 2px; }
  .stat-value { font-size: var(--vaco-text-xl); font-weight: var(--vaco-weight-bold); font-variant-numeric: tabular-nums; }
</style>
</head>
<body class="vaco">
<script src="/vaco-ui.js"></script>
<script>
// VOID MAGIC — meet & greet bookings.
//
// A real client of 25 of this app's 33 mutating/reading routes (an
// audit found only 9 actually wired before this pass — see README's
// "Frontend coverage pass"). Refund policy, waiting-room admission,
// and identity verification at the door are all server-decided, never
// assumed here.
//
// **The waiting room is the interesting mechanic and gets its own
// tab.** A meet & greet fails in one specific way: the wrong person
// walks up. So admission is a real gate with a real identity check
// rather than a list a host eyeballs. Physical check-in (the in-person
// counterpart) lives in the same tab.

var el = VACO.el;

function renderExperiences(body) {
  var out = el('div', 'vaco-stack');

  out.appendChild(VACO.card('List an experience', [
    VACO.form([
      { name: 'title', label: 'Title', placeholder: 'Backstage meet & greet', width: '200px' },
      { name: 'hostId', label: 'Host', value: VACO.userId() || '', width: '130px' },
      { name: 'pricePerGuest', label: 'Per guest', type: 'number', min: 1, value: 60, width: '100px' },
      { name: 'capacity', label: 'Capacity', type: 'number', min: 1, value: 20, width: '90px' },
    ], function (values) {
      return VACO.post('/api/experiences', values)
        .then(function (e) { VACO.toast('Experience ' + e.id + ' listed.'); VACO.render(); });
    }, 'List'),
  ]));

  return VACO.api('/api/experiences').then(function (data) {
    var experiences = data.experiences || [];
    if (!experiences.length) {
      out.appendChild(el('div', 'vaco-empty', 'No experiences listed yet.'));
      return VACO.mount(body, out);
    }

    out.appendChild(VACO.grid(experiences.map(function (e) {
      var lines = el('div', 'vaco-stack-sm');
      var art = el('div', 'exp-art');
      art.appendChild(el('strong', null, e.hostId || ''));
      lines.appendChild(art);

      var row = el('div', 'vaco-row-tight');
      row.appendChild(VACO.price(e.pricePerGuest, { freeLabel: false }));
      if (e.capacity) row.appendChild(VACO.badge(e.capacity + ' spots'));
      lines.appendChild(row);

      lines.appendChild(VACO.button('Book', function () {
        if (!VACO.userId()) throw new Error('Sign in to book.');
        return VACO.post('/api/bookings', { experienceId: e.id, customerId: VACO.userId() })
          .then(function (b) {
            VACO.toast('Booking ' + b.id + ' confirmed.', 'money');
            VACO.refreshBalances().then(VACO.renderIdentity);
          });
      }, 'primary'));

      return VACO.card(e.title || ('Experience ' + e.id), [lines],
        { trailing: VACO.badge(e.status || 'open') });
    }), true));
    VACO.mount(body, out);
  });
}

function renderBookings(body) {
  var out = el('div', 'vaco-stack');
  out.appendChild(VACO.notice(
    'Cancelling follows a real refund policy — how much comes back depends on when you cancel, '
    + 'and the refund is a real VCoin movement rather than a status change.'));

  var id = VACO.userId();
  if (!id) {
    out.appendChild(el('div', 'vaco-empty', 'Sign in to see your bookings.'));
    return VACO.mount(body, out);
  }

  return VACO.api('/api/customers/' + encodeURIComponent(id) + '/experiences').then(function (data) {
    var bookings = data.bookings || data.experiences || data || [];
    out.appendChild(VACO.card('Your bookings', [
      VACO.table([
        { key: 'id', label: 'Booking' },
        { key: 'experienceId', label: 'Experience' },
        { label: 'Paid', num: true, render: function (b) { return VACO.price(b.amountPaid || b.total, { freeLabel: false }); } },
        { label: 'Status', render: function (b) { return VACO.badge(b.status); } },
        { label: '', render: function (b) {
          if (b.status === 'completed') {
            return VACO.button('Summary', function () {
              return VACO.api('/api/bookings/' + b.id + '/post-event-summary').then(function (s) {
                VACO.toast('"' + s.experienceTitle + '" with ' + s.hostId + ' — paid ' + VACO.round(s.pricePaid) + '.');
              });
            }, 'ghost vaco-btn-sm');
          }
          if (b.status === 'cancelled') return '—';
          return VACO.button('Cancel', function () {
            return VACO.post('/api/bookings/' + b.id + '/cancel', { customerId: id })
              .then(function (r) {
                VACO.toast('Cancelled — ' + VACO.round(r.refundAmount !== undefined ? r.refundAmount : 0) + ' refunded.', 'money');
                VACO.refreshBalances().then(VACO.renderIdentity);
                VACO.render();
              });
          }, 'danger vaco-btn-sm');
        } },
      ], bookings, { empty: 'No bookings yet.' }),
    ]));
    VACO.mount(body, out);
  });
}

function renderWaitingRoom(body) {
  var out = el('div', 'vaco-stack');
  out.appendChild(VACO.notice(
    'The door. A guest enters the waiting room, their identity is verified, and only then are they admitted. '
    + '<strong>Verification is a real gate</strong> — admitting an unverified guest is refused, not warned about.'));

  out.appendChild(VACO.card('Enter a waiting room', [
    VACO.form([{ name: 'bookingId', label: 'Booking id', type: 'number', min: 1, value: 1, width: '110px' }],
      function (values) {
        if (!VACO.userId()) throw new Error('Sign in first.');
        return VACO.post('/api/waiting-room/enter', { bookingId: values.bookingId, userId: VACO.userId() })
          .then(function (entry) { VACO.toast('In the waiting room as entry ' + entry.id + '.'); });
      }, 'Enter'),
  ]));

  out.appendChild(VACO.card('Physical check-in', [
    el('p', 'vaco-small vaco-dim',
      'The in-person counterpart to the digital room above — scan the credential a guest was issued at '
      + 'booking time. Only the host of that booking may check someone in, and the wrong code is refused.'),
    VACO.form([
      { name: 'bookingId', label: 'Booking id', type: 'number', min: 1, value: 1, width: '110px' },
      { name: 'providedCredential', label: 'Credential', placeholder: 'from the booking confirmation', width: '200px' },
    ], function (values) {
      return VACO.post('/api/bookings/' + values.bookingId + '/check-in', { providedCredential: values.providedCredential })
        .then(function (b) { VACO.toast('Booking ' + b.id + ' checked in.', 'money'); });
    }, 'Check in'),
  ]));

  out.appendChild(VACO.card('Host controls', [
    el('p', 'vaco-small vaco-dim', 'Verify a guest, then admit them. The order is enforced by the server.'),
    VACO.form([{ name: 'id', label: 'Entry id', type: 'number', min: 1, value: 1, width: '100px' }],
      function (values) {
        return VACO.api('/api/waiting-room/' + values.id).then(function (entry) {
          while (out.childNodes.length > 4) out.removeChild(out.lastChild);
          var lines = el('div', 'vaco-stack-sm');
          lines.appendChild(VACO.badge(entry.status));
          lines.appendChild(el('p', 'vaco-small vaco-dim',
            'Guest ' + (entry.userId || '—')
            + (entry.identityVerified ? ' · identity verified' : ' · identity NOT verified')));

          var actions = el('div', 'vaco-row-tight');
          actions.appendChild(VACO.button('Verify identity', function () {
            return VACO.post('/api/waiting-room/' + values.id + '/verify-identity', {})
              .then(function () { VACO.toast('Identity verified.'); });
          }));
          actions.appendChild(VACO.button('Admit', function () {
            return VACO.post('/api/waiting-room/' + values.id + '/admit', {})
              .then(function () { VACO.toast('Admitted.', 'money'); });
          }, 'primary'));
          lines.appendChild(actions);

          out.appendChild(VACO.card('Entry ' + values.id, [lines]));
          VACO.mount(body, out);
        });
      }, 'Load'),
  ]));

  return VACO.mount(body, out);
}

function renderHostConsole(body) {
  var out = el('div', 'vaco-stack');
  out.appendChild(VACO.notice(
    'Run your own experience: settle it once it has actually happened, and call in VOID\'s own '
    + 'Security, Transport, Space, Staffing or Fulfillment crews — or a CVLLEX merch run — for a '
    + 'specific event. Each of these only works for the real host of the experience; the server '
    + 'checks that, not this page.'));

  out.appendChild(VACO.card('Complete & settle', [
    el('p', 'vaco-small vaco-dim',
      'Marks the experience completed and pays the host + platform fee out of escrow for every '
      + 'attendee. If nobody checked in, every booking is refunded in full instead.'),
    VACO.form([{ name: 'experienceId', label: 'Experience id', type: 'number', min: 1, value: 1, width: '120px' }],
      function (values) {
        return VACO.post('/api/experiences/' + values.experienceId + '/complete', {})
          .then(function (r) {
            VACO.toast('Experience ' + r.experience.id + ' completed — ' + r.completedBookings.length + ' booking(s) settled.', 'money');
            VACO.refreshBalances().then(VACO.renderIdentity);
          });
      }, 'Complete'),
  ]));

  out.appendChild(VACO.card('Request a VOID Event Service', [
    el('p', 'vaco-small vaco-dim',
      'A real job on VOID\'s own marketplace — the host pays when VOID marks it complete, not here.'),
    VACO.form([
      { name: 'experienceId', label: 'Experience id', type: 'number', min: 1, value: 1, width: '110px' },
      { name: 'serviceType', label: 'Service', options: [
        { value: 'security', label: 'Security' },
        { value: 'transport', label: 'Transport' },
        { value: 'space', label: 'Space' },
        { value: 'staffing', label: 'Staffing' },
        { value: 'fulfillment', label: 'Fulfillment' },
      ], width: '130px' },
      { name: 'quantity', label: 'Quantity', type: 'number', min: 1, value: 1, width: '90px' },
      { name: 'unitPrice', label: 'Unit price', type: 'number', min: 1, value: 50, width: '100px' },
    ], function (values) {
      return VACO.post('/api/experiences/' + values.experienceId + '/event-services', {
        serviceType: values.serviceType, quantity: values.quantity, unitPrice: values.unitPrice,
      }).then(function (r) {
        VACO.toast('Requested ' + r.serviceType + ' — VOID job ' + r.voidJobId + '.');
      });
    }, 'Request'),
  ]));

  out.appendChild(VACO.card('Order a physical production run', [
    el('p', 'vaco-small vaco-dim', 'Real merch/collectibles for this specific event, through CVLLEX.'),
    VACO.form([
      { name: 'experienceId', label: 'Experience id', type: 'number', min: 1, value: 1, width: '110px' },
      { name: 'itemType', label: 'Item type', placeholder: 'poster', width: '130px' },
      { name: 'quantity', label: 'Quantity', type: 'number', min: 1, value: 50, width: '90px' },
      { name: 'estimatedUnitCost', label: 'Est. unit cost', type: 'number', min: 0, value: 5, width: '110px' },
    ], function (values) {
      return VACO.post('/api/experiences/' + values.experienceId + '/physical-run', {
        itemType: values.itemType, quantity: values.quantity, estimatedUnitCost: values.estimatedUnitCost,
      }).then(function (r) {
        VACO.toast('Production order ' + r.order.id + ' placed for ' + values.quantity + ' ' + values.itemType + '.');
      });
    }, 'Order'),
  ]));

  out.appendChild(VACO.card('Event service requests for an experience', [
    VACO.form([{ name: 'experienceId', label: 'Experience id', type: 'number', min: 1, value: 1, width: '120px' }],
      function (values) {
        return VACO.api('/api/experiences/' + values.experienceId + '/event-services').then(function (data) {
          while (out.childNodes.length > 5) out.removeChild(out.lastChild);
          out.appendChild(VACO.card('Requests for experience ' + values.experienceId, [
            VACO.table([
              { key: 'id', label: 'Request' },
              { label: 'Type', render: function (r) { return r.serviceType; } },
              { label: 'VOID job', render: function (r) { return r.voidJobId; } },
              { label: 'Status', render: function (r) { return VACO.badge(r.status); } },
            ], data.requests || [], { empty: 'No event service requests yet.' }),
          ]));
          VACO.mount(body, out);
        });
      }, 'Load'),
  ]));

  return VACO.mount(body, out);
}

function renderAnalytics(body) {
  var out = el('div', 'vaco-stack');
  out.appendChild(VACO.notice(
    'Real numbers over your own experiences and bookings — no estimates. Four of the brief\'s own '
    + 'named metrics (conversion, geographic demand, venue performance, advertising performance) '
    + 'aren\'t computable from what this app actually tracks, and say so below rather than guessing.'));

  out.appendChild(VACO.card('Look up a creator', [
    VACO.form([{ name: 'hostId', label: 'Host id', value: VACO.userId() || '', width: '150px' }],
      function (values) {
        if (!values.hostId) throw new Error('Enter a host id.');
        return VACO.api('/api/creators/' + encodeURIComponent(values.hostId) + '/analytics').then(function (a) {
          while (out.childNodes.length > 2) out.removeChild(out.lastChild);

          var stats = el('div', 'stat-row');
          function stat(label, value) {
            var wrap = el('div', 'stat');
            wrap.appendChild(el('span', 'vaco-small vaco-dim', label));
            wrap.appendChild(el('span', 'stat-value', value === null || value === undefined ? '—' : String(value)));
            stats.appendChild(wrap);
          }
          stat('Experiences', a.totalExperiences);
          stat('Bookings', a.totalBookings);
          stat('Gross revenue', VACO.round(a.grossRevenue));
          stat('Your earnings', VACO.round(a.creatorEarnings));
          stat('Avg order', VACO.round(a.averageOrderValue));
          stat('Attended', a.attendedCount);
          stat('No-shows', a.noShowCount);
          stat('Attendance rate', a.attendanceRate === null ? '—' : Math.round(a.attendanceRate * 100) + '%');
          stat('Repeat customers', a.repeatCustomerCount);
          stat('Avg duration', a.averageExperienceDurationMinutes === null ? '—' : a.averageExperienceDurationMinutes + 'm');
          stat('Peak hour (UTC)', a.peakBookingHourUTC === null ? '—' : a.peakBookingHourUTC + ':00');
          out.appendChild(VACO.card(null, [stats]));

          var byFormat = el('div', 'vaco-row-tight');
          Object.keys(a.bookingsByFormat).forEach(function (k) {
            byFormat.appendChild(VACO.badge(k + ': ' + a.bookingsByFormat[k]));
          });
          out.appendChild(VACO.card('By format', [byFormat]));

          var byType = el('div', 'vaco-row-tight');
          Object.keys(a.bookingsByType).forEach(function (k) {
            byType.appendChild(VACO.badge(k + ': ' + a.bookingsByType[k]));
          });
          out.appendChild(VACO.card('By experience type', [byType]));

          var byService = el('div', 'vaco-row-tight');
          Object.keys(a.eventServiceUsage).forEach(function (k) {
            byService.appendChild(VACO.badge(k + ': ' + a.eventServiceUsage[k]));
          });
          out.appendChild(VACO.card('VOID Event Service usage', [byService]));

          out.appendChild(VACO.card('Not yet computable', [
            el('p', 'vaco-small vaco-dim', (a.notComputable || []).join(', ') || 'none'),
          ]));

          VACO.mount(body, out);
        });
      }, 'Load'),
  ]));

  return VACO.mount(body, out);
}

function renderFavorites(body) {
  var out = el('div', 'vaco-stack');
  var id = VACO.userId();
  if (!id) {
    out.appendChild(el('div', 'vaco-empty', 'Sign in to manage your favorite creators.'));
    return VACO.mount(body, out);
  }

  out.appendChild(VACO.card('Favorite a creator', [
    VACO.form([{ name: 'creatorId', label: 'Creator (host) id', placeholder: 'artist-x', width: '160px' }],
      function (values) {
        if (!values.creatorId) throw new Error('Enter a creator id.');
        return VACO.post('/api/favorites', { customerId: id, creatorId: values.creatorId })
          .then(function () { VACO.toast('Favorited ' + values.creatorId + '.'); VACO.render(); });
      }, 'Favorite'),
  ]));

  return VACO.api('/api/customers/' + encodeURIComponent(id) + '/favorites').then(function (data) {
    var favorites = data.favorites || [];
    out.appendChild(VACO.card('Your favorite creators', [
      VACO.table([
        { key: 'creatorId', label: 'Creator' },
        { label: '', render: function (f) {
          return VACO.button('Remove', function () {
            return VACO.post('/api/favorites/remove', { customerId: id, creatorId: f.creatorId })
              .then(function () { VACO.toast('Removed ' + f.creatorId + '.'); VACO.render(); });
          }, 'ghost vaco-btn-sm');
        } },
      ], favorites, { empty: 'No favorites yet.' }),
    ]));
    VACO.mount(body, out);
  });
}

function renderNotifications(body) {
  var out = el('div', 'vaco-stack');
  var id = VACO.userId();
  if (!id) {
    out.appendChild(el('div', 'vaco-empty', 'Sign in to see your notifications.'));
    return VACO.mount(body, out);
  }

  return VACO.api('/api/notifications/' + encodeURIComponent(id)).then(function (data) {
    var notifications = data.notifications || [];
    out.appendChild(VACO.card('Your notifications', [
      VACO.table([
        { label: 'Type', render: function (n) { return VACO.badge(n.type); } },
        { label: 'Subject', render: function (n) {
          var wrap = el('div', 'vaco-stack-sm');
          wrap.style.gap = '2px';
          wrap.appendChild(el('strong', null, n.subject));
          wrap.appendChild(el('span', 'vaco-small vaco-dim', n.message));
          return wrap;
        } },
        { label: '', render: function (n) {
          if (n.read) return VACO.badge('read');
          return VACO.button('Mark read', function () {
            return VACO.post('/api/notifications/' + n.id + '/read', {})
              .then(function () { VACO.toast('Marked read.'); VACO.render(); });
          }, 'ghost vaco-btn-sm');
        } },
      ], notifications, { empty: 'No notifications yet.' }),
    ]));
    VACO.mount(body, out);
  });
}

function renderMedia(body) {
  var out = el('div', 'vaco-stack');
  out.appendChild(VACO.notice(
    'MAGIC PHOTO/VIDEO are real paid add-ons, charged at order time; the host and platform are only '
    + 'paid once a real delivered asset exists — never a placeholder. MAGIC MEMORY only packages a '
    + 'booking that has actually completed.'));

  out.appendChild(VACO.card('Order media for a booking', [
    VACO.form([
      { name: 'bookingId', label: 'Booking id', type: 'number', min: 1, value: 1, width: '110px' },
      { name: 'type', label: 'Type', options: [
        { value: 'magic-photo', label: 'Magic Photo' },
        { value: 'magic-video', label: 'Magic Video' },
        { value: 'magic-memory', label: 'Magic Memory' },
      ], width: '140px' },
      { name: 'price', label: 'Price', type: 'number', min: 1, value: 25, width: '90px' },
    ], function (values) {
      if (!VACO.userId()) throw new Error('Sign in to order.');
      return VACO.post('/api/media-orders', {
        bookingId: values.bookingId, type: values.type, price: values.price, customerId: VACO.userId(),
      }).then(function (o) {
        VACO.toast('Media order ' + o.id + ' placed.', 'money');
        VACO.refreshBalances().then(VACO.renderIdentity);
      });
    }, 'Order'),
  ]));

  var ordersResult = el('div', 'vaco-stack');
  function loadOrders(bookingId) {
    return VACO.api('/api/bookings/' + bookingId + '/media-orders').then(function (data) {
      VACO.mount(ordersResult, VACO.card('Orders for booking ' + bookingId, [
        VACO.table([
          { key: 'id', label: 'Order' },
          { key: 'type', label: 'Type' },
          { label: 'Status', render: function (o) { return VACO.badge(o.status); } },
          { label: '', render: function (o) {
            if (o.status === 'delivered') return '—';
            return VACO.button('Deliver', function () {
              var url = window.prompt('Real asset URL for this delivery:');
              if (!url) throw new Error('Delivery requires a real, non-empty assetUrl.');
              return VACO.post('/api/media-orders/' + o.id + '/deliver', { assetUrl: url })
                .then(function () {
                  VACO.toast('Delivered.', 'money');
                  VACO.refreshBalances().then(VACO.renderIdentity);
                  return loadOrders(bookingId);
                });
            }, 'primary vaco-btn-sm');
          } },
        ], data.mediaOrders || [], { empty: 'No media orders for this booking yet.' }),
      ]));
    });
  }
  out.appendChild(VACO.card('Orders for a booking', [
    el('p', 'vaco-small vaco-dim', 'The host delivers against a real, non-empty asset URL — delivery pays the host + platform fee.'),
    VACO.form([{ name: 'bookingId', label: 'Booking id', type: 'number', min: 1, value: 1, width: '110px' }],
      function (values) { return loadOrders(values.bookingId); }, 'Load'),
  ]));
  out.appendChild(ordersResult);

  var memoryResult = el('div', 'vaco-stack');
  out.appendChild(VACO.card('Magic Memory package', [
    VACO.form([{ name: 'bookingId', label: 'Booking id', type: 'number', min: 1, value: 1, width: '110px' }],
      function (values) {
        return VACO.api('/api/bookings/' + values.bookingId + '/magic-memory').then(function (pkg) {
          var lines = el('div', 'vaco-stack-sm');
          lines.appendChild(el('p', 'vaco-small vaco-dim', pkg.experienceTitle + ' · hosted by ' + pkg.hostId));
          lines.appendChild(VACO.price(pkg.pricePaid, { freeLabel: false }));
          if (!pkg.mediaAssets || !pkg.mediaAssets.length) {
            lines.appendChild(el('div', 'vaco-empty', 'No delivered media yet.'));
          } else {
            pkg.mediaAssets.forEach(function (a) {
              var row = el('div', 'vaco-row-tight');
              row.appendChild(VACO.badge(a.type));
              var link = el('a', null, a.assetUrl);
              link.href = a.assetUrl;
              link.target = '_blank';
              row.appendChild(link);
              lines.appendChild(row);
            });
          }
          VACO.mount(memoryResult, VACO.card('Memory for booking ' + values.bookingId, [lines]));
        });
      }, 'View'),
  ]));
  out.appendChild(memoryResult);

  return VACO.mount(body, out);
}

VACO.app({
  id: 'voidmagic',
  name: 'VOID MAGIC',
  tagline: 'Meet & greet bookings',
  //: VOID MAGIC's identity: a warm coral-orange. Stage-door excitement,
  //: sitting between Vvltvre Pods' rust and CVNVO's coral without
  //: colliding with either.
  accent: '#e86f4f',
  accentDim: '#c25236',
