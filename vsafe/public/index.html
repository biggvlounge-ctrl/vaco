<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VSAFE</title>
<link rel="stylesheet" href="/vaco-design.css" />
<style>
  .safety-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: var(--vaco-space-3); }
  .big { font-size: var(--vaco-text-2xl); font-weight: var(--vaco-weight-bold); font-variant-numeric: tabular-nums; }
</style>
</head>
<body class="vaco">
<script src="/vaco-ui.js"></script>
<script>
// VSAFE — the ecosystem's shared safety layer.
//
// Six apps already call into this service; until now none of them, and
// no person, had a screen for it. Real client of VSAFE's own 43 routes.
//
// **Nothing here simulates safety.** A check-in that escalates does so
// because the server's timer says so. An ID verification badge reflects
// a real verification record. Where a capability is not connected —
// there is no SMS or push channel — this page says so rather than
// implying someone will be contacted.

var el = VACO.el;

// The six real sourceApps a check-in may originate from -- lib/safetyCheckIn.js's
// own SOURCE_APPS, not invented here. There is no seventh "vsafe" option: the
// doc's own "Not yet built" section names VSAFE's standalone onboarding for
// non-VACO users as real, unbuilt work, so a standalone VSAFE user must still
// pick one of the six real originating apps below.
var SOURCE_APPS = ['cvnvo', 'hvntz', 'void', 'vault-studios', 'vacay', 'vxllage'];

function renderCheckIns(body) {
  var out = el('div', 'vaco-stack');
  out.appendChild(VACO.notice(
    'A check-in is a timer with a consequence: miss it and VSAFE escalates to your trusted contacts. '
    + '<strong>Escalation is recorded, not delivered</strong> — no SMS, push, or call channel is connected, '
    + 'so a real deployment needs one before this protects anyone.', 'warn'));

  var id = VACO.userId();
  if (!id) {
    out.appendChild(el('div', 'vaco-empty', 'Sign in to start a check-in.'));
    return VACO.mount(body, out);
  }

  out.appendChild(VACO.card('Start a check-in', [
    VACO.form([
      { name: 'sourceApp', label: 'Originating app', options: SOURCE_APPS, width: '140px' },
      { name: 'activityType', label: 'Activity', placeholder: 'date, hunt-checkpoint, ride…', width: '150px' },
      { name: 'trustedContactIds', label: 'Trusted contacts', placeholder: 'comma-separated user ids', width: '200px' },
      { name: 'checkInWindowMinutes', label: 'Check back in (minutes)', type: 'number', min: 1, value: 60, width: '90px' },
    ], function (values) {
      var contacts = (values.trustedContactIds || '').split(',').map(function (s) { return s.trim(); }).filter(Boolean);
      return VACO.post('/api/check-ins', {
        userId: id,
        sourceApp: values.sourceApp,
        activityType: values.activityType,
        trustedContactIds: contacts,
        checkInWindowMinutes: values.checkInWindowMinutes,
      }).then(function (c) {
        VACO.toast('Check-in ' + c.id + ' armed for ' + values.checkInWindowMinutes + ' minutes.');
        VACO.render();
      });
    }, 'Arm'),
  ]));

  var statusHost = el('div', 'vaco-stack');

  // Real actions, not simulated: Confirm safe and Trigger emergency call the
  // exact same `confirmSafe`/`triggerEmergency` paths the timer sweep and
  // CVNVO's own panic button use. Both require the session to be the
  // check-in's own owner (`requireCheckInOwner`) -- looking up someone else's
  // check-in id still works (the GET is open), but acting on it will 403.
  function renderStatusCard(checkInId, status) {
    var lines = el('div', 'vaco-stack-sm');
    lines.appendChild(VACO.badge(status.status || 'unknown'));
    Object.keys(status).forEach(function (k) {
      if (typeof status[k] === 'object') return;
      lines.appendChild(el('p', 'vaco-small vaco-dim', k + ': ' + status[k]));
    });

    var children = [lines];
    if (status.status === 'active') {
      var actions = el('div', 'vaco-row-tight');
      actions.appendChild(VACO.button('Confirm safe', function () {
        return VACO.post('/api/check-ins/' + checkInId + '/confirm-safe', {}).then(function (updated) {
          VACO.toast('Check-in ' + checkInId + ' confirmed safe.');
          renderStatusCard(checkInId, updated);
        });
      }, 'primary'));
      actions.appendChild(VACO.button('Trigger emergency', function () {
        return VACO.post('/api/check-ins/' + checkInId + '/emergency', {}).then(function (result) {
          var delivered = result.notification && result.notification.notified;
          VACO.toast(
            'Emergency triggered for check-in ' + checkInId
            + (delivered ? ' — vaco-notify accepted the page.' : ' — notification was NOT delivered.'),
            delivered ? undefined : 'danger');
          renderStatusCard(checkInId, result);
        });
      }, 'danger'));
      children.push(actions);
    } else if (status.status === 'escalated') {
      children.push(el('p', 'vaco-small vaco-faint', 'Already escalated — nothing further to do here.'));
    } else if (status.status === 'confirmed-safe') {
      children.push(el('p', 'vaco-small vaco-faint', 'Already confirmed safe.'));
    }

    VACO.mount(statusHost, VACO.card('Check-in ' + checkInId, children));
  }

  out.appendChild(VACO.card('Look up a check-in', [
    VACO.form([{ name: 'id', label: 'Check-in id', type: 'number', min: 1, value: 1, width: '100px' }],
      function (values) {
        return VACO.api('/api/check-ins/' + values.id).then(function (status) {
          renderStatusCard(values.id, status);
        });
      }, 'Status'),
  ]));
  out.appendChild(statusHost);

  return VACO.mount(body, out);
}

// lib/idVerification.js's own ID_DOCUMENT_TYPES — real KYC document types,
// all three real steps (document/selfie/liveness) must independently pass.
var ID_DOCUMENT_TYPES = ['drivers-license', 'passport', 'state-id'];

function renderIdentity(body) {
  var out = el('div', 'vaco-stack');
  var id = VACO.userId();
  if (!id) {
    out.appendChild(el('div', 'vaco-empty', 'Sign in to see your verification status.'));
    return VACO.mount(body, out);
  }

  var grid = el('div', 'safety-grid');

  grid.appendChild(VACO.card('ID verification', [
    (function () {
      var node = el('div', 'vaco-stack-sm');
      node.appendChild(el('p', 'vaco-small vaco-dim', 'Checking…'));
      VACO.api('/api/id-verification/' + encodeURIComponent(id) + '/verified')
        .then(function (v) {
          VACO.mount(node, [
            v.verified ? VACO.badge('verified', 'money') : VACO.badge('not verified', 'warn'),
            el('p', 'vaco-small vaco-dim',
              v.verified
                ? 'Other apps in the ecosystem can trust this identity claim.'
                : 'Unverified. Apps that gate on identity will refuse the gated actions.'),
          ]);
        })
        .catch(function () { VACO.mount(node, el('p', 'vaco-small vaco-faint', 'No verification record.')); });
      return node;
    }()),
    (function () {
      // The full record (GET /api/id-verification/:userId) -- distinct from
      // the boolean badge above: shows exactly which of the three real steps
      // were submitted, not just the final pass/fail.
      var node = el('div', 'vaco-stack-sm');
      VACO.api('/api/id-verification/' + encodeURIComponent(id))
        .then(function (r) {
          VACO.mount(node, VACO.table(
            [{ key: 'field', label: 'Field' }, { key: 'value', label: 'Value' }],
            [
              { field: 'documentType', value: r.documentType },
              { field: 'documentSubmitted', value: String(r.documentSubmitted) },
              { field: 'selfieSubmitted', value: String(r.selfieSubmitted) },
              { field: 'livenessCheckPassed', value: String(r.livenessCheckPassed) },
              { field: 'submittedAt', value: new Date(r.submittedAt).toLocaleString() },
            ]));
        })
        .catch(function () { /* no record yet -- the submission form below covers that */ });
      return node;
    }()),
    VACO.form([
      { name: 'documentType', label: 'Document', options: ID_DOCUMENT_TYPES, width: '130px' },
      { name: 'documentSubmitted', label: 'Document OK', options: ['true', 'false'], value: 'true', width: '85px' },
      { name: 'selfieSubmitted', label: 'Selfie OK', options: ['true', 'false'], value: 'true', width: '85px' },
      { name: 'livenessCheckPassed', label: 'Liveness OK', options: ['true', 'false'], value: 'true', width: '85px' },
    ], function (values) {
      // Real KYC rule, enforced server-side (not re-implemented here): all
      // three must independently pass for `verified` to come back true.
      return VACO.post('/api/id-verification', {
        userId: id,
        documentType: values.documentType,
        documentSubmitted: values.documentSubmitted === 'true',
        selfieSubmitted: values.selfieSubmitted === 'true',
        livenessCheckPassed: values.livenessCheckPassed === 'true',
      }).then(function (r) {
        VACO.toast(r.verified
          ? 'ID verification submitted — all three checks passed, verified.'
          : 'ID verification submitted — not all checks passed, not verified.');
        VACO.render();
      });
    }, 'Submit verification'),
  ]));

  var trustNode = el('div', 'vaco-stack-sm');
  trustNode.appendChild(el('p', 'vaco-small vaco-dim', 'Compute to see your current score.'));
  grid.appendChild(VACO.card('Trust score', [
    trustNode,
    VACO.form([
      { name: 'accountAgeDays', label: 'Account age (days)', type: 'number', min: 0, value: 0, width: '110px' },
      { name: 'reportedIncidentCount', label: 'Reported incidents', type: 'number', min: 0, value: 0, width: '110px' },
    ], function (values) {
      // A real, bounded [0,100] aggregate -- this app supplies accountAgeDays
      // and reportedIncidentCount itself (trustSignals.js never touches
      // CVNVO's Yap directly, per its own header), so these are entered here
      // rather than looked up automatically.
      return VACO.post('/api/trust-score', {
        userId: id,
        accountAgeDays: values.accountAgeDays,
        reportedIncidentCount: values.reportedIncidentCount,
      }).then(function (t) {
        VACO.mount(trustNode, [
          el('p', 'big', String(t.trustScore)),
          VACO.table([{ key: 'k', label: 'Component' }, { key: 'v', label: 'Value' }], [
            { k: 'idVerified', v: String(t.idVerified) },
            { k: 'idBonus', v: t.idBonus },
            { k: 'ageBonus', v: t.ageBonus },
            { k: 'incidentPenalty', v: t.incidentPenalty },
          ]),
        ]);
      });
    }, 'Compute'),
  ]));

  grid.appendChild(VACO.card('Screen time today', [
    (function () {
      var node = el('div', 'vaco-stack-sm');
      node.appendChild(el('p', 'big', '…'));
      VACO.api('/api/screen-time/' + encodeURIComponent(id) + '/daily-total')
        .then(function (t) {
          var mins = t.dailyTotalMinutes !== undefined ? t.dailyTotalMinutes : 0;
          VACO.mount(node, [
            el('p', 'big', mins + 'm'),
            el('p', 'vaco-small vaco-dim',
              'Tracked so a dating or social app can nudge toward a break rather than optimise for time-on-app. '
              + 'Record sessions and manage prompts on the Screen Time tab.'),
          ]);
        })
        .catch(function () { VACO.mount(node, el('p', 'vaco-small vaco-faint', 'No screen time recorded today.')); });
      return node;
    }()),
  ]));

  grid.appendChild(VACO.card('Privacy settings', [
    (function () {
      var node = el('div', null);
      node.textContent = 'Loading…';
      VACO.api('/api/privacy-settings/' + encodeURIComponent(id))
        .then(function (s) {
          var rows = Object.keys(s).map(function (k) { return { setting: k, value: String(s[k]) }; });
          VACO.mount(node, VACO.table(
            [{ key: 'setting', label: 'Setting' }, { key: 'value', label: 'Value' }], rows));
        })
        .catch(function () { node.textContent = 'No privacy settings stored.'; });
      return node;
    }()),
  ]));

  out.appendChild(grid);
  return VACO.mount(body, out);
}

function renderFakeCalls(body) {
  var out = el('div', 'vaco-stack');
  out.appendChild(VACO.notice(
    'A scheduled fake call is an exit from a situation that has turned uncomfortable — the phone rings, you leave. '
    + '<strong>No real call is placed</strong>; VSAFE records that one is due, and the app showing this must ring.'));

  var id = VACO.userId();
  if (!id) {
    out.appendChild(el('div', 'vaco-empty', 'Sign in to schedule a call.'));
    return VACO.mount(body, out);
  }

  // lib/fakeCall.js requires a real, caller-supplied name (no default
  // identity is fabricated) and a bounded delaySeconds (5-300s).
  out.appendChild(VACO.card('Schedule one', [
    VACO.form([
      { name: 'callerName', label: 'Caller name', placeholder: 'who it appears to be', width: '160px' },
      { name: 'delaySeconds', label: 'Ring in (5-300s)', type: 'number', min: 5, value: 15, width: '110px' },
      { name: 'callerPhotoUrl', label: 'Photo URL (optional)', placeholder: 'https://…', width: '180px' },
    ], function (values) {
      var payload = { userId: id, callerName: values.callerName, delaySeconds: values.delaySeconds };
      if (values.callerPhotoUrl) payload.callerPhotoUrl = values.callerPhotoUrl;
      return VACO.post('/api/fake-calls', payload).then(function (c) {
        VACO.toast('Fake call ' + c.id + ' scheduled from "' + c.callerName + '" in ' + values.delaySeconds + 's.');
        VACO.render();
      });
    }, 'Schedule'),
  ]));

  var lookupHost = el('div', 'vaco-stack');

  // Real, deterministic polling: a status badge plus whichever action is
  // real for that status -- 'scheduled' can only be cancelled, 'ringing'
  // can only be answered or dismissed, every other status is terminal.
  function renderFakeCallCard(callId, call) {
    var lines = el('div', 'vaco-stack-sm');
    lines.appendChild(VACO.badge(call.status || 'unknown'));
    Object.keys(call).forEach(function (k) {
      if (typeof call[k] === 'object' || call[k] === null) return;
      lines.appendChild(el('p', 'vaco-small vaco-dim', k + ': ' + call[k]));
    });

    var children = [lines];
    var actions = el('div', 'vaco-row-tight');
    if (call.status === 'scheduled') {
      actions.appendChild(VACO.button('Cancel', function () {
        return VACO.post('/api/fake-calls/' + callId + '/cancel', {}).then(function (updated) {
          VACO.toast('Fake call ' + callId + ' cancelled.');
          renderFakeCallCard(callId, updated);
        });
      }, 'ghost'));
      children.push(actions);
    } else if (call.status === 'ringing') {
      actions.appendChild(VACO.button('Answer', function () {
        return VACO.post('/api/fake-calls/' + callId + '/answer', {}).then(function (updated) {
          VACO.toast('Fake call ' + callId + ' answered.');
          renderFakeCallCard(callId, updated);
        });
      }, 'primary'));
      actions.appendChild(VACO.button('Dismiss', function () {
        return VACO.post('/api/fake-calls/' + callId + '/dismiss', {}).then(function (updated) {
          VACO.toast('Fake call ' + callId + ' dismissed.');
          renderFakeCallCard(callId, updated);
        });
      }, 'ghost'));
      children.push(actions);
    }
    VACO.mount(lookupHost, VACO.card('Fake call ' + callId, children));
  }

  out.appendChild(VACO.card('Look up / manage a fake call', [
    VACO.form([{ name: 'id', label: 'Fake call id', type: 'number', min: 1, value: 1, width: '100px' }],
      function (values) {
        return VACO.api('/api/fake-calls/' + values.id).then(function (call) {
          renderFakeCallCard(values.id, call);
        });
      }, 'Look up'),
  ]));
  out.appendChild(lookupHost);

  // getDueFakeCalls transitions any real due call from 'scheduled' to
  // 'ringing' as a side effect of this read -- the real poll shape every
  // "is it time yet" client in this app uses.
  return VACO.api('/api/fake-calls/due/' + encodeURIComponent(id)).then(function (data) {
    var due = data.due || [];
    out.appendChild(VACO.card('Due now', [
      VACO.table([
        { key: 'id', label: 'Id' },
        { key: 'callerName', label: 'Caller' },
        { key: 'scheduledFor', label: 'Scheduled', render: function (c) { return new Date(c.scheduledAt).toLocaleTimeString(); } },
        {
          key: 'actions', label: '', render: function (c) {
            var row = el('div', 'vaco-row-tight');
            row.appendChild(VACO.button('Answer', function () {
              return VACO.post('/api/fake-calls/' + c.id + '/answer', {}).then(function () {
                VACO.toast('Fake call ' + c.id + ' answered.'); VACO.render();
              });
            }, 'primary vaco-btn-sm'));
            row.appendChild(VACO.button('Dismiss', function () {
              return VACO.post('/api/fake-calls/' + c.id + '/dismiss', {}).then(function () {
                VACO.toast('Fake call ' + c.id + ' dismissed.'); VACO.render();
              });
            }, 'ghost vaco-btn-sm'));
            return row;
          },
        },
      ], due, { empty: 'Nothing due.' }),
    ]));
    VACO.mount(body, out);
  }).catch(function () {
    out.appendChild(el('div', 'vaco-empty', 'No scheduled calls.'));
    VACO.mount(body, out);
  });
}

// lib/photoCheckIn.js's own MISSED_CHECKIN_ACTIONS.
var MISSED_CHECKIN_ACTIONS = ['notify-contacts', 'escalate-emergency'];

function renderPhotoCheckIns(body) {
  var out = el('div', 'vaco-stack');
  out.appendChild(VACO.notice(
    'A photo check-in keeps exactly one live scheduled slot: submit on time and the next slot schedules itself; '
    + 'miss it and the slot resolves to "missed" — or, only if this record is linked to a real, still-active check-in '
    + 'and set to escalate, genuinely triggers that check-in\'s own emergency path. '
    + '<strong>A miss with no linked check-in can only ever fall back to notifying contacts</strong> — there is '
    + 'nothing else real to escalate.', 'warn'));

  var id = VACO.userId();
  if (!id) {
    out.appendChild(el('div', 'vaco-empty', 'Sign in to schedule a photo check-in.'));
    return VACO.mount(body, out);
  }

  out.appendChild(VACO.card('Schedule a photo check-in', [
    VACO.form([
      { name: 'intervalMinutes', label: 'Every (minutes)', type: 'number', min: 1, value: 60, width: '100px' },
      { name: 'trustedContactIds', label: 'Trusted contacts', placeholder: 'comma-separated user ids', width: '200px' },
      { name: 'missedCheckInAction', label: 'If missed', options: MISSED_CHECKIN_ACTIONS, width: '160px' },
      { name: 'checkInId', label: 'Link to check-in id', type: 'number', min: 1, placeholder: 'blank = none', width: '130px' },
    ], function (values) {
      var contacts = (values.trustedContactIds || '').split(',').map(function (s) { return s.trim(); }).filter(Boolean);
      var payload = {
        userId: id, intervalMinutes: values.intervalMinutes, trustedContactIds: contacts,
        missedCheckInAction: values.missedCheckInAction,
      };
      if (values.checkInId) payload.checkInId = values.checkInId;
      return VACO.post('/api/photo-check-ins', payload).then(function (r) {
        VACO.toast('Photo check-in ' + r.id + ' scheduled — first slot due in ' + values.intervalMinutes + ' minutes.');
        VACO.render();
      });
    }, 'Schedule'),
  ]));

  var lookupHost = el('div', 'vaco-stack');

  function renderPhotoCard(pcId, record) {
    var lines = el('div', 'vaco-stack-sm');
    lines.appendChild(VACO.badge(record.active ? 'active' : 'stopped', record.active ? 'money' : 'danger'));
    lines.appendChild(el('p', 'vaco-small vaco-dim',
      'Current slot: ' + record.currentCheckIn.status + ', due ' + new Date(record.currentCheckIn.dueAt).toLocaleString()));
    lines.appendChild(el('p', 'vaco-small vaco-dim', 'Resolved slots so far: ' + record.history.length));
    lines.appendChild(el('p', 'vaco-small vaco-dim',
      'If missed: ' + record.missedCheckInAction
      + (record.checkInId ? (' (linked to check-in ' + record.checkInId + ')') : ' (not linked to any check-in)')));

    var children = [lines];
    if (record.active && record.currentCheckIn.status === 'pending') {
      var row = el('div', 'vaco-row-tight');
      var photoInput = el('input', 'vaco-input');
      photoInput.type = 'text';
      photoInput.placeholder = 'photo URL';
      photoInput.style.width = '200px';
      row.appendChild(photoInput);
      row.appendChild(VACO.button('Submit photo', function () {
        if (!photoInput.value) throw new Error('A photoUrl is required to submit.');
        return VACO.post('/api/photo-check-ins/' + pcId + '/submit', { photoUrl: photoInput.value }).then(function (updated) {
          VACO.toast('Photo check-in ' + pcId + ' submitted on time; next slot scheduled.');
          renderPhotoCard(pcId, updated);
        });
      }, 'primary'));
      children.push(row);
    }
    if (record.active) {
      children.push(VACO.button('Stop', function () {
        return VACO.post('/api/photo-check-ins/' + pcId + '/stop', {}).then(function (updated) {
          VACO.toast('Photo check-in ' + pcId + ' stopped.');
          renderPhotoCard(pcId, updated);
        });
      }, 'ghost'));
    }
    VACO.mount(lookupHost, VACO.card('Photo check-in ' + pcId, children));
  }

  out.appendChild(VACO.card('Look up / manage a photo check-in', [
    VACO.form([{ name: 'id', label: 'Photo check-in id', type: 'number', min: 1, value: 1, width: '130px' }],
      function (values) {
        return VACO.api('/api/photo-check-ins/' + values.id).then(function (record) {
          renderPhotoCard(values.id, record);
        });
      }, 'Look up'),
  ]));
  out.appendChild(lookupHost);

  return VACO.mount(body, out);
}

function renderMeetupVerification(body) {
  var out = el('div', 'vaco-stack');
  out.appendChild(VACO.notice(
    'A meetup verification is a real, two-sided confirmation tied to an existing check-in — both participants '
    + 'independently confirm they are genuinely at the meetup, reducing catfishing/no-show risk. It is distinct from '
    + 'the check-in timer, which only tracks one person\'s safety after the fact.'));

  var id = VACO.userId();
  if (!id) {
    out.appendChild(el('div', 'vaco-empty', 'Sign in to request a meetup verification.'));
    return VACO.mount(body, out);
  }

  out.appendChild(VACO.card('Request a meetup verification', [
    VACO.form([
      { name: 'checkInId', label: 'Check-in id', type: 'number', min: 1, value: 1, width: '110px' },
      { name: 'participantIds', label: 'Participants (include yourself)', placeholder: id + ',other-user', width: '220px' },
    ], function (values) {
      // requireMeetupParticipant: the session's own userId must be among
      // participantIds, or the server refuses this with a 403.
      var participants = (values.participantIds || '').split(',').map(function (s) { return s.trim(); }).filter(Boolean);
      return VACO.post('/api/meetup-verifications', {
        checkInId: values.checkInId, participantIds: participants,
      }).then(function (v) {
        VACO.toast('Meetup verification ' + v.id + ' requested.');
        VACO.render();
      });
    }, 'Request'),
  ]));

  var lookupHost = el('div', 'vaco-stack');

  function renderVerificationCard(vId, v, bothConfirmed) {
    var lines = el('div', 'vaco-stack-sm');
    lines.appendChild(VACO.badge(bothConfirmed ? 'both confirmed' : 'awaiting confirmation', bothConfirmed ? 'money' : 'warn'));
    lines.appendChild(el('p', 'vaco-small vaco-dim', 'Check-in: ' + v.checkInId));
    lines.appendChild(el('p', 'vaco-small vaco-dim', 'Participants: ' + v.participantIds.join(', ')));
    var confirmedIds = v.confirmations.map(function (c) { return c.userId; });
    lines.appendChild(el('p', 'vaco-small vaco-dim', 'Confirmed so far: ' + (confirmedIds.join(', ') || 'none yet')));

    var children = [lines];
    if (v.participantIds.indexOf(id) !== -1 && confirmedIds.indexOf(id) === -1) {
      children.push(VACO.button('Confirm I\'m here', function () {
        return VACO.post('/api/meetup-verifications/' + vId + '/confirm', { userId: id }).then(function (updated) {
          VACO.toast('Confirmed.');
          return VACO.api('/api/meetup-verifications/' + vId + '/both-confirmed').then(function (bc) {
            renderVerificationCard(vId, updated, bc.bothConfirmed);
          });
        });
      }, 'primary'));
    }
    VACO.mount(lookupHost, VACO.card('Verification ' + vId, children));
  }

  out.appendChild(VACO.card('Look up a verification', [
    VACO.form([{ name: 'id', label: 'Verification id', type: 'number', min: 1, value: 1, width: '110px' }],
      function (values) {
        return VACO.api('/api/meetup-verifications/' + values.id).then(function (v) {
          return VACO.api('/api/meetup-verifications/' + values.id + '/both-confirmed').then(function (bc) {
            renderVerificationCard(values.id, v, bc.bothConfirmed);
          });
        });
      }, 'Look up'),
  ]));
  out.appendChild(lookupHost);

  return VACO.mount(body, out);
}

// lib/relationshipSafety.js's own CONCERN_TYPES -- real, recognized
// domestic-violence-safety-awareness categories.
var CONCERN_TYPES = ['controlling-behavior', 'isolation-pattern', 'financial-control', 'threats', 'other'];

function renderSafetyWord(body) {
  var out = el('div', 'vaco-stack');
  out.appendChild(VACO.notice(
    'A safety word is a silent duress code: a correct match genuinely escalates your most recent active check-in '
    + 'through the exact same emergency path a manual panic button uses — without alerting anyone who might be '
    + 'coercing you in the moment. <strong>The check below is real, not a simulation</strong> — if you have a real '
    + 'active check-in, a correct match escalates it for real.', 'warn'));

  var id = VACO.userId();
  if (!id) {
    out.appendChild(el('div', 'vaco-empty', 'Sign in to set a safety word.'));
    return VACO.mount(body, out);
  }

  out.appendChild(VACO.card('Set your safety word', [
    VACO.form([{ name: 'word', label: 'Safety word', placeholder: 'at least 3 characters', width: '170px' }],
      function (values) {
        return VACO.post('/api/safety-word', { userId: id, word: values.word }).then(function () {
          VACO.toast('Safety word set. It is stored as a SHA-256 hash — never plaintext.');
          VACO.render();
        });
      }, 'Set'),
  ]));

  out.appendChild(VACO.card('Test your safety word', [
    VACO.form([{ name: 'inputWord', label: 'Word to check', width: '170px' }],
      function (values) {
        return VACO.post('/api/safety-word/check', { userId: id, inputWord: values.inputWord }).then(function (r) {
          if (!r.matched) { VACO.toast('No match.'); return; }
          VACO.toast(r.escalated
            ? 'Matched — check-in ' + r.checkInId + ' genuinely escalated.'
            : 'Matched, but you have no real active check-in to escalate.');
        });
      }, 'Check'),
  ]));

  out.appendChild(VACO.card('Log a private concern', [
    VACO.form([
      { name: 'aboutUserId', label: 'About (user id)', width: '140px' },
      { name: 'concernType', label: 'Type', options: CONCERN_TYPES, width: '170px' },
      { name: 'details', label: 'Details', placeholder: 'what happened', width: '240px' },
    ], function (values) {
      return VACO.post('/api/relationship-safety/concerns', {
        userId: id, aboutUserId: values.aboutUserId, concernType: values.concernType, details: values.details,
      }).then(function () {
        VACO.toast('Concern logged — structurally private, visible only to you.');
        loadConcerns();
      });
    }, 'Log'),
  ]));

  var concernsNode = el('div', 'vaco-stack-sm');
  // GET .../concerns/:userId only ever returns the requesting userId's own
  // entries -- there is no function anywhere in relationshipSafety.js that
  // lets one user read another's log, so this is genuinely private, not
  // just hidden by this page.
  function loadConcerns() {
    return VACO.api('/api/relationship-safety/concerns/' + encodeURIComponent(id)).then(function (data) {
      VACO.mount(concernsNode, VACO.table([
        { key: 'concernType', label: 'Type' },
        { key: 'aboutUserId', label: 'About' },
        { key: 'details', label: 'Details' },
        { key: 'createdAt', label: 'Logged', render: function (c) { return new Date(c.createdAt).toLocaleString(); } },
      ], data.concerns, { empty: 'No concerns logged.' }));
    });
  }
  out.appendChild(VACO.card('Your concern log (private)', [
    concernsNode,
    VACO.button('Refresh', loadConcerns, 'ghost'),
  ]));
  loadConcerns();

  return VACO.mount(body, out);
}

// lib/privacyControls.js's own PROFILE_VISIBILITY_OPTIONS.
var PROFILE_VISIBILITY_OPTIONS = ['public', 'contacts-only', 'hidden'];

function renderPrivacyBlocking(body) {
  var out = el('div', 'vaco-stack');
  var id = VACO.userId();
  if (!id) {
    out.appendChild(el('div', 'vaco-empty', 'Sign in to manage privacy and blocking.'));
    return VACO.mount(body, out);
  }

  out.appendChild(VACO.card('Edit your privacy settings', [
    VACO.form([
      { name: 'locationSharingDefault', label: 'Share location by default', options: ['true', 'false'], value: 'false', width: '110px' },
      { name: 'profileVisibility', label: 'Profile visibility', options: PROFILE_VISIBILITY_OPTIONS, width: '140px' },
      { name: 'contactInfoHidden', label: 'Hide contact info', options: ['true', 'false'], value: 'true', width: '110px' },
    ], function (values) {
      return VACO.post('/api/privacy-settings', {
        userId: id,
        locationSharingDefault: values.locationSharingDefault === 'true',
        profileVisibility: values.profileVisibility,
        contactInfoHidden: values.contactInfoHidden === 'true',
      }).then(function () { VACO.toast('Privacy settings updated.'); });
    }, 'Save'),
  ]));

  // A real, symmetric block -- checked both directions by isBlocked below.
  out.appendChild(VACO.card('Block a user', [
    VACO.form([{ name: 'blockedUserId', label: 'User id to block', width: '150px' }],
      function (values) {
        return VACO.post('/api/blocks', { userId: id, blockedUserId: values.blockedUserId }).then(function () {
          VACO.toast(values.blockedUserId + ' blocked.');
        });
      }, 'Block'),
  ]));

  out.appendChild(VACO.card('Unblock a user', [
    VACO.form([{ name: 'blockedUserId', label: 'User id to unblock', width: '150px' }],
      function (values) {
        return VACO.post('/api/blocks/remove', { userId: id, blockedUserId: values.blockedUserId }).then(function () {
          VACO.toast(values.blockedUserId + ' unblocked.');
        });
      }, 'Unblock'),
  ]));

  var blockStatusNode = el('div', 'vaco-stack-sm');
  out.appendChild(VACO.card('Check block status', [
    VACO.form([{ name: 'otherUserId', label: 'Other user id', width: '150px' }],
      function (values) {
        return VACO.api('/api/blocks/' + encodeURIComponent(id) + '/' + encodeURIComponent(values.otherUserId)).then(function (r) {
          VACO.mount(blockStatusNode, VACO.badge(r.blocked ? 'blocked' : 'not blocked', r.blocked ? 'danger' : 'money'));
        });
      }, 'Check'),
    blockStatusNode,
  ]));

  return VACO.mount(body, out);
}

VACO.app({
  id: 'vsafe',
  name: 'VSAFE',
  tagline: 'Shared safety layer',
  //: VSAFE's identity: a clear signal blue. Calm authority rather than
  //: alarm red — the colour of a service you want to be boring.
  accent: '#4d94e8',
  accentDim: '#3573c2',
  accentInk: '#04101c',
  tabs: [
    { id: 'checkins', label: 'Check-ins', heading: 'Timed check-ins', render: renderCheckIns },
    { id: 'identity', label: 'Identity', heading: 'Verification & privacy', render: renderIdentity },
    { id: 'calls', label: 'Exit calls', heading: 'Scheduled fake calls', render: renderFakeCalls },
    { id: 'photo-checkins', label: 'Photo check-ins', heading: 'Scheduled photo check-ins', render: renderPhotoCheckIns },
    { id: 'meetup-verification', label: 'Meetup verification', heading: 'Two-sided meetup verification', render: renderMeetupVerification },
    { id: 'safety-word', label: 'Safety word', heading: 'Safety word & relationship safety', render: renderSafetyWord },
    { id: 'privacy-blocking', label: 'Privacy & blocking', heading: 'Privacy settings & blocking', render: renderPrivacyBlocking },
  ],
});
</script>
</body>
</html>
