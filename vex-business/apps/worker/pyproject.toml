[project]
name = "vexbusiness-worker"
version = "0.1.0"
description = "Vex Business — background worker process. Real autonomous PAPER-trading scheduler (worker/main.py): runs several independent, parallel strategy instances (worker/instances.py) against synthetic market data, always through MockBrokerAdapter — never a live broker adapter, regardless of settings (see worker/main.py's own docstring)."
requires-python = ">=3.12"
dependencies = [
    "vexbusiness-domain",
    "vexbusiness-data",
    "vexbusiness-config",
    "vexbusiness-market",
    "vexbusiness-strategy",
    "vexbusiness-execution",
    "redis>=5.2",
]

[tool.uv.sources]
vexbusiness-domain = { workspace = true }
vexbusiness-data = { workspace = true }
vexbusiness-config = { workspace = true }
vexbusiness-market = { workspace = true }
vexbusiness-strategy = { workspace = true }
vexbusiness-execution = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]
