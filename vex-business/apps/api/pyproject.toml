[project]
name = "vexbusiness-api"
version = "0.1.0"
description = "Vex Business — FastAPI backend (Master Directive Section 6: PRESENTATION, REST/WebSocket half)."
requires-python = ">=3.12"
dependencies = [
    "vexbusiness-domain",
    "vexbusiness-data",
    "vexbusiness-config",
    "vexbusiness-research",
    "vexbusiness-execution",
    "vexbusiness-backtest",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[tool.uv.sources]
vexbusiness-domain = { workspace = true }
vexbusiness-data = { workspace = true }
vexbusiness-config = { workspace = true }
vexbusiness-research = { workspace = true }
vexbusiness-execution = { workspace = true }
vexbusiness-backtest = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api"]
