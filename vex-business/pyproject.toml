[project]
name = "vexbusiness-workspace"
version = "0.1.0"
description = "Vex Business — Continuous Autonomous Learning & Logic. Internal autonomous futures-trading research platform. Live trading is disabled by default and gated behind an explicit, multi-part interlock — see config/settings.py and README.md."
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["apps/api", "apps/worker", "config", "packages/*"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.13",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Auto-generated by `alembic revision --autogenerate` -- not hand-
# formatted, so not linted (real generated code, not authored code).
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests", "apps", "packages"]
asyncio_mode = "auto"
