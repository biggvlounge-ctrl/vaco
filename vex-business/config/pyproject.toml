[project]
name = "vexbusiness-config"
version = "0.1.0"
description = "Vex Business — application settings, including the real live-trading-disabled interlock (see config/settings.py). Depends on vexbusiness-domain for its enums only."
requires-python = ">=3.12"
dependencies = [
    "vexbusiness-domain",
    "pydantic-settings>=2.6",
]

[tool.uv.sources]
vexbusiness-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["config"]
