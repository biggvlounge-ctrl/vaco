[project]
name = "vexbusiness-analytics"
version = "0.1.0"
description = "Vex Business — trade journal, analytics, model/strategy versioning reporting (Master Directive Sections 3, 15). Scaffolded in Phase 1; real implementation is Phase 3+ scope, not attempted here."
requires-python = ">=3.12"
dependencies = ["vexbusiness-domain"]

[tool.uv.sources]
vexbusiness-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["analytics"]
