[project]
name = "vexbusiness-backtest"
version = "0.1.0"
description = "Vex Business — event-driven backtest engine, no-look-ahead-bias enforcement (Master Directive Section 21). Phase 12: real walk-forward implementation in backtest/engine.py."
requires-python = ">=3.12"
dependencies = ["vexbusiness-domain", "vexbusiness-strategy", "vexbusiness-risk"]

[tool.uv.sources]
vexbusiness-domain = { workspace = true }
vexbusiness-strategy = { workspace = true }
vexbusiness-risk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backtest"]
