[project]
name = "vexbusiness-research"
version = "0.1.0"
description = "Vex Business — Stephanie's real market/competitor research: genuine, sourced findings on comparable quant/algorithmic-trading research platforms, surfaced through VACON's own Stephanie agent (app: \"Vex Business\"). An internal management tool per the user's own framing — findings are a real, dated snapshot compiled from live web research, not fabricated, and not claimed to update themselves without a person re-running that research."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["research"]
