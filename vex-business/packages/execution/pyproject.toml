[project]
name = "vexbusiness-execution"
version = "0.1.0"
description = "Vex Business — BrokerAdapter interface + Mock/Paper/live-capable-but-disabled adapters (Master Directive Section 19). Phase 10: real MockBrokerAdapter + the live-trading safety gate (create_broker_adapter) + order/position lifecycle helpers are implemented. BrokerAdapterKind.LIVE has no real implementation yet. execution.pipeline (Phase 11) ties Phases 5-10 into one real, callable end-to-end flow."
requires-python = ">=3.12"
dependencies = ["vexbusiness-domain", "vexbusiness-strategy", "vexbusiness-risk"]

[tool.uv.sources]
vexbusiness-domain = { workspace = true }
vexbusiness-strategy = { workspace = true }
vexbusiness-risk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["execution"]
