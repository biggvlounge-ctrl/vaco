[project]
name = "vexbusiness-risk"
version = "0.1.0"
description = "Vex Business — the risk engine (Master Directive Section 16). RISK HAS VETO POWER: this package's approval is the one mandatory, unbypassable gate between a signal/decision and any order reaching the execution engine. Phase 9: the real approve/reject logic (risk/engine.py) is implemented."
requires-python = ">=3.12"
dependencies = ["vexbusiness-domain", "vexbusiness-market"]

[tool.uv.sources]
vexbusiness-domain = { workspace = true }
vexbusiness-market = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["risk"]
