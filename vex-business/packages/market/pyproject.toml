[project]
name = "vexbusiness-market"
version = "0.1.0"
description = "Vex Business — market data adapters, the 5-minute candle engine, ES contract mapping, session engine (Master Directive Sections 8-10)."
requires-python = ">=3.12"
dependencies = ["vexbusiness-domain", "vexbusiness-data"]

[tool.uv.sources]
vexbusiness-domain = { workspace = true }
vexbusiness-data = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["market"]
