<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vavlt Stvdios</title>
<link rel="stylesheet" href="/vaco-design.css" />
<style>
  .screen {
    aspect-ratio: 16 / 9;
    border-radius: var(--vaco-radius-sm);
    border: 1px solid var(--vaco-border-subtle);
    background:
      linear-gradient(135deg, var(--vaco-accent-soft), transparent 70%),
      var(--vaco-bg-raised);
    display: flex; align-items: center; justify-content: center;
    color: var(--vaco-text-faint);
    font-size: var(--vaco-text-xs);
    letter-spacing: 0.08em; text-transform: uppercase;
    position: relative;
  }
  .live-dot {
    position: absolute; top: 8px; left: 8px;
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--vaco-danger);
    box-shadow: 0 0 0 3px var(--vaco-danger-soft);
  }
  /* The eight-screen wall is the app's signature mechanic, so it gets a
     real layout rather than a list. */
  .wall { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: var(--vaco-space-3); }
</style>
</head>
<body class="vaco">
<script src="/vaco-ui.js"></script>
<script>
// Vavlt Stvdios — multi-channel streaming, the IG-style content layer,
// and the eight-screen interactive session.
//
// Real client of its own 57 routes. Grouping rules, tip splits, and
// session state are server-side.

var el = VACO.el;

function screenTile(channel) {
  var tile = el('div', 'screen');
  if (channel.isLive) tile.appendChild(el('span', 'live-dot'));
  tile.appendChild(el('span', null, channel.isLive ? 'live' : 'offline'));
  return tile;
}

// -- Live -------------------------------------------------------------

function renderLive(body) {
  return VACO.api('/api/channels/live').then(function (data) {
    var channels = data.channels || [];
    if (!channels.length) return el('div', 'vaco-empty', 'Nothing live right now.');

    return VACO.grid(channels.map(function (c) {
      var lines = el('div', 'vaco-stack-sm');
      lines.appendChild(screenTile(c));
      lines.appendChild(el('p', 'vaco-small vaco-dim', c.ownerId));
      var meta = el('div', 'vaco-row-tight');
      if (c.groupingType) meta.appendChild(VACO.badge(c.groupingType));
      lines.appendChild(meta);

      // Tipping moves real VCoin through V3, so it is a real control
      // rather than a heart icon.
      var tip = el('div', 'vaco-row-tight');
      var amount = el('input', 'vaco-input vaco-num');
      amount.type = 'number'; amount.min = 1; amount.value = 5;
      amount.style.width = '76px';
      amount.setAttribute('aria-label', 'Tip amount');
      tip.appendChild(amount);
      tip.appendChild(VACO.button('Tip', function () {
        if (!VACO.userId()) throw new Error('Sign in to tip.');
        return VACO.post('/api/channels/' + c.id + '/tips', {
          fromUserId: VACO.userId(), amount: Number(amount.value),
        }).then(function () {
          VACO.toast('Tipped ' + amount.value + ' to ' + c.name, 'money');
          VACO.refreshBalances().then(VACO.renderIdentity);
        });
      }, 'primary'));
      lines.appendChild(tip);

      return VACO.card(c.name, [lines], { trailing: c.isLive ? VACO.badge('live', 'danger') : null });
    }), true);
  });
}

// -- Channels (create, go live/end, chat, tips) -----------------------
//
// The multi-channel core itself had no frontend at all -- Live/Wall
// only ever READ channels seedDemoData had already created and put
// live. This closes that: creating a channel (and, optionally, the
// channel group it joins), going live/ending a stream you own, a
// channel's own independent chat (postMessage/getMessages), and the
// real per-channel and per-person tip totals.

var GROUPING_TYPE_OPTIONS = [
  { label: 'Same location, multiple rooms', value: 'same-location-multi-room' },
  { label: 'Same brand, multiple locations', value: 'same-brand-multi-location' },
  { label: 'Same role, multiple locations', value: 'same-role-multi-location' },
];

function renderChannelChat(channel, host) {
  VACO.mount(host, el('p', 'vaco-small vaco-dim', 'Loading chat…'));
  return VACO.api('/api/channels/' + channel.id + '/chat').then(function (data) {
    var messages = data.messages || [];
    var wrap = el('div', 'vaco-stack-sm');
    var log = el('div', 'vaco-stack-sm');
    if (!messages.length) log.appendChild(el('div', 'vaco-empty', 'No messages yet.'));
    messages.slice(-8).forEach(function (m) {
      var line = el('p', 'vaco-small');
      line.appendChild(el('strong', null, m.userId + ': '));
      line.appendChild(document.createTextNode(m.text));
      log.appendChild(line);
    });
    wrap.appendChild(log);

    if (VACO.userId()) {
      var row = el('div', 'vaco-row-tight');
      var input = el('input', 'vaco-input');
      input.placeholder = 'Say something…';
      input.style.width = '180px';
      input.setAttribute('aria-label', 'Chat message');
      row.appendChild(input);
      row.appendChild(VACO.button('Send', function () {
        var text = input.value.trim();
        if (!text) throw new Error('Type a message first.');
        return VACO.post('/api/channels/' + channel.id + '/chat', { userId: VACO.userId(), text: text })
          .then(function () { input.value = ''; return renderChannelChat(channel, host); });
      }, 'sm'));
      wrap.appendChild(row);
    }
    VACO.mount(host, wrap);
  });
}

function renderChannelTips(channel, host) {
  VACO.mount(host, el('p', 'vaco-small vaco-dim', 'Loading tips…'));
  return VACO.api('/api/channels/' + channel.id + '/tips').then(function (data) {
    VACO.mount(host, VACO.table([
      { key: 'tipperId', label: 'From' },
      { key: 'recipientPersonId', label: 'To' },
      { key: 'amountVCoin', label: 'VCoin', num: true },
    ], data.tips || [], { empty: 'No tips on this channel yet.' }));
  });
}

function renderOwnedChannelCard(channel) {
  var lines = el('div', 'vaco-stack-sm');
  var meta = el('div', 'vaco-row-tight');
  meta.appendChild(VACO.badge(channel.groupingType));
  if (channel.parentGroupId) meta.appendChild(el('span', 'vaco-small vaco-dim', 'group ' + channel.parentGroupId));
  lines.appendChild(meta);
  lines.appendChild(el('p', 'vaco-small vaco-dim', channel.streamUrl));

  lines.appendChild(VACO.button(channel.isLive ? 'End stream' : 'Go live', function () {
    var action = channel.isLive ? 'end' : 'live';
    return VACO.post('/api/channels/' + channel.id + '/' + action, {}).then(function () {
      VACO.toast(channel.isLive ? 'Stream ended.' : 'You are live.');
      VACO.render();
    });
  }, channel.isLive ? 'danger' : 'primary'));

  var chatHost = el('div', 'vaco-stack-sm');
  var tipsHost = el('div', 'vaco-stack-sm');
  var toggles = el('div', 'vaco-row-tight');
  toggles.appendChild(VACO.button('Chat', function () { return renderChannelChat(channel, chatHost); }, 'sm'));
  toggles.appendChild(VACO.button('Tips', function () { return renderChannelTips(channel, tipsHost); }, 'sm'));
  lines.appendChild(toggles);
  lines.appendChild(chatHost);
  lines.appendChild(tipsHost);

  return VACO.card(channel.name, [lines], { trailing: channel.isLive ? VACO.badge('live', 'danger') : VACO.badge('offline') });
}

function renderChannels(body) {
  var userId = VACO.userId();
  var out = el('div', 'vaco-stack');

  if (!userId) {
    out.appendChild(el('div', 'vaco-empty', 'Sign in to create and manage channels.'));
    return VACO.mount(body, out);
  }

  out.appendChild(VACO.card('New channel group', [
    el('p', 'vaco-small vaco-dim',
      'Optional, and only needed before creating the channels that join it — e.g. a club\'s rooms or a franchise\'s locations. '
      + 'Note the new group\'s id so you can pass it below.'),
    VACO.form([
      { name: 'groupingBasis', label: 'Grouping basis', options: GROUPING_TYPE_OPTIONS },
    ], function (values) {
      return VACO.post('/api/channel-groups', values).then(function (g) {
        VACO.toast('Channel group ' + g.id + ' created.');
      });
    }, 'Create group'),
  ]));

  out.appendChild(VACO.card('New channel', [
    VACO.form([
      { name: 'name', label: 'Name', placeholder: 'e.g. Front Door Cam', width: '180px' },
      { name: 'streamUrl', label: 'Stream URL', placeholder: 'rtmp://…', width: '200px' },
      { name: 'groupingType', label: 'Grouping type', options: GROUPING_TYPE_OPTIONS },
      { name: 'parentGroupId', label: 'Group id', type: 'number', placeholder: 'optional', width: '90px' },
    ], function (values) {
      var payload = { ownerId: userId, name: values.name, streamUrl: values.streamUrl, groupingType: values.groupingType };
      if (values.parentGroupId) payload.parentGroupId = Number(values.parentGroupId);
      return VACO.post('/api/channels', payload).then(function () {
        VACO.toast('Channel created.');
        VACO.render();
      });
    }, 'Create channel'),
  ]));

  return VACO.api('/api/owners/' + encodeURIComponent(userId) + '/channels').then(function (data) {
    var channels = data.channels || [];
    if (channels.length) {
      out.appendChild(VACO.grid(channels.map(renderOwnedChannelCard), true));
    } else {
      out.appendChild(el('div', 'vaco-empty', 'You own no channels yet — create one above.'));
    }

    var lookupHost = el('div', 'vaco-stack-sm');
    out.appendChild(VACO.card('Tip earnings lookup', [
      el('p', 'vaco-small vaco-dim', 'A tip pays the specific person on camera, not necessarily the channel owner — look up anyone\'s real total.'),
      VACO.form([
        { name: 'personId', label: 'Person id', placeholder: 'e.g. leon-carter', width: '180px' },
      ], function (values) {
        return VACO.api('/api/people/' + encodeURIComponent(values.personId) + '/tips').then(function (result) {
          VACO.mount(lookupHost, el('p', 'vaco-small', result.personId + ' has earned ' + result.totalTipsVCoin + ' VCoin in tips.'));
        });
      }, 'Look up'),
      lookupHost,
    ]));

    VACO.mount(body, out);
  });
}

// -- The wall ---------------------------------------------------------

function renderWall(body) {
  var out = el('div', 'vaco-stack');
  out.appendChild(VACO.notice(
    'The eight-screen session: several channels from the same venue, brand, or role watched at once. '
    + '<strong>Streams are not real video</strong> — no media infrastructure is connected, so a stream URL is a '
    + 'recorded address rather than a playing feed.', 'warn'));

  return VACO.api('/api/channel-groups').then(function (data) {
    var groups = data.groups || data.channelGroups || [];
    if (!groups.length) {
      out.appendChild(el('div', 'vaco-empty', 'No channel groups yet.'));
      return VACO.mount(body, out);
    }

    var pending = groups.map(function (g) {
      return VACO.api('/api/channel-groups/' + g.id + '/channels')
        .then(function (r) { return { group: g, channels: r.channels || [] }; })
        .catch(function () { return { group: g, channels: [] }; });
    });

    return Promise.all(pending).then(function (loaded) {
      loaded.forEach(function (entry) {
        var wall = el('div', 'wall');
        entry.channels.forEach(function (c) {
          var cell = el('div', 'vaco-stack-sm');
          cell.appendChild(screenTile(c));
          cell.appendChild(el('span', 'vaco-small', c.name));
          wall.appendChild(cell);
        });
        if (!entry.channels.length) wall.appendChild(el('div', 'vaco-empty', 'No channels in this group.'));
        // A group has no name of its own — it is defined by what binds
        // its channels together, so the basis IS the title.
        out.appendChild(VACO.card(
          'Group ' + entry.group.id + ' · ' + entry.channels.length + ' screens',
          [wall],
          { trailing: VACO.badge(entry.group.groupingBasis || 'group') }));
      });
      VACO.mount(body, out);
    });
  });
}

// -- Screen sessions ---------------------------------------------------
//
// A screen session is a real vaco-media live session (`kind: 'wall'`),
// distinct from the static channel-group wall above: creating one
// opens a real session and issues the owner a real join credential.
// `VACO.resolveJoin` + `VACO.joinPanel` (vaco-ui.js) render whatever
// `POST /api/join` answers -- a connected feed once a transport is
// configured, or, today, the honest "approved, nothing will connect"
// note, never a fake live screen.

function joinScreenSession(session, host) {
  if (!session.media || session.media.available === false) {
    VACO.mount(host, VACO.notice(
      (session.media && session.media.reason) || 'This session has no media session registered.',
      'warn',
    ));
    return;
  }
  VACO.mount(host, el('p', 'vaco-small vaco-dim', 'Connecting…'));
  return VACO.resolveJoin(session.media.sessionId, session.media.joinCredential)
    .then(function (join) { VACO.mount(host, VACO.joinPanel(join)); });
}

// Managing an existing session's screens: `addScreenToSession` enforces
// a broadcaster session's channels must be the session's own owner, but
// a viewer session has no such constraint -- combining channels across
// unrelated owners is the entire MultiTwitch/ViewGrid gap this closes.
// So the real pool to add from differs by `sessionType`: the owner's
// own channels for a broadcaster session, any currently-live channel
// for a viewer session.
function renderSessionManage(session, userId, host) {
  VACO.mount(host, el('p', 'vaco-small vaco-dim', 'Loading…'));
  var poolCall = session.sessionType === 'broadcaster'
    ? VACO.api('/api/owners/' + encodeURIComponent(userId) + '/channels')
    : VACO.api('/api/channels/live');

  return Promise.all([VACO.api('/api/screen-sessions/' + session.id), poolCall]).then(function (results) {
    var detail = results[0];
    var pool = results[1].channels || [];
    var wrap = el('div', 'vaco-stack-sm');

    wrap.appendChild(VACO.table([
      { key: 'id', label: 'Channel' },
      { key: 'name', label: 'Name' },
      { key: 'ownerId', label: 'Owner' },
      { label: '', render: function (c) {
        return VACO.button('Remove', function () {
          return VACO.del('/api/screen-sessions/' + session.id + '/screens/' + c.id)
            .then(function () { VACO.toast('Screen removed.'); return renderSessionManage(session, userId, host); });
        }, 'sm');
      } },
    ], (detail.screens || []).filter(Boolean), { empty: 'No screens in this session.' }));

    var included = detail.channelIds || [];
    var addable = pool.filter(function (c) { return included.indexOf(c.id) === -1; });
    if (addable.length && included.length < 8) {
      var row = el('div', 'vaco-row-tight');
      var select = el('select', 'vaco-select');
      addable.forEach(function (c) {
        var opt = el('option', null, (c.name || ('Channel ' + c.id)) + ' — ' + c.ownerId);
        opt.value = c.id;
        select.appendChild(opt);
      });
      row.appendChild(select);
      row.appendChild(VACO.button('Add screen', function () {
        return VACO.post('/api/screen-sessions/' + session.id + '/screens', { channelId: Number(select.value) })
          .then(function () { VACO.toast('Screen added.'); return renderSessionManage(session, userId, host); });
      }, 'sm'));
      wrap.appendChild(row);
    } else if (!addable.length) {
      wrap.appendChild(el('p', 'vaco-small vaco-dim',
        session.sessionType === 'broadcaster' ? 'No more of your own channels to add.' : 'No other live channels to add right now.'));
    }
    VACO.mount(host, wrap);
  });
}

function renderSessions(body) {
  var userId = VACO.userId();
  var out = el('div', 'vaco-stack');
  out.appendChild(VACO.notice(
    'Bundle 1-8 channels into a real screen session and join it. A <strong>broadcaster</strong> session must use '
    + 'only your own channels (e.g. one venue\'s 8 camera angles); a <strong>viewer</strong> session freely mixes '
    + 'any live channels from any owners into your own personal multi-view -- the real MultiTwitch/ViewGrid gap. '
    + 'The session and join credential are real; whether a feed actually connects '
    + 'depends on a live-media transport this ecosystem has not configured yet.', 'warn'));

  if (!userId) {
    out.appendChild(el('div', 'vaco-empty', 'Sign in to create a screen session.'));
    return VACO.mount(body, out);
  }

  var picker = el('div', 'vaco-stack-sm');
  var checkboxes = [];
  var createHost = el('div', 'vaco-stack-sm');
  var sessionType = 'broadcaster';

  function loadPicker() {
    VACO.clear(picker);
    checkboxes = [];
    var poolCall = sessionType === 'broadcaster'
      ? VACO.api('/api/owners/' + encodeURIComponent(userId) + '/channels')
      : VACO.api('/api/channels/live');
    return poolCall.then(function (data) {
      var channels = data.channels || [];
      if (!channels.length) {
        picker.appendChild(el('div', 'vaco-empty', sessionType === 'broadcaster' ? 'You have no channels yet — create one on the Channels tab first.' : 'No channels are live right now.'));
        return;
      }
      channels.forEach(function (c) {
        var row = el('label', 'vaco-row-tight');
        var box = el('input', null);
        box.type = 'checkbox';
        box.value = c.id;
        checkboxes.push(box);
        row.appendChild(box);
        row.appendChild(el('span', 'vaco-small', (c.name || ('Channel ' + c.id)) + (sessionType === 'viewer' ? ' — ' + c.ownerId : '')));
        picker.appendChild(row);
      });
    });
  }

  var typeRow = el('div', 'vaco-row-tight');
  var typeSelect = el('select', 'vaco-select');
  [{ label: 'Broadcaster (my own channels)', value: 'broadcaster' }, { label: 'Viewer (mix any live channels)', value: 'viewer' }].forEach(function (opt) {
    var o = el('option', null, opt.label); o.value = opt.value; typeSelect.appendChild(o);
  });
  typeSelect.addEventListener('change', function () { sessionType = typeSelect.value; loadPicker(); });
  typeRow.appendChild(el('span', 'vaco-label', 'Session type'));
  typeRow.appendChild(typeSelect);

  var createBtn = VACO.button('Create session', function () {
    var channelIds = checkboxes.filter(function (b) { return b.checked; }).map(function (b) { return Number(b.value); });
    if (!channelIds.length) throw new Error('Pick at least one channel.');
    return VACO.post('/api/screen-sessions', {
      ownerId: userId, sessionType: sessionType, channelIds: channelIds,
    }).then(function (session) {
      VACO.toast('Screen session ' + session.id + ' created.');
      joinScreenSession(session, createHost);
    });
  }, 'primary');

  return loadPicker().then(function () {
    out.appendChild(VACO.card('New session', [typeRow, picker, createBtn, createHost]));
    return VACO.api('/api/owners/' + encodeURIComponent(userId) + '/screen-sessions').catch(function () { return null; });
  }).then(function (existing) {
    var sessions = (existing && (existing.sessions || existing.screenSessions || existing)) || [];
    if (sessions.length) {
      var manageHost = el('div', 'vaco-stack-sm');
      // No stored session here carries a joinable credential — vaco-media
      // issues one fresh at creation, not a reusable one kept on the
      // record — so this list is real history plus real screen
      // management (add/remove), not a "Join" surface.
      out.appendChild(VACO.card('Your past sessions', [
        VACO.table([
          { key: 'id', label: 'Id' },
          { key: 'sessionType', label: 'Type' },
          { label: 'Screens', render: function (s) { return (s.channelIds || []).length; } },
          { label: '', render: function (s) {
            return VACO.button('Manage', function () { return renderSessionManage(s, userId, manageHost); }, 'sm');
          } },
        ], sessions, { empty: 'No sessions yet.' }),
        manageHost,
      ]));
    }
    VACO.mount(body, out);
  });
}

// -- Casino events ----------------------------------------------------

function renderEvents(body) {
  return VACO.api('/api/casino-events').then(function (data) {
    var events = data.events || data.casinoEvents || [];
    return VACO.card('Streamed casino events', [
      el('p', 'vaco-small vaco-dim',
        'Watch-together events tied to VAGO. Joining is real state — the attendee list is who is actually in the room.'),
      VACO.table([
        { key: 'id', label: 'Id' },
        { key: 'title', label: 'Event' },
        { key: 'hostId', label: 'Host' },
        { label: 'Status', render: function (r) { return VACO.badge(r.status); } },
        { label: '', render: function (r) {
          return VACO.button('Join', function () {
            if (!VACO.userId()) throw new Error('Sign in to join.');
            return VACO.post('/api/casino-events/' + r.id + '/join', { userId: VACO.userId() })
              .then(function () { VACO.toast('Joined ' + r.title); VACO.render(); });
          }, 'sm');
        } },
      ], events, { empty: 'No casino events scheduled.' }),
    ]);
  });
}

// -- Feed -------------------------------------------------------------

// `p.mediaUrl`/`mediaUrls` are real, caller-supplied addresses — the
// server already withholds them for a locked post the viewer hasn't
// paid for (`applyPostAccess`, fixed 15 Oct 2026 to also cover every
// listing route, not just the single-item one). So this renders the
// real media when the field is present, and the honest "locked" note
// when the server has withheld it — never a placeholder box standing
// in for media it never tried to show.
function postMedia(p) {
  if (p.isLocked && !p.mediaUrl && !p.mediaUrls) {
    return VACO.notice('Locked — subscribe to this creator\'s tier to view.', 'warn');
  }
  if (p.postType === 'carousel' && p.mediaUrls && p.mediaUrls.length) {
    var row = el('div', 'vaco-row-tight');
    p.mediaUrls.forEach(function (url) {
      var img = el('img', null);
      img.src = url;
      img.style.width = '96px';
      img.style.borderRadius = 'var(--vaco-radius-sm)';
      row.appendChild(img);
    });
    return row;
  }
  if (!p.mediaUrl) return el('div', 'screen');
  if (p.postType === 'reel') {
    var video = el('video', null);
    video.src = p.mediaUrl;
    video.controls = true;
    video.style.width = '100%';
    return video;
  }
  var img = el('img', null);
  img.src = p.mediaUrl;
  img.style.width = '100%';
  img.style.borderRadius = 'var(--vaco-radius-sm)';
  return img;
}

function renderFeed(body) {
  var id = VACO.userId();
  if (!id) return el('div', 'vaco-empty', 'Sign in to see the content feed.');

  return VACO.api('/api/feed?viewerId=' + encodeURIComponent(id))
    .catch(function () { return VACO.api('/api/explore?viewerId=' + encodeURIComponent(id)); })
    .then(function (data) {
      var posts = data.posts || data.feed || data.items || [];
      if (!posts.length) return el('div', 'vaco-empty', 'Nothing in the feed yet.');
      return VACO.grid(posts.map(function (p) {
        var lines = el('div', 'vaco-stack-sm');
        lines.appendChild(postMedia(p));
        lines.appendChild(el('p', 'vaco-small vaco-dim', p.caption || p.body || ''));
        var meta = el('div', 'vaco-row-tight');
        if (p.postType) meta.appendChild(VACO.badge(p.postType));
        if (p.source) meta.appendChild(VACO.badge(p.source));
        if (p.isLocked) meta.appendChild(VACO.badge('locked tier', 'warn'));
        lines.appendChild(meta);
        return VACO.card(p.authorId || 'post', [lines]);
      }), true);
    });
}

// -- Videos (long-form, on-demand) --------------------------------------
//
// `mediaUrl` is real and caller-supplied at creation, the same honest
// "already-hosted elsewhere" shape as VENVM's videoUrl and DREAMS'
// creativeUrl — there is no vaco-media asset-registration step here
// because there is no upload-then-wait lifecycle to model; the real
// address already exists by the time a Video record is created.
function renderVideos(body) {
  var out = el('div', 'vaco-stack');

  out.appendChild(VACO.card('Post a video', [
    VACO.form([
      { name: 'title', label: 'Title', placeholder: 'What it is', width: '200px' },
      { name: 'authorId', label: 'Author', value: VACO.userId() || '', width: '130px' },
      { name: 'mediaUrl', label: 'Media URL', placeholder: 'https://…', width: '220px' },
      { name: 'durationSeconds', label: 'Duration (s)', type: 'number', min: 1, width: '110px' },
    ], function (values) {
      return VACO.post('/api/videos', values)
        .then(function () { VACO.toast('Video posted.'); VACO.render(); });
    }, 'Post'),
  ]));

  var viewerId = VACO.userId();
  var url = '/api/video-feed' + (viewerId ? '?viewerId=' + encodeURIComponent(viewerId) : '');
  return VACO.api(url).then(function (data) {
    var videos = data.videos || [];
    if (!videos.length) {
      out.appendChild(el('div', 'vaco-empty', 'No videos yet.'));
      return VACO.mount(body, out);
    }
    out.appendChild(VACO.grid(videos.map(function (v) {
      var lines = el('div', 'vaco-stack-sm');
      if (v.isLocked && !v.mediaUrl) {
        lines.appendChild(VACO.notice('Locked — subscribe to view.', 'warn'));
      } else {
        var video = el('video', null);
        video.src = v.mediaUrl;
        video.controls = true;
        video.style.width = '100%';
        lines.appendChild(video);
      }
      lines.appendChild(el('p', 'vaco-small vaco-dim', v.title));
      var meta = el('div', 'vaco-row-tight');
      meta.appendChild(VACO.badge(v.source));
      if (v.isLocked) meta.appendChild(VACO.badge('locked tier', 'warn'));
      lines.appendChild(meta);
      return VACO.card(v.authorId, [lines]);
    }), true));
    VACO.mount(body, out);
  });
}

VACO.app({
  id: 'vavlt-stvdios',
  name: 'Vavlt Stvdios',
  tagline: 'Multi-channel streaming',
  //: Vavlt Stvdios' identity: an electric violet. Broadcast and stage
  //: lighting, and the one hue no sibling app in the register uses.
  accent: '#9b6ef0',
  accentDim: '#7a4fd0',
  accentInk: '#0d0618',
  tabs: [
    { id: 'live', label: 'Live', heading: 'On air now', render: renderLive },
    { id: 'channels', label: 'Channels', heading: 'Create & manage your channels', render: renderChannels },
    { id: 'wall', label: 'The Wall', heading: 'Eight-screen sessions', render: renderWall },
    { id: 'sessions', label: 'Sessions', heading: 'Live screen sessions', render: renderSessions },
    { id: 'events', label: 'Events', heading: 'Casino streams', render: renderEvents },
    { id: 'feed', label: 'Feed', heading: 'Content', render: renderFeed },
    { id: 'videos', label: 'Videos', heading: 'On-demand, long-form', render: renderVideos },
  ],
});
</script>
</body>
</html>
