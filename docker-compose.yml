# VACO -- generated Docker Compose config. Regenerate with
# node deploy/generate-docker-compose.js
# (also regenerate deploy/nginx-docker.conf: node deploy/generate-nginx-conf.js --docker)
#
# Run:
#   cp .env.example .env   # set ANTHROPIC_API_KEY for v4-proxy
#   docker compose up --build
# Front door: http://localhost/ (nginx -> vaco-shell)
# Direct per-app access (bypassing nginx): http://localhost:<port>/api/health

services:
  vaco-shell:
    build:
      context: ./vaco-shell
      dockerfile: ../deploy/Dockerfile.node
      args:
        PORT: 8789
    container_name: vaco-shell
    environment:
      PORT: 8789
      SHIELD_API_URL: "http://shield:8812"
      V3_API_URL: "http://v3:8811"
      VACON_API_URL: "http://vacon:8805"
      VACO_AUDIT_URL: "http://vaco-audit:8819"
      VACO_OPERATOR_URL: "http://vaco-operator:8820"
      VACO_SERVICE_TOKENS: "${VACO_SERVICE_TOKENS:?Set VACO_SERVICE_TOKENS in .env -- see .env.example}"
      VACO_SERVICE_AUTH_MODE: "${VACO_SERVICE_AUTH_MODE:-enforce}"
      VACO_SERVICE_NAME: vaco-shell
      VACO_SERVICE_TOKEN: "${VACO_TOKEN_VACO_SHELL:?Set a V3 service token for vaco-shell in .env}"
      VACO_AUDIT_MODE: "${VACO_AUDIT_MODE:-enforce}"
      VACO_OPERATOR_MODE: "${VACO_OPERATOR_MODE:-enforce}"
    ports:
      - "8789:8789"
    networks:
      - vaco
    restart: unless-stopped
    depends_on:
      - v3
      - shield
      - vaco-audit
      - vaco-operator
  v4-proxy:
    build:
      context: ./v4-proxy
      dockerfile: ../deploy/Dockerfile.node
      args:
        PORT: 8787
    container_name: v4-proxy
    environment:
      PORT: 8787
      SHIELD_API_URL: "http://shield:8812"
      VACO_MEDIA_URL: "http://vaco-media:8821"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:?Set ANTHROPIC_API_KEY in a .env file at the repo root}"
      VACO_SERVICE_TOKENS: "${VACO_SERVICE_TOKENS:?Set VACO_SERVICE_TOKENS in .env -- see .env.example}"
      VACO_SERVICE_AUTH_MODE: "${VACO_SERVICE_AUTH_MODE:-enforce}"
      VACO_SERVICE_NAME: v4-proxy
      VACO_SERVICE_TOKEN: "${VACO_TOKEN_V4_PROXY:?Set a V3 service token for v4-proxy in .env}"
    ports:
      - "8787:8787"
    networks:
      - vaco
    restart: unless-stopped
    depends_on:
      - v3
      - shield
  v4-search:
