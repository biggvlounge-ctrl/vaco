      VACO_SERVICE_NAME: vacon
      VACO_SERVICE_TOKEN: "${VACO_TOKEN_VACON:?Set a V3 service token for vacon in .env}"
      DATABASE_URL: "postgres://vacancy:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/vacancy"
