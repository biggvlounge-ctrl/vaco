<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VACO Notify</title>
<link rel="stylesheet" href="/vaco-design.css" />
<style>
  .sev { font-size: var(--vaco-text-xs); letter-spacing: 0.06em; text-transform: uppercase; }
  .undelivered-count { font-size: 32px; font-weight: var(--vaco-weight-medium); line-height: 1; }
</style>
</head>
<body class="vaco">
<script src="/vaco-ui.js"></script>
<script>
// VACO Notify — the one channel.
//
// **The number this page exists to show is `undeliveredAlerts`.** Every
// other surface in this ecosystem records alerts; the gap was that none
// of them delivered one. So the first thing on the first tab is a count
// of notifications that claimed to page a human and did not — because a
// notification service whose failures are only visible in a log has
// reproduced the bug it was built to fix.

var el = VACO.el;

var SEV_KIND = { signal: 'info', alert: 'warn', critical: 'danger' };

function sevBadge(severity) {
  return VACO.badge(severity, SEV_KIND[severity] || 'info');
}

function renderStatus(body) {
  var out = el('div', 'vaco-stack');

  return VACO.api('/api/health').then(function (health) {
    var count = health.undeliveredAlerts;
    var card = VACO.card('Alerts that reached nobody', [
      el('div', 'undelivered-count' + (count > 0 ? ' vaco-danger' : ''), String(count)),
      el('p', 'vaco-small vaco-dim', count > 0
        ? 'Each of these was raised and no channel accepted it. That is the failure this service exists to make visible rather than silent.'
        : 'Every alert raised so far was accepted by at least one channel.'),
    ], { trailing: count > 0 ? VACO.badge('action needed', 'danger') : VACO.badge('clear', 'money') });
    out.appendChild(card);

    out.appendChild(VACO.card('Channels', [
      el('p', 'vaco-small', 'Working today, with no vendor account: '
        + health.channels.join(', ') + '.'),
      el('p', 'vaco-small vaco-dim', 'A webhook target works with Slack, Discord, PagerDuty and '
        + 'Opsgenie as-is. Not implemented: ' + health.unimplementedChannels.join(', ')
        + ' — these need a vendor, and are refused at subscribe time rather than stubbed, '
        + 'because a stub that accepts a message and drops it is the exact bug this service closes.'),
    ]));

    out.appendChild(VACO.card('Delivery attempts by severity', [
      VACO.table(
        [{ key: 'severity', label: 'Severity' }, { key: 'attempts', label: 'Attempts' }, { key: 'meaning', label: 'Posture' }],
        [
          { severity: 'signal', attempts: health.attemptsBySeverity.signal, meaning: 'best effort — a dropped one costs a data point' },
          { severity: 'alert', attempts: health.attemptsBySeverity.alert, meaning: 'retried, and a total failure is recorded' },
          { severity: 'critical', attempts: health.attemptsBySeverity.critical, meaning: 'must not fail silently' },
        ],
      ),
    ]));

    return VACO.mount(body, out);
  });
}

function renderNotifications(body) {
  var out = el('div', 'vaco-stack');
  return VACO.api('/api/notifications?limit=50').then(function (data) {
    if (data.notifications.length === 0) {
      out.appendChild(VACO.notice('Nothing has been sent yet.'));
      return VACO.mount(body, out);
    }
    data.notifications.forEach(function (n) {
      var delivered = n.status === 'delivered';
      out.appendChild(VACO.card(n.title, [
        el('p', 'vaco-small vaco-dim', n.body || ''),
        el('p', 'vaco-small vaco-mono', n.app + ' · ' + new Date(n.createdAt).toLocaleString()),
        n.deliveries.length > 0
          ? VACO.table([{ key: 'subscription', label: 'To' }, { key: 'channel', label: 'Channel' }, { key: 'result', label: 'Result' }],
            n.deliveries.map(function (d) {
              return { subscription: d.subscription, channel: d.channel, result: d.ok ? 'delivered' : (d.error || 'failed') };
            }))
          : el('p', 'vaco-small vaco-danger', 'No subscription matched — nobody was configured to hear this.'),
      ], { trailing: delivered ? VACO.badge('delivered', 'money') : VACO.badge('undelivered', 'danger') }));
    });
    return VACO.mount(body, out);
  });
}

// `GET /api/notifications/undelivered` had no frontend at all. The
// Status tab only ever showed a *count* (`health.undeliveredAlerts`);
// this is the real list behind that number — the one an operator
// actually needs to act on, not just be alarmed by.
function renderUndelivered(body) {
  var state = { minSeverity: 'alert' };

  function load() {
    return VACO.api('/api/notifications/undelivered?minSeverity=' + encodeURIComponent(state.minSeverity))
      .then(function (data) {
        var out = el('div', 'vaco-stack');
        out.appendChild(VACO.notice(
          'Everything below was raised and <strong>no channel accepted it</strong> — the exact failure '
          + 'this service exists to end. A clean list at "alert" or above means the service is doing its '
          + 'job; a non-empty one means a safety or money escalation went unheard.'));

        out.appendChild(VACO.card('Filter', [
          VACO.form([
            { name: 'minSeverity', label: 'From severity', options: ['alert', 'critical', 'signal'], value: state.minSeverity },
          ], function (values) {
            state.minSeverity = values.minSeverity;
            return load();
          }, 'Apply'),
        ]));

        if (data.undelivered.length === 0) {
          out.appendChild(VACO.notice('Nothing undelivered at or above "' + state.minSeverity + '".', 'money'));
        } else {
          out.appendChild(VACO.card(data.undelivered.length + ' undelivered', [
            VACO.table([
              { key: 'id', label: 'ID' },
              { key: 'app', label: 'App' },
              { key: 'severity', label: 'Severity', render: function (row) { return sevBadge(row.severity); } },
              { key: 'title', label: 'Title' },
              { key: 'createdAt', label: 'When', render: function (row) { return new Date(row.createdAt).toLocaleString(); } },
              { key: 'reason', label: 'Why', render: function (row) {
                return row.deliveries.length === 0
                  ? 'no subscription matched'
                  : row.deliveries.length + ' channel(s) attempted, all failed';
              } },
            ], data.undelivered),
          ]));
        }

        return VACO.mount(body, out);
      });
  }

  return load();
}

// Changing who gets paged is an administrative act (`requireOperator`
// on both the real POST and DELETE routes) -- it needs a real
// X-Operator-Credential, not a session token, same as the credential
// widget `cvnvo/yap`'s Moderate tab already established for exactly
// this situation. The previous version of this tab sent an
// `operatorId` field in the POST body; `subscribe()` never reads that
// field and the guard checks a header, so that form 401'd against any
// deployment actually enforcing it. Fixed here along with adding the
// DELETE route (unsubscribe), which had no frontend at all.
function renderSubscriptions(body) {
  var out = el('div', 'vaco-stack');
  var state = { credential: '' };

  out.appendChild(VACO.notice(
    'A subscription is <strong>who hears about what</strong>. Deliberately not a broadcast: '
    + 'an ad-budget alert and a safety escalation should not land in the same place by default. '
    + 'A pager that cries wolf gets muted, and then the real one is missed.'));

  out.appendChild(VACO.notice(
    'Adding or removing a subscription changes who gets paged, so every change here needs a real '
    + 'operator credential from vaco-operator (X-Operator-Credential) -- a session alone is not enough.', 'warn'));

  out.appendChild(VACO.card('Operator credential', [
    VACO.form([{ name: 'credential', label: 'X-Operator-Credential', placeholder: 'from vaco-operator', width: '220px' }],
      function (values) { state.credential = values.credential; VACO.toast('Credential set for this session.'); }, 'Use this credential'),
  ]));

  function authedHeaders() {
    return { 'Content-Type': 'application/json', 'X-Operator-Credential': state.credential };
  }

  var listCard = el('div');
  out.appendChild(listCard);

  function unsubscribeOne(name) {
    if (!state.credential) { VACO.toast('Set an operator credential first.', 'warn'); return Promise.resolve(); }
    if (!window.confirm('Remove subscription "' + name + '"? It stops hearing about new alerts immediately.')) return Promise.resolve();
    return VACO.api('/api/subscriptions/' + encodeURIComponent(name), { method: 'DELETE', headers: authedHeaders() })
      .then(function () { VACO.toast('Removed "' + name + '".'); return loadList(); });
  }

  function loadList() {
    return VACO.api('/api/subscriptions').then(function (data) {
      VACO.mount(listCard, VACO.card('Current subscriptions', [
        VACO.table([
          { key: 'name', label: 'Name' },
          { key: 'channel', label: 'Channel' },
          { key: 'minSeverity', label: 'From severity' },
          { key: 'apps', label: 'Apps' },
          { key: 'remove', label: '', render: function (row) {
            return VACO.button('Remove', function () { return unsubscribeOne(row.name); }, 'ghost vaco-btn-sm');
          } },
        ], data.subscriptions.map(function (s) {
          return {
            name: s.name, channel: s.channel, minSeverity: s.minSeverity,
            apps: s.apps ? s.apps.join(', ') : 'all',
          };
        })),
      ]));
    });
  }

  out.appendChild(VACO.card('Add a subscription', [
    VACO.form([
      { name: 'name', label: 'Name', width: '140px' },
      { name: 'channel', label: 'Channel', options: ['console', 'file', 'webhook'] },
      { name: 'target', label: 'Target (webhook URL)', width: '220px' },
      { name: 'minSeverity', label: 'From', options: ['alert', 'critical', 'signal'] },
    ], function (values) {
      if (!state.credential) { VACO.toast('Set an operator credential first.', 'warn'); return Promise.resolve(); }
      var payload = { name: values.name, channel: values.channel, minSeverity: values.minSeverity };
      if (values.target) payload.target = values.target;
      return VACO.api('/api/subscriptions', { method: 'POST', headers: authedHeaders(), body: JSON.stringify(payload) })
        .then(function (s) {
          VACO.toast('Subscribed "' + s.name + '".');
          return loadList();
        });
    }, 'Subscribe'),
  ]));

  out.appendChild(buildWebpushCard(state, authedHeaders, function () { return loadList(); }));

  return loadList().then(function () { return VACO.mount(body, out); });
}

// `GET /api/webpush/public-key` and the entire `webpush` channel had
// zero frontend presence -- not even an explanation of why. This is
// the real browser-side half of `lib/notify.js`'s webpush adapter:
// register the service worker (`/sw.js`), subscribe this browser via
// the real PushManager API using the server's real VAPID public key,
// and hand the real PushSubscription straight to
// `POST /api/subscriptions` as `target` -- the exact shape
// `subscribe()` validates (`{ endpoint, keys: { p256dh, auth } }`).
function buildWebpushCard(state, authedHeaders, reloadList) {
  var container = el('div');
  var supported = 'serviceWorker' in navigator && 'PushManager' in window;

  if (!supported) {
    container.appendChild(VACO.card('Browser push (webpush)', [
      el('p', 'vaco-small vaco-dim', 'This browser does not support push notifications.'),
    ]));
    return container;
  }

  function renderUnconfigured() {
    VACO.mount(container, VACO.card('Browser push (webpush)', [
      el('p', 'vaco-small vaco-dim',
        'Not configured on this deployment -- no VAPID_PUBLIC_KEY set. Run '
        + '"npm run generate-vapid-keys" and set VAPID_PUBLIC_KEY/VAPID_PRIVATE_KEY to enable '
        + 'push straight to a browser, no vendor account needed.'),
    ]));
  }

  function renderConfigured(publicKey) {
    VACO.mount(container, VACO.card('Browser push (webpush)', [
      el('p', 'vaco-small vaco-dim',
        'Subscribes THIS browser directly to real RFC 8030/8291 web push -- delivery lands in the '
        + "OS notification tray, no vendor account beyond the deployment's own VAPID keypair."),
      VACO.form([
        { name: 'name', label: 'Name', width: '140px' },
        { name: 'minSeverity', label: 'From', options: ['alert', 'critical', 'signal'] },
      ], function (values) {
        if (!state.credential) { VACO.toast('Set an operator credential first.', 'warn'); return Promise.resolve(); }
        if (!values.name) { VACO.toast('Name this subscription first.', 'warn'); return Promise.resolve(); }
        return navigator.serviceWorker.register('/sw.js')
          .then(function () { return navigator.serviceWorker.ready; })
          .then(function (registration) {
            return registration.pushManager.subscribe({
              userVisibleOnly: true,
              applicationServerKey: urlBase64ToUint8Array(publicKey),
            });
          })
          .then(function (pushSubscription) {
            var payload = {
              name: values.name, channel: 'webpush', minSeverity: values.minSeverity,
              target: pushSubscription.toJSON(),
            };
            return VACO.api('/api/subscriptions', { method: 'POST', headers: authedHeaders(), body: JSON.stringify(payload) });
          })
          .then(function (s) {
            VACO.toast('This browser now subscribed as "' + s.name + '".');
            return reloadList();
          });
      }, 'Enable push in this browser'),
    ]));
  }

  VACO.api('/api/webpush/public-key').then(function (data) {
    renderConfigured(data.publicKey);
  }).catch(function () {
    renderUnconfigured();
  });

  return container;
}

// Standard VAPID applicationServerKey conversion -- pushManager.subscribe
// takes a Uint8Array, the server hands back a URL-safe base64 string.
function urlBase64ToUint8Array(base64String) {
  var padding = '='.repeat((4 - base64String.length % 4) % 4);
  var base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  var rawData = window.atob(base64);
  var outputArray = new Uint8Array(rawData.length);
  for (var i = 0; i < rawData.length; i += 1) {
    outputArray[i] = rawData.charCodeAt(i);
  }
  return outputArray;
}

VACO.app({
  id: 'vaco-notify',
  name: 'VACO Notify',
  tagline: 'The one channel — escalations, alerts, signals',
  //: Notify's identity: signal amber. It sits deliberately between
  //: VAGO's casino brass (40°) and HVNTZ's lime (78°) at ~52°, and it
  //: is the one place a warm alerting colour is the *subject* rather
  //: than a semantic overlay. Chosen over red: this service is not an
  //: emergency, it is the thing that tells you about one, and a console
  //: that always looks alarming stops being read.
  accent: '#d8b24a',
  accentDim: '#b0902f',
  accentInk: '#12100a',
  tabs: [
    { id: 'status', label: 'Status', heading: 'Delivery', render: renderStatus },
    { id: 'sent', label: 'Sent', heading: 'Recent notifications', render: renderNotifications },
    { id: 'undelivered', label: 'Undelivered', heading: 'Nobody got this', render: renderUndelivered },
    { id: 'subs', label: 'Subscriptions', heading: 'Who hears what', render: renderSubscriptions },
  ],
});
</script>
</body>
</html>
