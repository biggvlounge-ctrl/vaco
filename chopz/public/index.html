<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CHOPZ</title>
<link rel="stylesheet" href="/vaco-design.css" />
<style>
  .reel {
    aspect-ratio: 9 / 16;
    border-radius: var(--vaco-radius);
    border: 1px solid var(--vaco-border-subtle);
    background: linear-gradient(180deg, transparent 40%, var(--vaco-accent-soft)), var(--vaco-bg-raised);
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: var(--vaco-space-3); gap: var(--vaco-space-2);
  }
  .feed-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: var(--vaco-space-4); }
</style>
</head>
<body class="vaco">
<script src="/vaco-ui.js"></script>
<script>
// CHOPZ — the short-form video feed.
//
// **A real "Play" action, wired to vaco-media (15 Oct 2026).** Posting
// a video registers a real media asset; pressing Play claims a real
// playback grant for it (`POST /chopz/videos/:id/play`), which
// `VACO.resolvePlayback` + `VACO.mediaPlayer` (vaco-ui.js) turn into a
// real `<video>` or the honest "nothing stored yet" note — never a
// placeholder clip. No object store is configured anywhere in this
// ecosystem yet, so today Play shows that honest note; the moment
// `VACO_MEDIA_STORAGE=s3` points at a real bucket, the same code plays
// the real file.
//
// What else is real: a video that claims to link a product is
// verified against CHOPZ SHOP's actual catalogue, so a creator cannot
// tag something that does not exist.

var el = VACO.el;

function playChopzVideo(videoId, host) {
  var viewerId = VACO.userId();
  if (!viewerId) { VACO.toast('Sign in to watch.', 'danger'); return; }
  return VACO.post('/chopz/videos/' + videoId + '/play', { viewerId: viewerId })
    .then(function (r) {
      if (!r.media || r.media.available === false) {
        VACO.mount(host, VACO.notice(
          (r.media && r.media.reason) || 'This video has no media asset registered yet.',
          'warn',
        ));
        return;
      }
      VACO.mount(host, el('p', 'vaco-small vaco-dim', 'Connecting…'));
      return VACO.resolvePlayback(r.media.assetId, r.media.playbackCredential)
        .then(function (playback) { VACO.mount(host, VACO.mediaPlayer(playback)); });
    })
    .catch(VACO.error);
}

// Shared per-video card -- both the plain Feed and the For You tab
// render the real same card for a video, so there is exactly one
// place that knows how to draw a video, not two that can drift apart.
function buildVideoCard(v) {
      var cell = el('div', 'vaco-stack-sm');
      var reel = el('div', 'reel');
      reel.appendChild(el('strong', null, v.creatorId || ''));
      reel.appendChild(el('span', 'vaco-small vaco-dim', v.mediaUrl || ''));
      cell.appendChild(reel);

      // A real, local relationship -- no fabricated video composition,
      // see lib/videos.js's own header. Duets are an ordinary video
      // with one extra field.
      if (v.duetOfVideoId) {
        cell.appendChild(VACO.badge('duet of #' + v.duetOfVideoId, 'warn'));
      }

      // Only present on a For You card -- the real score breakdown
      // GET /chopz/for-you returns, not fabricated client-side.
      if (v.forYou) {
        var scoreRow = el('div', 'vaco-row-tight');
        scoreRow.appendChild(VACO.badge('score ' + v.forYou.score.toFixed(1)));
        if (v.forYou.affinityMultiplier > 1) {
          scoreRow.appendChild(VACO.badge('you like ' + v.creatorId, 'money'));
        }
        cell.appendChild(scoreRow);
      }

      var playerHost = el('div', 'vaco-stack-sm');
      cell.appendChild(VACO.button('Play', function () { playChopzVideo(v.id, playerHost); }, 'sm'));
      cell.appendChild(playerHost);

      var engagement = v.engagement || { likeCount: 0, commentCount: 0, shareCount: 0, playCount: 0 };
      var engagementRow = el('div', 'vaco-row-tight');
      engagementRow.appendChild(VACO.badge('▶ ' + engagement.playCount));
      var likeBtn = VACO.button('♥ ' + engagement.likeCount, function () {
        var userId = VACO.userId();
        if (!userId) { VACO.toast('Sign in to like.', 'danger'); return; }
        return VACO.post('/chopz/videos/' + v.id + '/like', { userId: userId }).then(function (r) {
          likeBtn.textContent = '♥ ' + r.likeCount;
        });
      }, 'sm');
      engagementRow.appendChild(likeBtn);

      var shareBtn = VACO.button('share · ' + engagement.shareCount, function () {
        var userId = VACO.userId();
        if (!userId) { VACO.toast('Sign in to share.', 'danger'); return; }
        return VACO.post('/chopz/videos/' + v.id + '/share', { userId: userId }).then(function (r) {
          shareBtn.textContent = 'share · ' + r.shareCount;
          VACO.toast('Shared.', 'money');
        });
      }, 'sm');
      engagementRow.appendChild(shareBtn);
      cell.appendChild(engagementRow);

      var commentsHost = el('div', 'vaco-stack-sm');
      function refreshComments() {
        return VACO.api('/chopz/videos/' + v.id + '/comments').then(function (r) {
          var comments = r.comments || [];
          var list = el('div', 'vaco-stack-sm');
          comments.forEach(function (c) {
            var line = el('p', 'vaco-small');
            var who = el('strong', null, c.authorId + ': ');
            line.appendChild(who);
            line.appendChild(document.createTextNode(c.text));
            list.appendChild(line);
          });
          if (!comments.length) list.appendChild(el('p', 'vaco-small vaco-dim', 'No comments yet.'));

          var input = document.createElement('input');
          input.className = 'vaco-input';
          input.placeholder = 'Add a comment…';
          var addBtn = VACO.button('Post', function () {
            var userId = VACO.userId();
            if (!userId) { VACO.toast('Sign in to comment.', 'danger'); return; }
            if (!input.value) return;
            return VACO.post('/chopz/videos/' + v.id + '/comments', { authorId: userId, text: input.value })
              .then(function () { input.value = ''; return refreshComments(); });
          }, 'sm');
          var inputRow = el('div', 'vaco-row-tight');
          inputRow.appendChild(input);
          inputRow.appendChild(addBtn);

          VACO.mount(commentsHost, [list, inputRow]);
          commentsToggle.textContent = comments.length + ' comment' + (comments.length === 1 ? '' : 's');
        });
      }
      var commentsToggle = VACO.button(
        engagement.commentCount + ' comment' + (engagement.commentCount === 1 ? '' : 's'),
        refreshComments,
        'sm',
      );
      cell.appendChild(commentsToggle);
      cell.appendChild(commentsHost);

      // -- Duets: a real local relationship, posted as an ordinary new
      // video with duetOfVideoId set. No real split-screen composition
      // happens here or anywhere in this app -- see lib/videos.js's own
      // header for exactly why, and what this honestly is instead.
      var duetsHost = el('div', 'vaco-stack-sm');
      function refreshDuets() {
        return VACO.api('/chopz/videos/' + v.id + '/duets').then(function (r) {
          var duets = r.duets || [];
          var list = el('div', 'vaco-stack-sm');
          duets.forEach(function (d) {
            list.appendChild(el('p', 'vaco-small', d.creatorId + ' duetted this · ' + d.mediaUrl));
          });
          if (!duets.length) list.appendChild(el('p', 'vaco-small vaco-dim', 'No duets yet.'));

          var input = document.createElement('input');
          input.className = 'vaco-input';
          input.placeholder = 'Your duet\'s media URL…';
          var duetBtn = VACO.button('Post duet', function () {
            var userId = VACO.userId();
            if (!userId) { VACO.toast('Sign in to duet.', 'danger'); return; }
            if (!input.value) return;
            return VACO.post('/chopz/videos', { creatorId: userId, mediaUrl: input.value, duetOfVideoId: v.id })
              .then(function () { input.value = ''; VACO.toast('Duet posted.', 'money'); return refreshDuets(); });
          }, 'sm');
          var inputRow = el('div', 'vaco-row-tight');
          inputRow.appendChild(input);
          inputRow.appendChild(duetBtn);

          VACO.mount(duetsHost, [list, inputRow]);
          duetsToggle.textContent = duets.length + ' duet' + (duets.length === 1 ? '' : 's');
        });
      }
      var duetsToggle = VACO.button(
        (v.duetCount || 0) + ' duet' + (v.duetCount === 1 ? '' : 's'),
        refreshDuets,
        'sm',
      );
      cell.appendChild(duetsToggle);
      cell.appendChild(duetsHost);

      var meta = el('div', 'vaco-row-tight');
      if (v.linkedProductId) {
        var badge = VACO.badge('product ' + v.linkedProductId, 'warn');
        meta.appendChild(badge);
        // Verify against CHOPZ SHOP's real catalogue rather than
        // trusting the tag on the video.
        VACO.post('/chopz/videos/' + v.id + '/verify-linked-product', {})
          .then(function (r) {
            // The route returns the real, updated video record itself
            // (see POST /chopz/videos/:id/verify-linked-product in
            // server.js) -- `linkedProductVerified` is the field it
            // actually sets, not `verified`/`valid`.
            var ok = r.linkedProductVerified === true;
            badge.className = 'vaco-badge ' + (ok ? 'vaco-badge-money' : 'vaco-badge-danger');
            badge.textContent = ok
              ? 'product verified' + (r.linkedProductPrice !== undefined ? ' · $' + r.linkedProductPrice : '')
              : 'product not found';
          })
          .catch(function () { badge.textContent = 'verification unavailable'; });
      } else {
        meta.appendChild(VACO.badge('no product'));
      }
      cell.appendChild(meta);
      return cell;
}

function renderVideoGrid(out, body, videos) {
  if (!videos.length) {
    out.appendChild(el('div', 'vaco-empty', 'No videos yet.'));
    return VACO.mount(body, out);
  }
  var grid = el('div', 'feed-grid');
  videos.forEach(function (v) { grid.appendChild(buildVideoCard(v)); });
  out.appendChild(grid);
  VACO.mount(body, out);
}

function renderFeed(body) {
  var out = el('div', 'vaco-stack');
  out.appendChild(VACO.notice(
    'Each card is a real record with a real playback path to vaco-media. '
    + '<strong>No object store is configured yet</strong>, so Play currently shows an honest '
    + '"nothing stored" note instead of video — the same code plays the real file once one is. '
    + 'The linked-product check below is real: it verifies against CHOPZ SHOP’s catalogue, '
    + 'so a tagged product either exists or the tag is refused.', 'warn'));

  return VACO.api('/chopz/videos').then(function (data) {
    renderVideoGrid(out, body, data.videos || data || []);
  });
}

function renderForYou(body) {
  var out = el('div', 'vaco-stack');
  var viewerId = VACO.userId();
  out.appendChild(VACO.notice(
    'A real, deterministic ranking over real engagement (plays/likes/comments/shares, '
    + 'rarer actions weighted higher), decayed on a real 48-hour half-life. '
    + (viewerId
      ? 'Signed in as <strong>' + viewerId + '</strong> — videos from creators you\'ve engaged with before rank higher.'
      : 'Sign in to see creator-affinity boosts; this is the unpersonalized ranking.'),
    'warn'));

  var qs = viewerId ? ('?viewerId=' + encodeURIComponent(viewerId)) : '';
  return VACO.api('/chopz/for-you' + qs).then(function (data) {
    renderVideoGrid(out, body, data.videos || data || []);
  });
}

function renderPost(body) {
  return VACO.card('Post a video record', [
    el('p', 'vaco-small vaco-dim',
      'Tagging a product is checked against CHOPZ SHOP. An id that does not exist there is refused rather than stored.'),
    VACO.form([
      { name: 'creatorId', label: 'Creator', value: VACO.userId() || '', width: '130px' },
      { name: 'mediaUrl', label: 'Media URL', placeholder: 'https://cdn/clip.mp4', width: '240px' },
      { name: 'linkedProductId', label: 'Product id', placeholder: 'optional', width: '110px' },
    ], function (values) {
      if (!values.linkedProductId) delete values.linkedProductId;
      return VACO.post('/chopz/videos', values)
        .then(function (v) { VACO.toast('Video ' + v.id + ' posted.'); VACO.render(); });
    }, 'Post'),
  ]);
}

VACO.app({
  id: 'chopz',
  name: 'CHOPZ',
  tagline: 'Short-form video',
  //: CHOPZ's identity: a vivid spring green. Fast and young, and far
  //: enough from VXLLAGE's calmer green-teal to read as its own thing.
  accent: '#5fd44f',
  accentDim: '#43ae35',
  accentInk: '#04140b',
  tabs: [
    { id: 'feed', label: 'Feed', heading: 'The feed', render: renderFeed },
    { id: 'for-you', label: 'For You', heading: 'For You', render: renderForYou },
    { id: 'post', label: 'Post', heading: 'Add a video', render: renderPost },
  ],
});
</script>
</body>
</html>
