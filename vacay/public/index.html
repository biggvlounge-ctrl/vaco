<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VACAY</title>
<link rel="stylesheet" href="/vaco-design.css" />
<style>
  .listing-art {
    height: 128px;
    border-radius: var(--vaco-radius-sm);
    border: 1px solid var(--vaco-border-subtle);
    background: linear-gradient(150deg, var(--vaco-accent-soft), transparent 66%), var(--vaco-bg-raised);
    display: flex; align-items: flex-end; padding: var(--vaco-space-3);
  }
  .leg { display: flex; align-items: center; gap: var(--vaco-space-3); }
  .leg-code { font-weight: var(--vaco-weight-bold); font-size: var(--vaco-text-lg); letter-spacing: 0.04em; }
  .leg-line { flex: 1; height: 1px; background: var(--vaco-border); position: relative; }
  .leg-line::after { content: '✈'; position: absolute; right: -2px; top: -9px; color: var(--vaco-accent); font-size: 12px; }
</style>
</head>
<body class="vaco">
<script src="/vaco-ui.js"></script>
<script>
// VACAY — four travel products merged into one app.
//
// Stays, Experiences, Homes (Zillow-shape), Auto (Turo-shape), and
// Flights (merchant-of-record). They were separate apps and were merged
// deliberately: one identity, one wallet, one trip.
//
// Each product is a real sub-router with its own store, so this page
// talks to four APIs rather than one flattened surface.

var el = VACO.el;
var DAY_MS = 24 * 60 * 60 * 1000;

function priceRow(label, amount, unit) {
  var row = el('div', 'vaco-row-tight');
  row.appendChild(el('span', 'vaco-label', label));
  row.appendChild(el('span', 'vaco-spacer'));
  row.appendChild(VACO.price(amount, { freeLabel: false }));
  if (unit) row.appendChild(el('span', 'vaco-small vaco-faint', unit));
  return row;
}

// No calendar widget anywhere in this shared UI shell -- every date a
// user supplies in this file is collected the same minimal way,
// "how many days from now", and converted to the real epoch-ms every
// booking function actually requires. Returns null (and books
// nothing) if the user cancels either prompt.
function promptDateRange(startLabel, endLabel) {
  var startDays = window.prompt(startLabel + ' -- days from now:', '7');
  if (startDays === null) return null;
  var endDays = window.prompt(endLabel + ' -- days from now:', String(Number(startDays) + 3));
  if (endDays === null) return null;
  var start = Date.now() + Number(startDays) * DAY_MS;
  var end = Date.now() + Number(endDays) * DAY_MS;
  if (!Number.isFinite(start) || !Number.isFinite(end) || end <= start) {
    throw new Error('Enter a real end date after the start date.');
  }
  return { start: Math.round(start), end: Math.round(end) };
}

// The one real shape every "your X" section below shares: a list
// fetched for the signed-in actor, each row offering Cancel where the
// booking is still cancellable. Closes the real gap the UI audit
// found -- every section but Flights had no way to find what you'd
// already booked, which also made the real cancel/refund endpoints
// (Phase 5) unreachable from here even though they've existed for a
// while.
function renderMine(label, items, describe, cancelledStatuses, onCancel) {
  if (!items.length) return null;
  var wrap = el('div', 'vaco-stack-sm');
  wrap.appendChild(el('h3', 'vaco-label', label));
  items.forEach(function (item) {
    var row = el('div', 'vaco-row-tight');
    row.appendChild(el('span', null, describe(item)));
    row.appendChild(el('span', 'vaco-spacer'));
    row.appendChild(VACO.badge(item.status));
    if (!cancelledStatuses.includes(item.status)) {
      row.appendChild(VACO.button('Cancel', function () {
        return onCancel(item).then(function () {
          VACO.toast('Cancelled.', 'money');
          VACO.refreshBalances().then(VACO.renderIdentity);
        });
      }));
    }
    wrap.appendChild(row);
  });
  return wrap;
}

function renderStays(body) {
  var out = el('div', 'vaco-stack');
  return VACO.api('/api/bookings/listings').then(function (data) {
    var listings = data.listings || data || [];
    out.appendChild(listings.length ? VACO.grid(listings.map(function (l) {
      var lines = el('div', 'vaco-stack-sm');
      var art = el('div', 'listing-art');
      art.appendChild(el('strong', null, l.city || l.location || ''));
      lines.appendChild(art);
      // hostType is what folded Booking.com-style inventory in beside
      // Airbnb-style hosts without two separate products.
      if (l.hostType) lines.appendChild(VACO.badge(l.hostType));
      lines.appendChild(priceRow('Nightly', l.pricePerNight || l.nightlyRate, '/night'));
      lines.appendChild(VACO.button('Book', function () {
        if (!VACO.userId()) throw new Error('Sign in to book.');
        var range = promptDateRange('Check-in', 'Check-out');
        if (!range) return Promise.resolve();
        // Real route: the booking resource lives at this section's own
        // root (`POST /api/bookings`), not a nested `/bookings/bookings`
        // path -- "booking and stay are the same thing here".
        return VACO.post('/api/bookings', {
          listingId: l.id, guestId: VACO.userId(), checkIn: range.start, checkOut: range.end,
        }).then(function () {
          VACO.toast('Stay booked.', 'money');
          VACO.refreshBalances().then(VACO.renderIdentity);
          return VACO.render();
        });
      }, 'primary'));
      return VACO.card(l.title || ('Stay ' + l.id), [lines]);
    }), true) : el('div', 'vaco-empty', 'No stays listed yet.'));

    if (!VACO.userId()) { VACO.mount(body, out); return; }
    return VACO.api('/api/bookings/guests/' + encodeURIComponent(VACO.userId()) + '/bookings').then(function (mine) {
      var section = renderMine('Your stays', mine.bookings || [],
        function (b) { return 'Stay #' + b.id + ' -- ' + b.nights + ' night(s), ' + b.totalPrice + ' VCoin'; },
        ['cancelled', 'completed'],
        function (b) { return VACO.post('/api/bookings/' + b.id + '/cancel', {}); });
      if (section) out.appendChild(section);
      VACO.mount(body, out);
    });
  });
}

function renderExperiences(body) {
  var out = el('div', 'vaco-stack');
  return VACO.api('/api/bookings/experiences').then(function (data) {
    var experiences = data.experiences || data || [];
    out.appendChild(experiences.length ? VACO.grid(experiences.map(function (e) {
      var lines = el('div', 'vaco-stack-sm');
      lines.appendChild(el('p', 'vaco-small vaco-dim', e.description || ''));
      lines.appendChild(priceRow('Per guest', e.pricePerGuest || e.price));
      lines.appendChild(VACO.button('Book', function () {
        if (!VACO.userId()) throw new Error('Sign in to book.');
        return VACO.post('/api/bookings/experience-bookings', {
          experienceId: e.id, guestId: VACO.userId(),
        }).then(function () {
          VACO.toast('Experience booked.', 'money');
          VACO.refreshBalances().then(VACO.renderIdentity);
          return VACO.render();
        });
      }, 'primary'));
      return VACO.card(e.title || ('Experience ' + e.id), [lines]);
    }), true) : el('div', 'vaco-empty', 'No experiences yet.'));

    if (!VACO.userId()) { VACO.mount(body, out); return; }
    return VACO.api('/api/bookings/guests/' + encodeURIComponent(VACO.userId()) + '/experience-bookings').then(function (mine) {
      var section = renderMine('Your experience bookings', mine.bookings || [],
        function (b) { return 'Experience booking #' + b.id; },
        ['cancelled', 'completed'],
        function (b) { return VACO.post('/api/bookings/experience-bookings/' + b.id + '/cancel', {}); });
      if (section) out.appendChild(section);
      VACO.mount(body, out);
    });
  });
}

function renderHomes(body) {
  return VACO.api('/api/home/listings').then(function (data) {
    var listings = data.listings || data || [];
    if (!listings.length) return el('div', 'vaco-empty', 'No homes on the market.');
    return VACO.grid(listings.map(function (h) {
      var lines = el('div', 'vaco-stack-sm');
      var art = el('div', 'listing-art');
      art.appendChild(el('strong', null, h.address || ''));
      lines.appendChild(art);
      var meta = el('div', 'vaco-row-tight');
      if (h.bedrooms) meta.appendChild(VACO.badge(h.bedrooms + ' bd'));
      if (h.bathrooms) meta.appendChild(VACO.badge(h.bathrooms + ' ba'));
      if (h.squareFeet) meta.appendChild(VACO.badge(h.squareFeet + ' sqft'));
      lines.appendChild(meta);
      lines.appendChild(priceRow('Asking', h.listPrice || h.price));
      lines.appendChild(VACO.button('Request info', function () {
        if (!VACO.userId()) throw new Error('Sign in to enquire.');
        var contactInfo = window.prompt('Best way for the listing agent to reach you (phone or email):');
        if (!contactInfo) return Promise.resolve();
        // Real route expects `requesterId`, not `buyerId` -- this is a
        // free tour request, gated separately from the agent-paid lead
        // purchase (`lib/home/leads.js`'s own header).
        return VACO.post('/api/home/leads', {
          listingId: h.id, requesterId: VACO.userId(), contactInfo: contactInfo,
        }).then(function () { VACO.toast('Lead sent to the listing agent.'); });
      }));
      return VACO.card(h.address || ('Home ' + h.id), [lines],
        { trailing: VACO.badge(h.status || 'active') });
    }), true);
  });
}

function renderAuto(body) {
  var out = el('div', 'vaco-stack');

  function section(heading, items, cardFn) {
    out.appendChild(el('h3', 'vaco-label', heading));
    out.appendChild(items.length ? VACO.grid(items.map(cardFn), true)
      : el('div', 'vaco-empty', 'None available.'));
  }

  return VACO.api('/api/auto/vehicles').then(function (data) {
    var vehicles = data.vehicles || data || [];
    section('Turo-style peer rentals', vehicles, function (v) {
      var lines = el('div', 'vaco-stack-sm');
      lines.appendChild(el('p', 'vaco-small vaco-dim', [v.year, v.make, v.model].filter(Boolean).join(' ')));
      lines.appendChild(priceRow('Daily', v.dailyRate || v.pricePerDay, '/day'));
      lines.appendChild(VACO.button('Rent', function () {
        if (!VACO.userId()) throw new Error('Sign in to rent.');
        var range = promptDateRange('Pickup', 'Return');
        if (!range) return Promise.resolve();
        return VACO.post('/api/auto/rentals', {
          vehicleId: v.id, renterId: VACO.userId(), startDate: range.start, endDate: range.end,
        }).then(function () {
          VACO.toast('Rental started.', 'money');
          VACO.refreshBalances().then(VACO.renderIdentity);
          return VACO.render();
        });
      }, 'primary'));
      return VACO.card([v.year, v.make, v.model].filter(Boolean).join(' ') || ('Vehicle ' + v.id),
        [lines], { trailing: VACO.badge(v.status || 'available') });
    });
    return VACO.api('/api/auto/fleet-vehicles');
  }).then(function (data) {
    var fleet = data.vehicles || data || [];
    section('VACAY fleet (Hertz/Enterprise-style, no owner split)', fleet, function (v) {
      var lines = el('div', 'vaco-stack-sm');
      lines.appendChild(el('p', 'vaco-small vaco-dim', [v.year, v.make, v.model].filter(Boolean).join(' ') + (v.location ? ' -- ' + v.location : '')));
      lines.appendChild(priceRow('Daily', v.dailyRate, '/day'));
      lines.appendChild(VACO.button('Rent', function () {
        if (!VACO.userId()) throw new Error('Sign in to rent.');
        var range = promptDateRange('Pickup', 'Return');
        if (!range) return Promise.resolve();
        return VACO.post('/api/auto/fleet-rentals', {
          vehicleId: v.id, renterId: VACO.userId(), startDate: range.start, endDate: range.end,
        }).then(function () {
          VACO.toast('Fleet rental started.', 'money');
          VACO.refreshBalances().then(VACO.renderIdentity);
          return VACO.render();
        });
      }, 'primary'));
      return VACO.card([v.year, v.make, v.model].filter(Boolean).join(' ') || ('Fleet vehicle ' + v.id),
        [lines], { trailing: VACO.badge(v.status || 'active') });
    });
    return VACO.api('/api/auto/for-sale-listings');
  }).then(function (data) {
    var forSale = data.listings || data || [];
    out.appendChild(el('h3', 'vaco-label', 'CarGurus-style used-car marketplace'));
    out.appendChild(VACO.button('List your car for sale ($25 flat fee)', function () {
      if (!VACO.userId()) throw new Error('Sign in to list a car.');
      var make = window.prompt('Make:'); if (!make) return Promise.resolve();
      var model = window.prompt('Model:'); if (!model) return Promise.resolve();
      var year = Number(window.prompt('Year:', '2022'));
      var mileage = Number(window.prompt('Mileage:', '30000'));
      var price = Number(window.prompt('Your asking price:', '18000'));
      var marketAveragePrice = Number(window.prompt('Market-average price for this car (for the price rating):', '18500'));
      return VACO.post('/api/auto/for-sale-listings', {
        sellerId: VACO.userId(), make: make, model: model, year: year, mileage: mileage, price: price, marketAveragePrice: marketAveragePrice,
      }).then(function () {
        VACO.toast('Listed -- $25 fee charged.', 'money');
        VACO.refreshBalances().then(VACO.renderIdentity);
        return VACO.render();
      });
    }));
    out.appendChild(forSale.length ? VACO.grid(forSale.map(function (c) {
      var lines = el('div', 'vaco-stack-sm');
      lines.appendChild(el('p', 'vaco-small vaco-dim', [c.year, c.make, c.model, c.mileage ? c.mileage + ' mi' : null].filter(Boolean).join(' ')));
      lines.appendChild(priceRow('Asking', c.price));
      if (c.priceRating) lines.appendChild(VACO.badge(c.priceRating));
      return VACO.card([c.year, c.make, c.model].filter(Boolean).join(' ') || ('Listing ' + c.id),
        [lines], { trailing: VACO.badge(c.status || 'active') });
    }), true) : el('div', 'vaco-empty', 'No cars listed for sale yet.'));

    if (!VACO.userId()) { VACO.mount(body, out); return; }
    return Promise.all([
      VACO.api('/api/auto/renters/' + encodeURIComponent(VACO.userId()) + '/rentals'),
      VACO.api('/api/auto/renters/' + encodeURIComponent(VACO.userId()) + '/fleet-rentals'),
    ]).then(function (results) {
      var mineSection = renderMine('Your Turo-style rentals', results[0].rentals || [],
        function (r) { return 'Rental #' + r.id + ' -- ' + r.totalPrice + ' VCoin'; },
        ['cancelled', 'completed'],
        function (r) { return VACO.post('/api/auto/rentals/' + r.id + '/cancel', {}); });
      if (mineSection) out.appendChild(mineSection);
      var fleetMineSection = renderMine('Your fleet rentals', results[1].rentals || [],
        function (r) { return 'Fleet rental #' + r.id + ' -- ' + r.totalPrice + ' VCoin'; },
        ['cancelled', 'completed'],
        function (r) { return VACO.post('/api/auto/fleet-rentals/' + r.id + '/cancel', {}); });
      if (fleetMineSection) out.appendChild(fleetMineSection);
      VACO.mount(body, out);
    });
  });
}

function renderFlights(body) {
  var out = el('div', 'vaco-stack');
  out.appendChild(VACO.notice(
    'VACAY is the <strong>merchant of record</strong> on flights: it takes the payment and owns the customer '
    + 'relationship, rather than handing a booking off to an airline and disappearing. '
    + 'No GDS or airline API is connected — inventory here is VACAY’s own.'));

  var flightsById = {};

  return VACO.api('/api/flights/flights').then(function (data) {
    var flights = data.flights || data || [];
    flights.forEach(function (f) { flightsById[f.id] = f; });
    if (!flights.length) {
      out.appendChild(el('div', 'vaco-empty', 'No flights loaded.'));
    } else {
      out.appendChild(VACO.grid(flights.map(function (f) {
        var lines = el('div', 'vaco-stack-sm');
        var leg = el('div', 'leg');
        leg.appendChild(el('span', 'leg-code', f.originCode || f.origin || '???'));
        leg.appendChild(el('span', 'leg-line'));
        leg.appendChild(el('span', 'leg-code', f.destinationCode || f.destination || '???'));
        lines.appendChild(leg);
        if (f.departureTime) {
          lines.appendChild(el('p', 'vaco-small vaco-dim', new Date(f.departureTime).toLocaleString()));
        }
        lines.appendChild(priceRow('Fare', f.price || f.fare));
        lines.appendChild(VACO.button('Book', function () {
          if (!VACO.userId()) throw new Error('Sign in to book.');
          return VACO.post('/api/flights/flight-bookings', { flightId: f.id, passengerId: VACO.userId() })
            .then(function () {
              VACO.toast('Flight booked — VACAY is the merchant of record.', 'money');
              VACO.refreshBalances().then(VACO.renderIdentity);
              return VACO.render();
            });
        }, 'primary'));
        return VACO.card(f.flightNumber || ('Flight ' + f.id), [lines],
          { trailing: f.airline ? VACO.badge(f.airline) : null });
      }), true));
    }

    // A real flight+stay(+car)(+ridePack) bundle -- `POST
    // /api/flights/bundles`, previously entirely unreachable from this
    // UI even though it's had its own real tests for a while.
    out.appendChild(el('h3', 'vaco-label', 'Build a bundle (flight + stay, optionally a car and a VOID ride pack)'));
    out.appendChild(VACO.button('Build a bundle', function () {
      if (!VACO.userId()) throw new Error('Sign in to build a bundle.');
      var flightId = Number(window.prompt('Flight id to include:'));
      if (!flightId) return Promise.resolve();
      var stayListingId = Number(window.prompt('Stay listing id to include:'));
      if (!stayListingId) return Promise.resolve();
      var range = promptDateRange('Check-in', 'Check-out');
      if (!range) return Promise.resolve();
      var body = {
        flight: { flightId: flightId, passengerId: VACO.userId() },
        stay: { listingId: stayListingId, guestId: VACO.userId(), checkIn: range.start, checkOut: range.end },
      };
      var wantsCar = window.confirm('Add a car to this bundle?');
      if (wantsCar) {
        var kind = window.confirm('Use VACAY fleet (OK) or a Turo-style peer vehicle (Cancel)?') ? 'fleet' : 'vehicle';
        var vehicleId = Number(window.prompt('Vehicle id:'));
        var carRange = promptDateRange('Pickup', 'Return');
        if (vehicleId && carRange) {
          body.car = { kind: kind, vehicleId: vehicleId, renterId: VACO.userId(), startDate: carRange.start, endDate: carRange.end };
        }
      }
      var wantsRidePack = window.confirm('Add a VOID ride pack to this bundle?');
      if (wantsRidePack) {
        var planId = window.prompt('VOID ride pack plan id:');
        if (planId) body.ridePack = { planId: planId };
      }
      return VACO.post('/api/flights/bundles', body).then(function () {
        VACO.toast('Bundle booked.', 'money');
        VACO.refreshBalances().then(VACO.renderIdentity);
        return VACO.render();
      });
    }, 'primary'));

    if (!VACO.userId()) { VACO.mount(body, out); return; }
    return VACO.api('/api/flights/passengers/' + encodeURIComponent(VACO.userId()) + '/flight-bookings').then(function (mine) {
      var section = renderMine('Your flight bookings', mine.bookings || [],
        function (b) {
          var f = flightsById[b.flightId];
          return 'Booking #' + b.id + (f ? ' -- ' + (f.flightNumber || f.id) : '') + ' -- ' + b.retailPriceCharged + ' VCoin';
        },
        ['cancelled', 'completed'],
        function (b) { return VACO.post('/api/flights/flight-bookings/' + b.id + '/cancel', {}); });
      if (section) out.appendChild(section);
      VACO.mount(body, out);
    });
  });
}

VACO.app({
  id: 'vacay',
  name: 'VACAY',
  tagline: 'Stays · homes · auto · flights',
  //: VACAY's identity: the "dusk navy + sunset coral + brass" direction
  //: recorded in VISUAL_DESIGN_COHESION_DIRECTIVE.md — which noted the
  //: palette existed as a decision but appeared in no file. Sunset
  //: coral is the accent; dusk navy is already the shared ink ramp.
  accent: '#f0845e',
  accentDim: '#c96540',
  accentInk: '#1a0a05',
  tabs: [
    { id: 'stays', label: 'Stays', heading: 'Places to stay', render: renderStays },
    { id: 'experiences', label: 'Experiences', heading: 'Things to do', render: renderExperiences },
    { id: 'homes', label: 'Homes', heading: 'On the market', render: renderHomes },
    { id: 'auto', label: 'Auto', heading: 'Cars to rent', render: renderAuto },
    { id: 'flights', label: 'Flights', heading: 'Getting there', render: renderFlights },
  ],
});
</script>
</body>
</html>
