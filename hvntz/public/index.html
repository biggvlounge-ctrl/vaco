<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HVNTZ</title>
<link rel="stylesheet" href="/vaco-design.css" />
<style>
  .progress-track { height: 8px; border-radius: var(--vaco-radius-pill); background: var(--vaco-surface-hover); overflow: hidden; }
  .progress-fill { height: 100%; background: var(--vaco-accent); }
  .map-pin { display: inline-flex; gap: 4px; align-items: baseline; font-variant-numeric: tabular-nums; }
</style>
</head>
<body class="vaco">
<script src="/vaco-ui.js"></script>
<script>
// HVNTZ — the revenue stack, hunts, and the Explore Page.
//
// Real client of HVNTZ's own 40 routes. Hunt progress, break
// recommendations, and neighbour suggestions are all server-computed —
// the break recommendation in particular is a real fatigue rule, not a
// timer this page runs.

var el = VACO.el;

function renderHunts(body) {
  var out = el('div', 'vaco-stack');

  out.appendChild(VACO.card('Open a hunt', [
    VACO.form([{ name: 'huntId', label: 'Hunt id', width: '120px', value: '1' }], function (values) {
      return loadHunt(out, body, values.huntId);
    }, 'Load'),
  ]));

  out.appendChild(el('div', 'vaco-empty', 'Enter a hunt id above to see its progress.'));
  return VACO.mount(body, out);
}

function loadHunt(out, body, huntId) {
  var userId = VACO.userId();
  return Promise.all([
    VACO.api('/api/hunt/' + encodeURIComponent(huntId)),
    userId ? VACO.api('/api/hunt/' + encodeURIComponent(huntId) + '/progress/' + encodeURIComponent(userId))
      .catch(function () { return null; }) : Promise.resolve(null),
    userId ? VACO.api('/api/hunt/' + encodeURIComponent(huntId) + '/break-recommendation/' + encodeURIComponent(userId))
      .catch(function () { return null; }) : Promise.resolve(null),
  ]).then(function (r) {
    var hunt = r[0], progress = r[1], rec = r[2];
    var lines = el('div', 'vaco-stack-sm');
    lines.appendChild(el('p', 'vaco-small vaco-dim', hunt.description || ''));

    if (progress) {
      var done = progress.completedStops !== undefined ? progress.completedStops : (progress.completed || 0);
      var total = progress.totalStops !== undefined ? progress.totalStops : (progress.total || 1);
      var pct = Math.round((done / Math.max(total, 1)) * 100);
      var track = el('div', 'progress-track');
      var fill = el('div', 'progress-fill');
      fill.style.width = pct + '%';
      track.appendChild(fill);
      lines.appendChild(track);
      lines.appendChild(el('p', 'vaco-small', done + ' of ' + total + ' stops · ' + pct + '%'));
    }

    // A real fatigue rule from the server. Surfaced prominently because
    // a hunt that pushes someone past their limit is the failure mode.
    if (rec && rec.shouldBreak) {
      lines.appendChild(VACO.notice(
        'HVNTZ suggests a break: <strong>' + VACO.escapeHtml(rec.reason || 'you have been going a while')
        + '</strong>', 'warn'));
    }

    var replacement = el('div', 'vaco-stack');
    // `hunt.title`, not `hunt.name`. createHunt requires a title and
    // stores it under that key; there has never been a `name` on a
    // hunt, so this read was always undefined and every hunt rendered
    // as "Hunt <id>" with its real title sitting in the response.
    replacement.appendChild(VACO.card(hunt.title || ('Hunt ' + huntId), [lines],
      { trailing: VACO.badge(hunt.status || 'active') }));
    // Replace only the results area, keeping the lookup form in place.
    while (out.childNodes.length > 1) out.removeChild(out.lastChild);
    out.appendChild(replacement);
    VACO.mount(body, out);
  }).catch(function (err) {
    while (out.childNodes.length > 1) out.removeChild(out.lastChild);
    out.appendChild(VACO.notice('No hunt found: ' + VACO.escapeHtml(err.message), 'danger'));
    VACO.mount(body, out);
  });
}

// Mystery Hunts: a real Clue-style deduction layer over the
// checkpoint mechanic above (lib/mysteryHunt.js). Never shows the
// hidden solution itself -- `GET /api/hunt/:huntId/mystery/status`
// and `.../known-facts/:userId` are both built server-side to make
// that impossible, not just discreet about it here.
var MYSTERY_SLOTS = [
  { value: 'who', label: 'Who' },
  { value: 'what', label: 'What' },
  { value: 'where', label: 'Where' },
];

function renderMystery(body) {
  var out = el('div', 'vaco-stack');

  out.appendChild(VACO.card('Open a hunt’s mystery', [
    VACO.form([{ name: 'huntId', label: 'Hunt id', width: '120px', value: '1' }], function (values) {
      return loadMystery(out, body, values.huntId);
    }, 'Load'),
  ]));

  out.appendChild(el('div', 'vaco-empty', 'Enter a hunt id above to see its mystery.'));
  return VACO.mount(body, out);
}

function loadMystery(out, body, huntId) {
  var userId = VACO.userId();
  return Promise.all([
    VACO.api('/api/hunt/' + encodeURIComponent(huntId)),
    VACO.api('/api/hunt/' + encodeURIComponent(huntId) + '/mystery/status'),
    userId
      ? VACO.api('/api/hunt/' + encodeURIComponent(huntId) + '/mystery/known-facts/' + encodeURIComponent(userId))
        .catch(function () { return null; })
      : Promise.resolve(null),
  ]).then(function (r) {
    var hunt = r[0], status = r[1], knownFacts = r[2];
    var replacement = el('div', 'vaco-stack');

    var statusLines = el('div', 'vaco-stack-sm');
    statusLines.appendChild(el('p', 'vaco-small vaco-dim', hunt.title || ('Hunt ' + huntId)));
    if (!status.hasMystery) {
      statusLines.appendChild(el('p', 'vaco-small', 'This hunt has no mystery set up yet.'));
    } else {
      statusLines.appendChild(el('p', 'vaco-small',
        status.totalClues + ' real clue(s) placed · ' + status.totalTeams + ' team(s) · '
        + status.totalAccusations + ' real accusation(s) made so far'));
    }
    replacement.appendChild(VACO.card('Mystery status', [statusLines], {
      trailing: VACO.badge(!status.hasMystery ? 'none' : (status.solved ? 'solved' : 'open')),
    }));

    if (!userId) {
      replacement.appendChild(VACO.notice(
        'Sign in to see your team’s known facts, form a team, or make an accusation.', 'warn'));
    } else {
      // Never the hidden solution -- only what has actually been
      // revealed to this user's own real team so far.
      replacement.appendChild(VACO.card('Your known facts', [
        el('p', 'vaco-small vaco-dim',
          'What your team has actually uncovered by checking in — never the hidden answer itself.'),
        VACO.table([
          { label: 'Slot', render: function (f) {
            return (MYSTERY_SLOTS.filter(function (s) { return s.value === f.slot; })[0] || {}).label || f.slot;
          } },
          { key: 'value', label: 'Value' },
          { label: 'Red herring?', render: function (f) { return f.isRedHerring ? 'Yes' : 'No'; } },
        ], (knownFacts && knownFacts.facts) || [], {
          empty: 'No clues revealed yet — check in at a checkpoint to learn something real.',
        }),
      ]));

      replacement.appendChild(VACO.card('Form a team', [
        el('p', 'vaco-small vaco-dim',
          'Every clue any teammate reveals is shared with the whole team — that sharing is the real deduction.'),
        VACO.form([
          { name: 'name', label: 'Team name', width: '160px' },
          { name: 'otherMembers', label: 'Other members (comma-separated user ids)', width: '240px' },
        ], function (values) {
          var members = String(values.otherMembers || '').split(',')
            .map(function (s) { return s.trim(); }).filter(Boolean);
          return VACO.post('/api/hunt/' + encodeURIComponent(huntId) + '/mystery/team', {
            creatorId: userId, name: values.name, memberUserIds: members,
          }).then(function () {
            VACO.toast('Team created');
            return loadMystery(out, body, huntId);
          });
        }, 'Create team'),
      ]));

      if (status.hasMystery && !status.solved) {
        replacement.appendChild(VACO.card('Make an accusation', [
          el('p', 'vaco-small vaco-dim',
            'A wrong guess means your team can no longer win this mystery — but you keep collecting checkpoint bounties either way.'),
          VACO.form([
            { name: 'who', label: 'Who', width: '140px' },
            { name: 'what', label: 'What', width: '140px' },
            { name: 'where', label: 'Where', width: '140px' },
          ], function (values) {
            return VACO.post('/api/hunt/' + encodeURIComponent(huntId) + '/mystery/accusation', {
              userId: userId,
              guess: { who: values.who, what: values.what, where: values.where },
            }).then(function (result) {
              VACO.toast(result.correct ? 'Correct — mystery solved!' : 'Not correct — your team is out of the running.',
                result.correct ? undefined : 'warn');
              return loadMystery(out, body, huntId);
            });
          }, 'Accuse'),
        ]));
      }

      if (!status.solved) {
        var checkpoints = hunt.checkpoints || [];
        var checkpointOptions = checkpoints.map(function (c) {
          return { value: c.id, label: 'Checkpoint ' + c.id + ' — ' + c.clue };
        });
        var sponsorChildren = [
          el('p', 'vaco-small vaco-dim',
            'Only this hunt’s own real sponsor may set the solution or author a clue — enforced server-side.'),
        ];
        if (!status.hasMystery) {
          sponsorChildren.push(VACO.form([
            { name: 'who', label: 'Who', width: '140px' },
            { name: 'what', label: 'What', width: '140px' },
            { name: 'where', label: 'Where', width: '140px' },
          ], function (values) {
            return VACO.post('/api/hunt/' + encodeURIComponent(huntId) + '/mystery/solution', values)
              .then(function () {
                VACO.toast('Hidden solution set');
                return loadMystery(out, body, huntId);
              });
          }, 'Set hidden solution'));
        } else {
          sponsorChildren.push(el('p', 'vaco-small', 'The hidden solution is already set and locked.'));
        }
        if (checkpointOptions.length) {
          sponsorChildren.push(VACO.form([
            { name: 'checkpointId', label: 'Checkpoint', options: checkpointOptions },
            { name: 'slot', label: 'Slot', options: MYSTERY_SLOTS },
            { name: 'value', label: 'Value', width: '140px' },
            { name: 'isRedHerring', label: 'Red herring?', options: [
              { value: 'false', label: 'No — it’s true' },
              { value: 'true', label: 'Yes — red herring' },
            ] },
          ], function (values) {
            return VACO.post(
              '/api/hunt/' + encodeURIComponent(huntId) + '/checkpoint/' + encodeURIComponent(values.checkpointId) + '/mystery-clue',
              { slot: values.slot, value: values.value, isRedHerring: values.isRedHerring === 'true' },
            ).then(function () {
              VACO.toast('Clue added');
              return loadMystery(out, body, huntId);
            });
          }, 'Add clue'));
        } else {
          sponsorChildren.push(el('p', 'vaco-small vaco-dim', 'Add checkpoints to this hunt first.'));
        }
        replacement.appendChild(VACO.card('Sponsor tools', sponsorChildren));
      }
    }

    while (out.childNodes.length > 1) out.removeChild(out.lastChild);
    out.appendChild(replacement);
    VACO.mount(body, out);
  }).catch(function (err) {
    while (out.childNodes.length > 1) out.removeChild(out.lastChild);
    out.appendChild(VACO.notice('No hunt found: ' + VACO.escapeHtml(err.message), 'danger'));
    VACO.mount(body, out);
  });
}

function renderRevenue(body) {
  return VACO.api('/api/revenue-events').then(function (data) {
    var events = data.events || data.revenueEvents || data || [];
    return VACO.card('Revenue events', [
      el('p', 'vaco-small vaco-dim',
        'The revenue stack: every way a business earns through HVNTZ, recorded as a real event rather than a projection.'),
      VACO.table([
        { key: 'id', label: 'Id' },
        { key: 'businessId', label: 'Business' },
        { key: 'eventType', label: 'Type' },
        { label: 'Amount', num: true, render: function (r) { return VACO.price(r.amount, { freeLabel: false }); } },
      ], events, { empty: 'No revenue events recorded yet.' }),
    ]);
  });
}

function courseFormatLabel(format) {
  return {
    'self-paced-online': 'Self-paced online',
    'in-app': 'In the app',
    'live-virtual': 'Live virtual class',
    'recorded-virtual': 'Recorded virtual class',
    'in-person-city': 'In-person',
  }[format] || format;
}

function renderTraining(body) {
  var out = el('div', 'vaco-stack');

  out.appendChild(VACO.card('Hunts Academy', [
    el('p', 'vaco-small vaco-dim',
      'Real training on how a business actually earns through HVNTZ: your VDP digital double, the Vavlt Stvdios '
      + 'streaming unlock, and the screen network’s scans and direct-to-consumer sales — plus a course '
      + 'for VENVS sellers on selling through that same screen network.'),
    VACO.form([{ name: 'businessId', label: 'Business id', width: '150px', value: '1' }], function (values) {
      return loadTraining(out, body, values.businessId);
    }, 'Load my courses'),
  ]));

  out.appendChild(el('div', 'vaco-empty',
    'Enter your business id above, signed in as its owner, to see recommended courses and track progress.'));
  return VACO.mount(body, out);
}

function loadTraining(out, body, businessId) {
  var numericId = Number(businessId);
  return Promise.all([
    VACO.api('/api/training/courses'),
    VACO.api('/api/training/recommended/' + encodeURIComponent(businessId)).catch(function () { return null; }),
    VACO.api('/api/training/progress/' + encodeURIComponent(businessId)).catch(function () { return null; }),
  ]).then(function (r) {
    var courses = r[0].courses, recommended = r[1], progress = r[2];
    var statusByCourse = {};
    if (progress) {
      progress.enrollments.forEach(function (e) { statusByCourse[e.courseId] = e.status; });
    }

    var replacement = el('div', 'vaco-stack');

    if (!progress) {
      replacement.appendChild(VACO.notice(
        'Sign in above as this business’s owner to see recommendations, enroll, and track progress.', 'warn'));
    } else {
      // Server-computed from this business's real Digital Twin level and
      // participation, not a static "take everything" list -- see
      // `getRecommendedCourses` in lib/training.js.
      replacement.appendChild(VACO.card('Recommended next', [
        el('p', 'vaco-small vaco-dim', 'Chosen from this business’s own real progress, not a fixed list.'),
        VACO.table([
          { key: 'title', label: 'Course' },
          { label: 'Format', render: function (c) {
            return courseFormatLabel(c.format) + (c.city ? ' · ' + c.city : '');
          } },
        ], recommended.recommended, { empty: 'Nothing recommended right now — you are caught up.' }),
      ]));

      replacement.appendChild(VACO.card('Your progress', [
        el('p', 'vaco-small', progress.completedCount + ' of ' + progress.totalCourses + ' courses completed'),
      ]));
    }

    replacement.appendChild(VACO.card('Full catalog', [
      VACO.table([
        { key: 'title', label: 'Course' },
        { label: 'Format', render: function (c) {
          return courseFormatLabel(c.format) + (c.city ? ' · ' + c.city : '');
        } },
        { label: 'Status', render: function (c) {
          var status = statusByCourse[c.id];
          return status ? VACO.badge(status) : el('span', 'vaco-small vaco-dim', 'Not enrolled');
        } },
        { label: '', render: function (c) {
          if (!progress) return null;
          var status = statusByCourse[c.id];
          if (status === 'completed') return null;
          if (status === 'enrolled') {
            return VACO.button('Mark complete', function () {
              return VACO.post('/api/training/complete', { businessId: numericId, courseId: c.id })
                .then(function () { return loadTraining(out, body, businessId); })
                .then(function () { VACO.toast('Marked complete'); });
            }, 'sm');
          }
          return VACO.button('Enroll', function () {
            return VACO.post('/api/training/enroll', { businessId: numericId, courseId: c.id })
              .then(function () { return loadTraining(out, body, businessId); })
              .then(function () { VACO.toast('Enrolled'); });
          }, 'sm');
        } },
      ], courses, { empty: 'No courses yet.' }),
    ]));

    while (out.childNodes.length > 1) out.removeChild(out.lastChild);
    out.appendChild(replacement);
    VACO.mount(body, out);
  }).catch(function (err) {
    while (out.childNodes.length > 1) out.removeChild(out.lastChild);
    out.appendChild(VACO.notice('Could not load training: ' + VACO.escapeHtml(err.message), 'danger'));
    VACO.mount(body, out);
  });
}

function renderBusiness(body) {
  var out = el('div', 'vaco-stack');
  out.appendChild(VACO.card('Look up a business', [
    VACO.form([{ name: 'id', label: 'Business id', width: '150px', value: '1' }], function (values) {
      return Promise.all([
        VACO.api('/api/business/' + encodeURIComponent(values.id)),
        VACO.api('/api/business/' + encodeURIComponent(values.id) + '/locations').catch(function () { return { locations: [] }; }),
        VACO.api('/api/neighbor-program/' + encodeURIComponent(values.id) + '/suggestions').catch(function () { return null; }),
      ]).then(function (r) {
        var biz = r[0], locs = r[1].locations || [], sugg = r[2];
        while (out.childNodes.length > 1) out.removeChild(out.lastChild);

        out.appendChild(VACO.card(biz.name || ('Business ' + values.id), [
          el('p', 'vaco-small vaco-dim', biz.category || ''),
          VACO.table([
            { key: 'id', label: 'Location' },
            { key: 'name', label: 'Name' },
            { label: 'Coordinates', render: function (l) {
              var pin = el('span', 'map-pin');
              pin.textContent = VACO.round(l.lat) + ', ' + VACO.round(l.lng);
              return pin;
            } },
          ], locs, { empty: 'No locations registered.' }),
        ]));

        // The neighbour program is HVNTZ's own proximity mechanic —
        // real nearby businesses, computed from real coordinates.
        if (sugg) {
          var list = sugg.suggestions || sugg || [];
          out.appendChild(VACO.card('Neighbour suggestions', [
            el('p', 'vaco-small vaco-dim', 'Nearby businesses worth partnering with, by real distance.'),
            VACO.table([
              { key: 'businessId', label: 'Business' },
              { key: 'distanceKm', label: 'km', num: true },
              { key: 'reason', label: 'Why' },
            ], list, { empty: 'No neighbours suggested.' }),
          ]));
        }
        VACO.mount(body, out);
      });
    }, 'Load'),
  ]));
  return VACO.mount(body, out);
}

VACO.app({
  id: 'hvntz',
  name: 'HVNTZ',
  tagline: 'Hunts & the revenue stack',
  //: HVNTZ's identity: a lime-olive. Outdoors and searching, and the
  //: only app in the register in the yellow-green band.
  accent: '#a3c94f',
  accentDim: '#82a636',
  accentInk: '#101403',
  tabs: [
    { id: 'hunts', label: 'Hunts', heading: 'Hunt progress',
      blurb: 'Progress, and a real break recommendation when the pace warrants one.', render: renderHunts },
    { id: 'business', label: 'Business', heading: 'Businesses & neighbours', render: renderBusiness },
    { id: 'mystery', label: 'Mystery', heading: 'Mystery hunts',
      blurb: 'A Clue-style whodunit layered on a real hunt: a hidden solution, clues revealed at checkpoints, and accusations.', render: renderMystery },
    { id: 'revenue', label: 'Revenue', heading: 'The revenue stack', render: renderRevenue },
    { id: 'training', label: 'Training', heading: 'Hunts Academy',
      blurb: 'How a business owner actually makes money through HVNTZ, and how to learn it.', render: renderTraining },
  ],
});
</script>
</body>
</html>
